<title>算数プリントメーカー alpha7.27</title>
<div id="boot" data-version="alpha7.27" style="font-family:sans-serif;padding:24px">読み込み中… alpha7.27</div>
<script>
(async()=>{
 const files=["c1.txt", "c2.txt", "c3.txt", "c4.txt"];
 const parts=await Promise.all(files.map(x=>fetch(x,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error(x+":"+r.status);return r.text()})));
 const raw=Uint8Array.from(atob(parts.join("")),c=>c.charCodeAt(0));
 const ds=new DecompressionStream("gzip");
 const html=await new Response(new Blob([raw]).stream().pipeThrough(ds)).text();
 document.open(); document.write(html); document.close();
})().catch(e=>{document.getElementById("boot").innerHTML="<h2>読み込みエラー</h2><p>"+String(e)+"</p>"})
</script>
