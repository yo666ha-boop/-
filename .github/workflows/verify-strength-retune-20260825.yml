name: Verify strength retune 20260825
on:
  push:
    branches: [tune-future-fullsearch-20260825]
permissions:
  contents: read
jobs:
  strength-retune:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
      - name: Syntax check changed scripts
        run: |
          node --check shogi-side-test/future21520.js
          node --check shogi-side-test/cohort19-26-yaneura21536.js
          node --check .github/scripts/audit-strength-runtime-contract-20260825.mjs
          node --check .github/scripts/audit-all26-hierarchy-20260825.mjs
      - name: Build audit page
        run: node .github/scripts/build-lower8-quality-page-20260825.mjs
      - name: Start audit server
        run: |
          node .github/scripts/coi-lower8-quality-server-20260825.mjs >/tmp/strength-server.log 2>&1 &
          sleep 1
      - name: Verify runtime contract
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/audit-strength-runtime-contract-20260825.mjs 2>&1 | tee /tmp/runtime.log
          grep -F 'PASS_STRENGTH_RUNTIME_CONTRACT' /tmp/runtime.log
      - name: Verify lower8 8-case quality
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/audit-nonfuture-lower8-quality-20260825.mjs 2>&1 | tee /tmp/lower8.log
          grep -F 'PASS_NONFUTURE_LOWER8_8CASE_QUALITY' /tmp/lower8.log
      - name: Verify all26 hierarchy
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/audit-all26-hierarchy-20260825.mjs 2>&1 | tee /tmp/all26.log
          grep -F 'PASS_ALL26_8CASE_STRENGTH_HIERARCHY' /tmp/all26.log
