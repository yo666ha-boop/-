name: Shogi Future fixed3 iPhone acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/shogi-future-fixed3-acceptance.yml'
      - 'shogi-v21528/future-yaneura-worker21528.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed3:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright WebKit
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Prepare COI test site
        shell: bash
        run: |
          ROOT=/tmp/fixed3/site
          mkdir -p "$ROOT/yaneuraou"
          cp shogi-v21528/future-yaneura-worker21528.js "$ROOT/"
          cp shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.js "$ROOT/yaneuraou/"
          cp shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.worker.js "$ROOT/yaneuraou/"
          cp shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.wasm "$ROOT/yaneuraou/"
          cp shogi-v21528/yaneuraou/nn.bin "$ROOT/yaneuraou/"
          cat > "$ROOT/server.cjs" <<'NODE'
          const h=require('http'),f=require('fs'),p=require('path'),r=__dirname,m={'.js':'text/javascript','.wasm':'application/wasm','.bin':'application/octet-stream'};
          h.createServer((q,s)=>{const n=new URL(q.url,'http://x').pathname.replace(/^\//,''),x=p.resolve(r,n);if(!x.startsWith(r)){s.writeHead(403);return s.end()}f.readFile(x,(e,d)=>{if(e){s.writeHead(404);return s.end()}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',m[p.extname(x)]||'application/octet-stream');s.end(d)})}).listen(4183,'127.0.0.1');
          NODE
          node "$ROOT/server.cjs" >/tmp/fixed3-server.log 2>&1 &
          sleep 2
      - name: Compare live budget move to 20-second reference on 3 real positions
        shell: bash
        run: |
          cat > fixed3.mjs <<'NODE'
          import {webkit,devices} from 'playwright';
          const positions=[
            {name:'start',ms:15000,sfen:'lnsgkgsnl/1r5b1/ppppppppp/9/9/9/PPPPPPPPP/1B5R1/LNSGKGSNL b - 1'},
            {name:'ply24',ms:9000,sfen:'ln1g1gsnl/5k3/p2ppp1pp/2Ps2p2/1r7/5B3/P1+pPPPPPP/2G1G1R2/+b1S2KSNL b nl2p 25'},
            {name:'ply44',ms:9000,sfen:'l2g1gsnl/5k3/p1n1pp1pp/3p2p2/9/6P2/P2PP+l1PP/3G2R2/2+r1BKSNL b Nbg2s5p 45'}
          ];
          const browser=await webkit.launch({headless:true});
          const ctx=await browser.newContext({...devices['iPhone 13']});
          const page=await ctx.newPage();
          await page.goto('http://127.0.0.1:4183/future-yaneura-worker21528.js',{waitUntil:'load'}).catch(()=>{});
          const result=await page.evaluate(async positions=>{
            const w=new Worker('http://127.0.0.1:4183/future-yaneura-worker21528.js?fixed3='+Date.now());
            let seq=0;const pending=new Map();
            w.onmessage=e=>{const m=e.data||{};if(m.type==='result'){const p=pending.get(m.id);if(!p)return;pending.delete(m.id);m.ok?p.resolve(m):p.reject(Error(m.error||'worker error'))}};
            const call=(type,payload={},timeout=180000)=>new Promise((resolve,reject)=>{const id='q'+(++seq);pending.set(id,{resolve,reject});w.postMessage({type,id,...payload});setTimeout(()=>{if(pending.delete(id))reject(Error(type+' timeout'))},timeout)});
            const init=await call('init');const rows=[];
            for(const p of positions){
              const live=await call('bestmove',{sfen:p.sfen,ms:p.ms,multiPV:1},p.ms+120000);
              const ref=await call('bestmove',{sfen:p.sfen,ms:20000,multiPV:1},150000);
              rows.push({name:p.name,ms:p.ms,live:live.token,ref:ref.token,agree:live.token===ref.token,liveDepth:live.info?.depth||0,refDepth:ref.info?.depth||0,liveNodes:live.info?.nodes||0,refNodes:ref.info?.nodes||0,threads:live.info?.threads,hashMB:live.info?.hashMB,liveCp:live.info?.cp??null,refCp:ref.info?.cp??null});
            }
            w.terminate();return{init,rows};
          },positions);
          console.log('FIXED3',JSON.stringify(result));
          const agree=result.rows.filter(r=>r.agree).length;
          if(result.rows.some(r=>r.threads!==1||r.hashMB!==64||!r.liveNodes||!r.refNodes))throw Error('iPhone worker profile/search failure');
          if(agree<2)throw Error('strongest acceptance requires >=2/3 exact 20s agreement, got '+agree+'/3');
          console.log('PASS fixed3 iPhone strongest acceptance '+agree+'/3');
          await browser.close();
          NODE
          node fixed3.mjs 2>&1 | tee /tmp/fixed3.log
      - name: Upload fixed3 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: future-fixed3-acceptance
          path: |
            /tmp/fixed3.log
            /tmp/fixed3-server.log
          retention-days: 2