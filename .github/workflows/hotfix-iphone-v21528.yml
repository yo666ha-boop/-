name: Hotfix iPhone v2.15.28
on:
  push:
    paths:
      - '.github/workflows/hotfix-iphone-v21528.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh Future worker and fallback diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('shogi-side-test/future21520.js')
          s=p.read_text()
          s=s.replace('future-yaneura-worker21528.js?v=21528w7','future-yaneura-worker21528.js?v=21528w8')
          old="const x=lastAIInfo||{};setStatus('あなたの手番です。'+(x.fallback?'内蔵MAX退避':'やねうら王＋水匠5')+(x.depth?' / 深さ'+x.depth:'')+(x.nodes?' / '+Number(x.nodes).toLocaleString()+'局面':''));"
          new="const x=lastAIInfo||{};const engineLabel=x.fallback?'内蔵MAX退避（'+String(x.error||engineError||'原因不明').slice(0,80)+'）':'やねうら王＋水匠5';setStatus('あなたの手番です。'+engineLabel+(x.depth?' / 深さ'+x.depth:'')+(x.nodes?' / '+Number(x.nodes).toLocaleString()+'局面':''));"
          if old in s:s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shogi-side-test/future21520.js
          git diff --cached --quiet || git commit -m 'fix: iPhone Future worker cache and diagnostics v2.15.28w8'
          git push
