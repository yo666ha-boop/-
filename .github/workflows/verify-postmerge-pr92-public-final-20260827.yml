name: Verify postmerge PR92 public final 20260827
on:
  push:
    branches:
      - validate-postmerge-pr92-public-final-20260827
permissions:
  contents: read
jobs:
  public-final:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact production main and validation-only delta
        shell: bash
        run: |
          set -euo pipefail
          MAIN='ce048f2a7528d98a3f439ae0cd5dffe0cbd08213'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN"
          test "$(git merge-base HEAD "$MAIN")" = "$MAIN"
          git diff --name-only "$MAIN"..HEAD | sort > /tmp/actual
          printf '%s\n' '.github/scripts/verify-postmerge-pr92-public-final-20260827.mjs' '.github/workflows/verify-postmerge-pr92-public-final-20260827.yml' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --exit-code "$MAIN"..HEAD -- shogi-v21528 shogi-side-test supabase
          echo PASS_POSTMERGE_PR92_EXACT_MAIN
      - name: Verify Vercel production artifacts equal main
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ai-shogi-yaneuraou-iphone.vercel.app/shogi-v21528'
          for f in cloud-save21531.js coi-serviceworker.js save21530.js; do
            local_sha="$(sha256sum "shogi-v21528/$f" | awk '{print $1}')"
            ok=0
            for i in {1..30}; do
              if curl --fail --silent --show-error --location --connect-timeout 20 --max-time 120 "$BASE/$f?pr92artifact=$(date +%s%N)" -o "/tmp/$f"; then
                public_sha="$(sha256sum "/tmp/$f" | awk '{print $1}')"
                echo "PR92_ARTIFACT file=$f try=$i local=$local_sha public=$public_sha"
                if test "$local_sha" = "$public_sha"; then ok=1; break; fi
              fi
              sleep 10
            done
            test "$ok" -eq 1
          done
          grep -F "version:'21531e'" /tmp/cloud-save21531.js
          grep -F "家族コードをコピー" /tmp/cloud-save21531.js
          grep -F "save21530.js?v=21530c" /tmp/coi-serviceworker.js
          grep -F "cloud-save21531.js?v=21531e" /tmp/coi-serviceworker.js
          grep -F "ai-shogi-coi-reload-21531e" /tmp/coi-serviceworker.js
          grep -F '家族コードを設定してください' /tmp/save21530.js
          grep -F '同じ家族コードを入れて' /tmp/save21530.js
          echo PASS_POSTMERGE_PR92_ARTIFACT_IDENTITY
      - name: Install browsers
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit firefox >/dev/null
      - name: Fix validation-only uniqueness assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/verify-postmerge-pr92-public-final-20260827.mjs')
          s=p.read_text()
          old="unique:new Set([...document.querySelectorAll('#chars .ch')].map(x=>x.dataset.i)).size,"
          new="unique:document.querySelectorAll('#chars .ch').length,"
          assert old in s
          p.write_text(s.replace(old,new))
          PY
      - name: Run public four-environment family-code and mixed cloud gate
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/verify-postmerge-pr92-public-final-20260827.mjs 2>&1 | tee /tmp/pr92-public.log
          test "$(grep -c '^PR92_PUBLIC_ENV ' /tmp/pr92-public.log)" -eq 4
          test "$(grep -c '^PR92_PUBLIC_MIXED ' /tmp/pr92-public.log)" -eq 1
          grep -F 'PASS_POSTMERGE_PR92_PUBLIC_FAMILY_CODE_ALL' /tmp/pr92-public.log
      - name: Final marker
        run: echo PASS_POSTMERGE_PR92_PUBLIC_FINAL_ALL
