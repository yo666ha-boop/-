name: Diagnose Future scalar WASM all6 parity
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/diagnose-future-scalar-wasm-all6-20260824.yml']
permissions:
  contents: read
jobs:
  all6:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yaneurao/YaneuraOu
          ref: 76d58ef2e4cf64116784f41fd4816425ab6817ee
          path: YaneuraOu-scalar
      - name: Build scalar WASM
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('YaneuraOu-scalar/script/wasm_build.js');s=p.read_text();o='COMPILER=em++ TARGET_CPU=WASM YANEURAOU_EDITION=${pkgobj.edition}';n='COMPILER=em++ TARGET_CPU=OTHER YANEURAOU_EDITION=${pkgobj.edition}';assert o in s;p.write_text(s.replace(o,n,1))
          m=Path('YaneuraOu-scalar/source/Makefile');t=m.read_text();m.write_text(t.replace('-s PTHREAD_POOL_SIZE=32','-s PTHREAD_POOL_SIZE=2',1))
          PY
          docker pull emscripten/emsdk:3.1.43 >/dev/null
          docker run --rm -v "${{ github.workspace }}/YaneuraOu-scalar:/src" -w /src emscripten/emsdk:3.1.43 node script/wasm_build.js halfkp.noeval >/tmp/scalar-all6-build.log 2>&1
          LIB=YaneuraOu-scalar/build/wasm/halfkp.noeval/lib; mkdir -p shogi-v21528/scalar76d
          cp "$LIB"/yaneuraou.halfkp.noeval.{js,worker.js,wasm} shogi-v21528/scalar76d/; cp shogi-v21528/yaneuraou/nn.bin shogi-v21528/scalar76d/
          sha256sum shogi-v21528/scalar76d/yaneuraou.halfkp.noeval.{js,wasm} shogi-v21528/scalar76d/nn.bin
      - name: Prepare worker and WebKit
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),src=fs.readFileSync('shogi-v21528/future-yaneura-worker21528.js','utf8'),mark="    if(m.type==='stop'){try{if(engine)await sendUSI('stop')}catch(e){};return}";if(!src.includes(mark))throw Error('marker');const diag=`    if(m.type==='rawdepth'){await init();latestInfo={};latestMultiPV={};await sendUSI('setoption name MultiPV value 1');await sendUSI('setoption name USI_Hash value 32');await sendUSI('setoption name Threads value 1');await sendUSI('position sfen '+String(m.sfen||''));const p=waitLine(x=>x.startsWith('bestmove '),240000,'diag');await sendUSI('go depth '+Number(m.depth),240000);const line=await p;self.postMessage({type:'result',id,ok:true,kind:'rawdepth',token:(line.split(/\\s+/)[1]||''),info:{...latestInfo}});return;}\n`;let s=src.replace(mark,diag+mark).replace("BASE=new URL('./yaneuraou/',self.location.href).href;","BASE=new URL('./scalar76d/',self.location.href).href;");fs.writeFileSync('shogi-v21528/future-depth-scalar-all6.js',s)
          NODE
          npm init -y >/dev/null; npm i --no-audit --no-fund playwright@1.55.0 >/dev/null; npx playwright install --with-deps webkit >/dev/null
      - name: Start COI
        run: |
          cat >/tmp/srv.mjs <<'NODE'
          import http from'node:http';import fs from'node:fs';import path from'node:path';const r=process.env.GITHUB_WORKSPACE,m={'.html':'text/html','.js':'text/javascript','.wasm':'application/wasm','.bin':'application/octet-stream'};http.createServer((q,s)=>{let u=new URL(q.url,'http://x').pathname;if(u.endsWith('/'))u+='index.html';const f=path.resolve(r,'.'+u);if(!f.startsWith(path.resolve(r))||!fs.existsSync(f)){s.writeHead(404);return s.end()}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Content-Type',m[path.extname(f)]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4226,'127.0.0.1')
          NODE
          node /tmp/srv.mjs & for i in $(seq 1 30);do curl -fsS http://127.0.0.1:4226/shogi-v21528/index.html >/dev/null&&break;sleep 1;done
      - name: Run all six native parity cases
        run: |
          cat >all6.mjs <<'NODE'
          import{webkit}from'playwright';const C=[
          {ply:29,depth:12,sfen:'lnsgkg1nl/7s1/p3pp1pp/2pp2p2/3+bP4/5B3/P2P1PPPP/4GS1R1/L+r+p2K1NL b gsn2p 29',token:'5e5d',cp:-4054},
          {ply:29,depth:14,sfen:'lnsgkg1nl/7s1/p3pp1pp/2pp2p2/3+bP4/5B3/P2P1PPPP/4GS1R1/L+r+p2K1NL b gsn2p 29',token:'5e5d',cp:-4321},
          {ply:33,depth:12,sfen:'lnsgkg1nl/7s1/p3pp1pp/2pp2p2/3+bP4/5B3/P2P1PPPP/2+p1gSKR1/L+r2G2NL b sn2p 33',token:'2g2f',cp:-4217},
          {ply:33,depth:14,sfen:'lnsgkg1nl/7s1/p3pp1pp/2pp2p2/3+bP4/5B3/P2P1PPPP/2+p1gSKR1/L+r2G2NL b sn2p 33',token:'2g2f',cp:-4410},
          {ply:35,depth:12,sfen:'lnsgkg1nl/7s1/p3pp1pp/2pp2p2/3+bP4/5B1P1/P2P1PP1P/2+p2SKR1/L+r2g2NL b gsn2p 35',token:'4f5g',cp:-4290},
          {ply:35,depth:14,sfen:'lnsgkg1nl/7s1/p3pp1pp/2pp2p2/3+bP4/5B1P1/P2P1PP1P/2+p2SKR1/L+r2g2NL b gsn2p 35',token:'4h5i',cp:-4490}];
          const b=await webkit.launch({headless:true}),p=await b.newPage({userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1'});await p.goto('http://127.0.0.1:4226/shogi-v21528/index.html',{waitUntil:'domcontentloaded'});const rows=[];for(const q of C){const r=await p.evaluate(async q=>{const w=new Worker('./future-depth-scalar-all6.js?v='+Date.now()+Math.random());let n=0,P=new Map();w.onmessage=e=>{const m=e.data||{},z=P.get(m.id);if(!z||m.type!=='result')return;P.delete(m.id);clearTimeout(z.t);m.ok?z.r(m):z.j(Error(m.error||'worker'))};const call=(type,x={},ms=250000)=>new Promise((r,j)=>{const id=++n,t=setTimeout(()=>j(Error(type+' timeout')),ms);P.set(id,{r,j,t});w.postMessage({type,id,...x})});try{await call('init',{},120000);return await call('rawdepth',{sfen:q.sfen,depth:q.depth})}finally{w.terminate()}},q);const row={ply:q.ply,depth:q.depth,token:r.token,cp:r.info?.cp,nodes:r.info?.nodes,expectedToken:q.token,expectedCp:q.cp,tokenMatch:r.token===q.token,cpDelta:r.info?.cp-q.cp};rows.push(row);console.log('FUTURE_SCALAR_ALL6_ROW '+JSON.stringify(row))}const bad=rows.filter(x=>!x.tokenMatch||x.cpDelta!==0);console.log('FUTURE_SCALAR_ALL6_SUMMARY '+JSON.stringify({rows:rows.length,exact:rows.length-bad.length,bad}));if(bad.length)throw Error('parity mismatch '+JSON.stringify(bad));console.log('PASS_FUTURE_SCALAR_ALL6_EXACT');await b.close()
          NODE
          node all6.mjs 2>&1 | tee /tmp/all6.log
      - name: Preserve evidence
        if: always()
        run: grep -E '^(FUTURE_SCALAR_ALL6_ROW|FUTURE_SCALAR_ALL6_SUMMARY|PASS_FUTURE_SCALAR_ALL6_EXACT)' /tmp/all6.log || true
