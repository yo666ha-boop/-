name: verify-profile-rating-cloud-20260827

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-rating:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright WebKit
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Verify per-player rating and cloud round trip
        run: node .github/scripts/verify-profile-rating-cloud-20260827.mjs
