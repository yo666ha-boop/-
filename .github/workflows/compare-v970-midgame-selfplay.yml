name: Compare fixed V9.70 midgame strength
on:
  pull_request:
    paths:
      - '.github/workflows/compare-v970-midgame-selfplay.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  midgame:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare old and fixed V9.70 runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          ROOT=/tmp/midgame/site
          mkdir -p "$ROOT/old" "$ROOT/new" /tmp/midgame/art
          cp shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.{js,worker.js,wasm} "$ROOT/old/"
          cp shogi-v21528/yaneuraou/nn.bin "$ROOT/nn.bin"
          gh run download 32147280548 -n yaneuraou-v970-evalfile-fixed -D /tmp/midgame/art
          JS=$(find /tmp/midgame/art -name 'yaneuraou.halfkp.noeval.js' | head -1); test -n "$JS"; LIB=$(dirname "$JS")
          cp "$LIB"/yaneuraou.halfkp.noeval.{js,worker.js,wasm} "$ROOT/new/"
          sha256sum "$ROOT"/old/* "$ROOT"/new/* | tee /tmp/midgame/runtime-sha.txt
      - name: Create reusable browser engine driver
        shell: bash
        run: |
          set -euxo pipefail
          ROOT=/tmp/midgame/site
          cat > "$ROOT/driver.js" <<'JS'
          'use strict';
          const kind=new URL(self.location.href).searchParams.get('kind')||'new';
          const BASE=new URL('./'+kind+'/',self.location.href).href;
          let engine=null,ready=false,waiters=[],lastInfo={};
          function onLine(raw){const s=String(raw||'').trim();if(s.startsWith('info ')){const cp=/\bscore cp (-?\d+)/.exec(s),mate=/\bscore mate (-?\d+)/.exec(s),d=/\bdepth (\d+)/.exec(s),n=/\bnodes (\d+)/.exec(s),pv=/\bpv ([^\s]+)/.exec(s);if(pv)lastInfo={cp:cp?+cp[1]:null,mate:mate?+mate[1]:null,depth:d?+d[1]:0,nodes:n?+n[1]:0,pv:pv[1],line:s};}for(const w of waiters.slice())if(w.pred(s)){waiters=waiters.filter(x=>x!==w);clearTimeout(w.t);w.r(s)}}
          function waitLine(pred,ms,label){return new Promise((r,j)=>{const w={pred,r,j,t:setTimeout(()=>{waiters=waiters.filter(x=>x!==w);j(Error(label+' timeout'))},ms)};waiters.push(w)})}
          async function init(){if(ready)return;importScripts(BASE+'yaneuraou.halfkp.noeval.js?mid=1');const F=self.YaneuraOu_HalfKP_noeval||YaneuraOu_HalfKP_noeval;engine=await F({locateFile:p=>BASE+String(p).split('/').pop(),mainScriptUrlOrBlob:BASE+'yaneuraou.halfkp.noeval.js'});engine.addMessageListener(onLine);const b=new Uint8Array(await (await fetch(new URL('./nn.bin',self.location.href),{cache:'no-store'})).arrayBuffer());try{engine.FS.unlink('/nn.bin')}catch{}engine.FS.writeFile('/nn.bin',b);let p=waitLine(x=>x==='usiok',30000,'usiok');engine.postMessage('usi');await p;engine.postMessage('setoption name EvalDir value .');engine.postMessage('setoption name EvalFile value nn.bin');engine.postMessage('setoption name FV_SCALE value 24');engine.postMessage('setoption name USI_Hash value 32');engine.postMessage('setoption name Threads value 1');engine.postMessage('setoption name MultiPV value 1');p=waitLine(x=>x==='readyok',90000,'readyok');engine.postMessage('isready');await p;engine.postMessage('setoption name USI_Ponder value false');engine.postMessage('usinewgame');ready=true;}
          async function search(moves,nodes){await init();lastInfo={};engine.postMessage('position startpos'+(moves?' moves '+moves:''));const p=waitLine(x=>x.startsWith('bestmove '),90000,'bestmove');engine.postMessage('go nodes '+nodes);const s=await p;return{move:(s.split(/\s+/)[1]||''),...lastInfo}}
          self.onmessage=async e=>{const m=e.data||{};try{if(m.type==='search'){self.postMessage({id:m.id,ok:true,kind,...await search(String(m.moves||''),Number(m.nodes)||50000)})}}catch(err){self.postMessage({id:m.id,ok:false,kind,error:String(err&&err.stack||err)})}};
          JS
          cat > "$ROOT/index.html" <<'HTML'
          <!doctype html><meta charset="utf-8"><body>midgame host</body>
          HTML
          cat > "$ROOT/server.cjs" <<'NODE'
          const h=require('http'),f=require('fs'),p=require('path'),r=__dirname,m={'.html':'text/html','.js':'text/javascript','.wasm':'application/wasm','.bin':'application/octet-stream'};h.createServer((q,s)=>{const n=new URL(q.url,'http://x').pathname.replace(/^\//,'')||'index.html',x=p.resolve(r,n);f.readFile(x,(e,d)=>{if(e){s.writeHead(404);return s.end()}for(const[k,v]of Object.entries({'Cross-Origin-Opener-Policy':'same-origin','Cross-Origin-Embedder-Policy':'require-corp','Cross-Origin-Resource-Policy':'same-origin','Cache-Control':'no-store'}))s.setHeader(k,v);s.setHeader('Content-Type',m[p.extname(x)]||'application/octet-stream');s.end(d)})}).listen(4173,'127.0.0.1');
          NODE
      - name: Firefox selfplay midgame comparison
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/midgame/pw && cd /tmp/midgame/pw
          npm init -y >/dev/null; npm i --no-audit --no-fund playwright@1.55.0 >/dev/null; npx playwright install --with-deps firefox >/dev/null
          cat > midgame.mjs <<'NODE'
          import{firefox}from'playwright';
          const browser=await firefox.launch({headless:true}),page=await browser.newPage();
          page.on('console',m=>console.log('PAGE',m.text()));
          await page.goto('http://127.0.0.1:4173/');
          const result=await page.evaluate(async()=>{
            function makeRpc(kind){
              const w=new Worker('./driver.js?kind='+kind+'&r='+Math.random());let seq=0,p=new Map();
              w.onmessage=e=>{const m=e.data||{},q=p.get(m.id);if(!q)return;p.delete(m.id);clearTimeout(q.t);m.ok?q.r(m):q.j(Error(m.error||'engine error'))};
              w.onerror=e=>{for(const q of p.values()){clearTimeout(q.t);q.j(Error(e.message||'worker error'))}p.clear()};
              return{call:(moves,nodes)=>new Promise((r,j)=>{const id=++seq,t=setTimeout(()=>{p.delete(id);j(Error(kind+' timeout'))},120000);p.set(id,{r,j,t});w.postMessage({type:'search',id,moves,nodes})}),close:()=>w.terminate()};
            }
            const ref=makeRpc('new'),old=makeRpc('old'),neu=makeRpc('new');
            const moves=[];const snapshots=[];const targets=new Set([20,24,28,32,36]);
            for(let ply=1;ply<=36;ply++){
              const r=await ref.call(moves.join(' '),70000);
              if(!r.move||['resign','win','none'].includes(r.move))throw Error('selfplay stopped ply '+ply+' '+r.move);
              moves.push(r.move);
              if(targets.has(ply))snapshots.push({ply,moves:moves.join(' ')});
            }
            const rows=[];let oldMatch=0,newMatch=0;
            for(const s of snapshots){
              const r=await ref.call(s.moves,250000);
              const o=await old.call(s.moves,60000);
              const n=await neu.call(s.moves,60000);
              const row={ply:s.ply,moves:s.moves,ref:r,old:o,new:n,oldMatch:o.move===r.move,newMatch:n.move===r.move};
              if(row.oldMatch)oldMatch++;if(row.newMatch)newMatch++;rows.push(row);
            }
            ref.close();old.close();neu.close();
            return{positions:rows.length,oldMatch,newMatch,oldRate:oldMatch/rows.length,newRate:newMatch/rows.length,rows};
          });
          console.log('MIDGAME_SUMMARY',JSON.stringify(result));
          for(const row of result.rows)console.log('MIDGAME_ROW',JSON.stringify(row));
          await browser.close();
          NODE
          node /tmp/midgame/site/server.cjs >/tmp/midgame/server.log 2>&1 & PID=$!; trap 'kill $PID 2>/dev/null||true' EXIT
          for i in $(seq 1 50);do curl -fsS http://127.0.0.1:4173/ >/dev/null&&break||sleep .2;done
          node midgame.mjs 2>&1 | tee /tmp/midgame/result.log
          grep -F 'MIDGAME_SUMMARY ' /tmp/midgame/result.log
      - name: Upload midgame comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v970-midgame-selfplay
          path: |
            /tmp/midgame/result.log
            /tmp/midgame/runtime-sha.txt
            /tmp/midgame/server.log
          if-no-files-found: ignore
          retention-days: 2
