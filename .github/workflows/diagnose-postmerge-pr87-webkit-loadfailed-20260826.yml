name: Diagnose postmerge PR87 WebKit load failed 20260826

on:
  push:
    branches:
      - validate-postmerge-pr87-public-20260826
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-webkit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify production files unchanged from merged main
        shell: bash
        run: |
          set -euo pipefail
          MAIN='03abf4990cfe52c01c92401dddb2287e5919759f'
          git fetch --no-tags origin "$MAIN"
          git diff --exit-code "$MAIN"..HEAD -- shogi-v21528 supabase
          echo PASS_DIAG_PR87_PRODUCTION_UNCHANGED
      - name: Install WebKit
        shell: bash
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps webkit >/dev/null
      - name: Run diagnostic core flow v2
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/diagnose-postmerge-pr87-webkit-loadfailed-v2-20260826.mjs 2>&1 | tee /tmp/diag-pr87-webkit-v2.log
          grep -F 'PASS_DIAG_PR87_WEBKIT_V2_CORE_FLOW' /tmp/diag-pr87-webkit-v2.log
