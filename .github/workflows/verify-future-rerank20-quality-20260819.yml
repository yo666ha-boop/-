name: Verify Future rerank20 runtime quality
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        mode: [midgame, opening]
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright WebKit
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Start COOP COEP server
        run: |
          cat >/tmp/coi-quality.mjs <<'NODE'
          import http from'http';import fs from'fs';import path from'path';const root=process.cwd(),mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.wasm':'application/wasm','.bin':'application/octet-stream','.jpg':'image/jpeg','.png':'image/png','.webp':'image/webp'};http.createServer((q,s)=>{let n=decodeURIComponent(new URL(q.url,'http://x').pathname);if(n.endsWith('/'))n+='index.html';const f=path.resolve(root,'.'+n);if(!f.startsWith(root)||!fs.existsSync(f)){s.writeHead(404);return s.end('404')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',mime[path.extname(f).toLowerCase()]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4202,'127.0.0.1');
          NODE
          node /tmp/coi-quality.mjs >/tmp/coi-quality.log 2>&1 &
          sleep 1
      - name: Run actual candidate quality audit
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -o pipefail
          node .github/scripts/verify-future-rerank20-quality-20260819.mjs 2>&1 | tee /tmp/quality.log
          if [ "$MODE" = midgame ]; then test "$(grep -c '^CAND_REF ' /tmp/quality.log)" -eq 8; test "$(grep -c '^CAND_ROW ' /tmp/quality.log)" -eq 16; else test "$(grep -c '^CAND_REF ' /tmp/quality.log)" -eq 30; test "$(grep -c '^CAND_ROW ' /tmp/quality.log)" -eq 30; fi
          test "$(grep -c '^CAND_SUMMARY ' /tmp/quality.log)" -eq 1
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ matrix.mode }}
        run: |
          { echo "### Future rerank20 actual runtime quality - $MODE"; echo '```text'; grep -E '^(CAND_REF|CAND_ROW|CAND_SUMMARY)' /tmp/quality.log || true; echo '```'; } >/tmp/quality-report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/quality-report.md
