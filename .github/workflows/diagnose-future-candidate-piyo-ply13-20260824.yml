name: Diagnose Future candidate Piyo ply13
on:
  push:
    branches: [validate-future-layout-candidate-20260824]
    paths: ['.github/workflows/diagnose-future-candidate-piyo-ply13-20260824.yml']
permissions:
  contents: read
env:
  CANDIDATE_SHA: 70e15f1787aadbf0235428a0939826342c683d39
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 70e15f1787aadbf0235428a0939826342c683d39
      - name: Prepare audit
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          cat >/tmp/coi-target.mjs <<'NODE'
          import http from'http';import fs from'fs';import path from'path';const root=process.cwd(),mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.wasm':'application/wasm','.bin':'application/octet-stream','.jpg':'image/jpeg','.jpeg':'image/jpeg','.png':'image/png','.webp':'image/webp'};http.createServer((q,s)=>{let n=decodeURIComponent(new URL(q.url,'http://x').pathname);if(n.endsWith('/'))n+='index.html';const f=path.resolve(root,'.'+n);if(!f.startsWith(root)||!fs.existsSync(f)){s.writeHead(404);return s.end('404')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',mime[path.extname(f).toLowerCase()]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4233,'127.0.0.1');
          NODE
          node /tmp/coi-target.mjs >/tmp/coi-target.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4233/shogi-v21528/index.html >/dev/null && break; sleep 1; done
          cat > /tmp/ply13.mjs <<'NODE'
          import {webkit} from 'playwright';
          const pos='lnsgk2nl/1r4gb1/p1ppps1pp/1p3pp2/9/2P1SP1P1/PP1PP1P1P/1B5R1/LNSGKG1NL b - 13';
          const chosen='4f4e';
          const browser=await webkit.launch({headless:true});
          try{
            const page=await browser.newPage({userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1',viewport:{width:390,height:844}});
            const errs=[];page.on('pageerror',e=>errs.push(String(e.message||e)));
            await page.goto('http://127.0.0.1:4233/shogi-v21528/index.html?ply13='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
            const runs=[];
            for(let attempt=1;attempt<=3;attempt++){
              const r=await page.evaluate(async({pos,attempt})=>new Promise((resolve,reject)=>{
                const w=new Worker('/shogi-v21528/future-yaneura-worker21528.js?ply13='+attempt+'-'+Date.now()+Math.random());let id=0;const P=new Map(),stages=[];
                w.onmessage=e=>{const m=e.data||{};if(m.type==='stage'){stages.push(m.text);return}const q=P.get(m.id);if(!q||m.type!=='result')return;P.delete(m.id);clearTimeout(q.t);m.ok?q.r(m):q.j(Error(m.error||'worker'))};
                w.onerror=e=>reject(Error(e.message||'worker'));
                const call=(type,x={},timeout=240000)=>new Promise((r,j)=>{const n=++id,t=setTimeout(()=>{P.delete(n);j(Error(type+' timeout '+stages.slice(-8).join(' | ')))},timeout);P.set(n,{r,j,t});w.postMessage({type,id:n,...x})});
                (async()=>{try{await call('init',{},120000);const t=Date.now();const x=await call('bestmove',{sfen:pos,ms:12000,nodes:15000000,multiPV:10,adaptive:false},240000);resolve({...x,elapsed:Date.now()-t})}catch(e){reject(e)}finally{w.terminate()}})();
              }),{pos,attempt});
              const cs=(r.candidates||[]).slice().sort((a,b)=>(a.rank||99)-(b.rank||99)).map(x=>({rank:x.rank,token:x.token,cp:x.cp,mate:x.mate,depth:x.depth,nodes:x.nodes}));
              const best=cs.find(x=>x.rank===1)||{token:r.token,cp:r.info?.cp,mate:r.info?.mate,rank:1};
              const hit=cs.find(x=>x.token===chosen)||null;
              const loss=Number.isFinite(best.cp)&&Number.isFinite(hit?.cp)?Math.max(0,best.cp-hit.cp):null;
              const out={attempt,pos,chosen,best,chosenRank:hit?.rank||null,chosenCp:hit?.cp??null,lossCp:loss,candidates:cs,elapsed:r.elapsed};runs.push(out);console.log('PLY13_DEEP_AUDIT '+JSON.stringify(out));
            }
            const ranks=runs.map(x=>x.chosenRank),losses=runs.map(x=>x.lossCp).filter(Number.isFinite),summary={candidate:'70e15f1787aadbf0235428a0939826342c683d39',pos,chosen,runs:runs.map(x=>({attempt:x.attempt,best:x.best,chosenRank:x.chosenRank,chosenCp:x.chosenCp,lossCp:x.lossCp,elapsed:x.elapsed})),allTop10:ranks.every(x=>Number.isInteger(x)&&x<=10),maxKnownLossCp:losses.length?Math.max(...losses):null,pageErrors:errs};
            console.log('PLY13_DEEP_SUMMARY '+JSON.stringify(summary));
            if(errs.length)throw Error('pageErrors '+JSON.stringify(errs));
            if(!summary.allTop10)throw Error('chosen 4f4e not stable top10 '+JSON.stringify(ranks));
            if(summary.maxKnownLossCp!==null&&summary.maxKnownLossCp>80)throw Error('chosen 4f4e deep loss too large '+summary.maxKnownLossCp);
            console.log('PASS_PLY13_DEEP_EQUIVALENCE '+JSON.stringify(summary));
          }finally{await browser.close()}
          NODE
          node --check /tmp/ply13.mjs
      - name: Run repeated deep exact-candidate audit
        run: |
          set -o pipefail
          node /tmp/ply13.mjs 2>&1 | tee /tmp/ply13.log
          grep -q '^PASS_PLY13_DEEP_EQUIVALENCE ' /tmp/ply13.log
      - if: always()
        run: grep -E '^(PLY13_DEEP_AUDIT|PLY13_DEEP_SUMMARY|PASS_PLY13_DEEP_EQUIVALENCE|Error:)' /tmp/ply13.log 2>/dev/null || true
