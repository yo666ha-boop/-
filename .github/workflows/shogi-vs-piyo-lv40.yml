name: Shogi Future Mitsuki vs Piyo Lv40
on:
  pull_request:
    paths:
      - '.github/workflows/shogi-vs-piyo-lv40.yml'
      - '.github/scripts/build-opening-safety-harness.py'
  workflow_dispatch:
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check diagnostic builder
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/build-opening-safety-harness.py
          node --check .github/scripts/shogi-vs-piyo-lv40.js
      - name: Install Playwright browsers
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps webkit chromium
      - name: Start Future Mitsuki app server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 > /tmp/shogi-vs-piyo-server.log 2>&1 &
          echo $! > /tmp/shogi-vs-piyo-server.pid
          sleep 2
      - name: Build Future opening-safety match harness
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/shogi-vs-piyo-lv40.js /tmp/future-opening-safety.js
          python3 .github/scripts/build-opening-safety-harness.py
          node --check /tmp/future-opening-safety.js
          grep -F 'const MAX_PLIES=120;' /tmp/future-opening-safety.js
          grep -F 'OPENING_SAFETY' /tmp/future-opening-safety.js
      - name: Run real Piyo Lv40 match with opening safety
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/future-opening-safety.js 2>&1 | tee /tmp/future-opening-safety.log
          grep -F 'PIYO_OPENING_PROBE_RESULT' /tmp/future-opening-safety.log
          grep -F 'OPENING_SAFETY' /tmp/future-opening-safety.log
          if grep -F '"result":"incomplete"' /tmp/future-opening-safety.log; then
            echo 'FAIL: reached 120-ply cap without terminal result'
            exit 1
          fi
          if grep -F '"result":"future_win"' /tmp/future-opening-safety.log; then
            echo 'OPENING_SAFETY_RESULT=WIN'
          else
            echo 'OPENING_SAFETY_RESULT=NOT_WIN'
            exit 1
          fi
      - name: Upload opening-safety match log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: future-opening-safety-vs-piyo-lv40
          path: /tmp/future-opening-safety.log
          if-no-files-found: warn
          retention-days: 2
      - name: Show local server log on failure
        if: failure()
        run: cat /tmp/shogi-vs-piyo-server.log || true