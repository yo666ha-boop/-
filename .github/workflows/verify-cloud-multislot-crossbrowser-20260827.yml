name: verify-cloud-multislot-crossbrowser-20260827

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crossbrowser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium and Firefox
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium firefox
      - name: Verify Chromium Silk and Firefox save selection
        run: node .github/scripts/verify-cloud-multislot-crossbrowser-20260827.mjs
