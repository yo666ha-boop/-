name: Diagnose Future score consistency
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-future-score-consistency-20260822.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKit
        run: |
          set -euo pipefail
          mkdir -p /tmp/fscore && cd /tmp/fscore
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps webkit >/dev/null
      - name: Start COI server
        run: |
          cat >/tmp/fscore/server.mjs <<'NODE'
          import http from'node:http';import fs from'node:fs';import path from'node:path';const root=process.env.GITHUB_WORKSPACE,m={'.html':'text/html','.js':'text/javascript','.wasm':'application/wasm','.bin':'application/octet-stream'};http.createServer((q,s)=>{let u=decodeURIComponent((q.url||'/').split('?')[0]);if(u==='/')u='/shogi-v21528/index.html';const f=path.resolve(root,'.'+u);if(!f.startsWith(path.resolve(root))||!fs.existsSync(f)){s.writeHead(404);return s.end('404')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',m[path.extname(f)]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4188,'127.0.0.1');
          NODE
          node /tmp/fscore/server.mjs >/tmp/fscore/server.log 2>&1 &
          for i in $(seq 1 30);do curl -fsS http://127.0.0.1:4188/shogi-v21528/index.html >/dev/null&&exit 0;sleep 1;done;exit 1
      - name: Repeat exact contradiction positions
        run: |
          cat >/tmp/fscore/a.mjs <<'NODE'
          import{webkit,devices}from'playwright';
          const R='abcdefghi',I='lnsgkgsnl/1r5b1/ppppppppp/9/9/9/PPPPPPPPP/1B5R1/LNSGKGSNL';
          const M=`4i5h 8c8d 2h3h 8d8e 7g7f 8e8f 7f7e 8f8g+ 8h5e P*8h 7e7d 8h8i+ 7d7c+ 8b8e 5e4f 8i7i 5i4h N*5d 7c7d 5d4f 4g4f 7i6i 3g3f 5a4b N*2e 8e2e 2g2f 2e2f P*7b 7a7b 7d6c 2f2i+ P*2f 7b6c 6g6f S*4g 4h4g N*5e 4g4h B*5i 4h4i G*4h 5h4h 5i4h+`.split(/\s+/);
          function S(ms){const b=new Map(),h={b:{},w:{}};for(let r=0;r<9;r++){let f=9,pr=false;for(const c of I.split('/')[r]){if(c==='+'){pr=true;continue}if(/\d/.test(c)){f-=+c;continue}const side=c===c.toUpperCase()?'b':'w';b.set(''+f+R[r],{side,k:c.toUpperCase(),pr});pr=false;f--}}let t='b';for(const x of ms){if(/^[PLNSGBR]\*/.test(x)){const k=x[0],d=x.slice(2);h[t][k]=(h[t][k]||0)-1;b.set(d,{side:t,k,pr:false})}else{const a=x.slice(0,2),d=x.slice(2,4),q=b.get(a),c=b.get(d);if(!q)throw Error('missing '+x);if(c)h[t][c.k]=(h[t][c.k]||0)+1;b.delete(a);b.set(d,{...q,pr:q.pr||x.endsWith('+')})}t=t==='b'?'w':'b'}const rows=[];for(let r=0;r<9;r++){let z='',e=0;for(let f=9;f;f--){const q=b.get(''+f+R[r]);if(!q){e++;continue}if(e){z+=e;e=0}z+=(q.pr?'+':'')+(q.side==='b'?q.k:q.k.toLowerCase())}if(e)z+=e;rows.push(z)}let hand='';for(const side of['b','w'])for(const k of['R','B','G','S','N','L','P']){const n=h[side][k]||0;if(n>0)hand+=(n>1?n:'')+(side==='b'?k:k.toLowerCase())}return rows.join('/')+' '+t+' '+(hand||'-')+' '+(ms.length+1)}
          const b=await webkit.launch({headless:true}),p=await b.newPage({...devices['iPhone 14']});await p.goto('http://127.0.0.1:4188/shogi-v21528/index.html?x='+Date.now(),{waitUntil:'domcontentloaded'});if(!await p.evaluate(()=>crossOriginIsolated))throw Error('COI');
          async function search(pos,opt){return p.evaluate(async({pos,opt})=>{const w=new Worker('./future-yaneura-worker21528.js?v=score-'+Date.now()+'-'+Math.random());let n=0,P=new Map();w.onmessage=e=>{const m=e.data||{},q=P.get(m.id);if(!q||m.type!=='result')return;P.delete(m.id);clearTimeout(q.t);m.ok?q.r(m):q.j(Error(m.error||'worker'))};const call=(type,x={})=>new Promise((r,j)=>{const id=++n,t=setTimeout(()=>j(Error(type+' timeout')),190000);P.set(id,{r,j,t});w.postMessage({type,id,...x})});try{await call('init');return await call('bestmove',{sfen:pos,...opt})}finally{w.terminate()}},{pos,opt})}
          const out=[];for(const ply of[41,43,45]){const pos=S(M.slice(0,ply-1));for(const mode of['sp15','mp5_15','sp30'])for(let rep=1;rep<=3;rep++){const opt=mode==='sp15'?{ms:15000,multiPV:1,adaptive:false}:mode==='mp5_15'?{ms:15000,multiPV:5,adaptive:false}:{ms:30000,multiPV:1,adaptive:false};const r=await search(pos,opt),row={ply,mode,rep,token:r.token,cp:r.info?.cp,mate:r.info?.mate,depth:r.info?.depth,nodes:r.info?.nodes,candidates:(r.candidates||[]).slice(0,5).map(x=>({rank:x.rank,token:x.token,cp:x.cp,mate:x.mate,depth:x.depth,nodes:x.nodes}))};out.push(row);console.log('FUTURE_SCORE_REPEAT '+JSON.stringify(row))}}
          const summary=[41,43,45].map(ply=>({ply,rows:out.filter(x=>x.ply===ply).map(x=>({mode:x.mode,rep:x.rep,token:x.token,cp:x.cp,mate:x.mate,depth:x.depth,nodes:x.nodes}))}));console.log('FUTURE_SCORE_SUMMARY '+JSON.stringify(summary));
          for(const ply of[41,43,45]){const rows=out.filter(x=>x.ply===ply),keys=new Set(rows.map(x=>x.token+'|'+String(x.mate??'')+'|'+String(x.cp??'')));console.log('FUTURE_SCORE_DIVERGENCE '+JSON.stringify({ply,variants:keys.size,rows:rows.map(x=>({mode:x.mode,rep:x.rep,token:x.token,cp:x.cp,mate:x.mate}))}))}
          console.log('PASS_FUTURE_SCORE_CONSISTENCY_HARNESS');await b.close();
          NODE
          cd /tmp/fscore && node a.mjs 2>&1 | tee /tmp/fscore/a.log
          grep -F 'FUTURE_SCORE_SUMMARY ' /tmp/fscore/a.log
          grep -F 'PASS_FUTURE_SCORE_CONSISTENCY_HARNESS' /tmp/fscore/a.log
      - name: Preserve evidence
        if: always()
        run: grep -E '^(FUTURE_SCORE_REPEAT|FUTURE_SCORE_SUMMARY|FUTURE_SCORE_DIVERGENCE|PASS_FUTURE_SCORE_CONSISTENCY_HARNESS)' /tmp/fscore/a.log | tail -120 || true
