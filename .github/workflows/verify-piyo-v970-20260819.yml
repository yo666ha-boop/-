name: Verify Piyo Lv40 vs Future Mitsuki V9.70
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-piyo-v970-20260819.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  practical:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium and WebKit
        shell: bash
        run: |
          mkdir -p /tmp/piyo-pw && cd /tmp/piyo-pw
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
      - name: Start exact Piyo Lv40 and exchange first move
        shell: bash
        run: |
          cat > /tmp/piyo-pw/inspect.mjs <<'NODE'
          import { chromium, webkit } from 'playwright';
          const piyoBr=await chromium.launch({headless:true});
          const p=await piyoBr.newPage({viewport:{width:1280,height:1000}});
          await p.goto('https://www.studiok-i.net/ps/',{waitUntil:'domcontentloaded',timeout:120000});
          await p.waitForSelector('#btnNewGame',{timeout:120000});
          await p.waitForTimeout(2500);
          await p.click('#btnNewGame');
          await p.waitForFunction(()=>document.querySelector('#selectLevelGote')?.options.length>0,{timeout:30000});
          await p.check('#dialogGameGameTypeSente0');
          await p.check('#dialogGameGameTypeGote1');
          const lv40=await p.evaluate(()=>{const s=document.querySelector('#selectLevelGote');const o=[...s.options].find(o=>/^\s*Lv40\b/.test(o.textContent));if(!o)return null;s.value=o.value;s.dispatchEvent(new Event('change',{bubbles:true}));return {v:o.value,t:o.textContent}});
          console.log('PIYO_LV40_SELECTED',JSON.stringify(lv40));
          if(!lv40||!/R2610/.test(lv40.t))throw Error('exact Lv40 Piyo Emperor not selected');
          await p.uncheck('#chkFurigoma').catch(()=>{});
          await p.uncheck('#chkRandomBook').catch(()=>{});
          await p.click('#btnDialogGameStart');
          await p.waitForTimeout(1200);
          const board=await p.evaluate(()=>{const img=document.querySelector('img[alt="盤"]');if(!img)return null;const r=img.getBoundingClientRect();return{rect:{x:r.x,y:r.y,w:r.width,h:r.height}}});
          if(!board||board.rect.w<100)throw Error('Piyo board not found');

          const futureBr=await webkit.launch({headless:true});
          const f=await futureBr.newPage({viewport:{width:1180,height:900},userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'});
          await f.goto('https://yo666ha-boop.github.io/-/shogi-v21528/?piyo='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
          await f.waitForFunction(()=>window.AI_SHOGI_WEB_AUDIT?.characters===26,{timeout:120000});
          if(!await f.evaluate(()=>crossOriginIsolated))throw Error('Future public app COI false');
          const first=await f.evaluate(async()=>{
            const w=new Worker('./future-yaneura-worker21528.js?v=21528v970d4');let n=0,P=new Map();
            w.onmessage=e=>{const m=e.data||{},q=P.get(m.id);if(!q)return;if(m.type==='result'){P.delete(m.id);clearTimeout(q.t);m.ok?q.r(m):q.j(Error(m.error||'worker error'))}};
            const call=(type,payload={})=>new Promise((r,j)=>{const id=++n,t=setTimeout(()=>{P.delete(id);j(Error(type+' timeout'))},150000);P.set(id,{r,j,t});w.postMessage({type,id,...payload})});
            await call('init');const r=await call('bestmove',{sfen:'lnsgkgsnl/1r5b1/ppppppppp/9/9/9/PPPPPPPPP/1B5R1/LNSGKGSNL b - 1',ms:4500,multiPV:1});w.terminate();return r;
          });
          console.log('FUTURE_FIRST',JSON.stringify(first));
          const usi=String(first.token||'');if(!/^[1-9][a-i][1-9][a-i]\+?$/.test(usi))throw Error('unexpected first '+usi);
          const sq=s=>{const file=Number(s[0]),rank=s.charCodeAt(1)-97;return{x:board.rect.x+((9-file)+0.5)*board.rect.w/9,y:board.rect.y+(rank+0.5)*board.rect.h/9}};
          const a=sq(usi.slice(0,2)),b=sq(usi.slice(2,4));await p.mouse.click(a.x,a.y);await p.waitForTimeout(120);await p.mouse.click(b.x,b.y);
          if(usi.endsWith('+')){await p.waitForTimeout(150);if(await p.locator('#btnDialogNari1').isVisible())await p.click('#btnDialogNari1');}
          await p.waitForFunction(()=>document.querySelector('#select_kifu')?.options.length>=3,{timeout:120000});
          await p.waitForTimeout(400);
          const kif=await p.evaluate(()=>[...document.querySelector('#select_kifu').options].map(o=>({v:o.value,t:o.textContent,sel:o.selected})));
          console.log('PIYO_AFTER_FIRST_EXCHANGE',JSON.stringify(kif));

          const menu=p.locator('img[alt="メニュー"]').first();await menu.click();await p.waitForTimeout(250);
          const item=p.getByText('棋譜を表示',{exact:true});console.log('PIYO_KIF_MENU_COUNT',await item.count());
          if(await item.count()){await item.click();await p.waitForTimeout(300);await p.check('#dialogKifType2');await p.waitForTimeout(300);const txt=await p.evaluate(()=>({
            ids:[...document.querySelectorAll('[id]')].filter(e=>/kif/i.test(e.id)&&!!e.offsetParent).map(e=>({id:e.id,tag:e.tagName,value:'value'in e?String(e.value).slice(0,200):'',text:(e.textContent||'').trim().slice(0,500)})),
            body:document.body.innerText.split('\n').filter(x=>x.trim()).slice(-100)
          }));console.log('PIYO_SFEN_DIALOG',JSON.stringify(txt));}
          await futureBr.close();await piyoBr.close();
          NODE
          cd /tmp/piyo-pw
          node inspect.mjs 2>&1 | tee /tmp/piyo-inspect.log
      - name: Report discovery
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Piyo Lv40 first exchange'
            echo '```text'
            grep -E '^(PIYO_LV40_SELECTED|FUTURE_FIRST|PIYO_AFTER_FIRST_EXCHANGE|PIYO_KIF_MENU_COUNT|PIYO_SFEN_DIALOG)' /tmp/piyo-inspect.log | tail -30 || true
            echo '```'
          } >/tmp/piyo-report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/piyo-report.md
