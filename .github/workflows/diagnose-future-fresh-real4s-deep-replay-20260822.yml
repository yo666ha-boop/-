name: Diagnose Future fresh real4s deep replay
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-future-fresh-real4s-deep-replay-20260822.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKit
        run: |
          set -euo pipefail
          mkdir -p /tmp/ffrdeep && cd /tmp/ffrdeep
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps webkit >/dev/null
      - name: Start COI server
        run: |
          cat >/tmp/ffrdeep/server.mjs <<'NODE'
          import http from'node:http';import fs from'node:fs';import path from'node:path';const root=process.env.GITHUB_WORKSPACE,m={'.html':'text/html','.js':'text/javascript','.wasm':'application/wasm','.bin':'application/octet-stream'};http.createServer((q,s)=>{let u=decodeURIComponent((q.url||'/').split('?')[0]);if(u==='/')u='/shogi-v21528/index.html';const f=path.resolve(root,'.'+u);if(!f.startsWith(path.resolve(root))||!fs.existsSync(f)){s.writeHead(404);return s.end('404')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',m[path.extname(f)]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4188,'127.0.0.1');
          NODE
          node /tmp/ffrdeep/server.mjs >/tmp/ffrdeep/server.log 2>&1 &
          for i in $(seq 1 30);do curl -fsS http://127.0.0.1:4188/shogi-v21528/index.html >/dev/null&&exit 0;sleep 1;done;exit 1
      - name: Replay fresh real4s practical trajectory against 15s deep
        run: |
          cat >/tmp/ffrdeep/a.mjs <<'NODE'
          import{webkit,devices}from'playwright';
          const R='abcdefghi',I='lnsgkgsnl/1r5b1/ppppppppp/9/9/9/PPPPPPPPP/1B5R1/LNSGKGSNL';
          const M=`6g6f 3c3d 4i5h 2b6f 6i7h 6f3c 2h3h 8b2b 5i4h 2c2d 9g9f 2d2e 4h4i 2e2f 2g2f 2b2f P*2h 5a6b 9i9h 2f2e 2h2g 2e2g+ 3h2h P*2f 8g8f 2g2h 3i2h 2f2g+ 2h2g P*2h P*6d 2h2i+ R*9e R*3i 4i4h 6c6d 4g4f 2i2h 3g3f 3i1i+ 4h4g 2h2g 5h4h 1i3i 7i6h N*5e 9e5e 3c5e 6h5i 3i5i N*5h 2g3g 4g3g 5i3i 3g4g R*2g 4g5f S*6e 5f5e 5c5d 5e6d L*6c 6d7e`.split(/\s+/);
          function S(ms){const b=new Map(),h={b:{},w:{}};for(let r=0;r<9;r++){let f=9,pr=false;for(const c of I.split('/')[r]){if(c==='+'){pr=true;continue}if(/\d/.test(c)){f-=+c;continue}const side=c===c.toUpperCase()?'b':'w';b.set(''+f+R[r],{side,k:c.toUpperCase(),pr});pr=false;f--}}let t='b';for(const x of ms){if(/^[PLNSGBR]\*/.test(x)){const k=x[0],d=x.slice(2);h[t][k]=(h[t][k]||0)-1;b.set(d,{side:t,k,pr:false})}else{const a=x.slice(0,2),d=x.slice(2,4),q=b.get(a),c=b.get(d);if(!q)throw Error('missing '+x);if(c)h[t][c.k]=(h[t][c.k]||0)+1;b.delete(a);b.set(d,{...q,pr:q.pr||x.endsWith('+')})}t=t==='b'?'w':'b'}const rows=[];for(let r=0;r<9;r++){let z='',e=0;for(let f=9;f;f--){const q=b.get(''+f+R[r]);if(!q){e++;continue}if(e){z+=e;e=0}z+=(q.pr?'+':'')+(q.side==='b'?q.k:q.k.toLowerCase())}if(e)z+=e;rows.push(z)}let hand='';for(const side of['b','w'])for(const k of['R','B','G','S','N','L','P']){const n=h[side][k]||0;if(n>0)hand+=(n>1?n:'')+(side==='b'?k:k.toLowerCase())}return rows.join('/')+' '+t+' '+(hand||'-')+' '+(ms.length+1)}
          const b=await webkit.launch({headless:true}),p=await b.newPage({...devices['iPhone 14']});await p.goto('http://127.0.0.1:4188/shogi-v21528/index.html?x='+Date.now(),{waitUntil:'domcontentloaded'});if(!await p.evaluate(()=>crossOriginIsolated))throw Error('COI');
          async function one(pos,opt){return p.evaluate(async({pos,opt})=>{const w=new Worker('./future-yaneura-worker21528.js?v='+Date.now()+'-'+Math.random());let n=0,P=new Map();w.onmessage=e=>{const m=e.data||{},q=P.get(m.id);if(!q||m.type!=='result')return;P.delete(m.id);clearTimeout(q.t);m.ok?q.r(m):q.j(Error(m.error||'worker'))};const call=(type,x={})=>new Promise((r,j)=>{const id=++n,t=setTimeout(()=>j(Error(type+' timeout')),190000);P.set(id,{r,j,t});w.postMessage({type,id,...x})});try{await call('init');return await call('bestmove',{sfen:pos,...opt})}finally{try{w.terminate()}catch(e){}}},{pos,opt})}
          const targets=[23,25,27,29,31,33,35,37,39,41,43,45,47,49,51],rows=[];
          for(const ply of targets){const pos=S(M.slice(0,ply-1)),actual=M[ply-1];for(const [mode,opt] of [['fresh4',{ms:4000,multiPV:5,adaptive:false}],['deep15',{ms:15000,multiPV:5,adaptive:false}]]){const t=Date.now(),r=await one(pos,opt),cs=r.candidates||[],best=cs.find(x=>x.rank===1)||cs[0],ch=cs.find(x=>x.token===actual);let loss=null;if(Number.isFinite(best?.cp)&&Number.isFinite(ch?.cp))loss=Math.max(0,best.cp-ch.cp);const row={ply,mode,actual,token:r.token,cp:r.info?.cp,mate:r.info?.mate,depth:r.info?.depth,nodes:r.info?.nodes,elapsedMs:Date.now()-t,actualRank:ch?.rank??null,actualCp:ch?.cp,actualMate:ch?.mate??null,best:best?.token,bestCp:best?.cp,bestMate:best?.mate??null,lossCp:loss,top5:cs.slice(0,5).map(x=>({rank:x.rank,token:x.token,cp:x.cp,mate:x.mate,depth:x.depth}))};rows.push(row);console.log('FUTURE_FRESH_REAL4S_DEEP_ROW '+JSON.stringify(row))}}
          const out=targets.map(ply=>{const r=rows.find(x=>x.ply===ply&&x.mode==='fresh4'),d=rows.find(x=>x.ply===ply&&x.mode==='deep15');return{ply,actual:r.actual,fresh4:r.token,deep:d.token,same:r.token===d.token,actualDeepRank:d.actualRank,actualDeepLoss:d.lossCp,freshMate:r.mate??null,deepMate:d.mate??null,freshCp:r.cp,deepCp:d.cp}});console.log('FUTURE_FRESH_REAL4S_DEEP_SUMMARY '+JSON.stringify(out));console.log('FUTURE_FRESH_REAL4S_DEEP_DELTA '+JSON.stringify({different:out.filter(x=>!x.same).map(x=>x.ply),outsideDeep5:out.filter(x=>x.actualDeepRank==null).map(x=>x.ply),loss100:out.filter(x=>Number.isFinite(x.actualDeepLoss)&&x.actualDeepLoss>=100).map(x=>({ply:x.ply,loss:x.actualDeepLoss,actual:x.actual,deep:x.deep})),firstNegativeFresh:out.find(x=>Number.isFinite(x.freshMate)&&x.freshMate<0)?.ply??null,firstNegativeDeep:out.find(x=>Number.isFinite(x.deepMate)&&x.deepMate<0)?.ply??null}));console.log('PASS_FUTURE_FRESH_REAL4S_DEEP_REPLAY');await b.close();
          NODE
          cd /tmp/ffrdeep && node a.mjs 2>&1 | tee /tmp/ffrdeep/a.log
          grep -F 'FUTURE_FRESH_REAL4S_DEEP_DELTA ' /tmp/ffrdeep/a.log
          grep -F 'PASS_FUTURE_FRESH_REAL4S_DEEP_REPLAY' /tmp/ffrdeep/a.log
      - name: Preserve evidence
        if: always()
        run: |
          grep -E '^(FUTURE_FRESH_REAL4S_DEEP_ROW|FUTURE_FRESH_REAL4S_DEEP_SUMMARY|FUTURE_FRESH_REAL4S_DEEP_DELTA|PASS_FUTURE_FRESH_REAL4S_DEEP_REPLAY)' /tmp/ffrdeep/a.log | tail -120 || true
