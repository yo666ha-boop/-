name: Diagnose Future native fixed-depth parity
on:
  push:
    branches: [diag-future-native-parity-20260821]
    paths:
      - '.github/workflows/diagnose-future-native-fixed-depth-20260821.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  native_scalar_compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yaneurao/YaneuraOu
          ref: 76d58ef2e4cf64116784f41fd4816425ab6817ee
          path: YaneuraOu
      - name: Build AVX2 and scalar tournament engines
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq clang lld
          mkdir -p /tmp/native && cp shogi-v21528/yaneuraou/nn.bin /tmp/native/nn.bin
          cd YaneuraOu/source
          make -j2 tournament TARGET_CPU=AVX2 YANEURAOU_EDITION=YANEURAOU_ENGINE_NNUE COMPILER=clang++ TARGET=/tmp/native/avx2
          make clean >/dev/null
          make -j2 tournament TARGET_CPU=OTHER YANEURAOU_EDITION=YANEURAOU_ENGINE_NNUE COMPILER=clang++ TARGET=/tmp/native/scalar
          test -x /tmp/native/avx2 && test -x /tmp/native/scalar
      - name: Compare exact collapse SFEN
        run: |
          cat >/tmp/native/compare.py <<'PY'
          import subprocess,json,re,time
          sfen='lnsgkg1nl/7s1/p3pp1pp/2pp2p2/3+bP4/5B3/P2P1PPPP/4GS1R1/L+r+p2K1NL b gsn2p 29'
          def until(p,pred,timeout=180):
            end=time.time()+timeout; lines=[]
            while time.time()<end:
              x=p.stdout.readline()
              if x=='':
                if p.poll() is not None: raise RuntimeError('exit')
                continue
              x=x.rstrip(); lines.append(x)
              if pred(x): return x,lines
            raise TimeoutError(lines[-20:])
          def one(path,label):
            p=subprocess.Popen([path],cwd='/tmp/native',stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,bufsize=1)
            def send(x):p.stdin.write(x+'\n');p.stdin.flush()
            send('usi');_,usi=until(p,lambda x:x=='usiok',60)
            for c in ['setoption name EvalDir value /tmp/native','setoption name FV_SCALE value 24','setoption name USI_Hash value 32','setoption name Threads value 1','setoption name MultiPV value 1']: send(c)
            send('isready');_,ready=until(p,lambda x:x=='readyok',120); send('usinewgame'); send('position sfen '+sfen); send('go depth 10'); best,lines=until(p,lambda x:x.startswith('bestmove '),180)
            infos=[x for x in lines if x.startswith('info ') and ' pv ' in x]; last=infos[-1] if infos else ''
            def v(pat):
              m=re.search(pat,last); return int(m.group(1)) if m else None
            row={'engine':label,'idName':next((x for x in usi if x.startswith('id name ')),''),'loading':[x for x in ready if 'loading eval file' in x],'token':best.split()[1],'cp':v(r'\bscore cp (-?\d+)'),'mate':v(r'\bscore mate (-?\d+)'),'depth':v(r'\bdepth (\d+)'),'nodes':v(r'\bnodes (\d+)')}
            send('quit'); return row
          rows=[one('/tmp/native/avx2','avx2'),one('/tmp/native/scalar','scalar')]
          for r in rows: print('FUTURE_NATIVE_CPU_ROW '+json.dumps(r,separators=(',',':')),flush=True)
          print('FUTURE_NATIVE_CPU_SUMMARY '+json.dumps({'sfen':sfen,'rows':rows},separators=(',',':')),flush=True)
          print('PASS_FUTURE_NATIVE_CPU_HARNESS',flush=True)
          PY
          python3 /tmp/native/compare.py 2>&1 | tee /tmp/native/compare.log
      - name: Publish evidence to PR80
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');let t='';try{t=fs.readFileSync('/tmp/native/compare.log','utf8')}catch{}const lines=t.split(/\r?\n/).filter(x=>/^(FUTURE_NATIVE_CPU_ROW|FUTURE_NATIVE_CPU_SUMMARY|PASS_FUTURE_NATIVE_CPU_HARNESS)/.test(x));await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:80,body:['### Future native AVX2 vs scalar parity','```text',...(lines.length?lines:['NO_EVIDENCE']),'```'].join('\n').slice(0,60000)});
