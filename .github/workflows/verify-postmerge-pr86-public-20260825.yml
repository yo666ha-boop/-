name: Verify postmerge PR86 public four environment 20260825
on:
  push:
    branches: [validate-postmerge-pr86-public-20260825]
permissions:
  contents: read
jobs:
  public-final:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Assert validation based on exact merged main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin d3f71caf1e9045e2df5b17c41e18d4266ad2f95a --depth=1
          test "$(git rev-parse HEAD^)" = d3f71caf1e9045e2df5b17c41e18d4266ad2f95a
          echo PASS_POSTMERGE_PR86_EXACT_MAIN d3f71caf1e9045e2df5b17c41e18d4266ad2f95a
      - name: Wait for exact public artifact identity
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://yo666ha-boop.github.io/-/'
          FILES=(shogi-side-test/future21520.js shogi-side-test/cohort7-12-yaneura21533.js shogi-side-test/cohort19-26-yaneura21536.js)
          ok=0
          for n in $(seq 1 60); do
            ok=1
            for f in "${FILES[@]}"; do
              mkdir -p "/tmp/public/$(dirname "$f")"
              if ! curl -fsSL --retry 2 --connect-timeout 15 "$BASE$f?sha=d3f71caf-$n" -o "/tmp/public/$f"; then ok=0; break; fi
              a=$(sha256sum "$f" | awk '{print $1}')
              b=$(sha256sum "/tmp/public/$f" | awk '{print $1}')
              echo "PUBLIC_HASH $f local=$a public=$b attempt=$n"
              if [ "$a" != "$b" ]; then ok=0; break; fi
            done
            [ "$ok" -eq 1 ] && break
            sleep 10
          done
          test "$ok" -eq 1
          grep -F "fullsearch-20260825" /tmp/public/shogi-side-test/future21520.js >/dev/null
          grep -F "normal:650" /tmp/public/shogi-side-test/cohort7-12-yaneura21533.js >/dev/null
          echo PASS_POSTMERGE_PR86_PUBLIC_ARTIFACT_IDENTITY_EXACT
      - name: Install browsers
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps webkit chromium firefox >/dev/null
      - name: Verify public four environments all26 real replies sound
        shell: bash
        run: |
          cat > postmerge-pr86-public.mjs <<'NODE'
          import {webkit,chromium,firefox} from 'playwright';
          const base='https://yo666ha-boop.github.io/-/shogi-v21528';
          const cases=[
            {name:'IPHONE_WEBKIT',type:webkit,ua:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1',viewport:{width:390,height:844},hash:32},
            {name:'FIRE_SILK',type:chromium,ua:'Mozilla/5.0 (Linux; U; en-US; KFAPWI Build/JDQ39) AppleWebKit/535.19 (KHTML, like Gecko) Silk/3.13 Safari/535.19 Silk-Accelerated=true',viewport:{width:800,height:1280},hash:48},
            {name:'DESKTOP_CHROMIUM',type:chromium,ua:'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',viewport:{width:1440,height:900},hash:128},
            {name:'FIREFOX',type:firefox,ua:'Mozilla/5.0 (X11; Ubuntu; Linux x86_64; rv:142.0) Gecko/20100101 Firefox/142.0',viewport:{width:1440,height:900},hash:128}
          ];
          const rows=[];
          for(const c of cases){
            const browser=await c.type.launch({headless:true}); const ctx=await browser.newContext({userAgent:c.ua,viewport:c.viewport}); const page=await ctx.newPage(); const errors=[];
            page.on('pageerror',e=>errors.push('pageerror:'+String(e.message||e)));
            page.on('console',m=>{if(m.type()==='error'&&!/favicon|Data URL decoding failed|ERR_INVALID_URL|Load request cancelled|Failed to load resource|ServiceWorker intercepted/i.test(m.text()))errors.push('console:'+m.text())});
            const url=base+'/index.html?postmerge=d3f71caf-'+c.name+'-'+Date.now();
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
            for(let r=0;r<2;r++){try{await page.waitForFunction(()=>crossOriginIsolated&&document.querySelectorAll('#chars .ch').length===26&&window.AI_SHOGI_YANEURAOU_FUTURE?.strengthTune==='fullsearch-20260825'&&window.AI_SHOGI_YANEURAOU_COHORT7_12?.profiles?.[19]?.normal===650,{timeout:25000});break}catch(e){if(r)throw e;await page.reload({waitUntil:'domcontentloaded',timeout:120000})}}
            await page.waitForFunction(()=>[...document.querySelectorAll('#chars .ch img')].every(i=>i.complete&&i.naturalWidth>0),{timeout:30000});
            const initial=await page.evaluate(()=>({coi:crossOriginIsolated,cards:document.querySelectorAll('#chars .ch').length,unique:new Set([...document.querySelectorAll('#chars .ch')].map(x=>(x.querySelector('.chName')?.textContent||x.querySelector('img')?.alt||'').trim())).size,future:{index:AI_SHOGI_YANEURAOU_FUTURE.index,rating:AI_SHOGI_YANEURAOU_FUTURE.rating,tune:AI_SHOGI_YANEURAOU_FUTURE.strengthTune},shin:AI_SHOGI_YANEURAOU_COHORT7_12.profiles[19],overflow:document.documentElement.scrollWidth>innerWidth+1}));
            if(!initial.coi||initial.cards!==26||initial.unique!==26||initial.future.index!==25||initial.future.rating!==3400||initial.future.tune!=='fullsearch-20260825'||initial.shin.normal!==650||initial.shin.minRank!==2||initial.shin.maxLoss!==100||initial.overflow)throw Error(c.name+' initial '+JSON.stringify(initial));
            const eng=await page.evaluate(async()=>{const a=AI_SHOGI_YANEURAOU_FUTURE; await a.init(); const b=Array(81).fill(null),back=['L','N','S','G','K','G','S','N','L'];for(let i=0;i<9;i++){b[i]={k:back[i],o:-1};b[72+i]={k:back[8-i],o:1};b[18+i]={k:'P',o:-1};b[54+i]={k:'P',o:1}}b[10]={k:'R',o:-1};b[16]={k:'B',o:-1};b[64]={k:'B',o:1};b[70]={k:'R',o:1};const r=await a.bestMove({b,h:{1:{},'-1':{}},t:1,log:[],last:null},{ms:300,multiPV:1,adaptive:false});return{status:a.status(),result:r,info:r?.info||{}}});
            if(!eng.status.ready||!eng.status.worker||eng.info.hashMB!==c.hash||eng.info.threads!==1||eng.info.adaptive!==false||(!eng.result?.move&&!eng.result?.resign&&!eng.result?.declareWin))throw Error(c.name+' engine '+JSON.stringify(eng));
            await page.evaluate(()=>AI_SHOGI_PIECE_SOUND.setEnabled(false)); await page.reload({waitUntil:'domcontentloaded',timeout:120000}); await page.waitForFunction(()=>window.AI_SHOGI_PIECE_SOUND&&document.querySelectorAll('#chars .ch').length===26,{timeout:120000}); const sound=await page.evaluate(()=>AI_SHOGI_PIECE_SOUND.enabled); if(sound!==false)throw Error(c.name+' sound persistence'); await page.evaluate(()=>AI_SHOGI_PIECE_SOUND.setEnabled(true));
            async function reply(index,label){await page.locator('#chars .ch').nth(index).click();await page.selectOption('#sideSelect2157','sente');await page.click('#newBtn');await page.waitForTimeout(120);const before=(await page.locator('#moves').textContent()||'').trim();await page.locator('#board').locator(':scope > *').nth(56).click();await page.waitForTimeout(50);await page.locator('#board').locator(':scope > *').nth(47).click();await page.waitForFunction(b=>{const t=(document.getElementById('moves')?.textContent||'').trim();return t&&t!==b;},before,{timeout:10000});const human=(await page.locator('#moves').textContent()||'').trim();await page.waitForFunction(h=>{const t=(document.getElementById('moves')?.textContent||'').trim(),s=(document.getElementById('status')?.textContent||'');return t!==h&&!/考えています/.test(s);},human,{timeout:120000});const replied=(await page.locator('#moves').textContent()||'').trim(),status=(await page.locator('#status').textContent()||'').trim(),opp=(await page.locator('#oppName').textContent()||'').trim();if(replied===human||!opp.includes(label))throw Error(c.name+' reply '+label+' '+JSON.stringify({human,replied,status,opp}));return{human,replied,status,opp}}
            const shin=await reply(19,'シン'); const future=await reply(25,'未来からやってきたみつき'); const row={name:c.name,initial,engine:{status:eng.status,info:eng.info},soundPersist:true,shin,future,errors}; if(errors.length)throw Error(c.name+' errors '+JSON.stringify(errors)); console.log('POSTMERGE_PR86_PUBLIC_ROW '+JSON.stringify(row)); rows.push(row); await browser.close();
          }
          console.log('POSTMERGE_PR86_PUBLIC_SUMMARY '+JSON.stringify(rows));
          console.log('PASS_POSTMERGE_PR86_PUBLIC_FOUR_ENV_ALL26');
          NODE
          node postmerge-pr86-public.mjs 2>&1 | tee /tmp/postmerge-pr86-public.log
          grep -F 'PASS_POSTMERGE_PR86_PUBLIC_FOUR_ENV_ALL26' /tmp/postmerge-pr86-public.log
