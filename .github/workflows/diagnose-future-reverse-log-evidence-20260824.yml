name: Diagnose Future reverse multigame log evidence
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-future-reverse-log-evidence-20260824.yml'
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write
jobs:
  evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Extract compact actual evidence from completed reverse multigame job
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          JOB_ID: '97313204247'
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/jobs/${JOB_ID}/logs" \
            -o /tmp/job.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          text=Path('/tmp/job.log').read_bytes().decode('utf-8','replace')
          wanted=[]
          patterns=(
            'PIYO40_INITIAL ',
            'PIYO40_REVERSE_PROFILE ',
            'FUTURE_LAYOUT_REV_MOVE ',
            'FUTURE_LAYOUT_REV_AUDIT ',
            'FUTURE_LAYOUT_REV_SUMMARY ',
            'FUTURE_REVERSE_MULTIGAME_SUMMARY ',
            'PASS_FUTURE_REVERSE_MULTIGAME_DIVERSITY',
            'PASS_FUTURE_LAYOUT_REVERSE_HARNESS',
            'REVERSE_MULTI_BLOCK_FAIL',
          )
          for line in text.splitlines():
              if '\x1b[36;1m' in line: continue
              for mark in patterns:
                  i=line.find(mark)
                  if i>=0:
                      wanted.append(line[i:].strip())
                      break
          summaries=[x for x in wanted if x.startswith('FUTURE_LAYOUT_REV_SUMMARY ')]
          multi=[x for x in wanted if x.startswith('FUTURE_REVERSE_MULTIGAME_SUMMARY ')]
          initials=[x for x in wanted if x.startswith('PIYO40_INITIAL ')]
          profiles=[x for x in wanted if x.startswith('PIYO40_REVERSE_PROFILE ')]
          audits=[x for x in wanted if x.startswith('FUTURE_LAYOUT_REV_AUDIT ')]
          moves=[x for x in wanted if x.startswith('FUTURE_LAYOUT_REV_MOVE ')]
          gate=any(x=='PASS_FUTURE_REVERSE_MULTIGAME_DIVERSITY' for x in wanted)
          if len(summaries)!=4 or len(initials)!=4 or len(profiles)!=4 or not multi or not gate:
              raise SystemExit(f'evidence incomplete: summaries={len(summaries)} initials={len(initials)} profiles={len(profiles)} multi={len(multi)} gate={gate}')
          # Keep full per-game summary plus initial/profile, and all deep audits. Move lines are reduced to those carrying commit/reply/mate evidence.
          move_evidence=[x for x in moves if any(k in x for k in ('commit','reply','mate','resign','declare'))]
          selected=profiles+initials+summaries+multi[-1:]+['PASS_FUTURE_REVERSE_MULTIGAME_DIVERSITY']+audits+move_evidence
          body='### Diagnostic evidence extraction — reverse multi-game actual\n\n'
          body+='Source job: `97313204247` (diagnostic only; PR80 NEVER MERGE).\n\n```text\n'+'\n'.join(selected)+'\n```\n'
          if len(body)>64000:
              # Guaranteed compact fallback retains every game summary, diversity marker, and audit aggregate count.
              body='### Diagnostic evidence extraction — reverse multi-game actual\n\nSource job: `97313204247` (diagnostic only; PR80 NEVER MERGE).\n\n```text\n'+'\n'.join(profiles+initials+summaries+multi[-1:]+['PASS_FUTURE_REVERSE_MULTIGAME_DIVERSITY'])+f'\nAUDIT_LINE_COUNT {len(audits)}\nMOVE_LINE_COUNT {len(moves)}\n```\n'
          Path('/tmp/comment.md').write_text(body)
          print('EVIDENCE_COUNTS '+json.dumps({'summaryCount':len(summaries),'initialCount':len(initials),'profileCount':len(profiles),'multiCount':len(multi),'passGate':gate,'auditCount':len(audits),'moveCount':len(moves),'commentBytes':len(body.encode())}))
          PY
          gh api "repos/${REPO}/issues/${PR}/comments" -F body=@/tmp/comment.md
