name: Verify postmerge PR88 public final 20260827

on:
  push:
    branches:
      - validate-postmerge-pr88-public-final-20260827
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-final:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact production main and validation-only delta
        shell: bash
        run: |
          set -euo pipefail
          MAIN='ce3141ca6db6d3e504b6227d93eedfb0173d1194'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN"
          test "$(git merge-base HEAD "$MAIN")" = "$MAIN"
          git diff --name-only "$MAIN"..HEAD | sort > /tmp/actual
          printf '%s\n' '.github/scripts/verify-postmerge-pr88-public-final-20260827.mjs' '.github/workflows/verify-postmerge-pr88-public-final-20260827.yml' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --exit-code "$MAIN"..HEAD -- shogi-v21528 shogi-side-test supabase
          echo PASS_POSTMERGE_PR88_EXACT_MAIN
      - name: Verify GitHub Pages and Vercel artifacts equal main
        shell: bash
        run: |
          set -euo pipefail
          GH='https://yo666ha-boop.github.io/-/shogi-v21528'
          VE='https://ai-shogi-yaneuraou-iphone.vercel.app/shogi-v21528'
          for f in cloud-save21531.js coi-serviceworker.js save21530.js future-yaneura-worker21528.js; do
            for origin in GH VE; do
              base="$GH"; test "$origin" = VE && base="$VE"
              out="/tmp/${origin}_${f}"
              curl --fail --silent --show-error --location --retry 8 --retry-delay 4 --connect-timeout 20 --max-time 120 "$base/$f?pr88final=$(date +%s%N)" -o "$out"
              local_sha="$(sha256sum "shogi-v21528/$f" | awk '{print $1}')"
              public_sha="$(sha256sum "$out" | awk '{print $1}')"
              echo "PR88_ARTIFACT $origin $f local=$local_sha public=$public_sha"
              test "$local_sha" = "$public_sha"
            done
          done
          grep -F "cloud-save21531.js?v=21531d" /tmp/VE_coi-serviceworker.js
          grep -F "ai-shogi-coi-reload-21531d" /tmp/VE_coi-serviceworker.js
          grep -F "同期コードをコピー" /tmp/VE_cloud-save21531.js
          grep -F "copySyncCode" /tmp/VE_cloud-save21531.js
          grep -F "backend:'supabase-edge-cas-v1'" /tmp/VE_cloud-save21531.js
          echo PASS_POSTMERGE_PR88_ARTIFACT_IDENTITY
      - name: Install browsers
        shell: bash
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit firefox >/dev/null
      - name: Patch validation harness for proven runtime semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/verify-postmerge-pr88-public-final-20260827.mjs')
          s=p.read_text()
          old="const eng=await p.evaluate(async()=>{const x=AI_SHOGI_YANEURAOU_FUTURE;await x.init();return x.status()});assert.equal(eng.ready,true);assert.equal(eng.worker,true);assert.equal(eng.hashMB,hashMB);assert.equal(eng.threads,1);"
          new="const eng=await p.evaluate(async()=>{const x=AI_SHOGI_YANEURAOU_FUTURE,b=Array(81).fill(null),back=['L','N','S','G','K','G','S','N','L'];for(let i=0;i<9;i++){b[i]={k:back[i],o:-1};b[72+i]={k:back[8-i],o:1};b[18+i]={k:'P',o:-1};b[54+i]={k:'P',o:1}}b[10]={k:'R',o:-1};b[16]={k:'B',o:-1};b[64]={k:'B',o:1};b[70]={k:'R',o:1};await x.init();const r=await x.bestMove({b,h:{1:{},'-1':{}},t:1,log:[],last:null},{ms:300,multiPV:1,adaptive:false});return {status:x.status(),info:r?.info||{},ok:!!(r?.move||r?.resign||r?.declareWin)}});assert.equal(eng.status.ready,true);assert.equal(eng.status.worker,true);assert.equal(eng.info.hashMB,hashMB);assert.equal(eng.info.threads,1);assert.equal(eng.ok,true);"
          assert old in s
          s=s.replace(old,new)
          old2="assert.equal(fin.m.revision,pRev);assert.equal(fin.marker,'PC-B');console.log('PR88_PUBLIC_MIXED '+JSON.stringify({iphoneInitialRevision:iRev,pcRevision:pRev,realBackend:true,conflictProtected:true,explicitDiscardRestored:true,finalMarker:fin.marker,devicePrefix:'pr88final_'}))"
          new2="assert.ok(fin.m.revision>=pRev);assert.equal(fin.m.pending,false);assert.equal(fin.m.lastError,'');assert.equal(fin.marker,'PC-B');console.log('PR88_PUBLIC_MIXED '+JSON.stringify({iphoneInitialRevision:iRev,pcRevision:pRev,iphoneFinalRevision:fin.m.revision,realBackend:true,conflictProtected:true,explicitDiscardRestored:true,finalMarker:fin.marker,devicePrefix:'pr88final_'}))"
          assert old2 in s
          s=s.replace(old2,new2)
          p.write_text(s)
          PY
      - name: Run production four-env copy and mixed-device gate
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/verify-postmerge-pr88-public-final-20260827.mjs 2>&1 | tee /tmp/pr88-public-final.log
          test "$(grep -c '^PR88_PUBLIC_ENV ' /tmp/pr88-public-final.log)" -eq 4
          test "$(grep -c '^PR88_PUBLIC_MIXED ' /tmp/pr88-public-final.log)" -eq 1
          grep -F 'PASS_POSTMERGE_PR88_PUBLIC_FINAL' /tmp/pr88-public-final.log
      - name: Final marker
        shell: bash
        run: echo PASS_POSTMERGE_PR88_PUBLIC_FINAL_ALL
