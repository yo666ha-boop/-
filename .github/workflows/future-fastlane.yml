name: Future diagnostic fastlane
on:
  push:
    branches: [diag-future-fastlane-20260822]
permissions:
  contents: read
  issues: write
concurrency:
  group: future-fastlane
  cancel-in-progress: true
jobs:
  practical:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report run id
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/issues/80/comments -f body="FASTLANE_LAYOUT_PRACTICAL_RUN ${{ github.run_id }} ${{ github.sha }} PRODUCTION_PATCHES_PLUS_NNUE_LAYOUT_FIX"
      - uses: actions/checkout@v4
        with:
          repository: yaneurao/YaneuraOu
          ref: 76d58ef2e4cf64116784f41fd4816425ab6817ee
          path: YaneuraOu-layoutfix
      - name: Restore production WASM patches and NNUE layout fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,textwrap
          yml=subprocess.check_output(['git','show','2fbda43b3ac86c38f7760e589ce4c52c15c65141:.github/workflows/diag-yaneuraou-v970-threadfix.yml'],text=True)
          block=yml.split("python3 - <<'PY'",1)[1].split('\n          PY',1)[0]
          Path('/tmp/threadfix.py').write_text(textwrap.dedent(block.lstrip('\n')).replace("Path('YaneuraOu/","Path('YaneuraOu-layoutfix/"))
          PY
          python3 /tmp/threadfix.py
          python3 - <<'PY'
          from pathlib import Path
          m=Path('YaneuraOu-layoutfix/source/Makefile');s=m.read_text();assert '-s PTHREAD_POOL_SIZE=2' in s;m.write_text(s.replace('-s PTHREAD_POOL_SIZE=2','-s PTHREAD_POOL_SIZE=32',1))
          p=Path('YaneuraOu-layoutfix/source/eval/nnue/evaluate_nnue.cpp');s=p.read_text();needle='''    Options.add("EvalDir", Option(default_eval_dir, [](const Option& o) {\n                    std::string eval_dir = std::string(o);\n                    if (last_eval_dir != eval_dir)\n                    {\n                        // 評価関数フォルダ名の変更に際して、評価関数ファイルの読み込みフラグをクリアする。\n                        last_eval_dir = eval_dir;\n                        eval_loaded   = false;\n                    }\n                    return std::nullopt;\n                }));\n\n''';repl=needle+'''#if defined(__EMSCRIPTEN__)\n    Options.add("EvalFile", Option(EvalFileDefaultName));\n#endif\n\n''';
          if 'Options.add("EvalFile"' not in s: assert needle in s;s=s.replace(needle,repl,1)
          p.write_text(s)
          for fn,old,new in [('affine_transform.h','#if defined(USE_SSSE3) || defined(USE_NEON_DOTPROD)\n        return kOutputDimensions % 4 == 0 ? GetWeightIndexScrambled(i) : i;','#if (defined(USE_SSSE3) || defined(USE_NEON_DOTPROD)) && !defined(USE_WASM_SIMD)\n        return kOutputDimensions % 4 == 0 ? GetWeightIndexScrambled(i) : i;'),('affine_transform_sparse_input.h','#if defined(USE_SSSE3) || USE_NEON >= 8\n        return kOutputDimensions % 4 == 0 ? GetWeightIndexScrambled(i) : i;','#if (defined(USE_SSSE3) || USE_NEON >= 8) && !defined(USE_WASM_SIMD)\n        return kOutputDimensions % 4 == 0 ? GetWeightIndexScrambled(i) : i;')]:
              p=Path('YaneuraOu-layoutfix/source/eval/nnue/layers')/fn;s=p.read_text();assert old in s;p.write_text(s.replace(old,new,1))
          PY
          grep -F 'wasmNativeStarted' YaneuraOu-layoutfix/source/thread.cpp
          grep -F 'EMSCRIPTEN_KEEPALIVE int usi_command' YaneuraOu-layoutfix/source/engine/yaneuraou-engine/yaneuraou-search.cpp
          grep -F 'Options.add("EvalFile"' YaneuraOu-layoutfix/source/eval/nnue/evaluate_nnue.cpp
      - name: Build corrected V9.70 WASM
        run: |
          set -euo pipefail
          docker pull emscripten/emsdk:3.1.43 >/dev/null
          mkdir -p YaneuraOu-layoutfix/build/wasm/halfkp.noeval/lib
          docker run --rm -v "${{ github.workspace }}/YaneuraOu-layoutfix:/src" -w /src/source emscripten/emsdk:3.1.43 bash -lc 'make clean && make -j2 tournament COMPILER=em++ TARGET_CPU=WASM YANEURAOU_EDITION=YANEURAOU_ENGINE_NNUE TARGET=../build/wasm/halfkp.noeval/lib/yaneuraou.halfkp.noeval.js EM_EXPORT_NAME=YaneuraOu_HalfKP_noeval EM_INITIAL_MEMORY_SIZE=167772160' >/tmp/fast-build.log 2>&1
          LIB=YaneuraOu-layoutfix/build/wasm/halfkp.noeval/lib;mkdir -p shogi-v21528/layoutfix76d;cp "$LIB"/yaneuraou.halfkp.noeval.{js,worker.js,wasm} shogi-v21528/layoutfix76d/;cp shogi-v21528/yaneuraou/nn.bin shogi-v21528/layoutfix76d/
          echo FAST_LAYOUT_PRACTICAL_BUILD_OK
      - name: Prepare corrected worker and browsers
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('shogi-v21528/future-yaneura-worker21528.js','utf8').replace("BASE=new URL('./yaneuraou/',self.location.href).href;","BASE=new URL('./layoutfix76d/',self.location.href).href;");fs.writeFileSync('shogi-v21528/future-layoutfix-worker.js',s);
          NODE
          npm init -y >/dev/null;npm i --no-audit --no-fund playwright@1.55.0 >/dev/null;npx playwright install --with-deps chromium webkit >/dev/null
      - name: Start COI server
        run: |
          cat >/tmp/fast-srv.mjs <<'NODE'
          import http from'node:http';import fs from'node:fs';import path from'node:path';const r=process.env.GITHUB_WORKSPACE,m={'.html':'text/html','.js':'text/javascript','.wasm':'application/wasm','.bin':'application/octet-stream','.png':'image/png','.jpg':'image/jpeg','.json':'application/json'};http.createServer((q,s)=>{let u=new URL(q.url,'http://x').pathname;if(u.endsWith('/'))u+='index.html';const f=path.resolve(r,'.'+u);if(!f.startsWith(path.resolve(r))||!fs.existsSync(f)){s.writeHead(404);return s.end()}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Content-Type',m[path.extname(f)]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4230,'127.0.0.1')
          NODE
          node /tmp/fast-srv.mjs >/tmp/fast-srv.log 2>&1 & for i in $(seq 1 30);do curl -fsS http://127.0.0.1:4230/shogi-v21528/index.html >/dev/null&&exit 0;sleep 1;done;cat /tmp/fast-srv.log;exit 1
      - name: Corrected WebKit Future vs Piyo Lv40
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/verify-future-current-vs-piyo40-20260820.yml').read_text();a="          cat >/tmp/fpiyo/match.mjs <<'NODE'\n";i=src.index(a)+len(a);j=src.index("\n          NODE\n",i);js='\n'.join(line[10:] if line.startswith('          ') else line for line in src[i:j].splitlines())+'\n'
          js=js.replace('http://127.0.0.1:4173/','http://127.0.0.1:4230/').replace('./future-yaneura-worker21528.js?v=practical-','./future-layoutfix-worker.js?v=practical-')
          old="await p.click('#btnDialogKifClose');const m=/^position startpos";new="await p.click('#btnDialogKifClose');await p.waitForFunction(()=>{const e=document.querySelector('#dialogKifBox');return !e||getComputedStyle(e).display==='none'||getComputedStyle(e).visibility==='hidden'||e.getClientRects().length===0},{},{timeout:4000});await p.waitForTimeout(120);const m=/^position startpos";assert old in js;js=js.replace(old,new,1)
          old="async function exportMoves(){await p.locator('img[alt=\"メニュー\"]').first().click();";new="async function exportMoves(){await p.evaluate(()=>{const d=document.querySelector('#dialogMess');if(d){d.classList.remove('is-show');d.style.display='none'}});await p.locator('img[alt=\"メニュー\"]').first().click({force:true});";assert old in js;js=js.replace(old,new,1)
          old="if(u.endsWith('+'))await p.locator('#btnDialogNari2').click({force:true,timeout:1000}).catch(()=>{});else if(await p.locator('#dialogNari').isVisible().catch(()=>false))await p.click('#btnDialogNari1')";new="if(u.endsWith('+')){await p.waitForTimeout(120);if(await p.locator('#dialogNari').isVisible().catch(()=>false)){await p.click('#btnDialogNari2');await p.locator('#dialogNari').waitFor({state:'hidden',timeout:4000})}}else{await p.waitForTimeout(120);if(await p.locator('#dialogNari').isVisible().catch(()=>false)){await p.click('#btnDialogNari1');await p.locator('#dialogNari').waitFor({state:'hidden',timeout:4000})}}";assert old in js;js=js.replace(old,new,1)
          js=js.replace('FUTURE_CURRENT_PROFILE','FAST_LAYOUT_PROFILE').replace('FUTURE_CURRENT_MOVE','FAST_LAYOUT_MOVE').replace('FUTURE_CURRENT_AUDIT','FAST_LAYOUT_AUDIT').replace('FUTURE_CURRENT_PRACTICAL_SUMMARY','FAST_LAYOUT_PRACTICAL_SUMMARY').replace('PASS_FUTURE_CURRENT_PIYO40_HARNESS','PASS_FAST_LAYOUT_PIYO40_HARNESS');Path('/tmp/fast-practical.mjs').write_text(js)
          PY
          ATTEMPT=1 node /tmp/fast-practical.mjs 2>&1 | tee /tmp/fast-practical.log
      - name: Preserve evidence
        if: always()
        run: |
          grep -E '^(PIYO40_PROFILE|FAST_LAYOUT_PROFILE|FAST_LAYOUT_MOVE|PIYO40_COMMIT|PIYO40_HEARTBEAT|PIYO40_REPLY|FAST_LAYOUT_AUDIT|FAST_LAYOUT_PRACTICAL_SUMMARY|PASS_FAST_LAYOUT_PIYO40_HARNESS)' /tmp/fast-practical.log | tail -400 || true
          tail -80 /tmp/fast-build.log || true
