name: Future diagnostic fastlane
on:
  push:
    branches: [diag-future-fastlane-20260822]
permissions:
  contents: read
  issues: write
concurrency:
  group: future-fastlane
  cancel-in-progress: true
jobs:
  parity:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Report run id
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/issues/80/comments -f body="FASTLANE_LAYOUT_RUN ${{ github.run_id }} ${{ github.sha }} WASM_NNUE_WEIGHT_LAYOUT_FIX"
      - uses: actions/checkout@v4
        with:
          repository: yaneurao/YaneuraOu
          ref: 76d58ef2e4cf64116784f41fd4816425ab6817ee
          path: YaneuraOu-layoutfix
      - name: Patch weight layout and build WASM
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('YaneuraOu-layoutfix/source/eval/nnue/layers/affine_transform.h')
          s=p.read_text()
          old='#if defined(USE_SSSE3) || defined(USE_NEON_DOTPROD)\n        return kOutputDimensions % 4 == 0 ? GetWeightIndexScrambled(i) : i;'
          new='#if (defined(USE_SSSE3) || defined(USE_NEON_DOTPROD)) && !defined(USE_WASM_SIMD)\n        return kOutputDimensions % 4 == 0 ? GetWeightIndexScrambled(i) : i;'
          assert old in s
          p.write_text(s.replace(old,new,1))
          m=Path('YaneuraOu-layoutfix/source/Makefile')
          t=m.read_text(); assert '-s PTHREAD_POOL_SIZE=32' in t
          m.write_text(t.replace('-s PTHREAD_POOL_SIZE=32','-s PTHREAD_POOL_SIZE=2',1))
          PY
          docker pull emscripten/emsdk:3.1.43 >/dev/null
          docker run --rm -v "${{ github.workspace }}/YaneuraOu-layoutfix:/src" -w /src emscripten/emsdk:3.1.43 node script/wasm_build.js halfkp.noeval >/tmp/layout-build.log 2>&1
          LIB=YaneuraOu-layoutfix/build/wasm/halfkp.noeval/lib
          mkdir -p shogi-v21528/layoutfix76d
          cp "$LIB"/yaneuraou.halfkp.noeval.{js,worker.js,wasm} shogi-v21528/layoutfix76d/
          cp shogi-v21528/yaneuraou/nn.bin shogi-v21528/layoutfix76d/
          echo FAST_LAYOUT_BUILD_OK
          sha256sum shogi-v21528/layoutfix76d/yaneuraou.halfkp.noeval.{js,wasm} shogi-v21528/layoutfix76d/nn.bin
      - name: Prepare worker and browser
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const src=fs.readFileSync('shogi-v21528/future-yaneura-worker21528.js','utf8');
          const mark="    if(m.type==='stop'){try{if(engine)await sendUSI('stop')}catch(e){};return}";
          if(!src.includes(mark))throw Error('worker marker');
          const diag=`    if(m.type==='rawdepth'){await init();latestInfo={};latestMultiPV={};await sendUSI('setoption name MultiPV value 1');await sendUSI('setoption name USI_Hash value 32');await sendUSI('setoption name Threads value 1');await sendUSI('position sfen '+String(m.sfen||''));const p=waitLine(x=>x.startsWith('bestmove '),240000,'diag');await sendUSI('go depth '+Number(m.depth),240000);const line=await p;self.postMessage({type:'result',id,ok:true,kind:'rawdepth',token:(line.split(/\\s+/)[1]||''),info:{...latestInfo}});return;}\n`;
          let s=src.replace(mark,diag+mark).replace("BASE=new URL('./yaneuraou/',self.location.href).href;","BASE=new URL('./layoutfix76d/',self.location.href).href;");
          fs.writeFileSync('shogi-v21528/future-depth-layoutfix.js',s);
          NODE
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps webkit chromium >/dev/null
      - name: Start COI server
        run: |
          cat >/tmp/layout-srv.mjs <<'NODE'
          import http from'node:http';import fs from'node:fs';import path from'node:path';const r=process.env.GITHUB_WORKSPACE,m={'.html':'text/html','.js':'text/javascript','.wasm':'application/wasm','.bin':'application/octet-stream'};http.createServer((q,s)=>{let u=new URL(q.url,'http://x').pathname;if(u.endsWith('/'))u+='index.html';const f=path.resolve(r,'.'+u);if(!f.startsWith(path.resolve(r))||!fs.existsSync(f)){s.writeHead(404);return s.end()}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Content-Type',m[path.extname(f)]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4229,'127.0.0.1')
          NODE
          node /tmp/layout-srv.mjs >/tmp/layout-srv.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4229/shogi-v21528/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/layout-srv.log; exit 1
      - name: Fixed depth parity WebKit and Chromium
        run: |
          set -euo pipefail
          cat >layout.mjs <<'NODE'
          import{webkit,chromium}from'playwright';
          const q={ply:29,depth:12,sfen:'lnsgkg1nl/7s1/p3pp1pp/2pp2p2/3+bP4/5B3/P2P1PPPP/4GS1R1/L+r+p2K1NL b gsn2p 29',expectedToken:'5e5d',expectedCp:-4054};
          async function once(type){const bt=type==='webkit'?webkit:chromium,b=await bt.launch({headless:true}),p=await b.newPage({userAgent:type==='webkit'?'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1':undefined});await p.goto('http://127.0.0.1:4229/shogi-v21528/index.html',{waitUntil:'domcontentloaded'});const r=await p.evaluate(async q=>{const w=new Worker('./future-depth-layoutfix.js?v='+Date.now()+Math.random());let n=0,P=new Map();w.onmessage=e=>{const m=e.data||{},z=P.get(m.id);if(!z||m.type!=='result')return;P.delete(m.id);clearTimeout(z.t);m.ok?z.r(m):z.j(Error(m.error||'worker'))};const call=(type,x={},ms=250000)=>new Promise((r,j)=>{const id=++n,t=setTimeout(()=>j(Error(type+' timeout')),ms);P.set(id,{r,j,t});w.postMessage({type,id,...x})});try{await call('init',{},120000);return await call('rawdepth',{sfen:q.sfen,depth:q.depth})}finally{w.terminate()}},q);const row={browser:type,ply:q.ply,depth:q.depth,token:r.token,cp:r.info?.cp,nodes:r.info?.nodes,expectedToken:q.expectedToken,expectedCp:q.expectedCp,tokenMatch:r.token===q.expectedToken,cpDelta:r.info?.cp-q.expectedCp};console.log('FAST_LAYOUT_ROW '+JSON.stringify(row));await b.close();return row}
          const rows=[await once('webkit'),await once('chromium')];
          console.log('FAST_LAYOUT_SUMMARY '+JSON.stringify({tokenMatches:rows.filter(x=>x.tokenMatch).length,maxAbsCpDelta:Math.max(...rows.map(x=>Math.abs(x.cpDelta))),rows}));
          console.log('PASS_FAST_LAYOUT_HARNESS');
          NODE
          node layout.mjs 2>&1 | tee /tmp/layout.log
          grep -F 'FAST_LAYOUT_ROW ' /tmp/layout.log
          grep -F 'FAST_LAYOUT_SUMMARY ' /tmp/layout.log
          grep -F 'PASS_FAST_LAYOUT_HARNESS' /tmp/layout.log
      - name: Preserve evidence
        if: always()
        run: |
          grep -E '^(FAST_LAYOUT_|PASS_FAST_LAYOUT_)' /tmp/layout.log || true
          tail -100 /tmp/layout-build.log || true
