name: Diagnose Piyo legal click sync at failed Future moves
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-piyo-legal-click-sync-20260823.yml'
permissions:
  contents: read
jobs:
  legal-click:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          set -euo pipefail
          mkdir -p /tmp/pclick && cd /tmp/pclick
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Reproduce failed legal moves in human-human mode
        run: |
          set -euo pipefail
          cat >/tmp/pclick/check.mjs <<'NODE'
          import {chromium} from 'playwright';
          const cases=[
            {name:'h33-ply7-king',pre:['7g7f','8c8d','4i5h','3c3d','8h2b+','3a2b'],target:'5i4i'},
            {name:'h25-ply7-rook',pre:['7g7f','4a3b','7f7e','3c3d','8h2b+','3a2b'],target:'2h7h'},
            {name:'h21-ply21-king',pre:['7g7f','8c8d','4i5h','7a6b','2h3h','3c3d','8h2b+','3a2b','9i9h','8d8e','7f7e','B*5d','3g3f','5d8g+','B*5e','4a3b','7e7d','8g9h','7d7c+','6b7c'],target:'5i4i'}
          ];
          const b=await chromium.launch({headless:true});
          async function setup(name){
            const p=await b.newPage({viewport:{width:1280,height:1000}});
            await p.goto('https://www.studiok-i.net/ps/',{waitUntil:'domcontentloaded',timeout:120000});
            await p.waitForSelector('#btnNewGame',{timeout:120000});await p.waitForTimeout(1200);await p.click('#btnNewGame');
            await p.waitForFunction(()=>document.querySelector('#selectLevelGote')?.options.length>0);
            const radios=await p.evaluate(()=>[...document.querySelectorAll('input[name*=GameType],input[id*=GameType]')].map(x=>({id:x.id,name:x.name,value:x.value,checked:x.checked,label:(x.labels?.[0]?.textContent||'').trim()})));
            console.log('PIYO_CLICK_SETUP '+JSON.stringify({case:name,stage:'dialog',radios}));
            await p.check('#dialogGameGameTypeSente0');await p.check('#dialogGameGameTypeGote0');
            await p.uncheck('#chkFurigoma').catch(()=>{});await p.uncheck('#chkRandomBook').catch(()=>{});await p.uncheck('#chkRatingTarget').catch(()=>{});
            console.log('PIYO_CLICK_SETUP '+JSON.stringify({case:name,stage:'selected',selected:await p.evaluate(()=>({s0:document.querySelector('#dialogGameGameTypeSente0')?.checked,s1:document.querySelector('#dialogGameGameTypeSente1')?.checked,g0:document.querySelector('#dialogGameGameTypeGote0')?.checked,g1:document.querySelector('#dialogGameGameTypeGote1')?.checked}))}));
            await p.click('#btnDialogGameStart');await p.waitForTimeout(900);return p;
          }
          async function runCase(c){
            const p=await setup(c.name);const br=await p.locator('#board_img').boundingBox();if(!br)throw Error('board');
            const sq=s=>({x:br.x+((9-+s[0])+.5)*br.width/9,y:br.y+(s.charCodeAt(1)-97+.5)*br.height/9});
            async function exportMoves(){
              await p.locator('img[alt="メニュー"]').first().click();await p.waitForTimeout(100);await p.click('#menuKifu');await p.waitForTimeout(100);await p.check('#dialogKifType2');await p.waitForTimeout(60);
              const txt=(await p.locator('#dialogKifBox').textContent()||'').trim();await p.click('#btnDialogKifClose');
              const t0=Date.now();await p.waitForFunction(()=>{const e=document.querySelector('#dialogKifBox');return !e||getComputedStyle(e).display==='none'||getComputedStyle(e).visibility==='hidden'||e.getClientRects().length===0},{},{timeout:4000});
              console.log('PIYO_CLICK_KIFU_CLOSE '+JSON.stringify({case:c.name,elapsedMs:Date.now()-t0}));await p.waitForTimeout(120);
              const m=/^position startpos(?: moves\s+(.+))?$/s.exec(txt);if(!m)throw Error('export '+txt);return m[1]?m[1].trim().split(/\s+/):[]
            }
            async function state(){return p.evaluate(()=>{const o=[...document.querySelectorAll('#select_kifu option')].map(x=>(x.textContent||'').trim()),vis=e=>!!e&&getComputedStyle(e).display!=='none'&&getComputedStyle(e).visibility!=='hidden'&&e.getClientRects().length>0;return{count:o.length,last:o.at(-1)||'',tail:o.slice(-4),nari:vis(document.querySelector('#dialogNari')),kifu:vis(document.querySelector('#dialogKifBox')),game:vis(document.querySelector('#dialogGame')),menu:vis(document.querySelector('#menu'))}})}
            async function diag(u,label){const a=sq(u.slice(0,2)),d=sq(u.slice(2,4));const x=await p.evaluate(({a,d})=>{const f=q=>{const e=document.elementFromPoint(q.x,q.y);if(!e)return null;const r=e.getBoundingClientRect();return{tag:e.tagName,id:e.id,cls:e.className,alt:e.getAttribute('alt'),src:e.getAttribute('src'),rect:{x:r.x,y:r.y,w:r.width,h:r.height}}};return{src:f(a),dst:f(d)}},{a,d});console.log('PIYO_CLICK_DIAG '+JSON.stringify({case:c.name,label,u,board:br,a,d,hit:x,state:await state()}))}
            async function play(u,slow=false){
              if(/^[PLNSGBR]\*/.test(u)){const jp={P:'歩',L:'香',N:'桂',S:'銀',G:'金',B:'角',R:'飛'}[u[0]],pt=await p.evaluate(jp=>[...document.querySelectorAll('#komadai_u img,#komadai_s img')].map(i=>{const r=i.getBoundingClientRect();return{alt:i.alt.trim(),x:r.x+r.width/2,y:r.y+r.height/2,w:r.width,h:r.height}}).find(x=>x.w&&x.h&&x.alt===jp)||null,jp);if(!pt)throw Error('hand '+u);await p.mouse.click(pt.x,pt.y);await p.waitForTimeout(slow?350:80);const d=sq(u.slice(2));await p.mouse.click(d.x,d.y);await p.waitForTimeout(slow?350:120);return}
              const a=sq(u.slice(0,2)),d=sq(u.slice(2,4));await p.mouse.click(a.x,a.y);await p.waitForTimeout(slow?350:80);await p.mouse.click(d.x,d.y);
              if(u.endsWith('+')){
                await p.locator('#dialogNari').waitFor({state:'visible',timeout:4000});
                const buttons=await p.evaluate(()=>[...document.querySelectorAll('#dialogNari button,input[type=button]')].filter(x=>x.id?.includes('DialogNari')).map(x=>({id:x.id,text:(x.textContent||x.value||'').trim()})));
                console.log('PIYO_CLICK_NARI '+JSON.stringify({case:c.name,u,buttons,state:await state()}));
                await p.click('#btnDialogNari2');await p.locator('#dialogNari').waitFor({state:'hidden',timeout:4000});
              }else{
                await p.waitForTimeout(slow?350:120);if(await p.locator('#dialogNari').isVisible().catch(()=>false)){const buttons=await p.evaluate(()=>[...document.querySelectorAll('#dialogNari button,input[type=button]')].filter(x=>x.id?.includes('DialogNari')).map(x=>({id:x.id,text:(x.textContent||x.value||'').trim()})));console.log('PIYO_CLICK_NARI '+JSON.stringify({case:c.name,u,buttons,state:await state()}));await p.click('#btnDialogNari1');await p.locator('#dialogNari').waitFor({state:'hidden',timeout:4000})}
              }
              await p.waitForTimeout(slow?250:80)
            }
            async function commitOne(u,label){const before=(await state()).count;await diag(u,label+'-before-fast');await play(u,false);let s=await state();for(let i=0;i<20&&s.count<before+1;i++){await p.waitForTimeout(100);s=await state()}console.log('PIYO_CLICK_ATTEMPT '+JSON.stringify({case:c.name,label,mode:'fast',target:u,before,after:s.count,state:s,ok:s.count>=before+1}));if(s.count<before+1){await p.keyboard.press('Escape').catch(()=>{});await p.waitForTimeout(300);await diag(u,label+'-before-slow-retry');await play(u,true);s=await state();for(let i=0;i<30&&s.count<before+1;i++){await p.waitForTimeout(100);s=await state()}console.log('PIYO_CLICK_ATTEMPT '+JSON.stringify({case:c.name,label,mode:'slow-retry',target:u,before,after:s.count,state:s,ok:s.count>=before+1}))}if(s.count<before+1)return{ok:false,moves:null,state:s};const got=await exportMoves();return{ok:got.at(-1)===u,moves:got,state:s}}
            console.log('PIYO_CLICK_SETUP '+JSON.stringify({case:c.name,stage:'started',board:br,state:await state()}));
            for(let i=0;i<c.pre.length;i++){const u=c.pre[i],r=await commitOne(u,'pre-'+(i+1));console.log('PIYO_CLICK_PRE '+JSON.stringify({case:c.name,index:i+1,target:u,ok:r.ok,tail:r.moves?.slice(-4)||null,state:r.state}));if(!r.ok){await p.close();return false}}
            const r=await commitOne(c.target,'target');const ok=!!r.ok;console.log('PIYO_CLICK_SUMMARY '+JSON.stringify({case:c.name,target:c.target,ok,tail:r.moves?.slice(-6)||null,state:r.state}));await p.close();return ok
          }
          let all=true;for(const c of cases){try{all=(await runCase(c))&&all}catch(e){all=false;console.log('PIYO_CLICK_CASE_ERROR '+JSON.stringify({case:c.name,error:String(e&&e.stack||e)}))}}console.log('PIYO_CLICK_ALL '+JSON.stringify({all}));await b.close();if(!all)process.exit(2);
          NODE
          cd /tmp/pclick
          node --check check.mjs
          node check.mjs 2>&1 | tee legal-click.log
      - name: Preserve evidence
        if: always()
        run: |
          grep -E '^(PIYO_CLICK_SETUP|PIYO_CLICK_KIFU_CLOSE|PIYO_CLICK_NARI|PIYO_CLICK_DIAG|PIYO_CLICK_ATTEMPT|PIYO_CLICK_PRE|PIYO_CLICK_SUMMARY|PIYO_CLICK_CASE_ERROR|PIYO_CLICK_ALL)' /tmp/pclick/legal-click.log || true
