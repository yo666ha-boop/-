name: Diagnose Future MultiPV lifecycle semantics
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-future-multipv-lifecycle-20260823.yml'
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKit
        run: |
          set -euo pipefail
          mkdir -p /tmp/flife && cd /tmp/flife
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps webkit >/dev/null
      - name: Derive lifecycle raw worker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('shogi-v21528/future-yaneura-worker21528.js')
          s=p.read_text()
          state="let engine=null,ready=false,initPromise=null,waiters=[],latestInfo={},latestMultiPV={};"
          if state not in s: raise SystemExit('state marker missing')
          s=s.replace(state,state+"\nlet rawLifeLines=null;",1)
          line="  const line=String(raw||'').trim();"
          if line not in s: raise SystemExit('line marker missing')
          s=s.replace(line,line+"\n  if(Array.isArray(rawLifeLines))rawLifeLines.push(line);",1)
          handler="    if(m.type==='stop'){try{if(engine)await sendUSI('stop')}catch(e){};return}"
          js=[
            "    if(m.type==='rawlifecycle'){",
            "      await init();",
            "      const pos=String(m.sfen||'');",
            "      const ms=Math.max(250,Math.min(60000,Math.round(Number(m.ms)||15000)));",
            "      const mp=Math.max(1,Math.min(5,Math.round(Number(m.multiPV)||1)));",
            "      const fence=String(m.fence||'none');",
            "      await sendUSI('setoption name MultiPV value '+mp);",
            "      if(fence==='ready'||fence==='newgame'){let rp=waitLine(x=>x==='readyok',60000,'life readyok');await sendUSI('isready',60000);await rp;}",
            "      if(fence==='newgame')await sendUSI('usinewgame');",
            "      latestInfo={};latestMultiPV={};rawLifeLines=[];",
            "      await sendUSI('position sfen '+pos);",
            "      const bp=waitLine(x=>x.startsWith('bestmove '),90000,'life bestmove');",
            "      await sendUSI('go movetime '+ms,90000);const best=await bp;",
            "      const token=(best.split(/\\s+/)[1]||'').trim();",
            "      const raw=rawLifeLines.slice();rawLifeLines=null;",
            "      const candidates=collectCandidates(token);",
            "      self.postMessage({type:'result',id,ok:true,kind:'rawlifecycle',token,ms,multiPV:mp,fence,info:{...latestInfo},candidates,raw:raw.filter(x=>x.startsWith('info ')||x.startsWith('bestmove '))});return;",
            "    }"
          ]
          if handler not in s: raise SystemExit('handler marker missing')
          s=s.replace(handler,'\n'.join(js)+'\n'+handler,1)
          Path('shogi-v21528/future-yaneura-worker-lifediag.js').write_text(s)
          PY
          grep -F "m.type==='rawlifecycle'" shogi-v21528/future-yaneura-worker-lifediag.js
      - name: Start COI server
        run: |
          cat >/tmp/flife/server.mjs <<'NODE'
          import http from'node:http';import fs from'node:fs';import path from'node:path';const root=process.env.GITHUB_WORKSPACE,m={'.html':'text/html','.js':'text/javascript','.wasm':'application/wasm','.bin':'application/octet-stream'};http.createServer((q,s)=>{let u=decodeURIComponent((q.url||'/').split('?')[0]);if(u==='/')u='/shogi-v21528/index.html';const f=path.resolve(root,'.'+u);if(!f.startsWith(path.resolve(root))||!fs.existsSync(f)){s.writeHead(404);return s.end('404')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',m[path.extname(f)]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4186,'127.0.0.1');
          NODE
          node /tmp/flife/server.mjs >/tmp/flife/server.log 2>&1 &
          for i in $(seq 1 30);do curl -fsS http://127.0.0.1:4186/shogi-v21528/index.html >/dev/null&&exit 0;sleep 1;done;exit 1
      - name: Compare production and fenced movetime lifecycles
        run: |
          cat >/tmp/flife/a.mjs <<'NODE'
          import{webkit,devices}from'playwright';
          const R='abcdefghi',I='lnsgkgsnl/1r5b1/ppppppppp/9/9/9/PPPPPPPPP/1B5R1/LNSGKGSNL';
          const M=`4i5h 8c8d 2h3h 8d8e 7g7f 8e8f 7f7e 8f8g+ 8h5e P*8h 7e7d 8h8i+ 7d7c+ 8b8e 5e4f 8i7i 5i4h N*5d 7c7d 5d4f 4g4f 7i6i 3g3f 5a4b N*2e 8e2e 2g2f 2e2f P*7b 7a7b 7d6c 2f2i+ P*2f 7b6c 6g6f S*4g 4h4g N*5e 4g4h B*5i 4h4i G*4h 5h4h 5i4h+`.split(/\s+/);
          function S(ms){const b=new Map(),h={b:{},w:{}};for(let r=0;r<9;r++){let f=9,pr=false;for(const c of I.split('/')[r]){if(c==='+'){pr=true;continue}if(/\d/.test(c)){f-=+c;continue}const side=c===c.toUpperCase()?'b':'w';b.set(''+f+R[r],{side,k:c.toUpperCase(),pr});pr=false;f--}}let t='b';for(const x of ms){if(/^[PLNSGBR]\*/.test(x)){const k=x[0],d=x.slice(2);h[t][k]=(h[t][k]||0)-1;b.set(d,{side:t,k,pr:false})}else{const a=x.slice(0,2),d=x.slice(2,4),q=b.get(a),c=b.get(d);if(!q)throw Error('missing '+x);if(c)h[t][c.k]=(h[t][c.k]||0)+1;b.delete(a);b.set(d,{...q,pr:q.pr||x.endsWith('+')})}t=t==='b'?'w':'b'}const rows=[];for(let r=0;r<9;r++){let z='',e=0;for(let f=9;f;f--){const q=b.get(''+f+R[r]);if(!q){e++;continue}if(e){z+=e;e=0}z+=(q.pr?'+':'')+(q.side==='b'?q.k:q.k.toLowerCase())}if(e)z+=e;rows.push(z)}let hand='';for(const side of['b','w'])for(const k of['R','B','G','S','N','L','P']){const n=h[side][k]||0;if(n>0)hand+=(n>1?n:'')+(side==='b'?k:k.toLowerCase())}return rows.join('/')+' '+t+' '+(hand||'-')+' '+(ms.length+1)}
          const b=await webkit.launch({headless:true}),p=await b.newPage({...devices['iPhone 14']});await p.goto('http://127.0.0.1:4186/shogi-v21528/index.html?x='+Date.now(),{waitUntil:'domcontentloaded'});if(!await p.evaluate(()=>crossOriginIsolated))throw Error('COI');
          async function run(pos,opt){return p.evaluate(async({pos,opt})=>{const w=new Worker('./future-yaneura-worker-lifediag.js?v='+Date.now()+'-'+Math.random());let n=0,P=new Map();w.onmessage=e=>{const m=e.data||{},q=P.get(m.id);if(!q||m.type!=='result')return;P.delete(m.id);clearTimeout(q.t);m.ok?q.r(m):q.j(Error(m.error||'worker'))};const call=(type,x={})=>new Promise((r,j)=>{const id=++n,t=setTimeout(()=>j(Error(type+' timeout')),120000);P.set(id,{r,j,t});w.postMessage({type,id,...x})});try{await call('init');return await call('rawlifecycle',{sfen:pos,...opt})}finally{w.terminate()}},{pos,opt})}
          const modes=[['prod1',{ms:15000,multiPV:1,fence:'none'}],['prod5',{ms:15000,multiPV:5,fence:'none'}],['ready5',{ms:15000,multiPV:5,fence:'ready'}],['newgame5',{ms:15000,multiPV:5,fence:'newgame'}]],rows=[];
          for(const ply of[43,45]){const pos=S(M.slice(0,ply-1));for(let rep=1;rep<=2;rep++)for(const [mode,opt] of modes){const r=await run(pos,opt),raw=r.raw||[],rank1=raw.filter(x=>x.startsWith('info ')&&/\bmultipv 1\b/.test(x)&&/\bscore\b/.test(x));const row={ply,rep,mode,token:r.token,cp:r.info?.cp,mate:r.info?.mate,depth:r.info?.depth,nodes:r.info?.nodes,lastRank1:rank1.at(-1)||'',candidates:(r.candidates||[]).slice(0,5).map(x=>({rank:x.rank,token:x.token,cp:x.cp,mate:x.mate,depth:x.depth,nodes:x.nodes})),tail:raw.filter(x=>/\bscore\b/.test(x)||x.startsWith('bestmove ')).slice(-8)};rows.push(row);console.log('FUTURE_LIFECYCLE_ROW '+JSON.stringify(row))}}
          for(const ply of[43,45])console.log('FUTURE_LIFECYCLE_SUMMARY '+JSON.stringify({ply,rows:rows.filter(x=>x.ply===ply).map(x=>({rep:x.rep,mode:x.mode,token:x.token,cp:x.cp,mate:x.mate,depth:x.depth,nodes:x.nodes}))}));
          console.log('FUTURE_LIFECYCLE_DELTA '+JSON.stringify({prod5Positive:rows.filter(x=>x.mode==='prod5'&&Number.isFinite(x.cp)&&x.cp>0).map(x=>({ply:x.ply,rep:x.rep,cp:x.cp})),ready5Mate:rows.filter(x=>x.mode==='ready5'&&Number.isFinite(x.mate)).map(x=>({ply:x.ply,rep:x.rep,mate:x.mate})),newgame5Mate:rows.filter(x=>x.mode==='newgame5'&&Number.isFinite(x.mate)).map(x=>({ply:x.ply,rep:x.rep,mate:x.mate}))}));
          console.log('PASS_FUTURE_MULTIPV_LIFECYCLE_HARNESS');await b.close();
          NODE
          cd /tmp/flife && node a.mjs 2>&1 | tee /tmp/flife/a.log
          grep -F 'FUTURE_LIFECYCLE_DELTA ' /tmp/flife/a.log
          grep -F 'PASS_FUTURE_MULTIPV_LIFECYCLE_HARNESS' /tmp/flife/a.log
      - name: Preserve evidence
        if: always()
        run: grep -E '^(FUTURE_LIFECYCLE_ROW|FUTURE_LIFECYCLE_SUMMARY|FUTURE_LIFECYCLE_DELTA|PASS_FUTURE_MULTIPV_LIFECYCLE_HARNESS)' /tmp/flife/a.log | tail -120 || true
