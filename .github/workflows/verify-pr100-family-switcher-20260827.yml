name: verify-pr100-family-switcher-20260827

on:
  push:
    branches:
      - validate-pr100-family-switcher-v3-20260827
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family-switcher-four-env:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify exact candidate files
        run: |
          test "$(git hash-object shogi-v21528/cloud-family-switcher21533.js)" = "3d39e95761f1e034e42e2e345dd50d928bcd98ca"
          test "$(git hash-object shogi-v21528/coi-serviceworker.js)" = "fa86521634274c360a36e36d73abda60d9eb5570"
          test "$(git hash-object coi-serviceworker.js)" = "2d288f6aecf774e50e1fc953d68c15b37be7572e"
          test "$(git hash-object .github/scripts/verify-vercel-root-coi-shim-20260827.mjs)" = "467f1029855196896a98b711bd7b4a71133c08da"
          echo PASS_PR100_EXACT_CANDIDATE_97B6BFF4
      - name: Verify PR100 injection and syntax
        run: |
          node --check shogi-v21528/cloud-family-switcher21533.js
          node --check shogi-v21528/coi-serviceworker.js
          grep -F "cloud-save21531.js?v=21532a" shogi-v21528/coi-serviceworker.js
          grep -F "cloud-slot-picker21532.js?v=21532b" shogi-v21528/coi-serviceworker.js
          grep -F "cloud-family-switcher21533.js?v=21533a" shogi-v21528/coi-serviceworker.js
          grep -F "ai-shogi-coi-reload-21533a" shogi-v21528/coi-serviceworker.js
          grep -F "coi-serviceworker.js?v=21533a" coi-serviceworker.js
          echo PASS_PR100_INJECTION_21533A
      - name: Verify live Supabase edge read compatibility
        run: node .github/scripts/verify-cloud-edge-live-read-20260827.mjs
      - name: Verify live Supabase CAS conflict and update
        run: node .github/scripts/verify-pr100-live-cas-20260827.mjs
      - name: Install Playwright browsers
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Verify family switching and rollback safety across four environments
        run: node .github/scripts/verify-pr100-family-switcher-20260827.mjs
