name: Verify PR61 ranks 7-12 runtime
on:
  pull_request:
    branches: [feature/cohort7-12-yaneura21533-20260820]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
      env:
        HOME: /root
    strategy:
      fail-fast: false
      matrix:
        platform: [iphone, fire, desktop, firefox]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Playwright package
        run: |
          npm init -y
          npm install playwright@1.55.0
      - name: Start COOP COEP server
        run: |
          cat >/tmp/coi.mjs <<'NODE'
          import http from'http';import fs from'fs';import path from'path';const root=process.cwd(),mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css','.wasm':'application/wasm','.bin':'application/octet-stream','.jpg':'image/jpeg','.jpeg':'image/jpeg','.png':'image/png','.webp':'image/webp'};http.createServer((q,s)=>{let n=decodeURIComponent(new URL(q.url,'http://x').pathname);if(n.endsWith('/'))n+='index.html';const f=path.resolve(root,'.'+n);if(!f.startsWith(root)||!fs.existsSync(f)){s.writeHead(404);return s.end('404')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',mime[path.extname(f).toLowerCase()]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4226,'127.0.0.1');
          NODE
          node /tmp/coi.mjs >/tmp/coi.log 2>&1 &
          sleep 1
      - name: Run real cohort interaction regression
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          node .github/scripts/verify-pr61-cohort-runtime-20260820.mjs 2>&1 | tee /tmp/pr61.log
          grep -q '^PASS_PR61_COHORT_RUNTIME ' /tmp/pr61.log
      - name: Show actual result
        if: always()
        run: |
          grep -E '^(PR61_RUNTIME|PASS_PR61_COHORT_RUNTIME|Error:)' /tmp/pr61.log || true
