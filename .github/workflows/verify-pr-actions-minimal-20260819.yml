name: Future official-book Piyo Lv40 practical
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  practical:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Prepare official book worker
        run: bash .github/scripts/prepare-book-worker-20260819.sh
      - name: Prepare runner Chrome
        run: |
          mkdir -p /tmp/pbook && cd /tmp/pbook
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          google-chrome --version
          cp "$GITHUB_WORKSPACE/.github/scripts/piyo-book-practical-20260819.mjs" match.mjs
      - name: Start local server
        run: |
          TEST_PORT=4183 node .github/scripts/coop-coep-test-server-20260819.mjs >/tmp/pbook/server.log 2>&1 &
          sleep 1
      - name: Run practical match
        run: cd /tmp/pbook && node match.mjs 2>&1 | tee /tmp/pbook/match.log
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### Future + official book vs Piyo Lv40'; echo '```text'; grep -E '^(PBOOK_PIYO|PBOOK_PROFILE|PBOOK_FUTURE|PBOOK_REPLY|PBOOK_ERROR|PBOOK_SUMMARY)' /tmp/pbook/match.log | tail -140 || true; echo '```'; } >/tmp/pbook/report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/pbook/report.md
