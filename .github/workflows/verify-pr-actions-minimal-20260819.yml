name: Minimal PR Actions trigger
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  hello:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo MINIMAL_PR_ACTIONS_PASS
          gh pr comment ${{ github.event.pull_request.number }} --body 'MINIMAL_PR_ACTIONS_PASS'
