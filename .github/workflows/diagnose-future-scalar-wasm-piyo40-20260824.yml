name: Diagnose Future scalar WASM production policy vs Piyo40
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/diagnose-future-scalar-wasm-piyo40-20260824.yml']
permissions:
  contents: read
jobs:
  practical:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1,2]
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yaneurao/YaneuraOu
          ref: 76d58ef2e4cf64116784f41fd4816425ab6817ee
          path: YaneuraOu-scalar
      - name: Build scalar WASM and scalar worker
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('YaneuraOu-scalar/script/wasm_build.js');s=p.read_text();o='COMPILER=em++ TARGET_CPU=WASM YANEURAOU_EDITION=${pkgobj.edition}';n='COMPILER=em++ TARGET_CPU=OTHER YANEURAOU_EDITION=${pkgobj.edition}';assert o in s;p.write_text(s.replace(o,n,1))
          m=Path('YaneuraOu-scalar/source/Makefile');t=m.read_text();m.write_text(t.replace('-s PTHREAD_POOL_SIZE=32','-s PTHREAD_POOL_SIZE=2',1))
          PY
          docker pull emscripten/emsdk:3.1.43 >/dev/null
          docker run --rm -v "${{ github.workspace }}/YaneuraOu-scalar:/src" -w /src emscripten/emsdk:3.1.43 node script/wasm_build.js halfkp.noeval >/tmp/scalar-practical-build.log 2>&1
          LIB=YaneuraOu-scalar/build/wasm/halfkp.noeval/lib; mkdir -p shogi-v21528/scalar76d
          cp "$LIB"/yaneuraou.halfkp.noeval.{js,worker.js,wasm} shogi-v21528/scalar76d/; cp shogi-v21528/yaneuraou/nn.bin shogi-v21528/scalar76d/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('shogi-v21528/future-yaneura-worker21528.js');s=p.read_text();o="BASE=new URL('./yaneuraou/',self.location.href).href;";assert o in s;Path('shogi-v21528/future-yaneura-worker-scalar.js').write_text(s.replace(o,"BASE=new URL('./scalar76d/',self.location.href).href;",1))
          PY
          node --check shogi-v21528/future-yaneura-worker-scalar.js
          sha256sum shogi-v21528/scalar76d/yaneuraou.halfkp.noeval.{js,wasm} shogi-v21528/scalar76d/nn.bin
      - name: Install browsers and start COI
        run: |
          set -euo pipefail
          mkdir -p /tmp/scalarp; cd /tmp/scalarp; npm init -y >/dev/null; npm i --no-audit --no-fund playwright@1.55.0 >/dev/null; npx playwright install --with-deps chromium webkit >/dev/null
          cat >server.mjs <<'NODE'
          import http from'node:http';import fs from'node:fs';import path from'node:path';const r=process.env.GITHUB_WORKSPACE,m={'.html':'text/html','.js':'text/javascript','.wasm':'application/wasm','.bin':'application/octet-stream','.png':'image/png','.jpg':'image/jpeg','.json':'application/json'};http.createServer((q,s)=>{let u=new URL(q.url,'http://x').pathname;if(u==='/')u='/shogi-v21528/index.html';const f=path.resolve(r,'.'+u);if(!f.startsWith(path.resolve(r))||!fs.existsSync(f)){s.writeHead(404);return s.end()}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Content-Type',m[path.extname(f)]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4227,'127.0.0.1')
          NODE
          node server.mjs >/tmp/scalarp-server.log 2>&1 & for i in $(seq 1 30);do curl -fsS http://127.0.0.1:4227/shogi-v21528/index.html >/dev/null&&break;sleep 1;done
      - name: Derive hardened production-policy practical harness
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/verify-future-current-vs-piyo40-20260820.yml').read_text();a="          cat >/tmp/fpiyo/match.mjs <<'NODE'\n";i=src.index(a)+len(a);j=src.index("\n          NODE\n",i);js='\n'.join(x[10:] if x.startswith('          ') else x for x in src[i:j].splitlines())+'\n'
          js=js.replace("http://127.0.0.1:4173/","http://127.0.0.1:4227/").replace("future-yaneura-worker21528.js?v=practical-","future-yaneura-worker-scalar.js?v=scalar-practical-")
          js=js.replace("async function exportMoves(){await p.locator('img[alt=\"メニュー\"]').first().click();", "async function exportMoves(){await p.evaluate(()=>{const d=document.querySelector('#dialogMess');if(d){d.classList.remove('is-show');d.style.display='none'}});await p.waitForTimeout(80);await p.locator('img[alt=\"メニュー\"]').first().click({force:true});")
          js=js.replace("await p.click('#btnDialogKifClose');const m=/^position startpos", "await p.click('#btnDialogKifClose');await p.waitForFunction(()=>{const e=document.querySelector('#dialogKifBox');return !e||getComputedStyle(e).display==='none'||getComputedStyle(e).visibility==='hidden'||e.getClientRects().length===0},{},{timeout:4000});await p.waitForTimeout(120);const m=/^position startpos")
          old="if(u.endsWith('+'))await p.locator('#btnDialogNari2').click({force:true,timeout:1000}).catch(()=>{});else if(await p.locator('#dialogNari').isVisible().catch(()=>false))await p.click('#btnDialogNari1')"
          new="if(u.endsWith('+')){await p.waitForTimeout(180);if(await p.locator('#dialogNari').isVisible().catch(()=>false)){await p.click('#btnDialogNari2');await p.locator('#dialogNari').waitFor({state:'hidden',timeout:4000})}}else{await p.waitForTimeout(120);if(await p.locator('#dialogNari').isVisible().catch(()=>false)){await p.click('#btnDialogNari1');await p.locator('#dialogNari').waitFor({state:'hidden',timeout:4000})}}"
          assert old in js;js=js.replace(old,new,1)
          js=js.replace('FUTURE_CURRENT_PROFILE','FUTURE_SCALAR_PROFILE').replace('FUTURE_CURRENT_MOVE','FUTURE_SCALAR_MOVE').replace('FUTURE_CURRENT_AUDIT','FUTURE_SCALAR_AUDIT').replace('FUTURE_CURRENT_PRACTICAL_SUMMARY','FUTURE_SCALAR_PRACTICAL_SUMMARY').replace('PASS_FUTURE_CURRENT_PIYO40_HARNESS','PASS_FUTURE_SCALAR_PIYO40_HARNESS')
          Path('/tmp/scalarp/match.mjs').write_text(js)
          PY
          cd /tmp/scalarp; node --check match.mjs
      - name: Run scalar WASM production policy practical
        env:
          ATTEMPT: ${{ matrix.attempt }}
        run: |
          set -euo pipefail
          cd /tmp/scalarp; node match.mjs 2>&1 | tee scalar-${ATTEMPT}.log
          grep -F 'FUTURE_SCALAR_PRACTICAL_SUMMARY ' scalar-${ATTEMPT}.log
          grep -F 'PASS_FUTURE_SCALAR_PIYO40_HARNESS' scalar-${ATTEMPT}.log
      - name: Preserve evidence
        if: always()
        run: grep -E '^(PIYO40_PROFILE|FUTURE_SCALAR_PROFILE|FUTURE_SCALAR_MOVE|PIYO40_COMMIT|PIYO40_HEARTBEAT|PIYO40_REPLY|FUTURE_SCALAR_AUDIT|FUTURE_SCALAR_PRACTICAL_SUMMARY|PASS_FUTURE_SCALAR_PIYO40_HARNESS)' /tmp/scalarp/scalar-${{ matrix.attempt }}.log | tail -320 || true
