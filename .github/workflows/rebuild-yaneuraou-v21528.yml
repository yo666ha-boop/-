name: Rebuild YaneuraOu v2.15.28
on:
  push:
    paths:
      - '.github/workflows/rebuild-yaneuraou-v21528.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yaneurao/YaneuraOu
          ref: 0056b408e904f0733f3cfd2c2a7e57c3d74fcd62
          path: YaneuraOu

      - name: Verify browser-stable YaneuraOu source
        shell: bash
        run: |
          set -euxo pipefail
          grep -F 'EMSCRIPTEN_KEEPALIVE extern "C" int usi_command' YaneuraOu/source/usi.cpp
          grep -F 'threadStarted = true' YaneuraOu/source/thread.cpp
          grep -F 'if (!th->threadStarted)' YaneuraOu/source/usi.cpp
          grep -F '"halfkp.noeval"' YaneuraOu/script/wasm_build.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('YaneuraOu/source/Makefile')
          s=p.read_text()
          if '-s PTHREAD_POOL_SIZE=32' not in s:
              raise SystemExit('pthread pool marker missing')
          p.write_text(s.replace('-s PTHREAD_POOL_SIZE=32','-s PTHREAD_POOL_SIZE=2',1))
          PY
          grep -F 'PTHREAD_POOL_SIZE=2' YaneuraOu/source/Makefile
          test -s shogi-v21528/yaneuraou/nn.bin
          test $(stat -c%s shogi-v21528/yaneuraou/nn.bin) -gt 60000000

      - name: Build official HalfKP noeval WASM
        shell: bash
        run: |
          set -euxo pipefail
          docker pull emscripten/emsdk:3.1.43
          set +e
          docker run --rm \
            -v "${{ github.workspace }}/YaneuraOu:/src" \
            -w /src \
            emscripten/emsdk:3.1.43 \
            node script/wasm_build.js halfkp.noeval \
            2>&1 | tee /tmp/yaneuraou-build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            tail -n 240 /tmp/yaneuraou-build.log >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
          LIB=YaneuraOu/build/wasm/halfkp.noeval/lib
          test -s "$LIB/yaneuraou.halfkp.noeval.js"
          test -s "$LIB/yaneuraou.halfkp.noeval.worker.js"
          test -s "$LIB/yaneuraou.halfkp.noeval.wasm"
          grep -F 'ccall' "$LIB/yaneuraou.halfkp.noeval.js"
          node - <<'NODE'
          const fs=require('fs');
          const p='YaneuraOu/build/wasm/halfkp.noeval/lib/yaneuraou.halfkp.noeval.wasm';
          const m=new WebAssembly.Module(fs.readFileSync(p));
          const names=WebAssembly.Module.exports(m).map(x=>x.name);
          console.log('WASM_EXPORT_COUNT',names.length);
          console.log('WASM_USI_LIKE_EXPORTS',names.filter(x=>/usi/i.test(x)));
          NODE

      - name: Upload built runtime for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yaneuraou-built-runtime
          path: |
            YaneuraOu/build/wasm/halfkp.noeval/lib/yaneuraou.halfkp.noeval.js
            YaneuraOu/build/wasm/halfkp.noeval/lib/yaneuraou.halfkp.noeval.worker.js
            YaneuraOu/build/wasm/halfkp.noeval/lib/yaneuraou.halfkp.noeval.wasm
            /tmp/yaneuraou-build.log
          if-no-files-found: warn
          retention-days: 2

      - name: Install Firefox
        shell: bash
        run: |
          mkdir -p /tmp/yane && cd /tmp/yane
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps firefox

      - name: Firefox proof - usiok readyok bestmove
        shell: bash
        run: |
          set -euxo pipefail
          ROOT=/tmp/yane/site
          mkdir -p "$ROOT/yaneuraou"
          LIB="${{ github.workspace }}/YaneuraOu/build/wasm/halfkp.noeval/lib"
          cp "$LIB"/yaneuraou.halfkp.noeval.js "$ROOT/yaneuraou/"
          cp "$LIB"/yaneuraou.halfkp.noeval.worker.js "$ROOT/yaneuraou/"
          cp "$LIB"/yaneuraou.halfkp.noeval.wasm "$ROOT/yaneuraou/"
          cp shogi-v21528/yaneuraou/nn.bin "$ROOT/yaneuraou/"
          cp shogi-v21528/future-yaneura-worker21528.js "$ROOT/"
          cat > "$ROOT/index.html" <<'HTML'
          <!doctype html><meta charset="utf-8"><body data-result="running">starting</body>
          <script>
          (async()=>{
            const b=document.body,logs=[];
            const out=x=>{logs.push(x);console.log(x);b.textContent=logs.join('\n')};
            const fail=e=>{b.dataset.result='error';out('FAIL '+String(e&&e.stack||e))};
            try{
              out('COI '+crossOriginIsolated+' SAB '+typeof SharedArrayBuffer);
              if(!crossOriginIsolated||typeof SharedArrayBuffer!=='function')throw Error('cross-origin isolation unavailable');
              const w=new Worker('./future-yaneura-worker21528.js?proof=20241128b');
              let seq=0,pending=new Map();
              w.onmessage=e=>{const m=e.data||{};if(m.type==='stage'){out('STAGE '+m.text);return}if(m.type==='fatal'){fail(Error(m.text));return}if(m.type==='result'){const p=pending.get(m.id);if(p){pending.delete(m.id);m.ok?p.resolve(m):p.reject(Error(m.error||'worker result error'))}}};
              w.onerror=e=>fail(Error('worker '+e.message+' '+e.filename+':'+e.lineno+':'+e.colno));
              const call=(type,payload={})=>new Promise((resolve,reject)=>{const id='t'+(++seq);pending.set(id,{resolve,reject});w.postMessage({type,id,...payload});setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(Error(type+' timeout'))}},150000)});
              const init=await call('init');out('INIT '+JSON.stringify(init));
              const sfen='lnsgkgsnl/1r5b1/ppppppppp/9/9/9/PPPPPPPPP/1B5R1/LNSGKGSNL b - 1';
              const bm=await call('bestmove',{sfen,ms:1000});out('BEST '+JSON.stringify(bm));
              if(!bm.token||bm.token==='resign')throw Error('no usable bestmove: '+String(bm.token));
              b.dataset.result='ok';out('PASS usiok readyok bestmove '+bm.token);w.terminate();
            }catch(e){fail(e)}
          })();
          </script>
          HTML
          cat > "$ROOT/server.cjs" <<'NODE'
          const h=require('http'),f=require('fs'),p=require('path'),r=__dirname,m={'.html':'text/html','.js':'text/javascript','.wasm':'application/wasm','.bin':'application/octet-stream'};
          h.createServer((q,s)=>{const n=new URL(q.url,'http://x').pathname.replace(/^\//,'')||'index.html',x=p.resolve(r,n);f.readFile(x,(e,d)=>{if(e){s.writeHead(404);return s.end()}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',m[p.extname(x)]||'application/octet-stream');s.end(d)})}).listen(4173,'127.0.0.1');
          NODE
          cat > /tmp/yane/check.mjs <<'NODE'
          import{firefox}from'playwright';
          const b=await firefox.launch({headless:true}),p=await b.newPage();
          p.on('console',m=>console.log('CONSOLE',m.type(),m.text()));
          p.on('pageerror',e=>console.log('PAGEERROR',e.stack||e));
          p.on('requestfailed',r=>console.log('REQUESTFAILED',r.url(),r.failure()?.errorText||''));
          await p.goto('http://127.0.0.1:4173/',{waitUntil:'load'});
          await p.waitForFunction(()=>['ok','error'].includes(document.body.dataset.result),{timeout:180000});
          const r=await p.evaluate(()=>({state:document.body.dataset.result,text:document.body.textContent,coi:crossOriginIsolated,sab:typeof SharedArrayBuffer}));
          console.log('FINAL',JSON.stringify(r));
          await b.close();if(r.state!=='ok')process.exit(1);
          NODE
          node "$ROOT/server.cjs" >/tmp/yane/server.log 2>&1 & PID=$!;trap 'kill $PID 2>/dev/null||true' EXIT
          for i in $(seq 1 50);do curl -fsS http://127.0.0.1:4173/ >/dev/null&&break||sleep .2;done
          set +e
          cd /tmp/yane
          node check.mjs 2>&1 | tee /tmp/yane/firefox-smoke.log
          rc=${PIPESTATUS[0]}
          set -e
          { echo '## Firefox YaneuraOu proof'; echo '```text'; cat /tmp/yane/firefox-smoke.log || true; echo '--- server.log ---'; cat /tmp/yane/server.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload Firefox diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yaneuraou-firefox-smoke
          path: |
            /tmp/yane/firefox-smoke.log
            /tmp/yane/server.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Install only verified runtime into v2.15.28
        shell: bash
        run: |
          set -euxo pipefail
          LIB=YaneuraOu/build/wasm/halfkp.noeval/lib
          cp "$LIB"/yaneuraou.halfkp.noeval.js shogi-v21528/yaneuraou/
          cp "$LIB"/yaneuraou.halfkp.noeval.worker.js shogi-v21528/yaneuraou/
          cp "$LIB"/yaneuraou.halfkp.noeval.wasm shogi-v21528/yaneuraou/
          printf '%s\n' 'YaneuraOu HalfKP noeval + Suisho5' 'SOURCE=0056b408e904f0733f3cfd2c2a7e57c3d74fcd62' 'EMSCRIPTEN=3.1.43' 'PTHREAD_POOL_SIZE=2' 'THREAD_STARTED_RETRY=1' 'Firefox: usiok / readyok / bestmove OK' > shogi-v21528/yaneuraou/build-info.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.js shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.worker.js shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.wasm shogi-v21528/yaneuraou/build-info.txt
          git diff --cached --quiet || git commit -m 'fix: install Firefox-verified YaneuraOu Suisho5 runtime'
          git push
