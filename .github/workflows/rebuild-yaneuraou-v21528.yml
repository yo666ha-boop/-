name: Rebuild YaneuraOu v2.15.28
on:
  push:
    paths:
      - '.github/workflows/rebuild-yaneuraou-v21528.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yaneurao/YaneuraOu
          ref: 33ccf1f907eb7184889fa23051243f81ab0bf973
          path: YaneuraOu
      - name: Prepare official browser build and live USI bridge
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Keep the browser build light enough for iPhone/Firefox while still threaded.
          makefile=Path('YaneuraOu/source/Makefile')
          s=makefile.read_text()
          if '-s PTHREAD_POOL_SIZE=32' not in s:
              raise SystemExit('pthread marker missing')
          s=s.replace('-s PTHREAD_POOL_SIZE=32','-s PTHREAD_POOL_SIZE=2',1)
          makefile.write_text(s)

          # The current upstream tree still contains an old usi_command implementation,
          # but it sits inside a disabled #if 0 block.  Add a small public bridge to the
          # current USIEngine so WebAssembly can execute one USI line at a time.
          h=Path('YaneuraOu/source/usi.h')
          hs=h.read_text()
          marker='\tvoid loop();\n'
          bridge='''\tvoid loop();\n\n#if defined(__EMSCRIPTEN__) && !STOCKFISH\n\t// Browser bridge: execute one USI command without entering the blocking stdin loop.\n\tbool wasm_command(const std::string& cmd) { return usi_cmdexec(cmd); }\n#endif\n'''
          if marker not in hs:
              raise SystemExit('USIEngine::loop marker missing')
          hs=hs.replace(marker,bridge,1)
          h.write_text(hs)

          # Keep YaneuraOuEngine and USIEngine alive after main() returns in WebAssembly,
          # and export a real (non-disabled) C symbol called usi_command.
          p=Path('YaneuraOu/source/engine/yaneuraou-engine/yaneuraou-search.cpp')
          ys=p.read_text()
          tail_marker='using namespace YaneuraOu;\nnamespace {'
          if tail_marker not in ys:
              raise SystemExit('engine entry tail marker missing')
          live='''using namespace YaneuraOu;\n\n#if defined(__EMSCRIPTEN__)\n#include <emscripten/emscripten.h>\nstatic std::unique_ptr<YaneuraOuEngine> wasm_engine;\nstatic std::unique_ptr<USIEngine> wasm_usi;\n\nextern "C" EMSCRIPTEN_KEEPALIVE int usi_command(const char* cmd) {\n    if (!cmd || !wasm_usi)\n        return 1;\n    wasm_usi->wasm_command(std::string(cmd));\n    return 0;\n}\n#endif\n\nnamespace {'''
          ys=ys.replace(tail_marker,live,1)

          pattern=re.compile(r'void engine_main\(\) \{.*?\n\}',re.S)
          matches=list(pattern.finditer(ys))
          if len(matches)!=1:
              raise SystemExit(f'engine_main match count={len(matches)}')
          replacement='''void engine_main() {\n#if defined(__EMSCRIPTEN__)\n    wasm_engine = std::make_unique<YaneuraOuEngine>();\n    wasm_usi = std::make_unique<USIEngine>();\n    wasm_usi->set_engine(*wasm_engine);\n    wasm_usi->enqueue_startup_commands(CommandLine::g);\n    // loop() is intentionally non-blocking under Emscripten.  The static objects\n    // above survive main() and are driven through exported usi_command().\n    wasm_usi->loop();\n#else\n    auto engine = std::make_unique<YaneuraOuEngine>();\n    auto usi = std::make_unique<USIEngine>();\n    usi->set_engine(*engine);\n    usi->enqueue_startup_commands(CommandLine::g);\n    usi->loop();\n#endif\n}'''
          ys=pattern.sub(replacement,ys,count=1)
          p.write_text(ys)
          PY
          grep -F 'PTHREAD_POOL_SIZE=2' YaneuraOu/source/Makefile
          grep -F 'bool wasm_command' YaneuraOu/source/usi.h
          grep -F 'extern "C" EMSCRIPTEN_KEEPALIVE int usi_command' YaneuraOu/source/engine/yaneuraou-engine/yaneuraou-search.cpp
          grep -F 'wasm_usi = std::make_unique<USIEngine>()' YaneuraOu/source/engine/yaneuraou-engine/yaneuraou-search.cpp
          cp shogi-v21528/yaneuraou/nn.bin YaneuraOu/nn.bin
          test $(stat -c%s YaneuraOu/nn.bin) -gt 10000000
      - name: Build HalfKP noeval WASM
        shell: bash
        run: |
          set -euxo pipefail
          docker pull emscripten/emsdk:3.1.43
          mkdir -p YaneuraOu/build/wasm/halfkp.noeval/lib
          set +e
          docker run --rm \
            -v "${{ github.workspace }}/YaneuraOu:/src" \
            -w /src/source \
            emscripten/emsdk:3.1.43 \
            bash -lc 'set -euxo pipefail; make clean; make -j2 tournament COMPILER=em++ TARGET_CPU=WASM YANEURAOU_EDITION=YANEURAOU_ENGINE_NNUE TARGET=../build/wasm/halfkp.noeval/lib/yaneuraou.halfkp.noeval.js EM_EXPORT_NAME=YaneuraOu_HalfKP_noeval EM_INITIAL_MEMORY_SIZE=167772160 EXTRA_LDFLAGS="-sEXPORTED_FUNCTIONS=_main,_usi_command"' \
            2>&1 | tee /tmp/yaneuraou-build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            {
              echo '## YaneuraOu WASM build failed'
              echo '```text'
              tail -n 220 /tmp/yaneuraou-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
          LIB=YaneuraOu/build/wasm/halfkp.noeval/lib
          test -s "$LIB/yaneuraou.halfkp.noeval.js"
          test -s "$LIB/yaneuraou.halfkp.noeval.worker.js"
          test -s "$LIB/yaneuraou.halfkp.noeval.wasm"
          grep -F '_usi_command' "$LIB/yaneuraou.halfkp.noeval.js"
          grep -F 'ccall' "$LIB/yaneuraou.halfkp.noeval.js"
      - name: Upload build diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yaneuraou-build-log
          path: /tmp/yaneuraou-build.log
          if-no-files-found: ignore
          retention-days: 2
      - name: Install Firefox
        shell: bash
        run: |
          mkdir -p /tmp/yane && cd /tmp/yane
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps firefox
      - name: Firefox wrapper smoke - usiok readyok bestmove
        shell: bash
        run: |
          set -euxo pipefail
          ROOT=/tmp/yane/site
          mkdir -p "$ROOT/yaneuraou"
          LIB="${{ github.workspace }}/YaneuraOu/build/wasm/halfkp.noeval/lib"
          cp "$LIB"/yaneuraou.halfkp.noeval.js "$ROOT/yaneuraou/"
          cp "$LIB"/yaneuraou.halfkp.noeval.worker.js "$ROOT/yaneuraou/"
          cp "$LIB"/yaneuraou.halfkp.noeval.wasm "$ROOT/yaneuraou/"
          cp shogi-v21528/yaneuraou/nn.bin "$ROOT/yaneuraou/"
          cp shogi-v21528/future-yaneura-worker21528.js "$ROOT/"
          cat > "$ROOT/index.html" <<'HTML'
          <!doctype html><meta charset="utf-8"><body data-result="running">starting</body>
          <script>
          (async()=>{
            const b=document.body,logs=[];const out=x=>{logs.push(x);console.log(x);b.textContent=logs.join('\n')};
            const fail=e=>{b.dataset.result='error';out('FAIL '+String(e&&e.stack||e))};
            try{
              out('COI '+crossOriginIsolated+' SAB '+typeof SharedArrayBuffer);
              if(!crossOriginIsolated)throw Error('not isolated');
              const w=new Worker('./future-yaneura-worker21528.js?buildtest=1');
              let seq=0,pending=new Map();
              w.onmessage=e=>{const m=e.data||{};if(m.type==='stage'){out('STAGE '+m.text);return}if(m.type==='fatal'){fail(Error(m.text));return}if(m.type==='result'){const p=pending.get(m.id);if(p){pending.delete(m.id);m.ok?p.resolve(m):p.reject(Error(m.error||'worker result error'))}}};
              w.onerror=e=>fail(Error('worker '+e.message+' '+e.filename+':'+e.lineno));
              const call=(type,payload={})=>new Promise((resolve,reject)=>{const id='t'+(++seq);pending.set(id,{resolve,reject});w.postMessage({type,id,...payload});setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(Error(type+' timeout'))}},120000)});
              const init=await call('init');out('INIT '+JSON.stringify(init));
              const sfen='lnsgkgsnl/1r5b1/ppppppppp/9/9/9/PPPPPPPPP/1B5R1/LNSGKGSNL b - 1';
              const bm=await call('bestmove',{sfen,ms:500});out('BEST '+JSON.stringify(bm));
              if(!bm.token)throw Error('bestmove token missing');
              b.dataset.result='ok';out('PASS');w.terminate();
            }catch(e){fail(e)}
          })();
          </script>
          HTML
          cat > "$ROOT/server.cjs" <<'NODE'
          const h=require('http'),f=require('fs'),p=require('path'),r=__dirname,m={'.html':'text/html','.js':'text/javascript','.wasm':'application/wasm','.bin':'application/octet-stream'};
          h.createServer((q,s)=>{const n=new URL(q.url,'http://x').pathname.replace(/^\//,'')||'index.html',x=p.resolve(r,n);f.readFile(x,(e,d)=>{if(e){s.writeHead(404);return s.end()}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',m[p.extname(x)]||'application/octet-stream');s.end(d)})}).listen(4173,'127.0.0.1');
          NODE
          cat > /tmp/yane/check.mjs <<'NODE'
          import{firefox}from'playwright';
          const b=await firefox.launch({headless:true}),p=await b.newPage();
          p.on('console',m=>console.log('CONSOLE',m.type(),m.text()));p.on('pageerror',e=>console.log('PAGEERROR',e.stack||e));
          await p.goto('http://127.0.0.1:4173/',{waitUntil:'load'});
          await p.waitForFunction(()=>['ok','error'].includes(document.body.dataset.result),{timeout:150000});
          const r=await p.evaluate(()=>({state:document.body.dataset.result,text:document.body.textContent,coi:crossOriginIsolated}));console.log('FINAL',JSON.stringify(r));
          await b.close();if(r.state!=='ok')process.exit(1);
          NODE
          node "$ROOT/server.cjs" >/tmp/yane/server.log 2>&1 & PID=$!;trap 'kill $PID 2>/dev/null||true' EXIT
          for i in $(seq 1 50);do curl -fsS http://127.0.0.1:4173/ >/dev/null&&break||sleep .2;done
          cd /tmp/yane && node check.mjs
      - name: Install verified runtime into v2.15.28
        shell: bash
        run: |
          set -euxo pipefail
          LIB=YaneuraOu/build/wasm/halfkp.noeval/lib
          cp "$LIB"/yaneuraou.halfkp.noeval.js shogi-v21528/yaneuraou/
          cp "$LIB"/yaneuraou.halfkp.noeval.worker.js shogi-v21528/yaneuraou/
          cp "$LIB"/yaneuraou.halfkp.noeval.wasm shogi-v21528/yaneuraou/
          printf '%s\n' 'YaneuraOu HalfKP noeval + Suisho5' 'PTHREAD_POOL_SIZE=2' 'LIVE_WASM_USI_BRIDGE=1' 'EXPORTED_FUNCTIONS=_main,_usi_command' 'Firefox: usiok / readyok / bestmove OK' > shogi-v21528/yaneuraou/build-info.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.js shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.worker.js shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.wasm shogi-v21528/yaneuraou/build-info.txt
          git diff --cached --quiet || git commit -m 'fix: rebuild YaneuraOu WASM verified in Firefox'
          git push
