name: Verify tournament boss chain 21583
on:
  pull_request:
    paths:
      - 'shogi-v21528/tournament21540.js'
      - 'shogi-v21528/tournament-boss21546.js'
      - '.github/scripts/verify-tournament-boss-chain21583.mjs'
      - '.github/workflows/verify-tournament-boss-chain21583.yml'
  workflow_dispatch:
jobs:
  boss-chain:
    runs-on: ubuntu-22.04
    container: mcr.microsoft.com/playwright:v1.55.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Playwright package
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
      - name: Syntax check
        run: |
          node --check shogi-v21528/tournament21540.js
          node --check shogi-v21528/tournament-boss21546.js
          node --check .github/scripts/verify-tournament-boss-chain21583.mjs
      - name: Verify 10 cups, boss-under field and separate fifth boss match
        env:
          HOME: /root
        run: |
          python3 -m http.server 8000 >/tmp/tournament21583-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8000/shogi-v21528/ >/dev/null && break; sleep .2; done
          node .github/scripts/verify-tournament-boss-chain21583.mjs
