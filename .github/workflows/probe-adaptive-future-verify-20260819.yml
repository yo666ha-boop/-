name: Probe selective Future verification search
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/probe-adaptive-future-verify-20260819.yml'
permissions:
  contents: read
  pull-requests: write
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKit
        run: |
          mkdir -p /tmp/verify && cd /tmp/verify
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps webkit >/dev/null
      - name: Start server
        run: |
          cat > /tmp/verify/server.mjs <<'NODE'
          import http from'http';import fs from'fs';import path from'path';const root=process.cwd();const mime={'.html':'text/html','.js':'text/javascript','.wasm':'application/wasm','.bin':'application/octet-stream','.css':'text/css','.jpg':'image/jpeg','.webp':'image/webp'};http.createServer((req,res)=>{let u=decodeURIComponent(req.url.split('?')[0]);if(u==='/')u='/shogi-v21528/index.html';const f=path.join(root,u);if(!f.startsWith(root)||!fs.existsSync(f)){res.writeHead(404);return res.end('404')}res.setHeader('Cross-Origin-Opener-Policy','same-origin');res.setHeader('Cross-Origin-Embedder-Policy','require-corp');res.setHeader('Cross-Origin-Resource-Policy','same-origin');res.setHeader('Cache-Control','no-store');res.setHeader('Content-Type',mime[path.extname(f)]||'application/octet-stream');fs.createReadStream(f).pipe(res)}).listen(4175,'127.0.0.1');
          NODE
          node /tmp/verify/server.mjs >/tmp/verify/server.log 2>&1 & sleep 1
      - name: Probe 4.5s plus 2.5s selective re-search
        shell: bash
        run: |
          cat > /tmp/verify/run.mjs <<'NODE'
          import{webkit}from'playwright';
          const R='abcdefghi',I='lnsgkgsnl/1r5b1/ppppppppp/9/9/9/PPPPPPPPP/1B5R1/LNSGKGSNL',M=`4i5h 8c8d 2h3h 8d8e 6g6f 8e8f 8g8f 8b8f 7g7f 8f8g+ 6i7h 8g7f P*7b 7a7b 5i4i 7f8e 3i4h P*8f 6f6e 8f8g+ 8h5e 8e6e 7h6h 6e5e 5g5f 5e7e 6h6i 3c3d 9g9f 2b9i+ 7i8h 9i8h 3h3i B*2h 3i3h 2h1i+`.split(/\s+/);
          function S(ms){const b=new Map(),h={b:{},w:{}};let rr=0;for(const row of I.split('/')){let f=9,p=false;for(const c of row){if(c==='+'){p=true;continue}if(/\d/.test(c)){f-=+c;continue}const s=c===c.toUpperCase()?'b':'w';b.set(''+f+R[rr],{s,k:c.toUpperCase(),p});p=false;f--}rr++}let t='b';for(const m of ms){if(/^[PLNSGBR]\*/.test(m)){const k=m[0],d=m.slice(2);h[t][k]=(h[t][k]||0)-1;b.set(d,{s:t,k,p:false})}else{const a=m.slice(0,2),d=m.slice(2,4),q=b.get(a),cap=b.get(d);if(!q)throw Error(m);if(cap)h[t][cap.k]=(h[t][cap.k]||0)+1;b.delete(a);b.set(d,{...q,p:q.p||m.endsWith('+')})}t=t==='b'?'w':'b'}const rows=[];for(let r=0;r<9;r++){let x='',e=0;for(let f=9;f;f--){const q=b.get(''+f+R[r]);if(!q){e++;continue}if(e){x+=e;e=0}x+=(q.p?'+':'')+(q.s==='b'?q.k:q.k.toLowerCase())}if(e)x+=e;rows.push(x)}let hand='';for(const s of['b','w'])for(const k of['R','B','G','S','N','L','P']){const n=h[s][k]||0;if(n>0)hand+=(n>1?n:'')+(s==='b'?k:k.toLowerCase())}return rows.join('/')+' '+t+' '+(hand||'-')+' '+(ms.length+1)}
          const ps=[{ply:23,ref:'5g5f'},{ply:33,ref:'3g3f'},{ply:35,ref:'4i3h'}].map(x=>({...x,sfen:S(M.slice(0,x.ply-1))}));const b=await webkit.launch({headless:true}),p=await b.newPage({userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'});await p.goto('http://127.0.0.1:4175/shogi-v21528/index.html',{waitUntil:'domcontentloaded',timeout:120000});if(!await p.evaluate(()=>crossOriginIsolated))throw Error('COI');const rows=[];
          for(const pos of ps)for(let rep=1;rep<=2;rep++){
            await p.evaluate(async()=>{if(window.__vw)window.__vw.terminate();const w=new Worker('./future-yaneura-worker21528.js?v=probe'+Date.now());let id=0,P=new Map();w.onmessage=e=>{const m=e.data||{},q=P.get(m.id);if(!q||m.type!=='result')return;P.delete(m.id);clearTimeout(q.t);m.ok?q.r(m):q.j(Error(m.error||'worker'))};const call=(type,x={})=>new Promise((r,j)=>{const mid=++id,t=setTimeout(()=>j(Error(type+' timeout')),90000);P.set(mid,{r,j,t});w.postMessage({type,id:mid,...x})});window.__vw={call,terminate:()=>w.terminate()};await call('init')});
            const first=await p.evaluate(pos=>window.__vw.call('bestmove',{sfen:pos.sfen,ms:4500,multiPV:1}),pos);const second=await p.evaluate(pos=>window.__vw.call('bestmove',{sfen:pos.sfen,ms:2500,multiPV:1}),pos);const row={ply:pos.ply,rep,ref:pos.ref,first:first.token,firstMatch:first.token===pos.ref,firstDepth:first.info?.depth,firstCp:first.info?.cp,verify:second.token,verifyMatch:second.token===pos.ref,verifyDepth:second.info?.depth,verifyCp:second.info?.cp};rows.push(row);console.log('VERIFY_ROW '+JSON.stringify(row));
          }
          const sum={tests:rows.length,firstMatches:rows.filter(x=>x.firstMatch).length,verifyMatches:rows.filter(x=>x.verifyMatch).length,changed:rows.filter(x=>x.first!==x.verify).length,rows};console.log('VERIFY_SUMMARY '+JSON.stringify(sum));await p.evaluate(()=>window.__vw?.terminate());await b.close();
          NODE
          cd /tmp/verify && node run.mjs 2>&1 | tee /tmp/verify/result.log
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### Selective 4.5s + 2.5s verify probe'; echo '```text'; grep -E '^(VERIFY_ROW|VERIFY_SUMMARY)' /tmp/verify/result.log || true; echo '```'; } >/tmp/verify/report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/verify/report.md
