name: Diagnose YaneuraOu browser options
on:
  push:
    paths:
      - '.github/workflows/diag-yaneuraou-options.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yaneurao/YaneuraOu
          ref: 33ccf1f907eb7184889fa23051243f81ab0bf973
          path: YaneuraOu
      - name: Patch current YaneuraOu for live WebAssembly USI
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          m=Path('YaneuraOu/source/Makefile')
          s=m.read_text().replace('-s PTHREAD_POOL_SIZE=32','-s PTHREAD_POOL_SIZE=2',1)
          m.write_text(s)

          h=Path('YaneuraOu/source/usi.h')
          s=h.read_text()
          marker='\tvoid loop();\n'
          bridge='''\tvoid loop();\n\n#if defined(__EMSCRIPTEN__) && !STOCKFISH\n\tbool wasm_command(const std::string& cmd) { return usi_cmdexec(cmd); }\n#endif\n'''
          if marker not in s: raise SystemExit('USIEngine marker missing')
          h.write_text(s.replace(marker,bridge,1))

          p=Path('YaneuraOu/source/engine/yaneuraou-engine/yaneuraou-search.cpp')
          s=p.read_text()
          marker='using namespace YaneuraOu;\nnamespace {'
          live='''using namespace YaneuraOu;\n\n#if defined(__EMSCRIPTEN__)\n#include <emscripten/emscripten.h>\nstatic std::unique_ptr<YaneuraOuEngine> wasm_engine;\nstatic std::unique_ptr<USIEngine> wasm_usi;\nextern "C" EMSCRIPTEN_KEEPALIVE int usi_command(const char* cmd) {\n    if (!cmd || !wasm_usi) return 1;\n    wasm_usi->wasm_command(std::string(cmd));\n    return 0;\n}\n#endif\n\nnamespace {'''
          if marker not in s: raise SystemExit('engine marker missing')
          s=s.replace(marker,live,1)
          pat=re.compile(r'void engine_main\(\) \{.*?\n\}',re.S)
          rep='''void engine_main() {\n#if defined(__EMSCRIPTEN__)\n    wasm_engine = std::make_unique<YaneuraOuEngine>();\n    wasm_usi = std::make_unique<USIEngine>();\n    wasm_usi->set_engine(*wasm_engine);\n    wasm_usi->enqueue_startup_commands(CommandLine::g);\n    wasm_usi->loop();\n#else\n    auto engine = std::make_unique<YaneuraOuEngine>();\n    auto usi = std::make_unique<USIEngine>();\n    usi->set_engine(*engine);\n    usi->enqueue_startup_commands(CommandLine::g);\n    usi->loop();\n#endif\n}'''
          if len(pat.findall(s)) != 1: raise SystemExit('engine_main match failure')
          p.write_text(pat.sub(rep,s,count=1))
          PY
          cp shogi-v21528/yaneuraou/nn.bin YaneuraOu/nn.bin
      - name: Build WASM
        shell: bash
        run: |
          set -euxo pipefail
          docker pull emscripten/emsdk:3.1.43
          mkdir -p YaneuraOu/build/wasm/halfkp.noeval/lib
          docker run --rm -v "${{ github.workspace }}/YaneuraOu:/src" -w /src/source emscripten/emsdk:3.1.43 \
            bash -lc 'make clean && make -j2 tournament COMPILER=em++ TARGET_CPU=WASM YANEURAOU_EDITION=YANEURAOU_ENGINE_NNUE TARGET=../build/wasm/halfkp.noeval/lib/yaneuraou.halfkp.noeval.js EM_EXPORT_NAME=YaneuraOu_HalfKP_noeval EM_INITIAL_MEMORY_SIZE=167772160 EXTRA_LDFLAGS="-sEXPORTED_FUNCTIONS=_main,_usi_command"'
      - name: Firefox option-by-option smoke
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/yane/site/yaneuraou
          ROOT=/tmp/yane/site
          LIB="${{ github.workspace }}/YaneuraOu/build/wasm/halfkp.noeval/lib"
          cp "$LIB"/yaneuraou.halfkp.noeval.{js,worker.js,wasm} "$ROOT/yaneuraou/"
          cp shogi-v21528/yaneuraou/nn.bin "$ROOT/yaneuraou/"
          cp shogi-v21528/future-yaneura-worker21528.js "$ROOT/worker.js"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/yane/site/worker.js'); s=p.read_text()
          cmds=[
            ('EvalDir',"setoption name EvalDir value ."),
            ('EvalFile',"setoption name EvalFile value nn.bin"),
            ('FV_SCALE',"setoption name FV_SCALE value 24"),
            ('Threads',"setoption name Threads value 2"),
            ('USI_Hash',"setoption name USI_Hash value 96"),
            ('USI_Ponder',"setoption name USI_Ponder value false"),
            ('BookFile',"setoption name BookFile value no_book"),
          ]
          for label,cmd in cmds:
              needle=f"engine.postMessage('{cmd}');"
              repl=f"stage('DBG {label} BEFORE');{needle}stage('DBG {label} AFTER');"
              if needle not in s: raise SystemExit('missing '+label)
              s=s.replace(needle,repl,1)
          p.write_text(s)
          PY
          cat > "$ROOT/index.html" <<'HTML'
          <!doctype html><meta charset="utf-8"><body data-result="running">starting</body>
          <script>
          (async()=>{
            const b=document.body,logs=[]; const out=x=>{logs.push(x);console.log(x);b.textContent=logs.join('\n')};
            const fail=e=>{b.dataset.result='error';out('FAIL '+String(e&&e.stack||e))};
            try{
              out('COI '+crossOriginIsolated+' SAB '+typeof SharedArrayBuffer);
              const w=new Worker('./worker.js?diag=1'); let seq=0,pending=new Map();
              w.onmessage=e=>{const m=e.data||{}; if(m.type==='stage'){out('STAGE '+m.text);return} if(m.type==='fatal'){fail(Error(m.text));return} if(m.type==='result'){const p=pending.get(m.id);if(p){pending.delete(m.id);m.ok?p.resolve(m):p.reject(Error(m.error||'worker result error'))}}};
              w.onerror=e=>fail(Error('worker '+e.message+' '+e.filename+':'+e.lineno));
              const call=(type,payload={})=>new Promise((resolve,reject)=>{const id='t'+(++seq);pending.set(id,{resolve,reject});w.postMessage({type,id,...payload});setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(Error(type+' timeout'))}},120000)});
              await call('init'); out('INIT OK'); b.dataset.result='ok'; w.terminate();
            }catch(e){fail(e)}
          })();
          </script>
          HTML
          cat > "$ROOT/server.cjs" <<'NODE'
          const h=require('http'),f=require('fs'),p=require('path'),r=__dirname,m={'.html':'text/html','.js':'text/javascript','.wasm':'application/wasm','.bin':'application/octet-stream'};
          h.createServer((q,s)=>{const n=new URL(q.url,'http://x').pathname.replace(/^\//,'')||'index.html',x=p.resolve(r,n);f.readFile(x,(e,d)=>{if(e){s.writeHead(404);return s.end()}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',m[p.extname(x)]||'application/octet-stream');s.end(d)})}).listen(4173,'127.0.0.1');
          NODE
          cd /tmp/yane
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps firefox >/dev/null
          cat > check.mjs <<'NODE'
          import{firefox}from'playwright';
          const b=await firefox.launch({headless:true}),p=await b.newPage();
          p.on('console',m=>console.log('CONSOLE',m.type(),m.text())); p.on('pageerror',e=>console.log('PAGEERROR',e.stack||e));
          await p.goto('http://127.0.0.1:4173/'); await p.waitForFunction(()=>['ok','error'].includes(document.body.dataset.result),{timeout:150000});
          console.log('FINAL',await p.evaluate(()=>document.body.textContent)); await b.close();
          NODE
          node "$ROOT/server.cjs" >/tmp/yane/server.log 2>&1 & PID=$!; trap 'kill $PID 2>/dev/null||true' EXIT
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep .2; done
          node check.mjs 2>&1 | tee /tmp/yane/diag.log
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yaneuraou-option-diag
          path: /tmp/yane/diag.log
          if-no-files-found: ignore
          retention-days: 2
