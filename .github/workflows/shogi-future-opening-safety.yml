name: Shogi Future opening safety vs Piyo Lv40
# second PR synchronize: workflow already exists, trigger real diagnostic run
on:
  pull_request:
    paths:
      - '.github/workflows/shogi-future-opening-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  opening-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright browsers
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps webkit chromium
      - name: Start Future app server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/future-opening-safety-server.log 2>&1 &
          echo $! >/tmp/future-opening-safety-server.pid
          sleep 2
      - name: Build opening-safety match harness
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/shogi-vs-piyo-lv40.js /tmp/future-opening-safety.js
          sed -i 's/const MAX_PLIES=12;/const MAX_PLIES=120;/' /tmp/future-opening-safety.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/future-opening-safety.js')
          s=p.read_text()
          old='async function futureBest(page,state,opts={}){'
          if old not in s: raise SystemExit('futureBest marker missing')
          s=s.replace(old,'async function futureRaw(page,state,opts={}){',1)
          marker='\nasync function startPiyoLv40(page){'
          if marker not in s: raise SystemExit('startPiyo marker missing')
          wrapper=r'''
async function futureBest(page,state,opts={}){
  if(opts&&Number.isFinite(Number(opts.ms)))return futureRaw(page,state,opts);
  const ply=(state.log||[]).length;
  const base=await futureRaw(page,state,{multiPV:ply<24?3:1});
  if(ply>=24||base.resign||base.declareWin||!base.token)return base;
  const rows=(base.info?.candidates||[]).filter(x=>x&&x.token).slice(0,3);
  const tokens=[];for(const r of rows)if(!tokens.includes(r.token))tokens.push(r.token);
  if(!tokens.includes(base.token))tokens.unshift(base.token);
  const tested=[];
  for(const token of tokens.slice(0,3)){
    let reply=null,score=-999999;
    try{
      const after=applyMove(state,tokenToMove(token),'safety-candidate');
      reply=await futureRaw(page,after,{ms:2400,multiPV:1});
      const mate=Number(reply.info?.mate),cp=Number(reply.info?.cp);
      if(Number.isFinite(mate))score=mate>0?-100000+mate:100000+mate;
      else if(Number.isFinite(cp))score=-cp;
    }catch(e){score=-999999}
    tested.push({token,score,reply:reply?.token||'',replyCp:reply?.info?.cp??null,replyMate:reply?.info?.mate??null});
  }
  tested.sort((a,b)=>b.score-a.score);
  const pick=tested[0]&&tested[0].score>-999999?tested[0]:{token:base.token,score:null};
  console.log('OPENING_SAFETY',JSON.stringify({ply,base:base.token,pick:pick.token,tested}));
  return{...base,token:pick.token,info:{...(base.info||{}),openingSafety:true,safetyBase:base.token,safetyPick:pick.token,safetyScore:pick.score,safetyTested:tested}};
}
'''
          s=s.replace(marker,'\n'+wrapper+marker,1)
          p.write_text(s)
          PY
          node --check /tmp/future-opening-safety.js
          grep -F 'const MAX_PLIES=120;' /tmp/future-opening-safety.js
          grep -F 'OPENING_SAFETY' /tmp/future-opening-safety.js
      - name: Run real Piyo Lv40 match with opening safety
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/future-opening-safety.js 2>&1 | tee /tmp/future-opening-safety.log
          grep -F 'PIYO_OPENING_PROBE_RESULT' /tmp/future-opening-safety.log
          if grep -F '"result":"future_loss"' /tmp/future-opening-safety.log; then
            echo 'OPENING_SAFETY_RESULT=LOSE'
            exit 1
          elif grep -F '"result":"future_win"' /tmp/future-opening-safety.log; then
            echo 'OPENING_SAFETY_RESULT=WIN'
          else
            echo 'OPENING_SAFETY_RESULT=NO_TERMINAL_RESULT'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: future-opening-safety-piyo
          path: |
            /tmp/future-opening-safety.log
            /tmp/future-opening-safety-server.log
          retention-days: 2