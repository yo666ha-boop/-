name: Build Fire Shogi APK

on:
  push:
    branches:
      - fire/shogi-webview-v1-20260828
    paths:
      - 'fire-app/**'
      - '.github/workflows/build-fire-shogi-apk.yml'
  pull_request:
    paths:
      - 'fire-app/**'
      - '.github/workflows/build-fire-shogi-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Guard frozen browser baseline
        run: |
          grep -F 'https://ai-shogi-yaneuraou-iphone.vercel.app/' fire-app/app/src/main/java/com/mitsuki/shogi/fire/MainActivity.java
          grep -F '813cad97b764c142bfb34b12498790c2759fd899' fire-app/app/src/main/java/com/mitsuki/shogi/fire/MainActivity.java
          grep -F 'No shogi engine/profile/rating code is changed' fire-app/app/src/main/java/com/mitsuki/shogi/fire/MainActivity.java

      - name: Build debug APK
        working-directory: fire-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -s fire-app/app/build/outputs/apk/debug/app-debug.apk
          ls -lh fire-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mitsuki-shogi-fire-debug-apk
          path: fire-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
