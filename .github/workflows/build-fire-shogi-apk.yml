name: Build Fire Shogi APK

on:
  push:
    branches:
      - fire/shogi-webview-v1-20260828
    paths:
      - 'fire-app/**'
      - '.github/workflows/build-fire-shogi-apk.yml'
  pull_request:
    paths:
      - 'fire-app/**'
      - '.github/workflows/build-fire-shogi-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Guard frozen browser baseline and strength conditions
        run: |
          grep -F '813cad97b764c142bfb34b12498790c2759fd899' fire-app/app/src/main/java/com/mitsuki/shogi/fire/OfflineContentStore.java
          grep -F 'LOCAL_HOST = "app.mitsuki.local"' fire-app/app/src/main/java/com/mitsuki/shogi/fire/OfflineContentStore.java
          grep -F 'START_URL = LOCAL_ORIGIN + "/shogi-v21528/index.html"' fire-app/app/src/main/java/com/mitsuki/shogi/fire/OfflineContentStore.java
          grep -F 'crossOriginIsolated' fire-app/app/src/main/java/com/mitsuki/shogi/fire/MainActivity.java
          grep -F 'SharedArrayBuffer' fire-app/app/src/main/java/com/mitsuki/shogi/fire/MainActivity.java
          grep -F 'refuseWeakFallback' fire-app/app/src/main/java/com/mitsuki/shogi/fire/MainActivity.java
          grep -F '更新取得済み・次回起動で適用' fire-app/app/src/main/java/com/mitsuki/shogi/fire/OfflineContentStore.java
          grep -F "bright:{label:'明るい木目'" fire-app/app/src/main/assets/fire/fire-theme.js
          grep -F "contrast:{label:'くっきり'" fire-app/app/src/main/assets/fire/fire-theme.js

      - name: Build offline debug APK
        working-directory: fire-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify offline APK payload
        run: |
          APK=fire-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 60000000
          unzip -l "$APK" > /tmp/fire-apk-list.txt
          grep -F 'assets/shogi-v21528/index.html' /tmp/fire-apk-list.txt
          grep -F 'assets/shogi/strong213.css' /tmp/fire-apk-list.txt
          grep -F 'assets/shogi-side-test/yaneuraou/nn.bin' /tmp/fire-apk-list.txt
          grep -F 'assets/shogi-side-test/yaneuraou/yaneuraou.halfkp.noeval.wasm' /tmp/fire-apk-list.txt
          grep -F 'assets/fire/fire-theme.js' /tmp/fire-apk-list.txt
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload offline APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mitsuki-shogi-fire-offline-debug-apk
          path: fire-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable Fire sideload test link
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=fire-app/app/build/outputs/apk/debug/app-debug.apk
          ASSET=mitsuki-shogi-fire-offline-test.apk
          TAG=fire-offline-test
          cp "$APK" "$ASSET"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --title 'みつき将棋 Fire オフライン版 テスト' --notes 'Fire実機検証用。ブラウザproduction mainは変更していません。オフライン本体・水匠5・盤面テーマ切替入り。PR #121のFire branchから自動生成。'
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title 'みつき将棋 Fire オフライン版 テスト' --notes 'Fire実機検証用。ブラウザproduction mainは変更していません。オフライン本体・水匠5・盤面テーマ切替入り。PR #121のFire branchから自動生成。' --prerelease
          fi
          echo 'Stable sideload URL:'
          echo 'https://github.com/yo666ha-boop/-/releases/download/fire-offline-test/mitsuki-shogi-fire-offline-test.apk'
