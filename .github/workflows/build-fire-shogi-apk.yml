name: Build Fire Shogi APK

on:
  push:
    branches:
      - fire/shogi-webview-v1-20260828
    paths:
      - 'fire-app/**'
      - '.github/workflows/build-fire-shogi-apk.yml'
  pull_request:
    paths:
      - 'fire-app/**'
      - '.github/workflows/build-fire-shogi-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fire Stage 3.3 prevent startup self-test from blocking gameplay
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('fire-app/app/src/main/java/com/mitsuki/shogi/fire/NativeEngineManager.java')
          s=p.read_text()
          old='    synchronized JSONObject selfTest() {'
          new='    JSONObject selfTest() {'
          if s.count(old) != 1:
              raise SystemExit('expected exactly one synchronized selfTest declaration')
          p.write_text(s.replace(old,new,1))
          PY
          grep -F '    JSONObject selfTest() {' fire-app/app/src/main/java/com/mitsuki/shogi/fire/NativeEngineManager.java
          if grep -F 'synchronized JSONObject selfTest()' fire-app/app/src/main/java/com/mitsuki/shogi/fire/NativeEngineManager.java; then
            echo 'startup self-test still holds the global engine-manager monitor' >&2
            exit 1
          fi

      - name: Set up Android NDK r23b
        id: setup_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23b

      - name: Build production-matched YaneuraOu V9.70git Android executables
        env:
          NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          set -euxo pipefail
          # Production shogi-side-test/yaneuraou/build-info.txt identifies this exact source commit.
          YANE_COMMIT=33ccf1f907eb7184889fa23051243f81ab0bf973
          grep -F "commit=$YANE_COMMIT" shogi-side-test/yaneuraou/build-info.txt
          git clone --filter=blob:none https://github.com/yaneurao/YaneuraOu.git /tmp/YaneuraOu
          cd /tmp/YaneuraOu
          git checkout "$YANE_COMMIT"
          test "$(git rev-parse HEAD)" = "$YANE_COMMIT"
          grep -F '#define ENGINE_VERSION "9.70git"' source/config.h
          grep -F 'EVAL_EMBEDDING = OFF' script/jni/Android.mk
          grep -F 'const char* default_eval_dir = "eval"' source/eval/nnue/evaluate_nnue.cpp
          grep -F '#define EvalFileDefaultName "nn.bin"' source/eval/nnue/evaluate_nnue.h
          for ABI in arm64-v8a armeabi-v7a; do
            rm -rf libs obj
            "$NDK_HOME/ndk-build" \
              NDK_PROJECT_PATH="$PWD" \
              APP_BUILD_SCRIPT="$PWD/script/jni/Android.mk" \
              NDK_APPLICATION_MK="$PWD/script/jni/Application.mk" \
              APP_ABI="$ABI" \
              YANEURAOU_EDITION=YANEURAOU_ENGINE_NNUE \
              -j2 V=1
            SRC="libs/$ABI/YaneuraOu_NNUE_$ABI"
            test -s "$SRC"
            file "$SRC"
            mkdir -p "$GITHUB_WORKSPACE/fire-app/app/src/main/jniLibs/$ABI"
            cp "$SRC" "$GITHUB_WORKSPACE/fire-app/app/src/main/jniLibs/$ABI/libyaneuraou_v970_exec.so"
          done
          git archive --format=tar.gz --output="$GITHUB_WORKSPACE/YaneuraOu-V9.70git-source-33ccf1f.tar.gz" HEAD
          test -s "$GITHUB_WORKSPACE/YaneuraOu-V9.70git-source-33ccf1f.tar.gz"
          ls -lh "$GITHUB_WORKSPACE"/fire-app/app/src/main/jniLibs/*/libyaneuraou_v970_exec.so

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Guard frozen browser baseline and native strength transport
        run: |
          set -euxo pipefail
          grep -F '813cad97b764c142bfb34b12498790c2759fd899' fire-app/app/src/main/java/com/mitsuki/shogi/fire/OfflineContentStore.java
          grep -F 'NativeEngineManager' fire-app/app/src/main/java/com/mitsuki/shogi/fire/LoopbackHttpServer.java
          grep -F 'YaneuraOu V9.70 Android NDK + Suisho5' fire-app/app/src/main/java/com/mitsuki/shogi/fire/NativeEngineManager.java
          grep -F 'libyaneuraou_v970_exec.so' fire-app/app/src/main/java/com/mitsuki/shogi/fire/NativeEngineManager.java
          grep -F 'new File(engineDir, "eval")' fire-app/app/src/main/java/com/mitsuki/shogi/fire/NativeEngineManager.java
          grep -F 'new File(evalDir, "nn.bin")' fire-app/app/src/main/java/com/mitsuki/shogi/fire/NativeEngineManager.java
          grep -F 'waitFor(id, cursor, "readyok"' fire-app/app/src/main/java/com/mitsuki/shogi/fire/NativeEngineManager.java
          grep -F 'go movetime 120' fire-app/app/src/main/java/com/mitsuki/shogi/fire/NativeEngineManager.java
          grep -F 'bestmove timeout after native search' fire-app/app/src/main/java/com/mitsuki/shogi/fire/NativeEngineManager.java
          grep -F '    JSONObject selfTest() {' fire-app/app/src/main/java/com/mitsuki/shogi/fire/NativeEngineManager.java
          grep -F "return 'setoption name EvalDir value eval'" fire-app/app/src/main/assets/fire/yaneuraou-native-shim.js
          grep -F 'EvalFile' fire-app/app/src/main/assets/fire/yaneuraou-native-shim.js
          grep -F 'yaneuraou-native-shim.js' fire-app/app/src/main/java/com/mitsuki/shogi/fire/LoopbackHttpServer.java
          grep -F 'result.optBoolean("readyok", false)' fire-app/app/src/main/java/com/mitsuki/shogi/fire/MainActivity.java
          grep -F 'result.optBoolean("searched", false)' fire-app/app/src/main/java/com/mitsuki/shogi/fire/MainActivity.java
          grep -F '/eval/nn.bin' fire-app/app/src/main/java/com/mitsuki/shogi/fire/MainActivity.java
          grep -F 'Silk/MitsukiFire' fire-app/app/src/main/java/com/mitsuki/shogi/fire/MainActivity.java
          grep -F 'android:extractNativeLibs="true"' fire-app/app/src/main/AndroidManifest.xml
          grep -F 'shared:!0' shogi-side-test/yaneuraou/yaneuraou.halfkp.noeval.js
          grep -F 'instanceof SharedArrayBuffer' shogi-side-test/yaneuraou/yaneuraou.halfkp.noeval.js
          grep -F '更新取得済み・次回起動で適用' fire-app/app/src/main/java/com/mitsuki/shogi/fire/OfflineContentStore.java
          grep -F "bright:{label:'明るい木目'" fire-app/app/src/main/assets/fire/fire-theme.js
          grep -F "contrast:{label:'くっきり'" fire-app/app/src/main/assets/fire/fire-theme.js

      - name: Build offline native-engine debug APK
        working-directory: fire-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify offline APK payload
        run: |
          set -euxo pipefail
          APK=fire-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 60000000
          unzip -l "$APK" > /tmp/fire-apk-list.txt
          grep -F 'assets/shogi-v21528/index.html' /tmp/fire-apk-list.txt
          grep -F 'assets/shogi/strong213.css' /tmp/fire-apk-list.txt
          grep -F 'assets/shogi-side-test/yaneuraou/nn.bin' /tmp/fire-apk-list.txt
          grep -F 'assets/fire/yaneuraou-native-shim.js' /tmp/fire-apk-list.txt
          grep -F 'lib/arm64-v8a/libyaneuraou_v970_exec.so' /tmp/fire-apk-list.txt
          grep -F 'lib/armeabi-v7a/libyaneuraou_v970_exec.so' /tmp/fire-apk-list.txt
          grep -F 'assets/fire/fire-theme.js' /tmp/fire-apk-list.txt
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload offline APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mitsuki-shogi-fire-native-v970-debug-apk
          path: fire-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload corresponding YaneuraOu source artifact
        uses: actions/upload-artifact@v4
        with:
          name: YaneuraOu-V9.70git-source-33ccf1f
          path: YaneuraOu-V9.70git-source-33ccf1f.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable Fire sideload test link
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          APK=fire-app/app/build/outputs/apk/debug/app-debug.apk
          ASSET=mitsuki-shogi-fire-offline-test.apk
          SOURCE=YaneuraOu-V9.70git-source-33ccf1f.tar.gz
          TAG=fire-offline-test
          cp "$APK" "$ASSET"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"
          NOTES='Fire実機検証用 Stage 3.3。Stage 3.2のThreads最低2・Hash最低96MB・Fire専用探索予算増加はそのまま維持し、棋力・26キャラprofile・水匠5・やねうら王V9.70gitは一切弱くしていません。実機で初手から1分以上待つ原因として、起動時のネイティブ自己診断 selfTest が最大90秒 readyok を待つ間 NativeEngineManager 全体の synchronized ロックを保持し、実戦用セッション開始を塞いでいた競合を特定。Stage 3.3では自己診断の長い待機中にグローバルロックを保持しないようビルド時に修正し、実戦エンジンと自己診断を分離します。自己診断自体、実bestmove確認、弱いfallback禁止方針は維持。ブラウザproduction mainは未変更。PR #121のFire branchから自動生成。'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$SOURCE" --clobber
            gh release edit "$TAG" --title 'みつき将棋 Fire Stage 3.3 初手待ち修正版' --notes "$NOTES"
          else
            gh release create "$TAG" "$ASSET" "$SOURCE" --target "$GITHUB_SHA" --title 'みつき将棋 Fire Stage 3.3 初手待ち修正版' --notes "$NOTES" --prerelease
          fi
          echo 'Stable sideload URL:'
          echo 'https://github.com/yo666ha-boop/-/releases/download/fire-offline-test/mitsuki-shogi-fire-offline-test.apk'
