name: Verify PR86 retuned rolling boundaries 20260825
on:
  push:
    branches: [audit-retuned-boundary-20260825]
permissions:
  contents: read
jobs:
  rolling-boundaries:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert exact PR86 candidate base
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=cecf7b88822ecde046d44e12d45f1cb7eac203be
          git merge-base --is-ancestor "$CANDIDATE" HEAD
          mapfile -t CHANGED < <(git diff --name-only "$CANDIDATE"..HEAD)
          printf 'VALIDATION_DIFF %s\n' "${CHANGED[*]}"
          test "${#CHANGED[@]}" -eq 2
          printf '%s\n' "${CHANGED[@]}" | grep -Fx '.github/scripts/audit-retuned-rolling-boundaries-20260825.mjs'
          printf '%s\n' "${CHANGED[@]}" | grep -Fx '.github/workflows/verify-pr86-retuned-rolling-boundaries-20260825.yml'
          echo "PASS_PR86_BOUNDARY_EXACT_CANDIDATE $CANDIDATE"
      - name: Prepare Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
      - name: Syntax check
        run: node --check .github/scripts/audit-retuned-rolling-boundaries-20260825.mjs
      - name: Build audit page
        run: node .github/scripts/build-lower8-quality-page-20260825.mjs
      - name: Start audit server
        run: |
          node .github/scripts/coi-lower8-quality-server-20260825.mjs >/tmp/pr86-boundary-server.log 2>&1 &
          sleep 1
      - name: Verify latest rolling boundaries
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/audit-retuned-rolling-boundaries-20260825.mjs 2>&1 | tee /tmp/pr86-boundary.log
          grep -F 'PASS_PR86_RETUNED_ROLLING_BOUNDARIES' /tmp/pr86-boundary.log
