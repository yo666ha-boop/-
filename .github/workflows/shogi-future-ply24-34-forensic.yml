name: Shogi Future ply24-34 forensic
on:
  pull_request:
    paths:
      - '.github/scripts/shogi-future-ply24-34-forensic.js'
      - '.github/workflows/shogi-future-ply24-34-forensic.yml'
      - 'shogi-v21528/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check .github/scripts/shogi-future-ply24-34-forensic.js
      - name: Install Playwright WebKit
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Start app server
        run: |
          python3 -m http.server 8000 >/tmp/forensic-server.log 2>&1 &
          echo $! >/tmp/forensic-server.pid
          sleep 2
      - name: Score actual Future moves from ply24 through ply34
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/shogi-future-ply24-34-forensic.js 2>&1 | tee /tmp/ply24-34-forensic.log
      - name: Upload forensic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: future-ply24-34-forensic
          path: |
            /tmp/ply24-34-forensic.log
            /tmp/forensic-server.log
          retention-days: 2