name: Diagnose Future corrected layout extended practical
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/diagnose-future-layout-practical-extended-20260824.yml']
permissions:
  contents: read
jobs:
  practical:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: yaneurao/YaneuraOu
          ref: 76d58ef2e4cf64116784f41fd4816425ab6817ee
          path: YaneuraOu-layoutext
      - name: Replay prior diagnostic with completed-game recognition
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,subprocess,sys
          from pathlib import Path
          repo=Path(os.environ['GITHUB_WORKSPACE'])
          src=subprocess.check_output([
              'git','show','31fee36df6bc83c2b88ec0d00da19c05a0d4db82:.github/workflows/diagnose-future-layout-practical-extended-20260824.yml'
          ],cwd=repo,text=True)
          lines=src.splitlines()
          blocks=[]
          i=0
          while i < len(lines):
              if lines[i]=='        run: |':
                  i+=1; out=[]
                  while i < len(lines):
                      line=lines[i]
                      if line and not line.startswith('          '): break
                      out.append(line[10:] if line.startswith('          ') else '')
                      i+=1
                  blocks.append('\n'.join(out)+'\n')
                  continue
              i+=1
          if len(blocks)!=7:
              raise SystemExit(f'expected 7 prior run blocks, got {len(blocks)}')
          fail=0; patched=False
          for n,block in enumerate(blocks,1):
              block=block.replace('${{ github.workspace }}',str(repo))
              print(f'=== REPLAY_BLOCK_{n} ===',flush=True)
              rc=subprocess.run(['bash','-lc',block],cwd=repo).returncode
              harness=repo/'layoutext-practical.mjs'
              if harness.exists() and not patched:
                  s=harness.read_text()
                  old="if(lastState.count>=baseCount+2||/投了|詰み|反則|千日手|持将棋|中断/.test(lastState.last)){ready=true;break}"
                  new="if(lastState.count>=baseCount+2||/投了|詰み|反則|千日手|持将棋|中断/.test(lastState.last)||/対局終了|プレイヤーの勝ち|プレイヤーの負け|引き分け/.test(lastState.messText||'')){ready=true;break}"
                  if old not in s: raise SystemExit('end-dialog readiness marker missing')
                  s=s.replace(old,new,1)
                  old2="if(/投了|詰み|反則|千日手|持将棋|中断/.test(lastState.last)||ms.length%2){result=lastState.last||'ENDED';break}"
                  new2="if(/対局終了|プレイヤーの勝ち|プレイヤーの負け|引き分け/.test(lastState.messText||'')){result=(lastState.messText||'ENDED').replace(/\\s+/g,' ').trim();break}if(/投了|詰み|反則|千日手|持将棋|中断/.test(lastState.last)||ms.length%2){result=lastState.last||'ENDED';break}"
                  if old2 not in s: raise SystemExit('end-dialog result marker missing')
                  harness.write_text(s.replace(old2,new2,1))
                  subprocess.run(['node','--check',str(harness)],cwd=repo,check=True)
                  print('PASS_PIYO_COMPLETED_DIALOG_PATCH',flush=True)
                  patched=True
              if rc!=0:
                  print(f'REPLAY_BLOCK_FAIL block={n} rc={rc}',flush=True)
                  fail=1
          if not patched: raise SystemExit('harness was never patched')
          raise SystemExit(fail)
          PY
