name: Diagnose Future corrected layout extended practical
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/diagnose-future-layout-practical-extended-20260824.yml']
permissions:
  contents: read
jobs:
  practical:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: yaneurao/YaneuraOu
          ref: 76d58ef2e4cf64116784f41fd4816425ab6817ee
          path: YaneuraOu-layoutext
      - name: Restore production patches and corrected NNUE layout
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,textwrap
          yml=subprocess.check_output(['git','show','2fbda43b3ac86c38f7760e589ce4c52c15c65141:.github/workflows/diag-yaneuraou-v970-threadfix.yml'],text=True)
          block=yml.split("python3 - <<'PY'",1)[1].split('\n          PY',1)[0]
          script=textwrap.dedent(block.lstrip('\n')).replace("Path('YaneuraOu/","Path('YaneuraOu-layoutext/")
          Path('/tmp/threadfix.py').write_text(script)
          PY
          python3 /tmp/threadfix.py
          python3 - <<'PY'
          from pathlib import Path
          m=Path('YaneuraOu-layoutext/source/Makefile');s=m.read_text()
          if '-s PTHREAD_POOL_SIZE=2' not in s: raise SystemExit('pool marker missing')
          m.write_text(s.replace('-s PTHREAD_POOL_SIZE=2','-s PTHREAD_POOL_SIZE=32',1))
          p=Path('YaneuraOu-layoutext/source/eval/nnue/evaluate_nnue.cpp');s=p.read_text()
          needle='''    Options.add("EvalDir", Option(default_eval_dir, [](const Option& o) {\n                    std::string eval_dir = std::string(o);\n                    if (last_eval_dir != eval_dir)\n                    {\n                        // 評価関数フォルダ名の変更に際して、評価関数ファイルの読み込みフラグをクリアする。\n                        last_eval_dir = eval_dir;\n                        eval_loaded   = false;\n                    }\n                    return std::nullopt;\n                }));\n\n'''
          if 'Options.add("EvalFile"' not in s:
              if needle not in s: raise SystemExit('EvalDir marker missing')
              s=s.replace(needle,needle+'#if defined(__EMSCRIPTEN__)\n    Options.add("EvalFile", Option(EvalFileDefaultName));\n#endif\n\n',1)
          p.write_text(s)
          fixes=[
          ('affine_transform.h','#if defined(USE_SSSE3) || defined(USE_NEON_DOTPROD)\n        return kOutputDimensions % 4 == 0 ? GetWeightIndexScrambled(i) : i;','#if (defined(USE_SSSE3) || defined(USE_NEON_DOTPROD)) && !defined(USE_WASM_SIMD)\n        return kOutputDimensions % 4 == 0 ? GetWeightIndexScrambled(i) : i;'),
          ('affine_transform_sparse_input.h','#if defined(USE_SSSE3) || USE_NEON >= 8\n        return kOutputDimensions % 4 == 0 ? GetWeightIndexScrambled(i) : i;','#if (defined(USE_SSSE3) || USE_NEON >= 8) && !defined(USE_WASM_SIMD)\n        return kOutputDimensions % 4 == 0 ? GetWeightIndexScrambled(i) : i;')]
          for fn,old,new in fixes:
              p=Path('YaneuraOu-layoutext/source/eval/nnue/layers')/fn;s=p.read_text()
              if old not in s: raise SystemExit('layout marker '+fn)
              p.write_text(s.replace(old,new,1))
          PY
          grep -F '!defined(USE_WASM_SIMD)' YaneuraOu-layoutext/source/eval/nnue/layers/affine_transform.h
          grep -F '!defined(USE_WASM_SIMD)' YaneuraOu-layoutext/source/eval/nnue/layers/affine_transform_sparse_input.h
      - name: Build corrected V9.70 WASM
        run: |
          set -euo pipefail
          docker pull emscripten/emsdk:3.1.43 >/dev/null
          mkdir -p YaneuraOu-layoutext/build/wasm/halfkp.noeval/lib
          docker run --rm -v "${{ github.workspace }}/YaneuraOu-layoutext:/src" -w /src/source emscripten/emsdk:3.1.43 bash -lc 'make clean && make -j2 tournament COMPILER=em++ TARGET_CPU=WASM YANEURAOU_EDITION=YANEURAOU_ENGINE_NNUE TARGET=../build/wasm/halfkp.noeval/lib/yaneuraou.halfkp.noeval.js EM_EXPORT_NAME=YaneuraOu_HalfKP_noeval EM_INITIAL_MEMORY_SIZE=167772160' >/tmp/layoutext-build.log 2>&1
          LIB=YaneuraOu-layoutext/build/wasm/halfkp.noeval/lib
          mkdir -p shogi-v21528/layoutext76d
          cp "$LIB"/yaneuraou.halfkp.noeval.{js,worker.js,wasm} shogi-v21528/layoutext76d/
          cp shogi-v21528/yaneuraou/nn.bin shogi-v21528/layoutext76d/
          node - <<'NODE'
          const fs=require('fs'),p='shogi-v21528/layoutext76d/yaneuraou.halfkp.noeval.wasm';const ex=WebAssembly.Module.exports(new WebAssembly.Module(fs.readFileSync(p))).map(x=>x.name);if(!ex.includes('usi_command'))throw Error('usi_command missing');console.log('FUTURE_LAYOUT_EXT_BUILD_OK')
          NODE
      - name: Prepare corrected worker and Playwright
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),src=fs.readFileSync('shogi-v21528/future-yaneura-worker21528.js','utf8');const s=src.replace("BASE=new URL('./yaneuraou/',self.location.href).href;","BASE=new URL('./layoutext76d/',self.location.href).href;");if(s===src)throw Error('BASE marker missing');fs.writeFileSync('shogi-v21528/future-layoutext-worker.js',s)
          NODE
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps webkit chromium >/dev/null
      - name: Start COI server
        run: |
          set -euo pipefail
          cat >/tmp/layoutext-srv.mjs <<'NODE'
          import http from'node:http';import fs from'node:fs';import path from'node:path';const r=process.env.GITHUB_WORKSPACE,m={'.html':'text/html','.js':'text/javascript','.wasm':'application/wasm','.bin':'application/octet-stream','.png':'image/png','.jpg':'image/jpeg','.json':'application/json'};http.createServer((q,s)=>{let u=new URL(q.url,'http://x').pathname;if(u.endsWith('/'))u+='index.html';const f=path.resolve(r,'.'+u);if(!f.startsWith(path.resolve(r))||!fs.existsSync(f)){s.writeHead(404);return s.end()}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Content-Type',m[path.extname(f)]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4229,'127.0.0.1')
          NODE
          node /tmp/layoutext-srv.mjs >/tmp/layoutext-srv.log 2>&1 &
          for i in $(seq 1 30);do curl -fsS http://127.0.0.1:4229/shogi-v21528/index.html >/dev/null&&exit 0;sleep 1;done;cat /tmp/layoutext-srv.log;exit 1
      - name: Derive extended corrected practical harness
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/verify-future-current-vs-piyo40-20260820.yml').read_text()
          a="          cat >/tmp/fpiyo/match.mjs <<'NODE'\n";i=src.index(a)+len(a);j=src.index("\n          NODE\n",i)
          js='\n'.join(line[10:] if line.startswith('          ') else line for line in src[i:j].splitlines())+'\n'
          js=js.replace('const MAX=70,R=','const MAX=140,R=',1)
          js=js.replace('http://127.0.0.1:4173/','http://127.0.0.1:4229/')
          js=js.replace('./future-yaneura-worker21528.js?v=practical-','./future-layoutext-worker.js?v=practical-')
          old="await p.click('#btnDialogKifClose');const m=/^position startpos";new="await p.click('#btnDialogKifClose');await p.waitForFunction(()=>{const e=document.querySelector('#dialogKifBox');return !e||getComputedStyle(e).display==='none'||getComputedStyle(e).visibility==='hidden'||e.getClientRects().length===0},{},{timeout:4000});await p.waitForTimeout(120);const m=/^position startpos"
          if old not in js: raise SystemExit('close marker');
          js=js.replace(old,new,1)
          old="async function exportMoves(){await p.locator('img[alt=\"メニュー\"]').first().click();";new="async function exportMoves(){await p.evaluate(()=>{const d=document.querySelector('#dialogMess');if(d){d.classList.remove('is-show');d.style.display='none'}});await p.locator('img[alt=\"メニュー\"]').first().click({force:true});"
          if old not in js: raise SystemExit('export marker');
          js=js.replace(old,new,1)
          old="if(u.endsWith('+'))await p.locator('#btnDialogNari2').click({force:true,timeout:1000}).catch(()=>{});else if(await p.locator('#dialogNari').isVisible().catch(()=>false))await p.click('#btnDialogNari1')";new="if(u.endsWith('+')){await p.waitForTimeout(120);if(await p.locator('#dialogNari').isVisible().catch(()=>false)){await p.click('#btnDialogNari2');await p.locator('#dialogNari').waitFor({state:'hidden',timeout:4000})}}else{await p.waitForTimeout(120);if(await p.locator('#dialogNari').isVisible().catch(()=>false)){await p.click('#btnDialogNari1');await p.locator('#dialogNari').waitFor({state:'hidden',timeout:4000})}}"
          if old not in js: raise SystemExit('promotion marker');
          js=js.replace(old,new,1)
          old="await p.uncheck('#chkRandomBook').catch(()=>{});";new="if(attempt===1)await p.uncheck('#chkRandomBook').catch(()=>{});else await p.check('#chkRandomBook').catch(()=>{});"
          if old not in js: raise SystemExit('random book marker');
          js=js.replace(old,new,1)
          js=js.replace("console.log('PIYO40_PROFILE '+JSON.stringify({attempt,level:lv}));","console.log('PIYO40_PROFILE '+JSON.stringify({attempt,level:lv,randomBook:attempt!==1}));",1)
          js=js.replace('FUTURE_CURRENT_PROFILE','FUTURE_LAYOUT_EXT_PROFILE').replace('FUTURE_CURRENT_MOVE','FUTURE_LAYOUT_EXT_MOVE').replace('FUTURE_CURRENT_AUDIT','FUTURE_LAYOUT_EXT_AUDIT').replace('FUTURE_CURRENT_PRACTICAL_SUMMARY','FUTURE_LAYOUT_EXT_SUMMARY').replace('PASS_FUTURE_CURRENT_PIYO40_HARNESS','PASS_FUTURE_LAYOUT_EXT_HARNESS')
          Path('layoutext-practical.mjs').write_text(js)
          PY
          node --check layoutext-practical.mjs
      - name: Run two extended practical attempts
        run: |
          set -euo pipefail
          for A in 1 2; do
            ATTEMPT=$A node layoutext-practical.mjs 2>&1 | tee /tmp/layoutext-practical-$A.log
            grep -F 'FUTURE_LAYOUT_EXT_SUMMARY ' /tmp/layoutext-practical-$A.log
            grep -F 'PASS_FUTURE_LAYOUT_EXT_HARNESS' /tmp/layoutext-practical-$A.log
          done
      - name: Preserve extended evidence
        if: always()
        run: |
          grep -E '^(PIYO40_PROFILE|FUTURE_LAYOUT_EXT_|PIYO40_COMMIT|PIYO40_HEARTBEAT|PIYO40_REPLY|PASS_FUTURE_LAYOUT_EXT_)' /tmp/layoutext-practical-*.log 2>/dev/null | tail -900 || true
          tail -60 /tmp/layoutext-build.log || true
