name: Diagnose Future 7g7f fresh SP7 practical via proven PR trigger
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-future-raw-node-multipv-20260822.yml'
permissions:
  contents: read
  issues: write
concurrency:
  group: future-opening-sp7-proven-pr80
  cancel-in-progress: true
jobs:
  practical:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Report run id
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/issues/80/comments -f body="SP7_PROVEN_RUN ${{ github.run_id }} ${{ github.sha }} OPENING_7G7F_FRESH_SP7"
      - name: Install Chromium and WebKit
        run: |
          set -euo pipefail
          mkdir -p /tmp/fastp && cd /tmp/fastp
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
      - name: Start local COI server
        run: |
          cat >/tmp/fastp/server.mjs <<'NODE'
          import http from'node:http';import fs from'node:fs';import path from'node:path';const root=process.env.GITHUB_WORKSPACE,m={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.wasm':'application/wasm','.bin':'application/octet-stream','.png':'image/png','.jpg':'image/jpeg','.json':'application/json'};http.createServer((q,s)=>{let u=decodeURIComponent((q.url||'/').split('?')[0]);if(u==='/')u='/shogi-v21528/index.html';const f=path.resolve(root,'.'+u);if(!f.startsWith(path.resolve(root))){s.writeHead(403);return s.end('forbidden')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');fs.readFile(f,(e,b)=>{if(e){s.writeHead(404);return s.end('not found')}s.setHeader('Content-Type',m[path.extname(f)]||'application/octet-stream');s.writeHead(200);s.end(b)})}).listen(4174,'127.0.0.1');
          NODE
          node /tmp/fastp/server.mjs >/tmp/fastp/server.log 2>&1 &
          for i in $(seq 1 30);do curl -fsS http://127.0.0.1:4174/shogi-v21528/index.html >/dev/null&&exit 0;sleep 1;done
          cat /tmp/fastp/server.log; exit 1
      - name: Derive practical harness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/verify-future-current-vs-piyo40-20260820.yml').read_text()
          a="          cat >/tmp/fpiyo/match.mjs <<'NODE'\n"
          i=src.index(a)+len(a); j=src.index("\n          NODE\n",i)
          js='\n'.join(line[10:] if line.startswith('          ') else line for line in src[i:j].splitlines())+'\n'
          js=js.replace('http://127.0.0.1:4173/','http://127.0.0.1:4174/')
          old="const search=(pos,o={})=>f.evaluate(({pos,o})=>window.__call('bestmove',{sfen:pos,...o}),{pos,o});"
          new="await f.evaluate(()=>{try{window.__w?.terminate()}catch(e){};window.__w=null;window.__call=null});const search=(pos,o={})=>f.evaluate(async({pos,o})=>{const w=new Worker('./future-yaneura-worker21528.js?v=fast-sp7-'+Date.now()+'-'+Math.random());let n=0,P=new Map();w.onmessage=e=>{const m=e.data||{},q=P.get(m.id);if(!q||m.type!=='result')return;P.delete(m.id);clearTimeout(q.t);m.ok?q.r(m):q.j(Error(m.error||'worker'))};const call=(type,x={})=>new Promise((r,j)=>{const id=++n,t=setTimeout(()=>j(Error(type+' timeout')),150000);P.set(id,{r,j,t});w.postMessage({type,id,...x})});try{await call('init');return await call('bestmove',{sfen:pos,...o})}finally{try{w.terminate()}catch(e){}}},{pos,o});"
          if old not in js: raise SystemExit('search marker missing')
          js=js.replace(old,new,1)
          old2="const ply=ms.length+1,pos=sfen(ms),r=await search(pos,{ms:4000,multiPV:1}),u=String(r.token||'');"
          new2="const ply=ms.length+1,pos=sfen(ms),r=ply===1?{token:'7g7f',info:{forcedOpening:true,adaptive:false}}:await search(pos,{ms:7000,multiPV:1,adaptive:false}),u=String(r.token||'');"
          if old2 not in js: raise SystemExit('move marker missing')
          js=js.replace(old2,new2,1)
          old_export="async function exportMoves(){await p.locator('img[alt=\"メニュー\"]').first().click();await p.waitForTimeout(80);await p.click('#menuKifu');"
          new_export="async function exportMoves(){await p.evaluate(()=>{const d=document.querySelector('#dialogMess');if(d){d.classList.remove('is-show');d.style.display='none'}try{if(typeof menuKifu==='function')menuKifu()}catch(e){}});await p.waitForTimeout(100);if(!await p.locator('#dialogKifBox').isVisible().catch(()=>false)){await p.locator('img[alt=\"メニュー\"]').first().click({force:true});await p.waitForTimeout(80);await p.click('#menuKifu',{force:true});}"
          if old_export not in js: raise SystemExit('export marker missing')
          js=js.replace(old_export,new_export,1)
          js=js.replace('FUTURE_CURRENT_PROFILE','FAST_SP7_PROFILE').replace('FUTURE_CURRENT_MOVE','FAST_SP7_MOVE').replace('FUTURE_CURRENT_AUDIT','FAST_SP7_AUDIT').replace('FUTURE_CURRENT_PRACTICAL_SUMMARY','FAST_SP7_PRACTICAL_SUMMARY').replace('PASS_FUTURE_CURRENT_PIYO40_HARNESS','PASS_FAST_SP7_PIYO40_HARNESS')
          Path('/tmp/fastp/match.mjs').write_text(js)
          PY
          grep -F "forcedOpening:true" /tmp/fastp/match.mjs
          grep -F "ms:7000,multiPV:1,adaptive:false" /tmp/fastp/match.mjs
      - name: Run opening plus fresh SinglePV7 practical match
        env:
          ATTEMPT: 1
        run: |
          cd /tmp/fastp
          node match.mjs 2>&1 | tee /tmp/fastp/match.log
          grep -F 'FAST_SP7_PRACTICAL_SUMMARY ' /tmp/fastp/match.log
          grep -F 'PASS_FAST_SP7_PIYO40_HARNESS' /tmp/fastp/match.log
      - name: Preserve evidence
        if: always()
        run: grep -E '^(PIYO40_PROFILE|FAST_SP7_PROFILE|FAST_SP7_MOVE|PIYO40_COMMIT|PIYO40_HEARTBEAT|PIYO40_REPLY|FAST_SP7_AUDIT|FAST_SP7_PRACTICAL_SUMMARY|PASS_FAST_SP7_PIYO40_HARNESS)' /tmp/fastp/match.log | tail -320 || true
