name: Verify PR83 pool2 isolated four-environment runtime
on:
  pull_request:
    branches: [future-layout-fix-pool2-production-candidate-20260824]
    paths: ['.github/workflows/verify-pr83-pool2-runtime-isolated-20260825.yml']
permissions:
  contents: read
jobs:
  runtime-matrix:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      CANDIDATE_SHA: d96a37094d6ceab48079c7b3322261004ec09d5a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d96a37094d6ceab48079c7b3322261004ec09d5a
          fetch-depth: 1
      - name: Assert exact candidate identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          grep -F 'WASM_NNUE_LAYOUT_FIX=1' shogi-v21528/yaneuraou/build-info.txt
          grep -F 'PTHREAD_POOL_SIZE=2' shogi-v21528/yaneuraou/build-info.txt
          test "$(sha256sum shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.js | awk '{print $1}')" = 'e551d99cc76d99a4f36cd274beaa2779acc4e18da3daa71d0a7ac6ece0aa07f2'
          test "$(sha256sum shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.worker.js | awk '{print $1}')" = '8013ce6c3d243a32be9da70771e5395f52031f9a259c39fc684533a05e86ff07'
          test "$(sha256sum shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.wasm | awk '{print $1}')" = '48f44d95c7ca3d0bde108f01d47df04514e8ebb24e63284148760aec876b3ab9'
          echo PASS_PR83_EXACT_POOL2_ARTIFACT_IDENTITY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright browsers
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps webkit chromium firefox >/dev/null
      - name: Start COI server
        run: |
          cat >/tmp/pr83-coi.mjs <<'NODE'
          import http from'node:http';import fs from'node:fs';import path from'node:path';
          const root=process.cwd(),mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css','.wasm':'application/wasm','.bin':'application/octet-stream','.jpg':'image/jpeg','.jpeg':'image/jpeg','.png':'image/png','.webp':'image/webp'};
          http.createServer((q,s)=>{let n=decodeURIComponent(new URL(q.url,'http://x').pathname);if(n.endsWith('/'))n+='index.html';const f=path.resolve(root,'.'+n);if(!f.startsWith(root)||!fs.existsSync(f)||fs.statSync(f).isDirectory()){s.writeHead(404);return s.end('404')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',mime[path.extname(f).toLowerCase()]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4198,'127.0.0.1');
          NODE
          node /tmp/pr83-coi.mjs >/tmp/pr83-coi.log 2>&1 &
          sleep 1
      - name: Verify iPhone Fire desktop Chromium Firefox runtime
        run: |
          cat >pr83-runtime.mjs <<'NODE'
          import {webkit,chromium,firefox} from 'playwright';
          const cases=[
            {name:'IPHONE_WEBKIT',type:webkit,ua:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1',expect:{threads:1,hashMB:32,mobileWebKit:true,fireSilk:false,mobileSafe:true}},
            {name:'FIRE_SILK',type:chromium,ua:'Mozilla/5.0 (Linux; U; en-US; KFAPWI Build/JDQ39) AppleWebKit/535.19 (KHTML, like Gecko) Silk/3.13 Safari/535.19 Silk-Accelerated=true',expect:{threads:1,hashMB:48,mobileWebKit:false,fireSilk:true,mobileSafe:true}},
            {name:'DESKTOP_CHROMIUM',type:chromium,ua:'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',expect:{threads:1,hashMB:128,mobileWebKit:false,fireSilk:false,mobileSafe:false}},
            {name:'FIREFOX',type:firefox,ua:'Mozilla/5.0 (X11; Ubuntu; Linux x86_64; rv:142.0) Gecko/20100101 Firefox/142.0',expect:{threads:1,hashMB:128,mobileWebKit:false,fireSilk:false,mobileSafe:false}}
          ];
          const rows=[];
          for(const c of cases){
            const browser=await c.type.launch({headless:true});const context=await browser.newContext({userAgent:c.ua,viewport:{width:c.name==='IPHONE_WEBKIT'?390:1280,height:c.name==='IPHONE_WEBKIT'?844:800}});const page=await context.newPage();
            const errors=[];page.on('pageerror',e=>errors.push('pageerror:'+e.message));page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
            const url='http://127.0.0.1:4198/shogi-v21528/index.html?pr83='+c.name+'-'+Date.now();await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});await page.waitForFunction(()=>document.querySelectorAll('#chars .ch').length===26,{timeout:120000});
            const before=await page.evaluate(()=>({coi:crossOriginIsolated,cards:document.querySelectorAll('#chars .ch').length,sound:window.AI_SHOGI_PIECE_SOUND?.audit?.()||null}));
            if(!before.coi||before.cards!==26)throw Error(c.name+' boot '+JSON.stringify(before));
            const r=await page.evaluate(async()=>{const a=window.AI_SHOGI_YANEURAOU_FUTURE;if(!a)throw Error('api missing');const t0=performance.now();await a.init();const initMs=Math.round(performance.now()-t0);const x=await a.bestMove((()=>{let b=Array(81).fill(null),back=['L','N','S','G','K','G','S','N','L'];for(let i=0;i<9;i++){b[i]={k:back[i],o:-1};b[72+i]={k:back[8-i],o:1};b[18+i]={k:'P',o:-1};b[54+i]={k:'P',o:1}}b[10]={k:'R',o:-1};b[16]={k:'B',o:-1};b[64]={k:'B',o:1};b[70]={k:'R',o:1};return{b,h:{1:{},'-1':{}},t:1,log:[],last:null}})(),{ms:300,multiPV:1});return{initMs,status:a.status(),move:!!x?.move,resign:!!x?.resign,declareWin:!!x?.declareWin,info:x?.info||{},sound:window.AI_SHOGI_PIECE_SOUND?.audit?.()||null};});
            for(const [k,v] of Object.entries(c.expect))if(r.info?.[k]!==v)throw Error(c.name+' profile '+k+' expected '+v+' actual '+r.info?.[k]+' '+JSON.stringify(r.info));
            if(!r.status.ready||!r.status.worker||(!r.move&&!r.resign&&!r.declareWin))throw Error(c.name+' engine '+JSON.stringify(r));
            const saved=await page.evaluate(()=>{const api=window.AI_SHOGI_PIECE_SOUND;if(!api)throw Error('sound api');api.setEnabled(false);return{enabled:api.enabled,keys:Object.keys(localStorage)};});
            await page.reload({waitUntil:'domcontentloaded',timeout:120000});await page.waitForFunction(()=>document.querySelectorAll('#chars .ch').length===26,{timeout:120000});const loaded=await page.evaluate(()=>({enabled:window.AI_SHOGI_PIECE_SOUND?.enabled,buttons:document.querySelectorAll('[data-piece-sound-toggle="1"]').length,keys:Object.keys(localStorage)}));
            if(saved.enabled!==false||loaded.enabled!==false||loaded.buttons!==2)throw Error(c.name+' save-load '+JSON.stringify({saved,loaded}));
            await page.evaluate(()=>window.AI_SHOGI_PIECE_SOUND.setEnabled(true));
            const row={name:c.name,before,r:{initMs:r.initMs,status:r.status,move:r.move,resign:r.resign,declareWin:r.declareWin,info:r.info,sound:r.sound},saveLoad:{savedDisabled:!saved.enabled,loadedDisabled:loaded.enabled===false,buttons:loaded.buttons},errors};rows.push(row);console.log('PR83_RUNTIME_ROW '+JSON.stringify(row));await browser.close();
          }
          console.log('PR83_RUNTIME_SUMMARY '+JSON.stringify(rows));console.log('PASS_PR83_POOL2_FOUR_ENV_RUNTIME');
          NODE
          node ./pr83-runtime.mjs 2>&1 | tee /tmp/pr83-runtime.log
          grep -F 'PASS_PR83_POOL2_FOUR_ENV_RUNTIME' /tmp/pr83-runtime.log
