name: Compare V9.70 mobile final proof
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/compare-v970-mobile-final-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  strength:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare old main and final V9.70 runtimes
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main --depth=1
          ROOT=/tmp/mobile-proof/site
          mkdir -p "$ROOT/old" "$ROOT/new" /tmp/mobile-proof/pw
          cp shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.js "$ROOT/new/"
          cp shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.worker.js "$ROOT/new/"
          cp shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.wasm "$ROOT/new/"
          git show origin/main:shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.js > "$ROOT/old/yaneuraou.halfkp.noeval.js"
          git show origin/main:shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.worker.js > "$ROOT/old/yaneuraou.halfkp.noeval.worker.js"
          git show origin/main:shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.wasm > "$ROOT/old/yaneuraou.halfkp.noeval.wasm"
          cp shogi-v21528/yaneuraou/nn.bin "$ROOT/nn.bin"
          sha256sum "$ROOT"/old/* "$ROOT"/new/* | tee /tmp/mobile-proof/runtime-sha.txt
      - name: Build local engine harness
        shell: bash
        run: |
          ROOT=/tmp/mobile-proof/site
          cat > "$ROOT/server.cjs" <<'NODE'
          const h=require('http'),f=require('fs'),p=require('path'),r=__dirname,m={'.html':'text/html','.js':'text/javascript','.wasm':'application/wasm','.bin':'application/octet-stream'};
          h.createServer((q,s)=>{const n=new URL(q.url,'http://x').pathname.replace(/^\//,'')||'index.html',x=p.resolve(r,n);f.readFile(x,(e,d)=>{if(e){s.writeHead(404);return s.end()}for(const[k,v]of Object.entries({'Cross-Origin-Opener-Policy':'same-origin','Cross-Origin-Embedder-Policy':'require-corp','Cross-Origin-Resource-Policy':'same-origin','Cache-Control':'no-store'}))s.setHeader(k,v);s.setHeader('Content-Type',m[p.extname(x)]||'application/octet-stream');s.end(d)})}).listen(4173,'127.0.0.1');
          NODE
          cat > "$ROOT/index.html" <<'HTML'
          <!doctype html><meta charset="utf-8"><body>mobile strength proof</body>
          HTML
          cat > "$ROOT/driver.js" <<'JS'
          'use strict';
          const kind=new URL(self.location.href).searchParams.get('kind')||'new',BASE=new URL('./'+kind+'/',self.location.href).href;
          let engine=null,ready=false,waiters=[],lastInfo={};const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function line(raw){const s=String(raw||'').trim();if(s.startsWith('info ')){const cp=/\bscore cp (-?\d+)/.exec(s),mate=/\bscore mate (-?\d+)/.exec(s),d=/\bdepth (\d+)/.exec(s),n=/\bnodes (\d+)/.exec(s),pv=/\bpv ([^\s]+)/.exec(s);if(pv)lastInfo={cp:cp?+cp[1]:null,mate:mate?+mate[1]:null,depth:d?+d[1]:0,nodes:n?+n[1]:0,pv:pv[1]};}for(const w of waiters.slice())if(w.p(s)){waiters=waiters.filter(x=>x!==w);clearTimeout(w.t);w.r(s)}}
          function waitLine(p,ms,label){return new Promise((r,j)=>{const w={p,r,j,t:setTimeout(()=>{waiters=waiters.filter(x=>x!==w);j(Error(label+' timeout'))},ms)};waiters.push(w)})}
          async function direct(c,timeout=90000){const st=Date.now();let back=1;for(;;){const rc=Number(engine.ccall('usi_command','number',['string'],[c]));if(rc===0)return;if(Date.now()-st>timeout)throw Error('direct timeout '+rc+' '+c);await sleep(back);back=Math.min(64,back*2)}}
          async function send(c,timeout=90000){if(kind==='new')return direct(c,timeout);engine.postMessage(c)}
          async function init(){if(ready)return;importScripts(BASE+'yaneuraou.halfkp.noeval.js?proof=2');const F=self.YaneuraOu_HalfKP_noeval||YaneuraOu_HalfKP_noeval;engine=await F({locateFile:p=>BASE+String(p).split('/').pop(),mainScriptUrlOrBlob:BASE+'yaneuraou.halfkp.noeval.js'});engine.addMessageListener(line);const b=new Uint8Array(await(await fetch('./nn.bin',{cache:'no-store'})).arrayBuffer());try{engine.FS.unlink('/nn.bin')}catch{}engine.FS.writeFile('/nn.bin',b);let p=waitLine(x=>x==='usiok',30000,'usiok');await send('usi');await p;for(const c of['setoption name EvalDir value .','setoption name EvalFile value nn.bin','setoption name FV_SCALE value 24','setoption name USI_Hash value 32','setoption name Threads value 1','setoption name MultiPV value 1'])await send(c);p=waitLine(x=>x==='readyok',90000,'readyok');await send('isready');await p;await send('setoption name USI_Ponder value false');await send('usinewgame');ready=true}
          async function search(moves,ms){await init();lastInfo={};await send('position startpos'+(moves?' moves '+moves:''));const p=waitLine(x=>x.startsWith('bestmove '),ms+30000,'bestmove');await send('go movetime '+ms);const s=await p;return{move:(s.split(/\s+/)[1]||''),ms,...lastInfo}}
          self.onmessage=async e=>{const m=e.data||{};try{if(m.type==='search'){self.postMessage({id:m.id,ok:true,kind,...await search(String(m.moves||''),Number(m.ms)||4500)});return}if(m.type==='shutdown'){try{engine&&engine.terminate&&engine.terminate()}catch{}self.postMessage({id:m.id,ok:true});close()}}catch(err){self.postMessage({id:m.id,ok:false,error:String(err&&err.stack||err)})}};
          JS
      - name: Install iPhone-equivalent WebKit
        shell: bash
        run: |
          cd /tmp/mobile-proof/pw
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps webkit >/dev/null
      - name: Compare 12 mixed midgame positions at 4.5 seconds
        shell: bash
        run: |
          cat > /tmp/mobile-proof/pw/strength.mjs <<'NODE'
          import{webkit}from'playwright';
          const UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1';
          const br=await webkit.launch({headless:true}),ctx=await br.newContext({userAgent:UA}),p=await ctx.newPage();await p.goto('http://127.0.0.1:4173/');if(!await p.evaluate(()=>crossOriginIsolated))throw Error('crossOriginIsolated=false');
          async function phase(kind,fn,payload){return p.evaluate(async({kind,code,payload})=>{const run=(0,eval)('('+code+')');function rpc(){const w=new Worker('./driver.js?kind='+kind+'&r='+Math.random());let n=0,P=new Map();w.onmessage=e=>{const m=e.data||{},q=P.get(m.id);if(!q)return;P.delete(m.id);clearTimeout(q.t);m.ok?q.r(m):q.j(Error(m.error||'engine error'))};const call=(moves,ms)=>new Promise((r,j)=>{const id=++n,t=setTimeout(()=>{P.delete(id);j(Error(kind+' timeout'))},180000);P.set(id,{r,j,t});w.postMessage({type:'search',id,moves,ms})});return{call,close:()=>new Promise(r=>{const id=++n,t=setTimeout(()=>{w.terminate();r()},3000);P.set(id,{r:()=>{clearTimeout(t);w.terminate();r()},j:()=>{clearTimeout(t);w.terminate();r()},t});w.postMessage({type:'shutdown',id})})}}const x=rpc();try{return await run(x,payload)}finally{await x.close()}},{kind,code:fn.toString(),payload})}
          const plies=[24,28,32,36,40,44];
          const gen=async(kind)=>phase(kind,async(x,ps)=>{const moves=[],snaps=[];for(let ply=1;ply<=44;ply++){const r=await x.call(moves.join(' '),300);if(!r.move||['resign','win','none'].includes(r.move))break;moves.push(r.move);if(ps.includes(ply))snaps.push({ply,moves:moves.join(' ')})}return snaps},plies);
          const fromNew=(await gen('new')).map(x=>({...x,origin:'new-line'})),fromOld=(await gen('old')).map(x=>({...x,origin:'old-line'}));const positions=[...fromNew,...fromOld];if(positions.length<10)throw Error('not enough positions '+positions.length);
          const refs=await phase('new',async(x,data)=>{const out=[];for(const s of data)out.push(await x.call(s.moves,12000));return out},positions);
          const old=await phase('old',async(x,data)=>{const out=[];for(const s of data)out.push(await x.call(s.moves,4500));return out},positions);
          const neu=await phase('new',async(x,data)=>{const out=[];for(const s of data)out.push(await x.call(s.moves,4500));return out},positions);
          const rows=positions.map((s,i)=>{const ref=refs[i],o=old[i],n=neu[i],og=Number.isFinite(ref.cp)&&Number.isFinite(o.cp)?Math.abs(o.cp-ref.cp):null,ng=Number.isFinite(ref.cp)&&Number.isFinite(n.cp)?Math.abs(n.cp-ref.cp):null;return{origin:s.origin,ply:s.ply,ref,o,n,oldMatch:o.move===ref.move,newMatch:n.move===ref.move,oldCpGap:og,newCpGap:ng}});
          const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null,ogs=rows.map(x=>x.oldCpGap).filter(Number.isFinite),ngs=rows.map(x=>x.newCpGap).filter(Number.isFinite);const summary={positions:rows.length,oldMatch:rows.filter(x=>x.oldMatch).length,newMatch:rows.filter(x=>x.newMatch).length,oldCpMeanGap:avg(ogs),newCpMeanGap:avg(ngs),rows};
          console.log('MOBILE_STRENGTH_SUMMARY '+JSON.stringify(summary));for(const r of rows)console.log('MOBILE_STRENGTH_ROW '+JSON.stringify(r));await br.close();if(summary.newMatch<summary.oldMatch)process.exit(2);
          NODE
          node /tmp/mobile-proof/site/server.cjs >/tmp/mobile-proof/server.log 2>&1 & PID=$!
          trap 'kill $PID 2>/dev/null||true' EXIT
          for i in $(seq 1 50);do curl -fsS http://127.0.0.1:4173/ >/dev/null&&break||sleep .2;done
          cd /tmp/mobile-proof/pw
          node strength.mjs 2>&1 | tee /tmp/mobile-proof/strength.log
          grep -F 'MOBILE_STRENGTH_SUMMARY ' /tmp/mobile-proof/strength.log
      - name: Report mobile strength proof on PR 8
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "### V9.70 iPhone 4.5s mixed-midgame proof: ${JOB_STATUS}"
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```text'
            if [ -f /tmp/mobile-proof/strength.log ]; then grep -E '^MOBILE_STRENGTH_(SUMMARY|ROW) ' /tmp/mobile-proof/strength.log | tail -20 || true; else echo 'strength.log missing'; fi
            echo '```'
          } > /tmp/mobile-proof-report.md
          gh pr comment 8 --body-file /tmp/mobile-proof-report.md
          test "$JOB_STATUS" = success
