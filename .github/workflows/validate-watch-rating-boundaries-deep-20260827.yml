name: Validate watch rating boundaries deeply
on:
  pull_request:
    paths:
      - '.github/scripts/calibrate-watch-rating-boundaries-deep-20260827.mjs'
      - '.github/workflows/validate-watch-rating-boundaries-deep-20260827.yml'
permissions:
  contents: read
jobs:
  watch-rating-boundaries-deep:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
      - name: Syntax check deep calibration
        run: node --check .github/scripts/calibrate-watch-rating-boundaries-deep-20260827.mjs
      - name: Build calibration page
        run: node .github/scripts/build-lower8-quality-page-20260825.mjs
      - name: Start COI server
        run: |
          node .github/scripts/coi-lower8-quality-server-20260825.mjs >/tmp/watch-deep-server.log 2>&1 &
          sleep 1
      - name: Run focused deep calibration
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/calibrate-watch-rating-boundaries-deep-20260827.mjs 2>&1 | tee /tmp/watch-deep.log
          grep -F 'PASS_WATCH_RATING_BOUNDARIES_DEEP_DIAGNOSTIC' /tmp/watch-deep.log
          grep -F 'WATCH_DEEP_FINAL' /tmp/watch-deep.log
