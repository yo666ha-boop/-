name: Shogi top-five position stress verify
on:
  pull_request:
    paths:
      - 'shogi-v21528/**'
      - 'shogi-side-test/**'
      - '.github/scripts/shogi-top5-position-stress-verify.js'
      - '.github/workflows/shogi-top5-position-stress-verify.yml'
  workflow_dispatch:
jobs:
  position-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        case: [7g-middle, 2g-middle, 5g-middle, 7g-late, 2g-late]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check position stress verification
        run: node --check .github/scripts/shogi-top5-position-stress-verify.js
      - name: Install Playwright Firefox
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install firefox
      - name: Start static server
        run: |
          python3 -m http.server 8000 > /tmp/shogi-position-stress-server.log 2>&1 &
          echo $! > /tmp/shogi-position-stress-server.pid
          sleep 2
      - name: Run broader position stress verification
        env:
          STRESS_CASE: ${{ matrix.case }}
        run: node .github/scripts/shogi-top5-position-stress-verify.js
      - name: Upload position stress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shogi-top5-position-stress-${{ matrix.case }}
          path: .github/benchmark-results/shogi-top5-position-stress-${{ matrix.case }}.json
          if-no-files-found: ignore
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/shogi-position-stress-server.log || true
