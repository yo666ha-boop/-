name: Diagnose live GitHub Pages Fire 20260927

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-fire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Diagnose live GitHub Pages as Fire Silk
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const url='https://yo666ha-boop.github.io/-/shogi-v21528/';
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({
              viewport:{width:1280,height:800},
              userAgent:'Mozilla/5.0 (Linux; U; en-US) AppleWebKit/537.36 Silk/126.5 like Chrome Safari/537.36'
            });
            const page=await context.newPage();
            const pageErrors=[],failed=[],bad=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText||''}));
            page.on('response',r=>{if(r.status()>=400)bad.push({url:r.url(),status:r.status()})});
            const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(8000);
            const before=await page.evaluate(()=>({
              title:document.title,
              boot:document.getElementById('boot')?.innerText||'',
              bootDisplay:getComputedStyle(document.getElementById('boot')||document.body).display,
              diag:document.getElementById('diag28')?.innerText||'',
              diagDisplay:document.getElementById('diag28')?getComputedStyle(document.getElementById('diag28')).display:'',
              boardSquares:document.querySelectorAll('#board > *').length,
              chars:document.querySelectorAll('#chars .ch').length,
              tournament:!!window.AI_SHOGI_TOURNAMENT,
              fire:!!window.AI_SHOGI_TOURNAMENT_UI?.audit?.().fire,
              bodyText:document.body.innerText.slice(0,1000)
            }));
            console.log('BEFORE',JSON.stringify(before));
            console.log('PAGE_ERRORS',JSON.stringify(pageErrors));
            console.log('FAILED',JSON.stringify(failed));
            console.log('BAD',JSON.stringify(bad));
            if(!res||res.status()!==200) throw new Error('entry status '+(res&&res.status()));
            const seriousFailed=failed.filter(x=>!(/hana21512\/naoe\.webp/.test(x.url)&&/ERR_ABORTED/.test(x.error)));
            if(pageErrors.length||seriousFailed.length||bad.length) throw new Error('network/page errors');
            if(!before.tournament||before.chars!==26) throw new Error('app did not fully boot');
            const moveAudit=await page.evaluate(async()=>{const legal=window.AIShogiIOS?.legal?.()||[];const u=legal[0]||'';if(!/^[1-9][a-i][1-9][a-i]\+?$/.test(u))return{ok:false,u};const file=s=>Number(s[0]),rank=s=>s.charCodeAt(1)-97,idx=s=>rank(s)*9+(9-file(s));const cells=[...document.querySelectorAll('#board > *')];cells[idx(u.slice(0,2))]?.click();await new Promise(r=>setTimeout(r,80));cells[idx(u.slice(2,4))]?.click();await new Promise(r=>setTimeout(r,1400));return{ok:true,u,diag:document.getElementById('diag28')?.innerText||'',status:document.getElementById('status')?.innerText||''}});console.log('MOVE_AUDIT',JSON.stringify(moveAudit));if(!moveAudit.ok)throw new Error('could not make live move '+JSON.stringify(moveAudit));if(pageErrors.length)throw new Error('page error after move '+JSON.stringify(pageErrors));
            const btn=page.locator('#tournament21540Btn');
            if(await btn.count()){
              await btn.click();
              await page.waitForTimeout(500);
              const start=page.locator('[data-tour-start]').first();
              if(await start.count()){
                await start.click();
                await page.waitForTimeout(1200);
                const after=await page.evaluate(()=>({
                  boot:document.getElementById('boot')?.innerText||'',
                  diag:document.getElementById('diag28')?.innerText||'',
                  panelOpen:document.getElementById('tournament21540Panel')?.classList.contains('on')||false,
                  parked:document.getElementById('tourBody21540')?.dataset.fireParked21595||'',
                  pageText:document.body.innerText.slice(0,1200)
                }));
                console.log('AFTER_TOURNAMENT',JSON.stringify(after));
              }
            }
            if(pageErrors.length||seriousFailed.length||bad.length) throw new Error('errors after tournament');
            console.log('PASS_LIVE_GITHUB_PAGES_FIRE');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
