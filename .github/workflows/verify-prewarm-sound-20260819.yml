name: Verify Future prewarm and piece sound
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and exact-change checks
        run: |
          node --check shogi-side-test/future21520.js
          node --check shogi-v21528/future-yaneura-worker21528.js
          grep -F "master.gain.setValueAtTime(.34*" shogi-side-test/future21520.js
          grep -F "version:'21529b'" shogi-side-test/future21520.js
          grep -F "ci===FUTURE_INDEX&&!engineReady" shogi-side-test/future21520.js
          grep -F "{cache:'force-cache'}" shogi-v21528/future-yaneura-worker21528.js
  webkit:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright WebKit
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Start COOP COEP static server
        run: |
          cat >/tmp/coi-server.mjs <<'NODE'
          import http from 'http';import fs from 'fs';import path from 'path';
          const root=process.cwd(),mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.mjs':'text/javascript; charset=utf-8','.css':'text/css','.wasm':'application/wasm','.bin':'application/octet-stream','.jpg':'image/jpeg','.jpeg':'image/jpeg','.png':'image/png','.webp':'image/webp'};
          http.createServer((q,s)=>{let n=decodeURIComponent(new URL(q.url,'http://x').pathname);if(n.endsWith('/'))n+='index.html';const f=path.resolve(root,'.'+n);if(!f.startsWith(root)||!fs.existsSync(f)||fs.statSync(f).isDirectory()){s.writeHead(404);return s.end('404')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',mime[path.extname(f).toLowerCase()]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4188,'127.0.0.1');
          NODE
          node /tmp/coi-server.mjs >/tmp/coi-server.log 2>&1 &
          sleep 1
      - name: Verify iPhone-equivalent WebKit
        run: node .github/scripts/verify-prewarm-sound-20260819.mjs 2>&1 | tee /tmp/prewarm-sound.log
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### Future prewarm + piece sound WebKit'; echo '```text'; grep -E '^(STATIC|BEFORE|PREWARM|SOUND|READY_SEARCH|PASS)' /tmp/prewarm-sound.log 2>/dev/null || true; echo '```'; } >/tmp/prewarm-report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/prewarm-report.md
