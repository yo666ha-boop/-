name: Validate Shogi save public 20260826
on:
  push:
    branches:
      - validate-save-resume-20260826
    paths:
      - '.github/workflows/validate-shogi-save-public-20260826.yml'
  workflow_dispatch:
jobs:
  public-save-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright browsers
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Wait for public main save fix
        run: |
          set -euo pipefail
          for url in \
            'https://yo666ha-boop.github.io/-/shogi-v21528/save21530.js' \
            'https://ai-shogi-yaneuraou-iphone.vercel.app/shogi-v21528/save21530.js'
          do
            ok=0
            for i in $(seq 1 40); do
              if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${url}?publicsaveaudit=${GITHUB_RUN_ID}-${i}" | grep -Fq "const allowEmpty=reason==='manual'||reason==='undo';"; then
                echo "PUBLIC_FIX_VISIBLE ${url}"
                ok=1
                break
              fi
              sleep 5
            done
            test "$ok" = 1
          done
      - name: Audit GitHub Pages
        env:
          SHOGI_URL: https://yo666ha-boop.github.io/-/shogi-v21528/
        run: node .github/scripts/shogi-save-resume-audit-20260826.mjs
      - name: Audit Vercel fallback
        env:
          SHOGI_URL: https://ai-shogi-yaneuraou-iphone.vercel.app/shogi-v21528/
        run: node .github/scripts/shogi-save-resume-audit-20260826.mjs
# Retry uses asset-integrity proof before filtering WebKit fallback access-control warnings.
