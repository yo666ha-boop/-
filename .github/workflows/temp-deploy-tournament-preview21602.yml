name: Temporary deploy isolated tournament preview 21602

on:
  push:
    branches:
      - feature/tournament-cups-20260902
    paths:
      - '.github/workflows/temp-deploy-tournament-preview21602.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Require existing Vercel token
        run: test -n "$VERCEL_TOKEN"

      - name: Link isolated preview project
        run: |
          mkdir -p preview/fullapp-unified21602-vercel/.vercel
          cat > preview/fullapp-unified21602-vercel/.vercel/project.json <<'JSON'
          {"orgId":"team_LXgcBDLoBpU1lMxZrMyxUQlg","projectId":"prj_SqCWAei0nS1b3iHeGWhw6E85meif"}
          JSON

      - name: Deploy isolated preview to production alias
        run: |
          npx --yes vercel@latest deploy             --prod             --yes             --cwd preview/fullapp-unified21602-vercel             --token "$VERCEL_TOKEN"
