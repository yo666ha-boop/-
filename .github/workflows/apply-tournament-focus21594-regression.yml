name: apply tournament focus 21594 regression alignment
on:
  push:
    paths:
      - '.github/workflows/apply-tournament-focus21594-regression.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tournament-cups-20260902
          fetch-depth: 0
      - name: Align 21592 regression with 21594 focus UI
        run: node .github/scripts/apply-tournament-focus21594-regression.mjs
      - name: Syntax gate
        run: |
          node --check .github/scripts/verify-tournament21540.mjs
          grep -q "active cup focus must hide the 10-cup grid" .github/scripts/verify-tournament21540.mjs
          grep -q "selection view must show all 10 cup boss labels" .github/scripts/verify-tournament21540.mjs
      - name: Commit regression alignment
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/scripts/verify-tournament21540.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test: align tournament regression with 21594 focus UI"
          git push origin HEAD:feature/tournament-cups-20260902
