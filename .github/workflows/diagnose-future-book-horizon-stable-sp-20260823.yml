name: Diagnose Future dynamic horizon plus stable SinglePV vs Piyo40
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-future-book-horizon-stable-sp-20260823.yml'
permissions:
  contents: read
concurrency:
  group: future-dynamic-horizon-stable-sp-pr80
  cancel-in-progress: true
jobs:
  practical:
    strategy:
      fail-fast: false
      matrix:
        horizon: [21, 25, 33]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium and WebKit
        run: |
          set -euo pipefail
          mkdir -p /tmp/fhorizon && cd /tmp/fhorizon
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
      - name: Start local COI server
        run: |
          cat >/tmp/fhorizon/server.mjs <<'NODE'
          import http from'node:http';import fs from'node:fs';import path from'node:path';
          const root=process.env.GITHUB_WORKSPACE,m={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.wasm':'application/wasm','.bin':'application/octet-stream','.png':'image/png','.jpg':'image/jpeg','.json':'application/json'};
          http.createServer((q,s)=>{let u=decodeURIComponent((q.url||'/').split('?')[0]);if(u==='/')u='/shogi-v21528/index.html';const f=path.resolve(root,'.'+u);if(!f.startsWith(path.resolve(root))){s.writeHead(403);return s.end('forbidden')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');fs.readFile(f,(e,b)=>{if(e){s.writeHead(404);return s.end('not found')}s.setHeader('Content-Type',m[path.extname(f)]||'application/octet-stream');s.writeHead(200);s.end(b)})}).listen(4173,'127.0.0.1');
          NODE
          node /tmp/fhorizon/server.mjs >/tmp/fhorizon/server.log 2>&1 &
          for i in $(seq 1 30);do curl -fsS http://127.0.0.1:4173/shogi-v21528/index.html >/dev/null&&exit 0;sleep 1;done;cat /tmp/fhorizon/server.log;exit 1
      - name: Derive path-independent horizon practical harness
        env:
          HORIZON: ${{ matrix.horizon }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/verify-future-current-vs-piyo40-20260820.yml').read_text()
          a="          cat >/tmp/fpiyo/match.mjs <<'NODE'\n"
          i=src.index(a)+len(a); j=src.index("\n          NODE\n",i)
          js='\n'.join(line[10:] if line.startswith('          ') else line for line in src[i:j].splitlines())+'\n'
          js=js.replace("const MAX=70,R=", "const MAX=70,horizon=Number(process.env.HORIZON||21),R=",1)
          old="const search=(pos,o={})=>f.evaluate(({pos,o})=>window.__call('bestmove',{sfen:pos,...o}),{pos,o});"
          new="await f.evaluate(()=>{try{window.__w?.terminate()}catch(e){};window.__w=null;window.__call=null});const search=(pos,o={})=>f.evaluate(async({pos,o})=>{const w=new Worker('./future-yaneura-worker21528.js?v=dynamic-horizon-'+Date.now()+'-'+Math.random());let n=0,P=new Map();w.onmessage=e=>{const m=e.data||{},q=P.get(m.id);if(!q||m.type!=='result')return;P.delete(m.id);clearTimeout(q.t);m.ok?q.r(m):q.j(Error(m.error||'worker'))};const call=(type,x={})=>new Promise((r,j)=>{const id=++n,t=setTimeout(()=>j(Error(type+' timeout')),190000);P.set(id,{r,j,t});w.postMessage({type,id,...x})});try{await call('init');return await call('bestmove',{sfen:pos,...o,adaptive:false})}finally{try{w.terminate()}catch(e){}}},{pos,o});"
          if old not in js: raise SystemExit('search marker missing')
          js=js.replace(old,new,1)
          marker="let ms=[],result='MAX_REACHED';const dec=[];"
          policy="""async function policy(pos,ply){
            if(ply<=horizon){
              const r=await search(pos,{ms:30000,multiPV:1,adaptive:false});
              console.log('FUTURE_HORIZON_POLICY '+JSON.stringify({horizon,ply,source:'sp30-horizon',token:r.token,cp:r.info?.cp,mate:r.info?.mate,depth:r.info?.depth,nodes:r.info?.nodes}));
              return r;
            }
            const a=await search(pos,{ms:7000,multiPV:1,adaptive:false}),bad=(Number.isFinite(a.info?.mate)&&a.info.mate<0)||(Number.isFinite(a.info?.cp)&&a.info.cp<=50);
            if(!bad){console.log('FUTURE_HORIZON_POLICY '+JSON.stringify({horizon,ply,source:'sp7-healthy',token:a.token,cp:a.info?.cp,mate:a.info?.mate}));return a}
            const b=await search(pos,{ms:15000,multiPV:1,adaptive:false});
            if(a.token===b.token){console.log('FUTURE_HORIZON_POLICY '+JSON.stringify({horizon,ply,source:'sp15-stable7',token:b.token,cp7:a.info?.cp,cp15:b.info?.cp,mate15:b.info?.mate}));return b}
            const c=await search(pos,{ms:30000,multiPV:1,adaptive:false});
            console.log('FUTURE_HORIZON_POLICY '+JSON.stringify({horizon,ply,source:b.token===c.token?'sp30-stable15':'sp30-unstable',token:c.token,sp7:a.token,sp15:b.token,sp30:c.token,cp30:c.info?.cp,mate30:c.info?.mate}));
            return c
          };"""
          if marker not in js: raise SystemExit('loop marker missing')
          js=js.replace(marker,policy+marker,1)
          old2="const ply=ms.length+1,pos=sfen(ms),r=await search(pos,{ms:4000,multiPV:1}),u=String(r.token||'');"
          new2="const ply=ms.length+1,pos=sfen(ms),r=await policy(pos,ply),u=String(r.token||'');"
          if old2 not in js: raise SystemExit('move marker missing')
          js=js.replace(old2,new2,1)
          js=js.replace("console.log('FUTURE_CURRENT_MOVE '+JSON.stringify({attempt,ply,u,", "console.log('FUTURE_HORIZON_MOVE '+JSON.stringify({horizon,attempt,ply,pos,u,",1)
          js=js.replace('FUTURE_CURRENT_PROFILE','FUTURE_HORIZON_PROFILE').replace('FUTURE_CURRENT_AUDIT','FUTURE_HORIZON_AUDIT').replace('FUTURE_CURRENT_PRACTICAL_SUMMARY','FUTURE_HORIZON_PRACTICAL_SUMMARY').replace('PASS_FUTURE_CURRENT_PIYO40_HARNESS','PASS_FUTURE_HORIZON_PIYO40_HARNESS')
          js=js.replace("summary={attempt,piyo:lv", "summary={horizon,attempt,piyo:lv",1)
          Path('/tmp/fhorizon/match.mjs').write_text(js)
          PY
          node --check /tmp/fhorizon/match.mjs
          grep -F 'FUTURE_HORIZON_POLICY' /tmp/fhorizon/match.mjs | head -1
      - name: Run dynamic horizon practical match
        env:
          ATTEMPT: 1
          HORIZON: ${{ matrix.horizon }}
        run: |
          cd /tmp/fhorizon
          node match.mjs 2>&1 | tee /tmp/fhorizon/h${HORIZON}.log
          grep -F 'FUTURE_HORIZON_PRACTICAL_SUMMARY ' /tmp/fhorizon/h${HORIZON}.log
          grep -F 'PASS_FUTURE_HORIZON_PIYO40_HARNESS' /tmp/fhorizon/h${HORIZON}.log
      - name: Preserve evidence
        if: always()
        run: |
          grep -E '^(PIYO40_PROFILE|FUTURE_HORIZON_PROFILE|FUTURE_HORIZON_POLICY|FUTURE_HORIZON_MOVE|PIYO40_COMMIT|PIYO40_HEARTBEAT|PIYO40_REPLY|FUTURE_HORIZON_AUDIT|FUTURE_HORIZON_PRACTICAL_SUMMARY|PASS_FUTURE_HORIZON_PIYO40_HARNESS)' /tmp/fhorizon/h${{ matrix.horizon }}.log | tail -360 || true
