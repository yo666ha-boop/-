name: Diagnose Future real 4s vs Piyo Lv40 practical
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-future-real4s-piyo40-20260822.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  practical:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium and WebKit
        run: |
          set -euo pipefail
          mkdir -p /tmp/fpiyo && cd /tmp/fpiyo
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
      - name: Start local COI server
        run: |
          cat >/tmp/fpiyo/server.mjs <<'NODE'
          import http from'node:http';import fs from'node:fs';import path from'node:path';const root=process.env.GITHUB_WORKSPACE,m={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.wasm':'application/wasm','.bin':'application/octet-stream','.png':'image/png','.jpg':'image/jpeg','.json':'application/json'};http.createServer((q,s)=>{let u=decodeURIComponent((q.url||'/').split('?')[0]);if(u==='/')u='/shogi-v21528/index.html';const f=path.resolve(root,'.'+u);if(!f.startsWith(path.resolve(root))){s.writeHead(403);return s.end('forbidden')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');fs.readFile(f,(e,b)=>{if(e){s.writeHead(404);return s.end('not found')}s.setHeader('Content-Type',m[path.extname(f)]||'application/octet-stream');s.writeHead(200);s.end(b)})}).listen(4173,'127.0.0.1');
          NODE
          node /tmp/fpiyo/server.mjs >/tmp/fpiyo/server.log 2>&1 &
          for i in $(seq 1 30);do curl -fsS http://127.0.0.1:4173/shogi-v21528/index.html >/dev/null&&exit 0;sleep 1;done;cat /tmp/fpiyo/server.log;exit 1
      - name: Derive exact practical harness with real 4s policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/verify-future-current-vs-piyo40-20260820.yml').read_text()
          a="          cat >/tmp/fpiyo/match.mjs <<'NODE'\n"
          i=src.index(a)+len(a); j=src.index("\n          NODE\n",i)
          js='\n'.join(line[10:] if line.startswith('          ') else line for line in src[i:j].splitlines())+'\n'
          old="const ply=ms.length+1,pos=sfen(ms),r=await search(pos,{ms:4000,multiPV:1}),u=String(r.token||'');"
          new="const ply=ms.length+1,pos=sfen(ms),r=await search(pos,{ms:4000,multiPV:5,adaptive:false}),u=String(r.token||'');"
          if old not in js: raise SystemExit('current practical search marker missing')
          js=js.replace(old,new,1)
          js=js.replace('FUTURE_CURRENT_PROFILE','FUTURE_REAL4S_PROFILE').replace('FUTURE_CURRENT_MOVE','FUTURE_REAL4S_MOVE').replace('FUTURE_CURRENT_AUDIT','FUTURE_REAL4S_AUDIT').replace('FUTURE_CURRENT_PRACTICAL_SUMMARY','FUTURE_REAL4S_PRACTICAL_SUMMARY').replace('PASS_FUTURE_CURRENT_PIYO40_HARNESS','PASS_FUTURE_REAL4S_PIYO40_HARNESS')
          Path('/tmp/fpiyo/match-real4s.mjs').write_text(js)
          PY
          grep -F "multiPV:5,adaptive:false" /tmp/fpiyo/match-real4s.mjs
      - name: Run real 4s practical match
        env:
          ATTEMPT: ${{ matrix.attempt }}
        run: |
          cd /tmp/fpiyo
          node match-real4s.mjs 2>&1 | tee /tmp/fpiyo/real4s-${ATTEMPT}.log
          grep -F 'FUTURE_REAL4S_PRACTICAL_SUMMARY ' /tmp/fpiyo/real4s-${ATTEMPT}.log
          grep -F 'PASS_FUTURE_REAL4S_PIYO40_HARNESS' /tmp/fpiyo/real4s-${ATTEMPT}.log
      - name: Preserve evidence
        if: always()
        run: |
          grep -E '^(PIYO40_PROFILE|FUTURE_REAL4S_PROFILE|FUTURE_REAL4S_MOVE|PIYO40_COMMIT|PIYO40_HEARTBEAT|PIYO40_REPLY|FUTURE_REAL4S_AUDIT|FUTURE_REAL4S_PRACTICAL_SUMMARY|PASS_FUTURE_REAL4S_PIYO40_HARNESS)' /tmp/fpiyo/real4s-${{ matrix.attempt }}.log | tail -240 || true
