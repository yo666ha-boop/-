name: Verify tournament mobile preview 21581

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-preview-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Playwright package
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
      - name: Start static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tournament21581-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/preview/tournament-16/index21581-mobile.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tournament21581-server.log
          exit 1
      - name: Verify iPhone Safari-like rendering
        env:
          HOME: /root
        run: |
          node <<'NODE'
          const { webkit } = require('playwright');
          (async()=>{
            const browser = await webkit.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:8765/preview/tournament-16/index21581-mobile.html',{waitUntil:'networkidle'});
            const initial=await page.evaluate(()=>({
              title:document.title,
              text:document.body.innerText.trim(),
              cups:document.querySelectorAll('.cup').length,
              overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),
              hasDocumentWrite:[...document.scripts].some(s=>s.textContent.includes('document.write')),
              boot:document.querySelector('#boot')?.textContent||''
            }));
            if(!initial.text.includes('みつき将棋・大会モード')) throw new Error('blank or missing tournament title');
            if(initial.cups!==8) throw new Error('cup count '+initial.cups);
            if(initial.overflow!==0) throw new Error('mobile page overflow '+initial.overflow);
            if(initial.hasDocumentWrite) throw new Error('document.write remains');
            if(!initial.boot.includes('画面描画OK')) throw new Error('boot marker missing: '+initial.boot);
            await page.locator('[data-cup="shinji"]').click();
            await page.waitForTimeout(100);
            const started=await page.evaluate(()=>({
              stage:document.querySelector('#stage')?.classList.contains('on'),
              road:document.querySelectorAll('#road span').length,
              rounds:document.querySelectorAll('#bracket > div').length,
              firstRound:document.querySelectorAll('#bracket > div:first-child .slot').length,
              text:document.body.innerText,
              live:document.querySelector('.dialogue')?.getAttribute('aria-live'),
              atomic:document.querySelector('.dialogue')?.getAttribute('aria-atomic'),
              overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth)
            }));
            if(!started.stage) throw new Error('stage did not open');
            if(started.road!==5) throw new Error('road count '+started.road);
            if(started.rounds!==5) throw new Error('round columns '+started.rounds);
            if(started.firstRound!==16) throw new Error('first round slots '+started.firstRound);
            if(!started.text.includes('優勝後ボス')) throw new Error('post-champion boss wording missing');
            if(started.live!=='polite'||started.atomic!=='true') throw new Error('dialogue aria live contract');
            if(started.overflow!==0) throw new Error('started mobile page overflow '+started.overflow);
            if(pageErrors.length) throw new Error('pageErrors '+JSON.stringify(pageErrors));
            console.log('PASS_TOURNAMENT21581_IPHONE_WEBKIT', JSON.stringify({cups:initial.cups,road:started.road,rounds:started.rounds,firstRound:started.firstRound,overflow:started.overflow,pageErrors}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
