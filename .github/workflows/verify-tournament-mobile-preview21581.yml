name: Verify tournament mobile preview 21584

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-preview-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Playwright package
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
      - name: Start static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tournament21584-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/preview/tournament-16/index21584-mobile.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tournament21584-server.log
          exit 1
      - name: Verify iPhone Safari-like rendering
        env:
          HOME: /root
        run: |
          node <<'NODE'
          const { webkit } = require('playwright');
          function fail(msg,obj){ throw new Error(msg+' '+JSON.stringify(obj)); }
          async function startedAudit(page){
            return page.evaluate(()=>{
              const slots=[...document.querySelectorAll('#bracket > div:first-child .slot')];
              const ai=slots.map(s=>({name:s.querySelector('.name')?.textContent?.trim()||'',meta:s.querySelector('.meta')?.textContent?.trim()||''}))
                .filter(x=>x.name&&x.name!=='あなた'&&x.name!=='—');
              const ratings=ai.map(x=>Number((x.meta.match(/R(\d+)/)||[])[1]||0));
              return {
                stage:document.querySelector('#stage')?.classList.contains('on'),
                road:document.querySelectorAll('#road span').length,
                rounds:document.querySelectorAll('#bracket > div').length,
                firstRound:slots.length,
                aiCount:ai.length,
                maxAiRating:ratings.length?Math.max(...ratings):0,
                minAiRating:ratings.length?Math.min(...ratings):0,
                bossInBracket:ai.some(x=>x.name==='ケンシロウ'),
                text:document.body.innerText,
                live:document.querySelector('.dialogue')?.getAttribute('aria-live'),
                atomic:document.querySelector('.dialogue')?.getAttribute('aria-atomic'),
                overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth)
              };
            });
          }
          (async()=>{
            const browser=await webkit.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true});
            const pageErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));
            const response=await page.goto('http://127.0.0.1:8765/preview/tournament-16/index21584-mobile.html',{waitUntil:'networkidle',timeout:45000});
            const initial=await page.evaluate(()=>({title:document.title,text:document.body.innerText.trim(),cups:document.querySelectorAll('.cup').length,overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),hasDocumentWrite:[...document.scripts].some(s=>s.textContent.includes('document.write')),boot:document.querySelector('#boot')?.textContent||''}));
            if(!response||response.status()!==200) fail('LOCAL http',{status:response&&response.status()});
            if(!initial.text.includes('みつき将棋・大会モード')||initial.cups!==10||!initial.boot.includes('画面描画OK')||initial.overflow!==0||initial.hasDocumentWrite) fail('LOCAL initial',initial);
            await page.locator('[data-cup="kenshiro"]').click();await page.waitForTimeout(100);
            const started=await startedAudit(page);
            if(!started.stage||started.road!==5||started.rounds!==5||started.firstRound!==16||started.aiCount!==15) fail('LOCAL structure',started);
            if(started.maxAiRating<=0||started.maxAiRating>=2100||started.bossInBracket) fail('LOCAL boss-under',started);
            if(!started.text.includes('優勝後ボス')||started.live!=='polite'||started.atomic!=='true'||started.overflow!==0||pageErrors.length) fail('LOCAL UX',{started,pageErrors});
            console.log('PASS_TOURNAMENT21584_10CUP_IPHONE_WEBKIT',JSON.stringify({status:response.status(),cups:initial.cups,...started,pageErrors}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify public raw.githack URL in WebKit
        env:
          HOME: /root
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node <<'NODE'
          const { webkit } = require('playwright');
          function fail(msg,obj){ throw new Error(msg+' '+JSON.stringify(obj)); }
          async function startedAudit(page){
            return page.evaluate(()=>{
              const slots=[...document.querySelectorAll('#bracket > div:first-child .slot')];
              const ai=slots.map(s=>({name:s.querySelector('.name')?.textContent?.trim()||'',meta:s.querySelector('.meta')?.textContent?.trim()||''}))
                .filter(x=>x.name&&x.name!=='あなた'&&x.name!=='—');
              const ratings=ai.map(x=>Number((x.meta.match(/R(\d+)/)||[])[1]||0));
              return {stage:document.querySelector('#stage')?.classList.contains('on'),road:document.querySelectorAll('#road span').length,rounds:document.querySelectorAll('#bracket > div').length,firstRound:slots.length,aiCount:ai.length,maxAiRating:ratings.length?Math.max(...ratings):0,bossInBracket:ai.some(x=>x.name==='ケンシロウ'),overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth)};
            });
          }
          (async()=>{
            const url=`https://rawcdn.githack.com/yo666ha-boop/-/${process.env.HEAD_SHA}/preview/tournament-16/index21584-mobile.html`;
            const browser=await webkit.launch({headless:true});
            const first=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true});
            const entry=await first.newPage();const entryResponse=await entry.goto(url,{waitUntil:'domcontentloaded',timeout:45000});const entryAudit=await entry.evaluate(()=>({title:document.title,text:document.body.innerText.trim().slice(0,500)}));
            if(!entryResponse||entryResponse.status()!==200||!entryAudit.text) fail('PUBLIC entry',entryAudit);
            console.log('TRACE_TOURNAMENT21584_PUBLIC_ENTRY',JSON.stringify({url,status:entryResponse.status(),...entryAudit}));await first.close();
            const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true});
            await context.addCookies([{name:'__Http-phish',value:'1',domain:'rawcdn.githack.com',path:'/',secure:true,sameSite:'Lax'}]);
            const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            const response=await page.goto(url,{waitUntil:'networkidle',timeout:45000});const audit=await page.evaluate(()=>({title:document.title,text:document.body.innerText.trim(),cups:document.querySelectorAll('.cup').length,boot:document.querySelector('#boot')?.textContent||'',overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),contentType:document.contentType}));
            if(!response||response.status()!==200||audit.contentType!=='text/html'||audit.cups!==10||!audit.boot.includes('画面描画OK')||audit.overflow!==0||errors.length) fail('PUBLIC app',{audit,errors});
            await page.locator('[data-cup="kenshiro"]').click();await page.waitForTimeout(100);const started=await startedAudit(page);
            if(!started.stage||started.road!==5||started.rounds!==5||started.firstRound!==16||started.aiCount!==15||started.maxAiRating<=0||started.maxAiRating>=2100||started.bossInBracket||started.overflow!==0) fail('PUBLIC interaction',started);
            console.log('PASS_TOURNAMENT21584_10CUP_PUBLIC_RAWGITHACK_WEBKIT',JSON.stringify({url,status:response.status(),cups:audit.cups,...started,pageErrors:errors}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
