name: Verify browser board themes

on:
  push:
    branches:
      - feature/shogi-board-themes-20260828
    paths:
      - 'shogi-v21528/board-theme21537.js'
      - 'shogi-v21528/coi-serviceworker.js'
      - 'coi-serviceworker.js'
      - '.github/scripts/verify-board-theme-20260828.mjs'
      - '.github/workflows/verify-board-theme-20260828.yml'
  pull_request:
    paths:
      - 'shogi-v21528/board-theme21537.js'
      - 'shogi-v21528/coi-serviceworker.js'
      - 'coi-serviceworker.js'
      - '.github/scripts/verify-board-theme-20260828.mjs'
      - '.github/workflows/verify-board-theme-20260828.yml'
  workflow_dispatch:

jobs:
  verify-board-theme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check shogi-v21528/board-theme21537.js
          node --check shogi-v21528/coi-serviceworker.js
          node --check coi-serviceworker.js
      - name: Theme switching and persistence contract
        run: node .github/scripts/verify-board-theme-20260828.mjs
