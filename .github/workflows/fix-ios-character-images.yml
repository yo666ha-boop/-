name: Fix iOS character images

on:
  push:
    paths:
      - '.github/workflows/fix-ios-character-images.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild Micchan SVG from known-good portrait
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          data = Path('shogi/micchan213.txt').read_text(encoding='utf-8').strip()
          assert data.startswith('data:image/webp;base64,'), 'micchan213.txt is not a WebP data URI'
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 192 192">
            <image width="192" height="192" preserveAspectRatio="xMidYMid slice" href="{data}"/>
          </svg>\n'''
          Path('shogi/micchan2154.svg').write_text(svg, encoding='utf-8')
          PY

      - name: Fix v2.15.28 image cache and iPhone load audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('shogi-v21528/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('21528c', '21528d')
          old = """  await sleep(800);fixImages();
  const brokenCards=[...document.querySelectorAll('#chars .ch')].filter(c=>{const i=c.querySelector('img');return i&&(!i.complete||i.naturalWidth===0)});"""
          new = """  await sleep(1800);fixImages();
  const imageList=[...document.querySelectorAll('#chars .ch img')];
  await Promise.all(imageList.map(i=>i.complete?Promise.resolve():new Promise(r=>{const done=()=>r();i.addEventListener('load',done,{once:true});i.addEventListener('error',done,{once:true});setTimeout(r,2200)})));
  fixImages();await sleep(250);
  const brokenCards=[...document.querySelectorAll('#chars .ch')].filter(c=>{const i=c.querySelector('img');return i&&(!i.complete||i.naturalWidth===0)});"""
          if old not in s:
              raise SystemExit('image audit block not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repaired assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shogi/micchan2154.svg shogi-v21528/index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: repair Mitsuchan portrait and iPhone image loading"
          git push
