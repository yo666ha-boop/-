name: Validate Future layout production candidate
on:
  push:
    branches: [validate-future-layout-candidate-20260824]
    paths: ['.github/workflows/validate-future-layout-candidate-20260824.yml']
permissions:
  contents: read
env:
  EXPECTED_MAIN: 4d6e94f2547dd63055c09fa1afb288647a99a8f8
  CANDIDATE_SHA: 70e15f1787aadbf0235428a0939826342c683d39
jobs:
  candidate-parity:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 70e15f1787aadbf0235428a0939826342c683d39
          path: candidate
          fetch-depth: 0
      - name: Assert isolated candidate identity
        run: |
          set -euo pipefail
          MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          test "$MAIN" = "$EXPECTED_MAIN"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C candidate fetch origin main
          mapfile -t F < <(git -C candidate diff --name-only "$EXPECTED_MAIN" "$CANDIDATE_SHA")
          printf 'CANDIDATE_FILE %s\n' "${F[@]}"
          test "${#F[@]}" -eq 6
          printf '%s\n' "${F[@]}" | sort > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          shogi-side-test/future21520.js
          shogi-v21528/future-yaneura-worker21528.js
          shogi-v21528/index.html
          shogi-v21528/yaneuraou/build-info.txt
          shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.js
          shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.wasm
          EOF
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          grep -F "WASM_NNUE_LAYOUT_FIX=1" candidate/shogi-v21528/yaneuraou/build-info.txt
          grep -F "const BUILD='21528v970d6';" candidate/shogi-v21528/future-yaneura-worker21528.js
          grep -F "future-yaneura-worker21528.js?v=21528v970d7" candidate/shogi-side-test/future21520.js
          grep -F "get(test+'future21520.js?v=21528h')" candidate/shogi-v21528/index.html
          node --check candidate/shogi-v21528/future-yaneura-worker21528.js
          node --check candidate/shogi-side-test/future21520.js
          sha256sum candidate/shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.js candidate/shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.worker.js candidate/shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.wasm candidate/shogi-v21528/yaneuraou/nn.bin
          node - <<'NODE'
          const fs=require('fs'),p='candidate/shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.wasm';
          const ex=WebAssembly.Module.exports(new WebAssembly.Module(fs.readFileSync(p))).map(x=>x.name);
          if(!ex.includes('usi_command'))throw Error('usi_command missing');
          console.log('PASS_CANDIDATE_STATIC_IDENTITY');
          NODE
      - name: Prepare exact candidate diagnostic worker
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),p='candidate/shogi-v21528/future-yaneura-worker21528.js',src=fs.readFileSync(p,'utf8');
          const mark="    if(m.type==='stop'){try{if(engine)await sendUSI('stop')}catch(e){};return}";
          if(!src.includes(mark))throw Error('worker marker missing');
          const diag=`    if(m.type==='candidate_rawdepth'){await init();latestInfo={};latestMultiPV={};await sendUSI('setoption name MultiPV value 1');await sendUSI('setoption name USI_Hash value 32');await sendUSI('setoption name Threads value 1');await sendUSI('usinewgame');await sendUSI('position sfen '+String(m.sfen||''));const p=waitLine(x=>x.startsWith('bestmove '),240000,'candidate_rawdepth');await sendUSI('go depth '+Number(m.depth),240000);const line=await p;self.postMessage({type:'result',id,ok:true,kind:'candidate_rawdepth',token:(line.split(/\\s+/)[1]||''),info:{...latestInfo}});return;}\n`;
          fs.writeFileSync('candidate/shogi-v21528/future-yaneura-worker-candidate-diag.js',src.replace(mark,diag+mark));
          NODE
          cd candidate
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps webkit chromium >/dev/null
      - name: Start candidate COI server
        run: |
          set -euo pipefail
          cat >/tmp/candidate-srv.mjs <<'NODE'
          import http from'node:http';import fs from'node:fs';import path from'node:path';const r=path.resolve('candidate'),m={'.html':'text/html','.js':'text/javascript','.wasm':'application/wasm','.bin':'application/octet-stream','.png':'image/png','.jpg':'image/jpeg','.jpeg':'image/jpeg','.webp':'image/webp','.css':'text/css'};http.createServer((q,s)=>{let u=new URL(q.url,'http://x').pathname;if(u.endsWith('/'))u+='index.html';const f=path.resolve(r,'.'+u);if(!f.startsWith(r)||!fs.existsSync(f)){s.writeHead(404);return s.end()}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',m[path.extname(f)]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4261,'127.0.0.1')
          NODE
          node /tmp/candidate-srv.mjs >/tmp/candidate-srv.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4261/shogi-v21528/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/candidate-srv.log; exit 1
      - name: Verify candidate fixed-depth native parity
        working-directory: candidate
        run: |
          set -euo pipefail
          cat >candidate-parity.mjs <<'NODE'
          import{webkit,chromium}from'playwright';
          const C=[{ply:29,depth:12,sfen:'lnsgkg1nl/7s1/p3pp1pp/2pp2p2/3+bP4/5B3/P2P1PPPP/4GS1R1/L+r+p2K1NL b gsn2p 29',token:'5e5d',cp:-4054},{ply:29,depth:14,sfen:'lnsgkg1nl/7s1/p3pp1pp/2pp2p2/3+bP4/5B3/P2P1PPPP/4GS1R1/L+r+p2K1NL b gsn2p 29',token:'5e5d',cp:-4321},{ply:33,depth:12,sfen:'lnsgkg1nl/7s1/p3pp1pp/2pp2p2/3+bP4/5B3/P2P1PPPP/2+p1gSKR1/L+r2G2NL b sn2p 33',token:'2g2f',cp:-4217},{ply:33,depth:14,sfen:'lnsgkg1nl/7s1/p3pp1pp/2pp2p2/3+bP4/5B3/P2P1PPPP/2+p1gSKR1/L+r2G2NL b sn2p 33',token:'2g2f',cp:-4410},{ply:35,depth:12,sfen:'lnsgkg1nl/7s1/p3pp1pp/2pp2p2/3+bP4/5B1P1/P2P1PP1P/2+p2SKR1/L+r2g2NL b gsn2p 35',token:'4f5g',cp:-4290},{ply:35,depth:14,sfen:'lnsgkg1nl/7s1/p3pp1pp/2pp2p2/3+bP4/5B1P1/P2P1PP1P/2+p2SKR1/L+r2g2NL b gsn2p 35',token:'4h5i',cp:-4490}];
          async function run(bt,name){const b=await bt.launch({headless:true}),p=await b.newPage({userAgent:name==='webkit'?'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1':undefined});await p.goto('http://127.0.0.1:4261/shogi-v21528/index.html',{waitUntil:'domcontentloaded',timeout:120000});if(!await p.evaluate(()=>crossOriginIsolated)){await p.reload({waitUntil:'domcontentloaded'});}const out=[];for(const q of C){const r=await p.evaluate(async q=>{const w=new Worker('./future-yaneura-worker-candidate-diag.js?v='+Date.now()+Math.random());let n=0,P=new Map();w.onmessage=e=>{const m=e.data||{},z=P.get(m.id);if(!z||m.type!=='result')return;P.delete(m.id);clearTimeout(z.t);m.ok?z.r(m):z.j(Error(m.error||'worker'))};const call=(type,x={},ms=250000)=>new Promise((r,j)=>{const id=++n,t=setTimeout(()=>j(Error(type+' timeout')),ms);P.set(id,{r,j,t});w.postMessage({type,id,...x})});try{await call('init',{},150000);return await call('candidate_rawdepth',{sfen:q.sfen,depth:q.depth})}finally{w.terminate()}},q);const row={browser:name,ply:q.ply,depth:q.depth,token:r.token,cp:r.info?.cp,nodes:r.info?.nodes,expectedToken:q.token,expectedCp:q.cp,tokenMatch:r.token===q.token,cpDelta:r.info?.cp-q.cp};out.push(row);console.log('CANDIDATE_PARITY_ROW '+JSON.stringify(row))}await b.close();return out}
          const rows=[...await run(webkit,'webkit'),...await run(chromium,'chromium')],wk=rows.filter(x=>x.browser==='webkit'),cr=rows.filter(x=>x.browser==='chromium');const summary={rows:rows.length,webkitExact:wk.filter(x=>x.tokenMatch&&x.cpDelta===0).length,chromiumTokenMatches:cr.filter(x=>x.tokenMatch).length,chromiumMaxAbsCpDelta:Math.max(...cr.map(x=>Math.abs(x.cpDelta))),detail:rows};console.log('CANDIDATE_PARITY_SUMMARY '+JSON.stringify(summary));if(summary.webkitExact!==6||summary.chromiumMaxAbsCpDelta>250)throw Error('candidate parity gate '+JSON.stringify(summary));console.log('PASS_FUTURE_CANDIDATE_FIXED_DEPTH_PARITY');
          NODE
          node candidate-parity.mjs 2>&1 | tee /tmp/candidate-parity.log
      - if: always()
        run: grep -E '^(PASS_CANDIDATE_STATIC_IDENTITY|CANDIDATE_PARITY_|PASS_FUTURE_CANDIDATE_)' /tmp/candidate-parity.log 2>/dev/null || true

  future-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
    strategy:
      fail-fast: false
      matrix:
        platform: [iphone, fire, desktop, firefox]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 70e15f1787aadbf0235428a0939826342c683d39
      - name: Prepare runtime
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          cat >/tmp/future-candidate-server.mjs <<'NODE'
          import http from'http';import fs from'fs';import path from'path';const r=process.cwd(),m={'.html':'text/html','.js':'text/javascript','.css':'text/css','.wasm':'application/wasm','.bin':'application/octet-stream','.jpg':'image/jpeg','.jpeg':'image/jpeg','.png':'image/png','.webp':'image/webp'};http.createServer((q,s)=>{let u=decodeURIComponent(new URL(q.url,'http://x').pathname);if(u.endsWith('/'))u+='index.html';const f=path.resolve(r,'.'+u);if(!f.startsWith(r)||!fs.existsSync(f)){s.writeHead(404);return s.end('404')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',m[path.extname(f)]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4262,'127.0.0.1')
          NODE
          node /tmp/future-candidate-server.mjs >/tmp/future-candidate-server.log 2>&1 &
          sleep 1
      - name: Run Future candidate runtime
        env:
          PLATFORM: ${{ matrix.platform }}
          HOME: /root
        run: |
          set -euo pipefail
          cat >/tmp/future-candidate-runtime.mjs <<'NODE'
          import{webkit,chromium,firefox}from'playwright';const mode=process.env.PLATFORM,cfg={iphone:{b:webkit,ua:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1',v:{width:390,height:844},hash:32,mw:true,fs:false},fire:{b:chromium,ua:'Mozilla/5.0 (Linux; U; en-US; KFMAWI Build/JDQ39) AppleWebKit/535.19 (KHTML, like Gecko) Silk/124.5.3 like Chrome/124.0 Safari/535.19',v:{width:800,height:1280},hash:48,mw:false,fs:true},desktop:{b:chromium,ua:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',v:{width:1440,height:900},hash:128,mw:false,fs:false},firefox:{b:firefox,ua:'Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:154.0) Gecko/20100101 Firefox/154.0',v:{width:1440,height:900},hash:128,mw:false,fs:false}}[mode];if(!cfg)throw Error('bad '+mode);const b=await cfg.b.launch({headless:true,env:{...process.env,HOME:'/root'}}),p=await b.newPage({userAgent:cfg.ua,viewport:cfg.v});const errs=[];p.on('pageerror',e=>errs.push(String(e)));await p.goto('http://127.0.0.1:4262/shogi-v21528/index.html?candidate='+mode+'-'+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});if(!await p.evaluate(()=>crossOriginIsolated))await p.reload({waitUntil:'domcontentloaded',timeout:120000});await p.waitForFunction(()=>document.querySelectorAll('#chars .ch').length===26&&window.AI_SHOGI_YANEURAOU_FUTURE,{timeout:120000});const r=await p.evaluate(async()=>{const a=AI_SHOGI_YANEURAOU_FUTURE;await a.init();let b=Array(81).fill(null),back=['L','N','S','G','K','G','S','N','L'];for(let x=0;x<9;x++){b[x]={k:back[x],o:-1};b[72+x]={k:back[8-x],o:1};b[18+x]={k:'P',o:-1};b[54+x]={k:'P',o:1}}b[10]={k:'R',o:-1};b[16]={k:'B',o:-1};b[64]={k:'B',o:1};b[70]={k:'R',o:1};const q=await a.bestMove({b,h:{1:{},'-1':{}},t:1,log:[],last:null},{ms:300,multiPV:1,adaptive:false});return{status:a.status(),move:!!q.move,resign:!!q.resign,declareWin:!!q.declareWin,info:q.info||{},sound:AI_SHOGI_PIECE_SOUND?.audit?.(),cards:document.querySelectorAll('#chars .ch').length,coi:crossOriginIsolated}});const out={platform:mode,r,errs};console.log('FUTURE_CANDIDATE_RUNTIME '+JSON.stringify(out));if(!r.coi||r.cards!==26||errs.length||!r.status?.ready||(!r.move&&!r.resign&&!r.declareWin)||r.info?.threads!==1||r.info?.hashMB!==cfg.hash||!!r.info?.mobileWebKit!==cfg.mw||!!r.info?.fireSilk!==cfg.fs||r.sound?.buttons!==2)throw Error('runtime gate '+JSON.stringify(out));console.log('PASS_FUTURE_CANDIDATE_RUNTIME '+JSON.stringify({platform:mode,threads:r.info.threads,hashMB:r.info.hashMB,mobileWebKit:r.info.mobileWebKit,fireSilk:r.info.fireSilk,depth:r.info.depth,nodes:r.info.nodes}));await b.close();
          NODE
          node /tmp/future-candidate-runtime.mjs 2>&1 | tee /tmp/future-candidate-runtime.log
      - if: always()
        run: grep -E '^(FUTURE_CANDIDATE_RUNTIME|PASS_FUTURE_CANDIDATE_RUNTIME)' /tmp/future-candidate-runtime.log || true

  all26-local:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
    strategy:
      fail-fast: false
      matrix:
        platform: [iphone, fire, desktop, firefox]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 70e15f1787aadbf0235428a0939826342c683d39
          fetch-depth: 0
      - name: Restore proven all26 audit script
        run: |
          set -euo pipefail
          git fetch origin fa99ef74863590301c1a2d4244c9103617fec729
          mkdir -p .github/scripts
          git show fa99ef74863590301c1a2d4244c9103617fec729:.github/scripts/audit-final-all26-post-pr76-20260820.mjs > .github/scripts/audit-final-all26-post-pr76-20260820.mjs
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
      - name: Start COI server
        run: |
          cat >/tmp/final26-server.mjs <<'NODE'
          import http from'http';import fs from'fs';import path from'path';const root=process.cwd(),mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css','.wasm':'application/wasm','.bin':'application/octet-stream','.jpg':'image/jpeg','.jpeg':'image/jpeg','.png':'image/png','.webp':'image/webp'};http.createServer((q,s)=>{let n=decodeURIComponent(new URL(q.url,'http://x').pathname);if(n.endsWith('/'))n+='index.html';const f=path.resolve(root,'.'+n);if(!f.startsWith(root)||!fs.existsSync(f)){s.writeHead(404);return s.end('404')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',mime[path.extname(f).toLowerCase()]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4248,'127.0.0.1');
          NODE
          node /tmp/final26-server.mjs >/tmp/final26-server.log 2>&1 &
          sleep 1
      - name: Run candidate all26 integrity
        env:
          TARGET: local
          PLATFORM: ${{ matrix.platform }}
          HOME: /root
        run: |
          set -euo pipefail
          node .github/scripts/audit-final-all26-post-pr76-20260820.mjs 2>&1 | tee /tmp/final26.log
          grep -q '^PASS_FINAL_ALL26_POST_PR76 ' /tmp/final26.log
          sed -n '/^PASS_FINAL_ALL26_POST_PR76 /p' /tmp/final26.log | sed 's/^/PASS_FUTURE_CANDIDATE_ALL26 /'
      - if: always()
        run: grep -E '^(FINAL_ALL26_POST_PR76|PASS_FINAL_ALL26_POST_PR76|PASS_FUTURE_CANDIDATE_ALL26|Error:)' /tmp/final26.log || true

  prewarm-sound:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 70e15f1787aadbf0235428a0939826342c683d39
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install WebKit
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps webkit >/dev/null
      - name: Start COI server
        run: |
          cat >/tmp/coi-server.mjs <<'NODE'
          import http from'http';import fs from'fs';import path from'path';const root=process.cwd(),mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.mjs':'text/javascript; charset=utf-8','.css':'text/css','.wasm':'application/wasm','.bin':'application/octet-stream','.jpg':'image/jpeg','.jpeg':'image/jpeg','.png':'image/png','.webp':'image/webp'};http.createServer((q,s)=>{let n=decodeURIComponent(new URL(q.url,'http://x').pathname);if(n.endsWith('/'))n+='index.html';const f=path.resolve(root,'.'+n);if(!f.startsWith(root)||!fs.existsSync(f)||fs.statSync(f).isDirectory()){s.writeHead(404);return s.end('404')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',mime[path.extname(f).toLowerCase()]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4188,'127.0.0.1');
          NODE
          node /tmp/coi-server.mjs >/tmp/coi-server.log 2>&1 &
          sleep 1
      - name: Verify candidate iPhone prewarm and sound
        run: |
          set -euo pipefail
          node .github/scripts/verify-prewarm-sound-20260819.mjs 2>&1 | tee /tmp/prewarm-sound.log
          grep -q '^PASS ' /tmp/prewarm-sound.log
          grep -E '^(STATIC|BEFORE|PREWARM|SOUND|READY_SEARCH|PASS)' /tmp/prewarm-sound.log
          echo PASS_FUTURE_CANDIDATE_PREWARM_SOUND
