name: Build Fire Stage 3.5 Prewarmed APK

on:
  push:
    branches:
      - fire/shogi-webview-v1-20260828
    paths:
      - 'fire-app/scripts/apply-stage35-fire-prewarm.py'
      - '.github/workflows/build-fire-stage35-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-stage35-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Stage 3.5 single-engine prewarm patch
        run: |
          set -euxo pipefail
          python fire-app/scripts/apply-stage35-fire-prewarm.py
          node --check shogi-v21528/future-yaneura-worker21528.js
          node --check shogi-side-test/future21520.js
          node --check shogi-side-test/top5-yaneura21529.js
          node --check shogi-side-test/cohort7-12-yaneura21533.js
          node --check shogi-side-test/cohort13-18-yaneura21534.js
          node --check shogi-side-test/cohort19-26-yaneura21536.js
          grep -F 'JSONObject warmupGameplaySession()' fire-app/app/src/main/java/com/mitsuki/shogi/fire/NativeEngineManager.java
          grep -F 'return "warm:" + id' fire-app/app/src/main/java/com/mitsuki/shogi/fire/NativeEngineManager.java
          grep -F 'nativeWarmup()' fire-app/app/src/main/java/com/mitsuki/shogi/fire/LoopbackHttpServer.java
          grep -F 'startNativeWarmupAndLoad()' fire-app/app/src/main/java/com/mitsuki/shogi/fire/MainActivity.java
          grep -F '__fireNativeWarmReady:warmed' fire-app/app/src/main/assets/fire/yaneuraou-native-shim.js
          grep -F 'Fire事前初期化済みV9.70＋水匠5セッション引継ぎ' shogi-v21528/future-yaneura-worker21528.js
          grep -F 'FIRE_THREADS=2' fire-app/app/src/main/assets/fire/yaneuraou-native-shim.js
          grep -F 'FIRE_HASH_MB=96' fire-app/app/src/main/assets/fire/yaneuraou-native-shim.js
          grep -F 'FIRE_NODE_MULTIPLIER=2' fire-app/app/src/main/assets/fire/yaneuraou-native-shim.js
          grep -F 'versionCode = 5' fire-app/app/build.gradle.kts
          grep -F 'versionName = "3.5-fire-native-v970-prewarmed-session"' fire-app/app/build.gradle.kts

      - name: Set up Android NDK r23b
        id: setup_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23b

      - name: Build production-matched YaneuraOu V9.70git Android executables
        env:
          NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          set -euxo pipefail
          YANE_COMMIT=33ccf1f907eb7184889fa23051243f81ab0bf973
          grep -F "commit=$YANE_COMMIT" shogi-side-test/yaneuraou/build-info.txt
          git clone --filter=blob:none https://github.com/yaneurao/YaneuraOu.git /tmp/YaneuraOu
          cd /tmp/YaneuraOu
          git checkout "$YANE_COMMIT"
          test "$(git rev-parse HEAD)" = "$YANE_COMMIT"
          grep -F '#define ENGINE_VERSION "9.70git"' source/config.h
          for ABI in arm64-v8a armeabi-v7a; do
            rm -rf libs obj
            "$NDK_HOME/ndk-build" \
              NDK_PROJECT_PATH="$PWD" \
              APP_BUILD_SCRIPT="$PWD/script/jni/Android.mk" \
              NDK_APPLICATION_MK="$PWD/script/jni/Application.mk" \
              APP_ABI="$ABI" \
              YANEURAOU_EDITION=YANEURAOU_ENGINE_NNUE \
              -j2 V=1
            SRC="libs/$ABI/YaneuraOu_NNUE_$ABI"
            test -s "$SRC"
            mkdir -p "$GITHUB_WORKSPACE/fire-app/app/src/main/jniLibs/$ABI"
            cp "$SRC" "$GITHUB_WORKSPACE/fire-app/app/src/main/jniLibs/$ABI/libyaneuraou_v970_exec.so"
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Stage 3.5 APK
        working-directory: fire-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify Stage 3.5 APK payload
        run: |
          set -euxo pipefail
          APK=fire-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 60000000
          unzip -l "$APK" > /tmp/fire-stage35-list.txt
          grep -F 'assets/shogi-v21528/index.html' /tmp/fire-stage35-list.txt
          grep -F 'assets/shogi-side-test/yaneuraou/nn.bin' /tmp/fire-stage35-list.txt
          grep -F 'assets/fire/yaneuraou-native-shim.js' /tmp/fire-stage35-list.txt
          grep -F 'lib/arm64-v8a/libyaneuraou_v970_exec.so' /tmp/fire-stage35-list.txt
          grep -F 'lib/armeabi-v7a/libyaneuraou_v970_exec.so' /tmp/fire-stage35-list.txt
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload Stage 3.5 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mitsuki-shogi-fire-stage35-prewarmed-native-v970-apk
          path: fire-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Stage 3.5 physical Fire test link
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          APK=fire-app/app/build/outputs/apk/debug/app-debug.apk
          ASSET=mitsuki-shogi-fire-stage35.apk
          TAG=fire-stage35-test
          cp "$APK" "$ASSET"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"
          NOTES='Fire実機検証用 Stage 3.5。Stage 3.4で内蔵AI退避ループを止めた後、初手が1分以上かかる実機報告を受けて修正。原因はStage 3.4の軽量preflightがYaneuraOu本体を起動せず、usi→isready→水匠5読み込み等の初期化を初手に残していたこと。Stage 3.5ではアプリ画面を対局可能にする前に実戦用YaneuraOu V9.70git＋水匠5を1本だけ完全起動し、Threads最低2・Hash最低96MB・FV_SCALE24・MultiPV1・readyok・短い実bestmoveまで通す。その同じネイティブプロセスをWeb Workerへ引き継ぎ、初手で二重初期化しない。26キャラR/MultiPV/cp-loss/personality、Fire探索予算増加、nodes 2倍は変更なし。弱い内蔵AIへの退避も引き続き禁止。ブラウザ版は変更しない。'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --title 'みつき将棋 Fire Stage 3.5 初手事前起動修正版' --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title 'みつき将棋 Fire Stage 3.5 初手事前起動修正版' --notes "$NOTES" --prerelease
          fi
          echo 'Stage 3.5 sideload URL:'
          echo 'https://github.com/yo666ha-boop/-/releases/download/fire-stage35-test/mitsuki-shogi-fire-stage35.apk'
