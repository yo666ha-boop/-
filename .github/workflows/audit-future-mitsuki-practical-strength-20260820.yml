name: Future Mitsuki practical-strength root-cause audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-future-mitsuki-practical-strength-20260820.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm_state:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright browsers
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps webkit chromium >/dev/null
      - name: Build diagnostic worker from exact production worker
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          let s=fs.readFileSync('shogi-v21528/future-yaneura-worker21528.js','utf8');
          const decl="let engine=null,ready=false,initPromise=null,waiters=[],latestInfo={},latestMultiPV={};";
          if(!s.includes(decl))throw Error('decl marker missing');
          s=s.replace(decl,"let __diag=[];"+decl);
          const ld="  const line=String(raw||'').trim();";
          if(!s.includes(ld))throw Error('line marker missing');
          s=s.replace(ld,ld+"\n  __diag.push(line);if(__diag.length>1200)__diag.shift();");
          const needle="    if(m.type==='stop'){try{if(engine)await sendUSI('stop')}catch(e){};return}";
          if(!s.includes(needle))throw Error('handler marker missing');
          const ins=`    if(m.type==='diagstate'){
              await init();__diag=[];
              let p=waitLine(x=>x==='usiok',20000,'diag usiok');await sendUSI('usi');await p;
              const usiLines=__diag.slice();__diag=[];
              for(const c of ['setoption name EvalDir value .','setoption name EvalFile value nn.bin','setoption name FV_SCALE value 24','setoption name USI_Hash value 32','setoption name Threads value 1','setoption name MultiPV value 1'])await sendUSI(c,20000);
              p=waitLine(x=>x==='readyok',60000,'diag readyok');await sendUSI('isready',60000);await p;
              const readyLines=__diag.slice();__diag=[];latestInfo={};latestMultiPV={};
              const pos=String(m.sfen||'');const depth=Math.max(1,Number(m.depth)||12);
              await sendUSI('position sfen '+pos);p=waitLine(x=>x.startsWith('bestmove '),210000,'diag bestmove');await sendUSI('go depth '+depth,210000);const best=await p;
              self.postMessage({type:'result',id,ok:true,kind:'diagstate',sfen:pos,usiLines,readyLines,bestmove:best,info:{...latestInfo},searchTail:__diag.slice(-50),profile:{threads:ENGINE_THREADS,hashMB:ENGINE_HASH_MB,mobileWebKit:MOBILE_WEBKIT,fireSilk:FIRE_SILK,mobileSafe:MOBILE_SAFE}});return;
            }\n`;
          fs.writeFileSync('shogi-v21528/future-yaneura-worker-state-diag.js',s.replace(needle,ins+needle));
          NODE
      - name: Start COI server
        shell: bash
        run: |
          cat >/tmp/future-state-server.mjs <<'NODE'
          import http from 'node:http';import fs from 'node:fs';import path from 'node:path';
          const root=process.env.GITHUB_WORKSPACE,m={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.wasm':'application/wasm','.bin':'application/octet-stream'};
          http.createServer((q,s)=>{let n=decodeURIComponent(new URL(q.url,'http://x').pathname);if(n.endsWith('/'))n+='index.html';const f=path.resolve(root,'.'+n);if(!f.startsWith(path.resolve(root))||!fs.existsSync(f)){s.writeHead(404);return s.end('404')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',m[path.extname(f)]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4199,'127.0.0.1');
          NODE
          node /tmp/future-state-server.mjs >/tmp/future-state-server.log 2>&1 &
          for i in $(seq 1 30);do curl -fsS http://127.0.0.1:4199/shogi-v21528/index.html >/dev/null&&exit 0||sleep 1;done
          cat /tmp/future-state-server.log; exit 1
      - name: Inspect exact production WASM state at fresh-collapse ply29
        shell: bash
        run: |
          cat >future-state-test.mjs <<'NODE'
          import {webkit,chromium} from 'playwright';
          const ua='Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1';
          const sfen='lnsgkg1nl/7s1/p3pp1pp/2pp2p2/3+bP4/5B3/P2P1PPPP/4GS1R1/L+r+p2K1NL b gsn2p 29';
          const rows=[];
          for(const [browserName,type] of [['webkit',webkit],['chromium',chromium]]){
            const b=await type.launch({headless:true}),ctx=await b.newContext({userAgent:ua}),p=await ctx.newPage(),errors=[];
            p.on('pageerror',e=>errors.push(String(e)));
            await p.goto('http://127.0.0.1:4199/shogi-v21528/index.html?state='+browserName+'-'+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
            if(!await p.evaluate(()=>crossOriginIsolated))throw Error(browserName+' no COI');
            const r=await p.evaluate(async({sfen})=>{const w=new Worker('./future-yaneura-worker-state-diag.js?v='+Date.now());let n=0,P=new Map();w.onmessage=e=>{const m=e.data||{},q=P.get(m.id);if(!q||m.type!=='result')return;P.delete(m.id);clearTimeout(q.t);m.ok?q.r(m):q.j(Error(m.error||'worker'))};const call=(type,data={},timeout=240000)=>new Promise((res,rej)=>{const id=++n,t=setTimeout(()=>{P.delete(id);rej(Error(type+' timeout'))},timeout);P.set(id,{r:res,j:rej,t});w.postMessage({type,id,...data})});const x=await call('diagstate',{sfen,depth:12});w.terminate();return x},{sfen});
            const opts=r.usiLines.filter(x=>x.startsWith('option name '));
            const row={browser:browserName,sfen:r.sfen,idName:r.usiLines.find(x=>x.startsWith('id name '))||'',hasEvalFile:opts.some(x=>x.startsWith('option name EvalFile ')),evalFileLine:opts.find(x=>x.startsWith('option name EvalFile '))||'',fvScaleLine:opts.find(x=>x.startsWith('option name FV_SCALE '))||'',readyNoSuch:r.readyLines.filter(x=>/No such option/i.test(x)),readyLoading:r.readyLines.filter(x=>/loading eval file/i.test(x)),readyEval:r.readyLines.filter(x=>/eval|nn\.bin|FV_SCALE/i.test(x)),bestmove:r.bestmove,token:(r.bestmove||'').split(/\s+/)[1]||'',cp:r.info?.cp??null,mate:r.info?.mate??null,depth:r.info?.depth??null,nodes:r.info?.nodes??null,profile:r.profile,pageErrors:errors};
            rows.push(row);console.log('FUTURE_WASM_STATE_ROW '+JSON.stringify(row));await b.close();
          }
          const native={sfen,token:'5e5d',cp:-4054,nodes:5234};
          console.log('FUTURE_WASM_STATE_SUMMARY '+JSON.stringify({native,rows,tokenSame:rows[0]?.token===rows[1]?.token,webKitNativeMove:rows[0]?.token===native.token,chromiumNativeMove:rows[1]?.token===native.token}));
          if(rows.some(x=>x.pageErrors.length))throw Error('page errors');
          console.log('PASS_FUTURE_WASM_STATE_HARNESS');
          NODE
          node future-state-test.mjs 2>&1 | tee /tmp/future-state.log
          grep -F 'FUTURE_WASM_STATE_SUMMARY ' /tmp/future-state.log
          grep -F 'PASS_FUTURE_WASM_STATE_HARNESS' /tmp/future-state.log
      - name: Preserve evidence
        if: always()
        shell: bash
        run: |
          echo '=== FUTURE WASM STATE EVIDENCE ==='
          grep -E '^(FUTURE_WASM_STATE_ROW|FUTURE_WASM_STATE_SUMMARY|PASS_FUTURE_WASM_STATE_HARNESS)' /tmp/future-state.log || true
