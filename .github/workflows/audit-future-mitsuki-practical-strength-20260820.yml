name: Future Mitsuki practical-strength root-cause audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-future-mitsuki-practical-strength-20260820.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed_depth_mpv1:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify diagnostic inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/scripts/verify-prewarm-sound-20260819.mjs
          grep -F 'FUTURE_FIXED_DEPTH_MPV1_SUMMARY' .github/scripts/verify-prewarm-sound-20260819.mjs
          grep -F "const ADAPTIVE_MS=4000" shogi-v21528/future-yaneura-worker21528.js
      - name: Install Playwright browsers
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps webkit chromium >/dev/null
      - name: Start local COI server
        shell: bash
        run: |
          cat >/tmp/future-fixed-depth-server.mjs <<'NODE'
          import http from 'node:http';
          import fs from 'node:fs';
          import path from 'node:path';
          const root=process.env.GITHUB_WORKSPACE;
          const mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.wasm':'application/wasm','.bin':'application/octet-stream','.png':'image/png','.jpg':'image/jpeg','.json':'application/json'};
          const srv=http.createServer((req,res)=>{let u=decodeURIComponent((req.url||'/').split('?')[0]);if(u==='/')u='/shogi-v21528/index.html';const f=path.resolve(root,'.'+u);if(!f.startsWith(path.resolve(root))){res.writeHead(403);return res.end('forbidden')}res.setHeader('Cross-Origin-Opener-Policy','same-origin');res.setHeader('Cross-Origin-Embedder-Policy','require-corp');res.setHeader('Cross-Origin-Resource-Policy','same-origin');fs.readFile(f,(e,b)=>{if(e){res.writeHead(404);return res.end('not found')}res.setHeader('Content-Type',mime[path.extname(f)]||'application/octet-stream');res.writeHead(200);res.end(b)})});
          srv.listen(4188,'127.0.0.1',()=>console.log('COI_SERVER_READY'));
          NODE
          node /tmp/future-fixed-depth-server.mjs >/tmp/future-fixed-depth-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4188/shogi-v21528/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/future-fixed-depth-server.log
          exit 1
      - name: Run fixed-depth MPV1 browser parity through checked-out PR script
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/verify-prewarm-sound-20260819.mjs 2>&1 | tee /tmp/future-fixed-depth-mpv1.log
          grep -F 'FUTURE_FIXED_DEPTH_MPV1_SUMMARY ' /tmp/future-fixed-depth-mpv1.log
          grep -F 'PASS_FUTURE_FIXED_DEPTH_MPV1_HARNESS' /tmp/future-fixed-depth-mpv1.log
      - name: Preserve concise evidence
        if: always()
        shell: bash
        run: |
          echo '=== FUTURE FIXED DEPTH MPV1 EVIDENCE ==='
          grep -E '^(FUTURE_FIXED_DEPTH_MPV1_ROW|FUTURE_FIXED_DEPTH_MPV1_SUMMARY|PASS_FUTURE_FIXED_DEPTH_MPV1_HARNESS)' /tmp/future-fixed-depth-mpv1.log || true
