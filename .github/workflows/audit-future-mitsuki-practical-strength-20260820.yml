name: Future Mitsuki practical-strength root-cause audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-future-mitsuki-practical-strength-20260820.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm_artifact_compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKit
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps webkit >/dev/null
      - name: Build diagnostic workers
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const src=fs.readFileSync('shogi-v21528/future-yaneura-worker21528.js','utf8');
          function build(name,baseExpr){
            let s=src.replace("new URL('./yaneuraou/',self.location.href).href",baseExpr);
            const decl="let engine=null,ready=false,initPromise=null,waiters=[],latestInfo={},latestMultiPV={};";
            s=s.replace(decl,"let __all=[];"+decl);
            const ld="  const line=String(raw||'').trim();";s=s.replace(ld,ld+"\n  __all.push(line);if(__all.length>2000)__all.shift();");
            const needle="    if(m.type==='stop'){try{if(engine)await sendUSI('stop')}catch(e){};return}";
            const ins=`    if(m.type==='diagcompare'){
              let initError='';try{await init()}catch(e){initError=String(e&&e.message||e)}
              const lines=__all.slice(), opts=lines.filter(x=>x.startsWith('option name '));
              if(initError){self.postMessage({type:'result',id,ok:true,kind:'diagcompare',initError,lines,opts});return}
              latestInfo={};latestMultiPV={};const pos=String(m.sfen||'');const depth=Math.max(1,Number(m.depth)||10);
              await sendUSI('position sfen '+pos);const p=waitLine(x=>x.startsWith('bestmove '),180000,'cmp bestmove');await sendUSI('go depth '+depth,180000);const best=await p;
              self.postMessage({type:'result',id,ok:true,kind:'diagcompare',initError:'',lines,opts,bestmove:best,info:{...latestInfo},profile:{threads:ENGINE_THREADS,hashMB:ENGINE_HASH_MB,mobileWebKit:MOBILE_WEBKIT}});return;
            }\n`;
            if(!s.includes(needle))throw Error('marker');
            fs.writeFileSync('shogi-v21528/'+name,s.replace(needle,ins+needle));
          }
          build('future-prod-compare.js',"new URL('./yaneuraou/',self.location.href).href");
          build('future-side-compare.js',"new URL('../shogi-side-test/yaneuraou/',self.location.href).href");
          NODE
      - name: Start COI server
        run: |
          cat >/tmp/cmp-server.mjs <<'NODE'
          import http from'node:http';import fs from'node:fs';import path from'node:path';const root=process.env.GITHUB_WORKSPACE,m={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.wasm':'application/wasm','.bin':'application/octet-stream'};http.createServer((q,s)=>{let n=decodeURIComponent(new URL(q.url,'http://x').pathname);if(n.endsWith('/'))n+='index.html';const f=path.resolve(root,'.'+n);if(!f.startsWith(path.resolve(root))||!fs.existsSync(f)){s.writeHead(404);return s.end('404')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',m[path.extname(f)]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4203,'127.0.0.1');
          NODE
          node /tmp/cmp-server.mjs >/tmp/cmp-server.log 2>&1 &
          for i in $(seq 1 30);do curl -fsS http://127.0.0.1:4203/shogi-v21528/index.html >/dev/null&&exit 0||sleep 1;done;exit 1
      - name: Compare artifacts on exact collapse SFEN
        run: |
          cat >future-artifact-compare.mjs <<'NODE'
          import{webkit}from'playwright';
          const ua='Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1';
          const sfen='lnsgkg1nl/7s1/p3pp1pp/2pp2p2/3+bP4/5B3/P2P1PPPP/4GS1R1/L+r+p2K1NL b gsn2p 29';
          const b=await webkit.launch({headless:true}),p=await b.newPage({userAgent:ua,viewport:{width:390,height:844}});await p.goto('http://127.0.0.1:4203/shogi-v21528/index.html?cmp='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
          async function run(file){return p.evaluate(async({file,sfen})=>{const w=new Worker('./'+file+'?v='+Date.now()+Math.random());let id=1;return await new Promise((res,rej)=>{const t=setTimeout(()=>rej(Error('timeout')),220000);w.onmessage=e=>{const m=e.data||{};if(m.type==='result'&&m.id===id){clearTimeout(t);w.terminate();m.ok?res(m):rej(Error(m.error||'worker'))}};w.postMessage({type:'diagcompare',id,sfen,depth:10})})},{file,sfen})}
          const out=[];for(const [artifact,file] of[['production76d','future-prod-compare.js'],['side33cc','future-side-compare.js']]){let r;try{r=await run(file)}catch(e){r={initError:String(e&&e.message||e),lines:[],opts:[]}}const row={artifact,initError:r.initError||'',idName:(r.lines||[]).find(x=>x.startsWith('id name '))||'',hasEvalFile:(r.opts||[]).some(x=>x.startsWith('option name EvalFile ')),loading:(r.lines||[]).filter(x=>/loading eval file/i.test(x)),evalErrors:(r.lines||[]).filter(x=>/eval|nn\.bin|No such option|failed to read/i.test(x)),token:(r.bestmove||'').split(/\s+/)[1]||'',cp:r.info?.cp??null,depth:r.info?.depth??null,nodes:r.info?.nodes??null};out.push(row);console.log('FUTURE_WASM_ARTIFACT_ROW '+JSON.stringify(row))}
          console.log('FUTURE_WASM_ARTIFACT_SUMMARY '+JSON.stringify({sfen,native:{token:'5e5d',cp:-4054},rows:out}));console.log('PASS_FUTURE_WASM_ARTIFACT_HARNESS');await b.close();
          NODE
          node future-artifact-compare.mjs 2>&1 | tee /tmp/artifact.log
          grep -F 'FUTURE_WASM_ARTIFACT_SUMMARY ' /tmp/artifact.log
          grep -F 'PASS_FUTURE_WASM_ARTIFACT_HARNESS' /tmp/artifact.log
      - name: Preserve evidence
        if: always()
        run: grep -E '^(FUTURE_WASM_ARTIFACT_ROW|FUTURE_WASM_ARTIFACT_SUMMARY|PASS_FUTURE_WASM_ARTIFACT_HARNESS)' /tmp/artifact.log || true
