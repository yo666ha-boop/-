name: Verify tournament preview URL 20260904
on:
  pull_request:
    paths:
      - 'shogi-v21528/tournament21540.js'
      - 'shogi-v21528/tournament21541.js'
      - 'shogi-v21528/rating-progress21536.js'
      - 'preview/tournament-16/index.html'
      - 'preview/tournament-16/index21542.html'
      - 'preview/tournament-16/index21542b.html'
      - 'preview/tournament-16/index21542c.html'
      - '.github/scripts/verify-tournament-preview-url-20260904.mjs'
      - '.github/workflows/verify-tournament-preview-url-20260904.yml'
  workflow_dispatch:

jobs:
  preview-url:
    runs-on: ubuntu-22.04
    container: mcr.microsoft.com/playwright:v1.55.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Playwright package
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
      - name: Syntax check
        run: node --check .github/scripts/verify-tournament-preview-url-20260904.mjs
      - name: Verify immutable preview URL
        env:
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/verify-tournament-preview-url-20260904.mjs
