name: Diagnose Future production WASM state
on:
  push:
    branches: [audit-future-mitsuki-strength-20260820]
    paths:
      - '.github/workflows/diagnose-future-production-wasm-state-20260821.yml'
permissions:
  contents: read
  issues: write
jobs:
  wasm_state:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKit and Chromium
        run: |
          set -euo pipefail
          mkdir -p /tmp/fwstate && cd /tmp/fwstate
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps webkit chromium >/dev/null
      - name: Build diagnostic worker from exact production worker
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const src='shogi-v21528/future-yaneura-worker21528.js';
          const dst='shogi-v21528/future-yaneura-worker-state-diag.js';
          let s=fs.readFileSync(src,'utf8');
          const decl="let engine=null,ready=false,initPromise=null,waiters=[],latestInfo={},latestMultiPV={};";
          if(!s.includes(decl))throw new Error('state declaration marker missing');
          s=s.replace(decl,"let diagLines=[];"+decl);
          const lineDecl="  const line=String(raw||'').trim();";
          if(!s.includes(lineDecl))throw new Error('onLine marker missing');
          s=s.replace(lineDecl,lineDecl+"\n  diagLines.push(line);if(diagLines.length>800)diagLines.shift();");
          const needle="    if(m.type==='stop'){try{if(engine)await sendUSI('stop')}catch(e){};return}";
          if(!s.includes(needle))throw new Error('handler marker missing');
          const insert=`    if(m.type==='diagstate'){
      await init();
      diagLines=[];
      let p=waitLine(x=>x==='usiok',20000,'diag usiok');await sendUSI('usi');await p;
      const usiLines=diagLines.slice();
      diagLines=[];
      for(const c of ['setoption name EvalDir value .','setoption name EvalFile value nn.bin','setoption name FV_SCALE value 24','setoption name USI_Hash value 32','setoption name Threads value 1','setoption name MultiPV value 1'])await sendUSI(c,20000);
      p=waitLine(x=>x==='readyok',60000,'diag readyok');await sendUSI('isready',60000);await p;
      const readyLines=diagLines.slice();
      const pos=String(m.sfen||'');const depth=Math.max(1,Number(m.depth)||12);
      diagLines=[];latestInfo={};latestMultiPV={};
      await sendUSI('setoption name MultiPV value 1');await sendUSI('position sfen '+pos);
      p=waitLine(x=>x.startsWith('bestmove '),150000,'diag bestmove');await sendUSI('go depth '+depth,150000);const best=await p;
      const searchLines=diagLines.slice();
      self.postMessage({type:'result',id,ok:true,kind:'diagstate',usiLines,readyLines,bestmove:best,info:{...latestInfo},searchTail:searchLines.slice(-30),profile:{threads:ENGINE_THREADS,hashMB:ENGINE_HASH_MB,mobileWebKit:MOBILE_WEBKIT,fireSilk:FIRE_SILK,mobileSafe:MOBILE_SAFE}});return;
    }
`;
          fs.writeFileSync(dst,s.replace(needle,insert+needle));
          NODE
      - name: Start COI server
        run: |
          cat >/tmp/fwstate/server.mjs <<'NODE'
          import http from'node:http';import fs from'node:fs';import path from'node:path';const root=process.env.GITHUB_WORKSPACE,mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.wasm':'application/wasm','.bin':'application/octet-stream'};http.createServer((q,s)=>{let n=decodeURIComponent(new URL(q.url,'http://x').pathname);if(n.endsWith('/'))n+='index.html';const f=path.resolve(root,'.'+n);if(!f.startsWith(path.resolve(root))||!fs.existsSync(f)){s.writeHead(404);return s.end('404')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',mime[path.extname(f)]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4197,'127.0.0.1');
          NODE
          node /tmp/fwstate/server.mjs >/tmp/fwstate/server.log 2>&1 &
          sleep 1
      - name: Inspect exact production WASM in WebKit and Chromium
        run: |
          cat >/tmp/fwstate/state.mjs <<'NODE'
          import{webkit,chromium}from'playwright';
          const ua='Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1';
          const sfen='lnsgkg1nl/7s1/p3pp1pp/2pp2p2/3+bP4/5B3/P2P1PPPP/4GS1R1/L+r+p2K1NL b gsn2p 29';
          const rows=[];
          for(const [name,type] of [['webkit',webkit],['chromium',chromium]]){
            const b=await type.launch({headless:true}),c=await b.newContext({userAgent:ua}),p=await c.newPage(),errs=[];p.on('pageerror',e=>errs.push(String(e)));
            await p.goto('http://127.0.0.1:4197/shogi-v21528/index.html?state='+name+'-'+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
            if(!await p.evaluate(()=>crossOriginIsolated))throw Error(name+' no COI');
            const r=await p.evaluate(async({sfen})=>{const w=new Worker('./future-yaneura-worker-state-diag.js?v='+Date.now()+'-'+Math.random());let n=0,P=new Map();w.onmessage=e=>{const m=e.data||{},q=P.get(m.id);if(!q||m.type!=='result')return;P.delete(m.id);clearTimeout(q.t);m.ok?q.r(m):q.j(Error(m.error||'worker'))};const call=(type,data={},timeout=220000)=>new Promise((res,rej)=>{const id=++n,t=setTimeout(()=>{P.delete(id);rej(Error(type+' timeout'))},timeout);P.set(id,{r:res,j:rej,t});w.postMessage({type,id,...data})});const out=await call('diagstate',{sfen,depth:12},210000);w.terminate();return out},{sfen});
            const options=r.usiLines.filter(x=>x.startsWith('option name '));
            const row={browser:name,idName:r.usiLines.find(x=>x.startsWith('id name '))||'',evalFileOption:options.some(x=>x.startsWith('option name EvalFile ')),fvScaleOption:options.find(x=>x.startsWith('option name FV_SCALE '))||'',evalDirOption:options.find(x=>x.startsWith('option name EvalDir '))||'',readyNoSuch:r.readyLines.filter(x=>/No such option/i.test(x)),readyLoading:r.readyLines.filter(x=>/loading eval file/i.test(x)),bestmove:r.bestmove,token:(r.bestmove||'').split(/\s+/)[1]||'',cp:r.info?.cp??null,mate:r.info?.mate??null,depth:r.info?.depth??null,nodes:r.info?.nodes??null,profile:r.profile,pageErrors:errs};rows.push(row);console.log('FUTURE_WASM_STATE_ROW '+JSON.stringify(row));await b.close();
          }
          const summary={rows,tokenSame:rows[0]?.token===rows[1]?.token,cpDelta:(Number.isFinite(rows[0]?.cp)&&Number.isFinite(rows[1]?.cp))?rows[0].cp-rows[1].cp:null};console.log('FUTURE_WASM_STATE_SUMMARY '+JSON.stringify(summary));if(rows.some(x=>x.pageErrors.length))throw Error('page errors');console.log('PASS_FUTURE_WASM_STATE_HARNESS');
          NODE
          cd /tmp/fwstate && node state.mjs 2>&1 | tee /tmp/fwstate/state.log
          grep -F 'FUTURE_WASM_STATE_SUMMARY ' /tmp/fwstate/state.log
          grep -F 'PASS_FUTURE_WASM_STATE_HARNESS' /tmp/fwstate/state.log
      - name: Publish evidence to PR80
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');let t='';try{t=fs.readFileSync('/tmp/fwstate/state.log','utf8')}catch{}
            const lines=t.split(/\r?\n/).filter(x=>/^(FUTURE_WASM_STATE_ROW|FUTURE_WASM_STATE_SUMMARY|PASS_FUTURE_WASM_STATE_HARNESS)/.test(x));
            const body=['### Future production WASM USI state + fixed depth12','```text',...(lines.length?lines:['NO_WASM_STATE_EVIDENCE']),'```'].join('\n').slice(0,60000);
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:80,body});
