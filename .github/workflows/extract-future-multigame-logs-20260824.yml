name: Extract Future multigame raw evidence
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/extract-future-multigame-logs-20260824.yml']
permissions:
  actions: read
  contents: read
jobs:
  extract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Download and content-verify completed multigame logs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess, zipfile
          from pathlib import Path

          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']
          jobs={'sente':97370695327,'reverse':97313204247}
          markers={
            'sente':(
              'PIYO40_SENTE_PROFILE','FUTURE_LAYOUT_SENTE_PROFILE','FUTURE_LAYOUT_SENTE_MOVE',
              'PIYO40_COMMIT','PIYO40_REPLY','FUTURE_LAYOUT_SENTE_AUDIT','FUTURE_LAYOUT_SENTE_SUMMARY',
              'PASS_FUTURE_LAYOUT_SENTE_HARNESS','FUTURE_SENTE_MULTIGAME_SUMMARY',
              'PASS_FUTURE_SENTE_MULTIGAME_DIVERSITY'),
            'reverse':(
              'PIYO40_REVERSE_PROFILE','PIYO40_INITIAL','FUTURE_LAYOUT_REV_PROFILE','FUTURE_LAYOUT_REV_MOVE',
              'PIYO40_COMMIT','PIYO40_REPLY','FUTURE_LAYOUT_REV_AUDIT','FUTURE_LAYOUT_REV_SUMMARY',
              'PASS_FUTURE_LAYOUT_REVERSE_HARNESS','FUTURE_REVERSE_MULTIGAME_SUMMARY',
              'PASS_FUTURE_REVERSE_MULTIGAME_DIVERSITY')}

          def download(label, job):
            raw=Path(f'/tmp/{label}.raw')
            url=f'https://api.github.com/repos/{repo}/actions/jobs/{job}/logs'
            subprocess.run(['curl','--fail-with-body','--location','--silent','--show-error',
                            '-H',f'Authorization: Bearer {token}','-H','Accept: application/vnd.github+json',
                            '-H','X-GitHub-Api-Version: 2022-11-28',url,'-o',str(raw)],check=True)
            b=raw.read_bytes()
            if b[:2]==b'PK':
              with zipfile.ZipFile(raw) as z:
                text='\n'.join(z.read(n).decode('utf-8','replace') for n in z.namelist())
            else:
              text=b.decode('utf-8','replace')
            if len(text)<1000: raise SystemExit(f'{label}: downloaded log unexpectedly short: {len(text)}')
            Path(f'{label}-full.log').write_text(text)
            return text

          def clean(line):
            line=re.sub(r'\x1b\[[0-9;]*m','',line.rstrip('\r\n'))
            line=re.sub(r'^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?Z\s+','',line)
            return line

          def actual_marker_lines(text, allowed):
            out=[]
            pat=re.compile(r'^(?:'+ '|'.join(re.escape(x) for x in allowed) + r')(?:\s+.*)?$')
            for raw in text.splitlines():
              line=clean(raw)
              if pat.fullmatch(line): out.append(line)
            return out

          def parse_json(lines, marker):
            vals=[]
            for line in lines:
              if line.startswith(marker+' '): vals.append(json.loads(line[len(marker)+1:]))
            return vals

          reports={}
          for side,job in jobs.items():
            text=download(side,job)
            lines=actual_marker_lines(text,markers[side])
            Path(f'{side}-markers.txt').write_text('\n'.join(lines)+'\n')
            if not lines: raise SystemExit(f'{side}: no exact raw marker lines')

            sm='FUTURE_LAYOUT_SENTE_SUMMARY' if side=='sente' else 'FUTURE_LAYOUT_REV_SUMMARY'
            mm='FUTURE_LAYOUT_SENTE_MOVE' if side=='sente' else 'FUTURE_LAYOUT_REV_MOVE'
            finalm='FUTURE_SENTE_MULTIGAME_SUMMARY' if side=='sente' else 'FUTURE_REVERSE_MULTIGAME_SUMMARY'
            passm='PASS_FUTURE_SENTE_MULTIGAME_DIVERSITY' if side=='sente' else 'PASS_FUTURE_REVERSE_MULTIGAME_DIVERSITY'
            sums=parse_json(lines,sm)
            # Preserve only one actual summary per attempt if the final evidence block repeats stdout lines.
            by_attempt={}
            for s in sums:
              if isinstance(s,dict) and int(s.get('attempt',0)) in range(1,5): by_attempt[int(s['attempt'])]=s
            if sorted(by_attempt)!=[1,2,3,4]: raise SystemExit(f'{side}: missing raw game summaries: {sorted(by_attempt)}')

            finals=parse_json(lines,finalm)
            if not finals: raise SystemExit(f'{side}: missing final multigame summary')
            final=finals[-1]
            if int(final.get('attempts',0))!=4 or int(final.get('uniqueOpeningCount',0))<2:
              raise SystemExit(f'{side}: diversity summary failed: {final}')
            if passm not in lines: raise SystemExit(f'{side}: missing exact PASS diversity marker')

            commits=parse_json(lines,'PIYO40_COMMIT')
            commit_bad=[c for c in commits if c.get('future')!=c.get('actual')]
            if commit_bad: raise SystemExit(f'{side}: UI/USI commit mismatch: {commit_bad[:3]}')

            moves=parse_json(lines,mm)
            negative_mates=[m for m in moves if isinstance(m.get('mate'),(int,float)) and m['mate']<0]
            if negative_mates: raise SystemExit(f'{side}: negative mate reappeared: {negative_mates[:3]}')

            games=[]
            for a in range(1,5):
              s=by_attempt[a]
              wanted='先手:プレイヤーの勝ち' if side=='sente' else '後手:プレイヤーの勝ち'
              if wanted not in str(s.get('result','')): raise SystemExit(f'{side} attempt {a}: not completed Future win: {s.get("result")}')
              if int(s.get('outsideTop5',99))!=0: raise SystemExit(f'{side} attempt {a}: outsideTop5={s.get("outsideTop5")}')
              if s.get('pageErrors'): raise SystemExit(f'{side} attempt {a}: pageErrors={s.get("pageErrors")}')
              ac=[c for c in commits if int(c.get('attempt',0))==a]
              am=[m for m in moves if int(m.get('attempt',0))==a]
              games.append({'attempt':a,'result':s.get('result'),'plies':s.get('plies'),'futureMoves':s.get('futureMoves'),
                            'audits':s.get('audits'),'deepBestMatches':s.get('deepBestMatches'),'outsideTop5':s.get('outsideTop5'),
                            'maxKnownLossCp':s.get('maxKnownLossCp'),'lossOver100':s.get('lossOver100'),'pageErrors':s.get('pageErrors'),
                            'exactCommitCount':len(ac),'moveLogCount':len(am),'negativeMateMoves':0})
            reports[side]={'job':job,'final':final,'games':games,'rawMarkerLines':len(lines),
                           'exactCommitRecords':len(commits),'moveRecords':len(moves),'negativeMateMoves':0}

          Path('future-multigame-content-verified.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2)+'\n')
          for side in ('sente','reverse'):
            print('CONTENT_VERIFIED_'+side.upper()+'_MULTIGAME '+json.dumps(reports[side],ensure_ascii=False,separators=(',',':')))
          print('PASS_FUTURE_BOTH_SIDES_MULTIGAME_CONTENT_VERIFIED')

          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('## Future multigame raw-content verification\n\n')
            f.write('Source jobs: Sente `97370695327`, Reverse `97313204247`. Badge-only inference is not used.\n\n')
            for side in ('sente','reverse'):
              r=reports[side]
              f.write(f'### {side}\n\n')
              f.write('```json\n'+json.dumps(r,ensure_ascii=False,indent=2)+'\n```\n')
            f.write('\n`PASS_FUTURE_BOTH_SIDES_MULTIGAME_CONTENT_VERIFIED`\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: future-multigame-content-verified
          if-no-files-found: error
          retention-days: 30
          path: |
            sente-markers.txt
            reverse-markers.txt
            future-multigame-content-verified.json
