name: Repair Future Mitsuki image
on:
  push:
    paths:
      - '.github/repair-future-mitsuki-image.trigger'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: python3 -m pip install --user pillow

      - name: Restore missing SOF0 marker and re-encode portrait
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import re,base64,io
          from pathlib import Path
          from PIL import Image

          p=Path('shogi-side-test/future-mitsuki-image21520.js')
          s=p.read_text(encoding='utf-8')
          m=re.search(r'window\.FUTURE_MITSUKI_IMAGE21520="data:image/[^;]+;base64,([A-Za-z0-9+/=]+)";',s)
          if not m: raise SystemExit('data URI not found')
          raw=base64.b64decode(m.group(1),validate=True)
          print('SOURCE_BYTES',len(raw),'HEAD',raw[:16].hex(),'TAIL',raw[-16:].hex())

          # Diagnosis from run #2:
          # DQT #2 ends at offset 158. The next 16 bytes are exactly a baseline
          # SOF0 payload beginning with length byte 0x11, but the three bytes
          # FF C0 00 are missing. The following marker is DHT at offset 174.
          # Reinsert only those missing bytes so the original portrait pixels
          # and compressed scan data remain untouched.
          if len(raw) < 180:
              raise SystemExit('source unexpectedly short')
          print('AROUND_GAP_BEFORE',raw[148:184].hex())
          if raw[158] != 0x11:
              raise SystemExit(f'unexpected SOF payload start at 158: {raw[158]:02x}')
          if raw[174:176] != b'\xff\xc4':
              raise SystemExit('expected DHT marker not found at 174')
          fixed=raw[:158]+b'\xff\xc0\x00'+raw[158:]
          print('AROUND_GAP_AFTER ',fixed[148:187].hex())

          # Confirm the reconstructed SOF segment is internally consistent.
          if fixed[158:162] != b'\xff\xc0\x00\x11':
              raise SystemExit('SOF0 reconstruction failed')
          sof=fixed[158:177]
          precision=sof[4]
          height=int.from_bytes(sof[5:7],'big')
          width=int.from_bytes(sof[7:9],'big')
          components=sof[9]
          print('RECONSTRUCTED_SOF0','precision',precision,'width',width,'height',height,'components',components)
          if not (width>=32 and height>=32 and components in (1,3)):
              raise SystemExit('reconstructed SOF dimensions/components invalid')

          im=Image.open(io.BytesIO(fixed))
          im.load()
          print('DECODE_OK',im.format,im.size,im.mode)
          if im.size != (width,height):
              raise SystemExit(f'decoded size mismatch {im.size} vs {(width,height)}')
          if im.mode not in ('RGB','RGBA'):
              im=im.convert('RGB')
          elif im.mode=='RGBA':
              bg=Image.new('RGB',im.size,'white'); bg.paste(im,mask=im.getchannel('A')); im=bg

          out=io.BytesIO()
          im.save(out,format='PNG',optimize=True)
          png=out.getvalue()
          if not png.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('PNG encoding failed')
          b64=base64.b64encode(png).decode('ascii')
          p.write_text('window.FUTURE_MITSUKI_IMAGE21520="data:image/png;base64,'+b64+'";\n',encoding='utf-8')
          Path('/tmp/future-recovered.png').write_bytes(png)
          print('PNG_BYTES',len(png),'FINAL_SIZE',im.size)
          PY

      - name: Verify repaired JS payload
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import re,base64,io
          from pathlib import Path
          from PIL import Image
          s=Path('shogi-side-test/future-mitsuki-image21520.js').read_text()
          m=re.search(r'data:image/png;base64,([A-Za-z0-9+/=]+)',s)
          if not m: raise SystemExit('PNG data URI missing')
          raw=base64.b64decode(m.group(1),validate=True)
          im=Image.open(io.BytesIO(raw)); im.load()
          print('VERIFY_OK',im.format,im.size,im.mode,len(raw))
          if im.width<32 or im.height<32: raise SystemExit('repaired portrait too small')
          PY

      - name: Commit repaired portrait
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add shogi-side-test/future-mitsuki-image21520.js
          if git diff --cached --quiet; then echo 'No change'; exit 0; fi
          git commit -m 'fix: restore Future Mitsuki portrait JPEG header'
          git push

      - name: Upload recovered portrait diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: future-mitsuki-recovered-portrait
          path: /tmp/future-recovered.png
          if-no-files-found: ignore
          retention-days: 2
