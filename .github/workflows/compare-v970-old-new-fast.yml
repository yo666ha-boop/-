name: Fast compare old WASM vs fixed V9.70
on:
  pull_request:
    paths:
      - '.github/workflows/compare-v970-old-new-fast.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare old and fixed V9.70 runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          ROOT=/tmp/cmpfast/site
          mkdir -p "$ROOT/old" "$ROOT/new" /tmp/cmpfast/art
          cp shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.{js,worker.js,wasm} "$ROOT/old/"
          cp shogi-v21528/yaneuraou/nn.bin "$ROOT/nn.bin"
          gh run download 32147280548 -n yaneuraou-v970-evalfile-fixed -D /tmp/cmpfast/art
          JS=$(find /tmp/cmpfast/art -name 'yaneuraou.halfkp.noeval.js' | head -1); test -n "$JS"; LIB=$(dirname "$JS")
          cp "$LIB"/yaneuraou.halfkp.noeval.{js,worker.js,wasm} "$ROOT/new/"
          sha256sum "$ROOT"/old/* "$ROOT"/new/* | tee /tmp/cmpfast/runtime-sha.txt
      - name: Create persistent browser driver
        shell: bash
        run: |
          set -euxo pipefail
          ROOT=/tmp/cmpfast/site
          cat > "$ROOT/driver.js" <<'JS'
          'use strict';
          const kind=new URL(self.location.href).searchParams.get('kind')||'new';
          const BASE=new URL('./'+kind+'/',self.location.href).href;
          let engine=null,ready=false,waiters=[],lastInfo={};
          function onLine(raw){const s=String(raw||'').trim();if(s.startsWith('info ')){const cp=/\bscore cp (-?\d+)/.exec(s),mate=/\bscore mate (-?\d+)/.exec(s),d=/\bdepth (\d+)/.exec(s),n=/\bnodes (\d+)/.exec(s),pv=/\bpv ([^\s]+)/.exec(s);if(pv)lastInfo={cp:cp?+cp[1]:null,mate:mate?+mate[1]:null,depth:d?+d[1]:0,nodes:n?+n[1]:0,pv:pv[1],line:s};}for(const w of waiters.slice())if(w.pred(s)){waiters=waiters.filter(x=>x!==w);clearTimeout(w.t);w.r(s)}}
          function waitLine(pred,ms,label){return new Promise((r,j)=>{const w={pred,r,j,t:setTimeout(()=>{waiters=waiters.filter(x=>x!==w);j(Error(label+' timeout'))},ms)};waiters.push(w)})}
          async function init(){if(ready)return;importScripts(BASE+'yaneuraou.halfkp.noeval.js?fast=1');const F=self.YaneuraOu_HalfKP_noeval||YaneuraOu_HalfKP_noeval;engine=await F({locateFile:p=>BASE+String(p).split('/').pop(),mainScriptUrlOrBlob:BASE+'yaneuraou.halfkp.noeval.js'});engine.addMessageListener(onLine);const b=new Uint8Array(await (await fetch(new URL('./nn.bin',self.location.href),{cache:'no-store'})).arrayBuffer());try{engine.FS.unlink('/nn.bin')}catch{}engine.FS.writeFile('/nn.bin',b);let p=waitLine(x=>x==='usiok',30000,'usiok');engine.postMessage('usi');await p;engine.postMessage('setoption name EvalDir value .');engine.postMessage('setoption name EvalFile value nn.bin');engine.postMessage('setoption name FV_SCALE value 24');engine.postMessage('setoption name USI_Hash value 32');engine.postMessage('setoption name Threads value 1');engine.postMessage('setoption name MultiPV value 1');p=waitLine(x=>x==='readyok',90000,'readyok');engine.postMessage('isready');await p;engine.postMessage('setoption name USI_Ponder value false');engine.postMessage('usinewgame');ready=true;}
          async function search(moves,nodes){await init();lastInfo={};engine.postMessage('position startpos'+(moves?' moves '+moves:''));const p=waitLine(x=>x.startsWith('bestmove '),90000,'bestmove');engine.postMessage('go nodes '+nodes);const s=await p;return{move:(s.split(/\s+/)[1]||''),...lastInfo}}
          self.onmessage=async e=>{const m=e.data||{};try{if(m.type==='search'){self.postMessage({id:m.id,ok:true,kind,...await search(String(m.moves||''),Number(m.nodes)||50000)})}}catch(err){self.postMessage({id:m.id,ok:false,kind,error:String(err&&err.stack||err)})}};
          JS
          cat > "$ROOT/index.html" <<'HTML'
          <!doctype html><meta charset="utf-8"><body>fast comparison host</body>
          HTML
          cat > "$ROOT/server.cjs" <<'NODE'
          const h=require('http'),f=require('fs'),p=require('path'),r=__dirname,m={'.html':'text/html','.js':'text/javascript','.wasm':'application/wasm','.bin':'application/octet-stream'};h.createServer((q,s)=>{const n=new URL(q.url,'http://x').pathname.replace(/^\//,'')||'index.html',x=p.resolve(r,n);f.readFile(x,(e,d)=>{if(e){s.writeHead(404);return s.end()}for(const[k,v]of Object.entries({'Cross-Origin-Opener-Policy':'same-origin','Cross-Origin-Embedder-Policy':'require-corp','Cross-Origin-Resource-Policy':'same-origin','Cache-Control':'no-store'}))s.setHeader(k,v);s.setHeader('Content-Type',m[p.extname(x)]||'application/octet-stream');s.end(d)})}).listen(4173,'127.0.0.1');
          NODE
      - name: Firefox reusable-worker 10-position comparison
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/cmpfast/pw && cd /tmp/cmpfast/pw
          npm init -y >/dev/null; npm i --no-audit --no-fund playwright@1.55.0 >/dev/null; npx playwright install --with-deps firefox >/dev/null
          cat > compare.mjs <<'NODE'
          import{firefox}from'playwright';
          const positions=['','7g7f 3c3d','7g7f 3c3d 2g2f 8c8d','7g7f 3c3d 2g2f 8c8d 6g6f 4c4d','7g7f 3c3d 2g2f 8c8d 6g6f 4c4d 5g5f 5c5d','7g7f 3c3d 2g2f 8c8d 6g6f 4c4d 5g5f 5c5d 4g4f 6c6d','7g7f 3c3d 2g2f 8c8d 6g6f 4c4d 5g5f 5c5d 4g4f 6c6d 3g3f 7c7d','7g7f 3c3d 2g2f 8c8d 6g6f 4c4d 5g5f 5c5d 4g4f 6c6d 3g3f 7c7d 9g9f 1c1d','7g7f 3c3d 2g2f 8c8d 6g6f 4c4d 5g5f 5c5d 4g4f 6c6d 3g3f 7c7d 9g9f 1c1d 1g1f 9c9d','7g7f 3c3d 2g2f 8c8d 6g6f 4c4d 5g5f 5c5d 4g4f 6c6d 3g3f 7c7d 9g9f 1c1d 1g1f 9c9d 2f2e 8d8e'];
          const browser=await firefox.launch({headless:true}),page=await browser.newPage();await page.goto('http://127.0.0.1:4173/');
          const summary=await page.evaluate(async positions=>{
            function rpc(kind){const w=new Worker('./driver.js?kind='+kind+'&r='+Math.random());let seq=0,p=new Map();w.onmessage=e=>{const m=e.data||{},q=p.get(m.id);if(!q)return;p.delete(m.id);clearTimeout(q.t);m.ok?q.r(m):q.j(Error(m.error||'engine error'))};return{call:(moves,nodes)=>new Promise((r,j)=>{const id=++seq,t=setTimeout(()=>{p.delete(id);j(Error(kind+' timeout'))},120000);p.set(id,{r,j,t});w.postMessage({type:'search',id,moves,nodes})}),close:()=>w.terminate()}}
            const ref=rpc('new'),old=rpc('old'),neu=rpc('new'),rows=[];let oldMatch=0,newMatch=0;
            for(let i=0;i<positions.length;i++){const moves=positions[i],r=await ref.call(moves,180000),o=await old.call(moves,50000),n=await neu.call(moves,50000);const row={i,moves,ref:r,old:o,new:n,oldMatch:o.move===r.move,newMatch:n.move===r.move};if(row.oldMatch)oldMatch++;if(row.newMatch)newMatch++;rows.push(row)}
            ref.close();old.close();neu.close();return{positions:rows.length,oldMatch,newMatch,oldRate:oldMatch/rows.length,newRate:newMatch/rows.length,rows};
          },positions);
          console.log('FAST_SUMMARY',JSON.stringify(summary));for(const row of summary.rows)console.log('FAST_ROW',JSON.stringify(row));await browser.close();
          NODE
          node /tmp/cmpfast/site/server.cjs >/tmp/cmpfast/server.log 2>&1 & PID=$!; trap 'kill $PID 2>/dev/null||true' EXIT
          for i in $(seq 1 50);do curl -fsS http://127.0.0.1:4173/ >/dev/null&&break||sleep .2;done
          node compare.mjs 2>&1 | tee /tmp/cmpfast/result.log
          grep -F 'FAST_SUMMARY ' /tmp/cmpfast/result.log
      - name: Upload fast comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v970-old-new-fast
          path: |
            /tmp/cmpfast/result.log
            /tmp/cmpfast/runtime-sha.txt
            /tmp/cmpfast/server.log
          if-no-files-found: ignore
          retention-days: 2
