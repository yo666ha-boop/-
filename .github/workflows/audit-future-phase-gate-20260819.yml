name: Audit Future phase gate
on:
  pull_request:
    branches: [future-mobile-rerank20-runtime-20260819]
permissions:
  contents: read
  pull-requests: write
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install WebKit
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps webkit >/dev/null
      - name: Start COOP COEP server
        run: |
          cat >/tmp/coi-phase.mjs <<'NODE'
          import http from'http';import fs from'fs';import path from'path';const root=process.cwd(),mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.wasm':'application/wasm','.bin':'application/octet-stream','.jpg':'image/jpeg','.png':'image/png','.webp':'image/webp'};http.createServer((q,s)=>{let n=decodeURIComponent(new URL(q.url,'http://x').pathname);if(n.endsWith('/'))n+='index.html';const f=path.resolve(root,'.'+n);if(!f.startsWith(root)||!fs.existsSync(f)){s.writeHead(404);return s.end('404')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',mime[path.extname(f).toLowerCase()]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4206,'127.0.0.1');
          NODE
          node /tmp/coi-phase.mjs >/tmp/coi-phase.log 2>&1 &
          sleep 1
      - name: Run phase-gate audit
        run: |
          set -o pipefail
          node .github/scripts/audit-future-phase-gate-20260819.mjs 2>&1 | tee /tmp/phase.log
          test "$(grep -c '^PHASE_REF ' /tmp/phase.log)" -eq 16
          test "$(grep -c '^PHASE_ROW ' /tmp/phase.log)" -eq 32
          test "$(grep -c '^PHASE_SUMMARY ' /tmp/phase.log)" -eq 1
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### Future phase-gate audit'; echo '```text'; grep -E '^(PHASE_REF|PHASE_ROW|PHASE_SUMMARY)' /tmp/phase.log || true; echo '```'; } >/tmp/phase-report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/phase-report.md
