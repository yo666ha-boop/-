name: Audit top-six strength quality
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install matching Playwright package
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
      - name: Start COOP COEP server
        run: |
          cat >/tmp/coi-top6.mjs <<'NODE'
          import http from'http';import fs from'fs';import path from'path';const root=process.cwd(),mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.wasm':'application/wasm','.bin':'application/octet-stream','.jpg':'image/jpeg','.jpeg':'image/jpeg','.png':'image/png','.webp':'image/webp'};http.createServer((q,s)=>{let n=decodeURIComponent(new URL(q.url,'http://x').pathname);if(n.endsWith('/'))n+='index.html';const f=path.resolve(root,'.'+n);if(!f.startsWith(root)||!fs.existsSync(f)){s.writeHead(404);return s.end('404')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',mime[path.extname(f).toLowerCase()]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4221,'127.0.0.1');
          NODE
          node /tmp/coi-top6.mjs >/tmp/coi-top6.log 2>&1 &
          sleep 1
      - name: Audit representative top-six move quality
        run: |
          set -o pipefail
          node .github/scripts/audit-top6-strength-quality-20260820.mjs 2>&1 | tee /tmp/top6-strength.log
          grep -q '^PASS_TOP6_STRENGTH_QUALITY ' /tmp/top6-strength.log
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### Top-six strength quality'; echo '```text'; grep -E '^(TOP6_SUMMARY|PASS_TOP6_STRENGTH_QUALITY|Error:)' /tmp/top6-strength.log || true; echo '```'; } >/tmp/top6-report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/top6-report.md
