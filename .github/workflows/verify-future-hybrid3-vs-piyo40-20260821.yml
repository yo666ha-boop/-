name: Audit Future exact production-patch V9.70 reconstruction
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-future-hybrid3-vs-piyo40-20260821.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconstruct:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: yaneurao/YaneuraOu
          ref: 76d58ef2e4cf64116784f41fd4816425ab6817ee
          path: YaneuraOu
      - name: Record production artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.js | tee /tmp/prod-js.sha
          sha256sum shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.worker.js | tee /tmp/prod-worker.sha
          sha256sum shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.wasm | tee /tmp/prod-wasm.sha
          echo 'PRODUCTION_BUILD_INFO_BEGIN'
          cat shogi-v21528/yaneuraou/build-info.txt
          echo 'PRODUCTION_BUILD_INFO_END'
      - name: Recover and apply exact historical V9.70 thread lifecycle + live USI bridge patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 2fbda43b3ac86c38f7760e589ce4c52c15c65141
          git show 2fbda43b3ac86c38f7760e589ce4c52c15c65141:.github/workflows/diag-yaneuraou-v970-threadfix.yml > /tmp/threadfix.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          yml=Path('/tmp/threadfix.yml').read_text()
          key="python3 - <<'PY'"
          if key not in yml:
              raise SystemExit('threadfix python block not found')
          block=yml.split(key,1)[1]
          end='\n          PY'
          if end not in block:
              raise SystemExit('threadfix terminator not found')
          script=textwrap.dedent(block.split(end,1)[0].lstrip('\n'))
          Path('/tmp/v970-threadfix.py').write_text(script)
          PY
          python3 /tmp/v970-threadfix.py
          grep -F 'wasmNativeStarted' YaneuraOu/source/thread.cpp
          grep -F 'wasmWorkerReady' YaneuraOu/source/thread.cpp
          grep -F 'all_threads_started' YaneuraOu/source/thread.cpp
          grep -F 'EMSCRIPTEN_KEEPALIVE int usi_command' YaneuraOu/source/engine/yaneuraou-engine/yaneuraou-search.cpp
      - name: Apply exact historical WASM EvalFile option fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('YaneuraOu/source/eval/nnue/evaluate_nnue.cpp')
          s=p.read_text()
          needle='''    Options.add("EvalDir", Option(default_eval_dir, [](const Option& o) {\n                    std::string eval_dir = std::string(o);\n                    if (last_eval_dir != eval_dir)\n                    {\n                        // 評価関数フォルダ名の変更に際して、評価関数ファイルの読み込みフラグをクリアする。\n                        last_eval_dir = eval_dir;\n                        eval_loaded   = false;\n                    }\n                    return std::nullopt;\n                }));\n\n'''
          repl=needle+'''#if defined(__EMSCRIPTEN__)\n    // V9.70 regression fix: load_eval() reads Options["EvalFile"] on WASM.\n    Options.add("EvalFile", Option(EvalFileDefaultName));\n#endif\n\n'''
          if 'Options.add("EvalFile"' in s:
              raise SystemExit('EvalFile unexpectedly already exists')
          if needle not in s:
              raise SystemExit('EvalDir option block not found')
          p.write_text(s.replace(needle,repl,1))
          PY
          grep -n -A3 -B2 'Options.add("EvalFile"' YaneuraOu/source/eval/nnue/evaluate_nnue.cpp
      - name: Build exact source with production historical toolchain
        shell: bash
        run: |
          set -euo pipefail
          docker pull emscripten/emsdk:3.1.43 >/dev/null
          mkdir -p YaneuraOu/build/wasm/halfkp.noeval/lib
          docker run --rm -v "${{ github.workspace }}/YaneuraOu:/src" -w /src/source emscripten/emsdk:3.1.43 \
            bash -lc 'make clean && make -j2 tournament COMPILER=em++ TARGET_CPU=WASM YANEURAOU_EDITION=YANEURAOU_ENGINE_NNUE TARGET=../build/wasm/halfkp.noeval/lib/yaneuraou.halfkp.noeval.js EM_EXPORT_NAME=YaneuraOu_HalfKP_noeval EM_INITIAL_MEMORY_SIZE=167772160' \
            2>&1 | tee /tmp/reconstruct-build.log
      - name: Verify exports and compare byte hashes
        shell: bash
        run: |
          set -euo pipefail
          LIB=YaneuraOu/build/wasm/halfkp.noeval/lib
          test -s "$LIB/yaneuraou.halfkp.noeval.js"
          test -s "$LIB/yaneuraou.halfkp.noeval.worker.js"
          test -s "$LIB/yaneuraou.halfkp.noeval.wasm"
          node - <<'NODE'
          const fs=require('fs');
          const p='YaneuraOu/build/wasm/halfkp.noeval/lib/yaneuraou.halfkp.noeval.wasm';
          const ex=WebAssembly.Module.exports(new WebAssembly.Module(fs.readFileSync(p))).map(x=>x.name);
          console.log('FUTURE_RECON_EXPORTS',JSON.stringify(ex.filter(x=>/usi/i.test(x))));
          if(!ex.includes('usi_command'))throw Error('usi_command missing');
          NODE
          PROD_JS=$(cut -d' ' -f1 /tmp/prod-js.sha)
          PROD_WORKER=$(cut -d' ' -f1 /tmp/prod-worker.sha)
          PROD_WASM=$(cut -d' ' -f1 /tmp/prod-wasm.sha)
          RECON_JS=$(sha256sum "$LIB/yaneuraou.halfkp.noeval.js" | cut -d' ' -f1)
          RECON_WORKER=$(sha256sum "$LIB/yaneuraou.halfkp.noeval.worker.js" | cut -d' ' -f1)
          RECON_WASM=$(sha256sum "$LIB/yaneuraou.halfkp.noeval.wasm" | cut -d' ' -f1)
          JS_MATCH=false; WORKER_MATCH=false; WASM_MATCH=false
          [ "$PROD_JS" = "$RECON_JS" ] && JS_MATCH=true
          [ "$PROD_WORKER" = "$RECON_WORKER" ] && WORKER_MATCH=true
          [ "$PROD_WASM" = "$RECON_WASM" ] && WASM_MATCH=true
          printf 'FUTURE_RECON_HASH_SUMMARY {"source":"76d58ef2e4cf64116784f41fd4816425ab6817ee","emscripten":"3.1.43","prodJS":"%s","reconJS":"%s","jsMatch":%s,"prodWorker":"%s","reconWorker":"%s","workerMatch":%s,"prodWasm":"%s","reconWasm":"%s","wasmMatch":%s}\n' "$PROD_JS" "$RECON_JS" "$JS_MATCH" "$PROD_WORKER" "$RECON_WORKER" "$WORKER_MATCH" "$PROD_WASM" "$RECON_WASM" "$WASM_MATCH"
          echo PASS_FUTURE_RECONSTRUCTION_HARNESS
      - name: Preserve build tail
        if: always()
        shell: bash
        run: |
          echo '=== RECONSTRUCTION BUILD TAIL ==='
          tail -120 /tmp/reconstruct-build.log 2>/dev/null || true
