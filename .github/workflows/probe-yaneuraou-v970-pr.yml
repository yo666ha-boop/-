name: YaneuraOu V9.70 PR probe
on:
  pull_request:
    paths:
      - '.github/workflows/probe-yaneuraou-v970-pr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v970:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yaneurao/YaneuraOu
          ref: 76d58ef2e4cf64116784f41fd4816425ab6817ee
          path: YaneuraOu970

      - name: Prepare V9.70 browser build
        shell: bash
        run: |
          set -euxo pipefail
          grep -F 'name: "halfkp.noeval"' YaneuraOu970/script/wasm_build.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('YaneuraOu970/source/Makefile')
          s=p.read_text()
          old='-s PTHREAD_POOL_SIZE=32'
          if old not in s:
              raise SystemExit('pthread marker missing')
          p.write_text(s.replace(old,'-s PTHREAD_POOL_SIZE=2',1))
          PY
          grep -F 'PTHREAD_POOL_SIZE=2' YaneuraOu970/source/Makefile
          test $(stat -c%s shogi-v21528/yaneuraou/nn.bin) -gt 60000000

      - name: Build HalfKP noeval
        shell: bash
        run: |
          set -euxo pipefail
          docker pull emscripten/emsdk:3.1.43
          docker run --rm \
            -v "${{ github.workspace }}/YaneuraOu970:/src" \
            -w /src \
            emscripten/emsdk:3.1.43 \
            node script/wasm_build.js halfkp.noeval \
            2>&1 | tee /tmp/v970-build.log
          LIB=YaneuraOu970/build/wasm/halfkp.noeval/lib
          test -s "$LIB/yaneuraou.halfkp.noeval.js"
          test -s "$LIB/yaneuraou.halfkp.noeval.worker.js"
          test -s "$LIB/yaneuraou.halfkp.noeval.wasm"
          echo "V970_WASM_BYTES=$(stat -c%s "$LIB/yaneuraou.halfkp.noeval.wasm")"

      - name: Install Chromium browser probe
        shell: bash
        run: |
          mkdir -p /tmp/v970probe
          cd /tmp/v970probe
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser Worker proof with current Suisho5
        shell: bash
        run: |
          set -euxo pipefail
          ROOT=/tmp/v970probe/site
          mkdir -p "$ROOT/yaneuraou"
          LIB="${{ github.workspace }}/YaneuraOu970/build/wasm/halfkp.noeval/lib"
          cp "$LIB"/yaneuraou.halfkp.noeval.js "$ROOT/yaneuraou/"
          cp "$LIB"/yaneuraou.halfkp.noeval.worker.js "$ROOT/yaneuraou/"
          cp "$LIB"/yaneuraou.halfkp.noeval.wasm "$ROOT/yaneuraou/"
          cp shogi-v21528/yaneuraou/nn.bin "$ROOT/yaneuraou/"
          cp shogi-v21528/future-yaneura-worker21528.js "$ROOT/"

          cat > "$ROOT/index.html" <<'HTML'
          <!doctype html><meta charset="utf-8"><body data-result="running">starting</body>
          <script>
          (async()=>{
            const b=document.body, logs=[];
            const out=x=>{logs.push(x);console.log(x);b.textContent=logs.join('\n')};
            try{
              out('COI '+crossOriginIsolated+' SAB '+typeof SharedArrayBuffer);
              if(!crossOriginIsolated||typeof SharedArrayBuffer!=='function') throw Error('COI unavailable');
              const w=new Worker('./future-yaneura-worker21528.js?v970='+Date.now());
              let seq=0; const pending=new Map();
              w.onmessage=e=>{const m=e.data||{};if(m.type==='stage'){out('STAGE '+m.text);return}if(m.type==='result'){const p=pending.get(m.id);if(!p)return;pending.delete(m.id);m.ok?p.resolve(m):p.reject(Error(m.error||'worker result error'))}};
              const call=(type,payload={},timeout=180000)=>new Promise((resolve,reject)=>{const id='q'+(++seq);pending.set(id,{resolve,reject});w.postMessage({type,id,...payload});setTimeout(()=>{if(pending.delete(id))reject(Error(type+' timeout'))},timeout)});
              const init=await call('init'); out('INIT '+JSON.stringify(init));
              const start='lnsgkgsnl/1r5b1/ppppppppp/9/9/9/PPPPPPPPP/1B5R1/LNSGKGSNL b - 1';
              const a=await call('bestmove',{sfen:start,ms:3000,multiPV:1}); out('START_3S '+JSON.stringify(a));
              const c=await call('bestmove',{sfen:start,ms:15000,multiPV:1}); out('START_15S '+JSON.stringify(c));
              if(!a.token||a.token==='resign'||!c.token||c.token==='resign')throw Error('no usable bestmove');
              if(!(c.info&&Number(c.info.nodes)>0&&Number(c.info.depth)>0))throw Error('missing search stats');
              b.dataset.result='ok'; out('PASS V9.70 Suisho5 browser bestmove '+c.token+' depth='+c.info.depth+' nodes='+c.info.nodes); w.terminate();
            }catch(e){b.dataset.result='error';out('FAIL '+String(e&&e.stack||e))}
          })();
          </script>
          HTML

          cat > "$ROOT/server.cjs" <<'NODE'
          const h=require('http'),f=require('fs'),p=require('path'),r=__dirname,m={'.html':'text/html','.js':'text/javascript','.wasm':'application/wasm','.bin':'application/octet-stream'};
          h.createServer((q,s)=>{const n=new URL(q.url,'http://x').pathname.replace(/^\//,'')||'index.html',x=p.resolve(r,n);f.readFile(x,(e,d)=>{if(e){s.writeHead(404);return s.end()}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',m[p.extname(x)]||'application/octet-stream');s.end(d)})}).listen(4173,'127.0.0.1');
          NODE

          cat > /tmp/v970probe/check.mjs <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          page.on('console',m=>console.log('CONSOLE',m.type(),m.text()));
          page.on('pageerror',e=>console.log('PAGEERROR',e.stack||e));
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'load'});
          await page.waitForFunction(()=>['ok','error'].includes(document.body.dataset.result),{timeout:240000});
          const r=await page.evaluate(()=>({state:document.body.dataset.result,text:document.body.textContent}));
          console.log('FINAL',JSON.stringify(r));
          await browser.close();
          if(r.state!=='ok') process.exit(1);
          NODE

          node "$ROOT/server.cjs" >/tmp/v970-server.log 2>&1 & PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep .2; done
          cd /tmp/v970probe
          node check.mjs 2>&1 | tee /tmp/v970-browser.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v970-browser-probe
          path: |
            /tmp/v970-build.log
            /tmp/v970-browser.log
            /tmp/v970-server.log
            YaneuraOu970/build/wasm/halfkp.noeval/lib/yaneuraou.halfkp.noeval.js
            YaneuraOu970/build/wasm/halfkp.noeval/lib/yaneuraou.halfkp.noeval.worker.js
            YaneuraOu970/build/wasm/halfkp.noeval/lib/yaneuraou.halfkp.noeval.wasm
          if-no-files-found: warn
          retention-days: 2