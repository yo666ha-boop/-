name: Diagnose Future real4s deep replay
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-future-real4s-deep-replay-20260822.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKit
        run: |
          mkdir -p /tmp/fdeep && cd /tmp/fdeep
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps webkit >/dev/null
      - name: Start COI server
        run: |
          cat >/tmp/fdeep/server.mjs <<'NODE'
          import http from'node:http';import fs from'node:fs';import path from'node:path';const root=process.env.GITHUB_WORKSPACE,m={'.html':'text/html','.js':'text/javascript','.wasm':'application/wasm','.bin':'application/octet-stream'};http.createServer((q,s)=>{let u=decodeURIComponent((q.url||'/').split('?')[0]);if(u==='/')u='/shogi-v21528/index.html';const f=path.resolve(root,'.'+u);if(!f.startsWith(path.resolve(root))||!fs.existsSync(f)){s.writeHead(404);return s.end('404')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',m[path.extname(f)]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4186,'127.0.0.1');
          NODE
          node /tmp/fdeep/server.mjs >/tmp/fdeep/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4186/shogi-v21528/index.html >/dev/null && exit 0; sleep 1; done; exit 1
      - name: Replay exact real4s practical and compare 15s deep
        run: |
          cat >/tmp/fdeep/a.mjs <<'NODE'
          import{webkit,devices}from'playwright';
          const R='abcdefghi',I='lnsgkgsnl/1r5b1/ppppppppp/9/9/9/PPPPPPPPP/1B5R1/LNSGKGSNL';
          const M=`7g7f 8c8d 4i5h 3c3d 8h2b+ 3a2b 5i4i B*3c 6g6f 3c6f 2h3h 6f9i+ 8i7g 9i7g 6i6h 7g7f 6h6g 7f8g 7i8h 8g8h 6g5f 8h9g 5h6h N*3e 5f4f 3e2g+ B*1e 5a5b 4f4e 1c1d 3i2h 2g3h 4i3h 1d1e 2h3i R*5i 4e3d B*4i 3h4h 5i7i+ 3g3f 7i6h 4h3g 9g6d N*5e 6d5e 3g2f G*2g 2f3e S*2f`.split(/\s+/);
          function S(ms){const b=new Map(),h={b:{},w:{}};for(let r=0;r<9;r++){let f=9,pr=false;for(const c of I.split('/')[r]){if(c==='+'){pr=true;continue}if(/\d/.test(c)){f-=+c;continue}const side=c===c.toUpperCase()?'b':'w';b.set(''+f+R[r],{side,k:c.toUpperCase(),pr});pr=false;f--}}let t='b';for(const x of ms){if(/^[PLNSGBR]\*/.test(x)){const k=x[0],d=x.slice(2);h[t][k]=(h[t][k]||0)-1;b.set(d,{side:t,k,pr:false})}else{const a=x.slice(0,2),d=x.slice(2,4),q=b.get(a),c=b.get(d);if(!q)throw Error('missing '+x+' after '+ms.join(' '));if(c)h[t][c.k]=(h[t][c.k]||0)+1;b.delete(a);b.set(d,{...q,pr:q.pr||x.endsWith('+')})}t=t==='b'?'w':'b'}const rows=[];for(let r=0;r<9;r++){let z='',e=0;for(let f=9;f;f--){const q=b.get(''+f+R[r]);if(!q){e++;continue}if(e){z+=e;e=0}z+=(q.pr?'+':'')+(q.side==='b'?q.k:q.k.toLowerCase())}if(e)z+=e;rows.push(z)}let hand='';for(const side of['b','w'])for(const k of['R','B','G','S','N','L','P']){const n=h[side][k]||0;if(n>0)hand+=(n>1?n:'')+(side==='b'?k:k.toLowerCase())}return rows.join('/')+' '+t+' '+(hand||'-')+' '+(ms.length+1)}
          const b=await webkit.launch({headless:true}),p=await b.newPage({...devices['iPhone 14']});await p.goto('http://127.0.0.1:4186/shogi-v21528/index.html?x='+Date.now(),{waitUntil:'domcontentloaded'});if(!await p.evaluate(()=>crossOriginIsolated))throw Error('COI');
          async function make(){return p.evaluate(async()=>{const w=new Worker('./future-yaneura-worker21528.js?v='+Math.random());let n=0,P=new Map();w.onmessage=e=>{const m=e.data||{},q=P.get(m.id);if(!q||m.type!=='result')return;P.delete(m.id);clearTimeout(q.t);m.ok?q.r(m):q.j(Error(m.error||'worker'))};const call=(type,x={})=>new Promise((r,j)=>{const id=++n,t=setTimeout(()=>j(Error(type+' timeout')),190000);P.set(id,{r,j,t});w.postMessage({type,id,...x})});const profile=await call('init');const key='w'+Math.random();window[key]={w,call};return{key,profile}})}
          const call=(key,pos,o)=>p.evaluate(({key,pos,o})=>window[key].call('bestmove',{sfen:pos,...o}),{key,pos,o});const kill=key=>p.evaluate(key=>{window[key].w.terminate();delete window[key]},key);
          const targets=[21,23,25,27,29,31,33,35,37,39,41],rows=[];
          for(const ply of targets){const pos=S(M.slice(0,ply-1)),actual=M[ply-1];for(const [mode,opt] of [['real4s',{ms:4000,multiPV:5,adaptive:false}],['deep15',{ms:15000,multiPV:5,adaptive:false}]]){const W=await make(),t=Date.now(),r=await call(W.key,pos,opt),cs=r.candidates||[];await kill(W.key);const chosen=cs.find(x=>x.token===actual),best=cs.find(x=>x.rank===1)||cs[0];let loss=null;if(Number.isFinite(best?.cp)&&Number.isFinite(chosen?.cp))loss=Math.max(0,best.cp-chosen.cp);const row={ply,mode,actual,token:r.token,cp:r.info?.cp,mate:r.info?.mate,depth:r.info?.depth,nodes:r.info?.nodes,elapsedMs:Date.now()-t,actualRank:chosen?.rank??null,actualCp:chosen?.cp,actualMate:chosen?.mate??null,best:best?.token,bestCp:best?.cp,bestMate:best?.mate??null,lossCp:loss,top5:cs.slice(0,5).map(x=>({rank:x.rank,token:x.token,cp:x.cp,mate:x.mate}))};rows.push(row);console.log('FUTURE_REAL4S_DEEP_ROW '+JSON.stringify(row))}}
          const out=targets.map(ply=>{const r=rows.find(x=>x.ply===ply&&x.mode==='real4s'),d=rows.find(x=>x.ply===ply&&x.mode==='deep15');return{ply,actual:r.actual,real4:r.token,deep:d.token,same:r.token===d.token,actualDeepRank:d.actualRank,actualDeepLoss:d.lossCp,real4Mate:r.mate??null,deepMate:d.mate??null,real4Cp:r.cp,deepCp:d.cp}});console.log('FUTURE_REAL4S_DEEP_SUMMARY '+JSON.stringify(out));console.log('FUTURE_REAL4S_DEEP_DELTA '+JSON.stringify({different:out.filter(x=>!x.same).map(x=>x.ply),outsideDeep5:out.filter(x=>x.actualDeepRank==null).map(x=>x.ply),loss100:out.filter(x=>Number.isFinite(x.actualDeepLoss)&&x.actualDeepLoss>=100).map(x=>({ply:x.ply,loss:x.actualDeepLoss,actual:x.actual,deep:x.deep})),negativeMate4:out.filter(x=>Number.isFinite(x.real4Mate)&&x.real4Mate<0).map(x=>x.ply),negativeMate15:out.filter(x=>Number.isFinite(x.deepMate)&&x.deepMate<0).map(x=>x.ply)}));console.log('PASS_FUTURE_REAL4S_DEEP_REPLAY');await b.close();
          NODE
          cd /tmp/fdeep && node a.mjs 2>&1 | tee /tmp/fdeep/a.log
          grep -F 'FUTURE_REAL4S_DEEP_DELTA ' /tmp/fdeep/a.log
          grep -F 'PASS_FUTURE_REAL4S_DEEP_REPLAY' /tmp/fdeep/a.log
      - name: Preserve evidence
        if: always()
        run: grep -E '^(FUTURE_REAL4S_DEEP_ROW|FUTURE_REAL4S_DEEP_SUMMARY|FUTURE_REAL4S_DEEP_DELTA|PASS_FUTURE_REAL4S_DEEP_REPLAY)' /tmp/fdeep/a.log | tail -100 || true
