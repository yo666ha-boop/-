name: Diagnose Future book stable SinglePV vs Piyo Lv40
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-future-fresh-deep15-piyo40-20260822.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  practical:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium and WebKit
        run: |
          set -euo pipefail
          mkdir -p /tmp/fbook && cd /tmp/fbook
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
      - name: Start local COI server
        run: |
          cat >/tmp/fbook/server.mjs <<'NODE'
          import http from'node:http';import fs from'node:fs';import path from'node:path';const root=process.env.GITHUB_WORKSPACE,m={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.wasm':'application/wasm','.bin':'application/octet-stream','.png':'image/png','.jpg':'image/jpeg','.json':'application/json'};http.createServer((q,s)=>{let u=decodeURIComponent((q.url||'/').split('?')[0]);if(u==='/')u='/shogi-v21528/index.html';const f=path.resolve(root,'.'+u);if(!f.startsWith(path.resolve(root))){s.writeHead(403);return s.end('forbidden')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');fs.readFile(f,(e,b)=>{if(e){s.writeHead(404);return s.end('not found')}s.setHeader('Content-Type',m[path.extname(f)]||'application/octet-stream');s.writeHead(200);s.end(b)})}).listen(4173,'127.0.0.1');
          NODE
          node /tmp/fbook/server.mjs >/tmp/fbook/server.log 2>&1 &
          for i in $(seq 1 30);do curl -fsS http://127.0.0.1:4173/shogi-v21528/index.html >/dev/null&&exit 0;sleep 1;done;cat /tmp/fbook/server.log;exit 1
      - name: Derive exact practical harness with fixed horizon and stable SinglePV
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/verify-future-current-vs-piyo40-20260820.yml').read_text()
          a="          cat >/tmp/fpiyo/match.mjs <<'NODE'\n"
          i=src.index(a)+len(a); j=src.index("\n          NODE\n",i)
          js='\n'.join(line[10:] if line.startswith('          ') else line for line in src[i:j].splitlines())+'\n'
          old="const search=(pos,o={})=>f.evaluate(({pos,o})=>window.__call('bestmove',{sfen:pos,...o}),{pos,o});"
          new="await f.evaluate(()=>{try{window.__w?.terminate()}catch(e){};window.__w=null;window.__call=null});const search=(pos,o={})=>f.evaluate(async({pos,o})=>{const w=new Worker('./future-yaneura-worker21528.js?v=bookstable-'+Date.now()+'-'+Math.random());let n=0,P=new Map();w.onmessage=e=>{const m=e.data||{},q=P.get(m.id);if(!q||m.type!=='result')return;P.delete(m.id);clearTimeout(q.t);m.ok?q.r(m):q.j(Error(m.error||'worker'))};const call=(type,x={})=>new Promise((r,j)=>{const id=++n,t=setTimeout(()=>j(Error(type+' timeout')),190000);P.set(id,{r,j,t});w.postMessage({type,id,...x})});try{await call('init');return await call('bestmove',{sfen:pos,...o,adaptive:false})}finally{try{w.terminate()}catch(e){}}},{pos,o});"
          if old not in js: raise SystemExit('search marker missing')
          js=js.replace(old,new,1)
          marker="let ms=[],result='MAX_REACHED';const dec=[];"
          book_moves="7g7f 4a3b 4i5h 3c3d 8h2b+ 3a2b 2h3h B*3c 6g6f 3c6f 8g8f 6f9i+ B*7g 9i8i 5i4i 8i9h 5h6g 9h9g 6g6h N*3e 7i8h 9g9h 3i4h 9h7f 6i5h 3e2g+ 7g2b+ 3b2b 3h3i"
          insert=f"const bookSeq=`{book_moves}`.split(/\\s+/);const book=new Map();for(let ply=1;ply<=29;ply+=2)book.set(sfen(bookSeq.slice(0,ply-1)),bookSeq[ply-1]);async function policy(pos,ply){{if(book.has(pos)){{const token=book.get(pos);console.log('FUTURE_BOOK_STABLE_POLICY '+JSON.stringify({{ply,source:'book29',token}}));return{{token,info:{{policy:'book29'}}}}}}const a=await search(pos,{{ms:7000,multiPV:1}}),bad=(Number.isFinite(a.info?.mate)&&a.info.mate<0)||(Number.isFinite(a.info?.cp)&&a.info.cp<=50);if(!bad){{console.log('FUTURE_BOOK_STABLE_POLICY '+JSON.stringify({{ply,source:'sp7',token:a.token,cp:a.info?.cp,mate:a.info?.mate}}));return a}}const b=await search(pos,{{ms:15000,multiPV:1}});if(a.token===b.token){{console.log('FUTURE_BOOK_STABLE_POLICY '+JSON.stringify({{ply,source:'sp15-stable7',token:b.token,cp7:a.info?.cp,cp15:b.info?.cp}}));return b}}const c=await search(pos,{{ms:30000,multiPV:1}});console.log('FUTURE_BOOK_STABLE_POLICY '+JSON.stringify({{ply,source:b.token===c.token?'sp30-stable15':'sp30-unstable',token:c.token,sp7:a.token,sp15:b.token,sp30:c.token,cp30:c.info?.cp,mate30:c.info?.mate}}));return c}};{marker}"
          if marker not in js: raise SystemExit('loop marker missing')
          js=js.replace(marker,insert,1)
          old2="const ply=ms.length+1,pos=sfen(ms),r=await search(pos,{ms:4000,multiPV:1}),u=String(r.token||'');"
          new2="const ply=ms.length+1,pos=sfen(ms),r=await policy(pos,ply),u=String(r.token||'');"
          if old2 not in js: raise SystemExit('move marker missing')
          js=js.replace(old2,new2,1)
          js=js.replace('FUTURE_CURRENT_PROFILE','FUTURE_BOOK_STABLE_PROFILE').replace('FUTURE_CURRENT_MOVE','FUTURE_BOOK_STABLE_MOVE').replace('FUTURE_CURRENT_AUDIT','FUTURE_BOOK_STABLE_AUDIT').replace('FUTURE_CURRENT_PRACTICAL_SUMMARY','FUTURE_BOOK_STABLE_PRACTICAL_SUMMARY').replace('PASS_FUTURE_CURRENT_PIYO40_HARNESS','PASS_FUTURE_BOOK_STABLE_PIYO40_HARNESS')
          Path('/tmp/fbook/match.mjs').write_text(js)
          PY
          node --check /tmp/fbook/match.mjs
          grep -F 'FUTURE_BOOK_STABLE_POLICY' /tmp/fbook/match.mjs | head -1
      - name: Run book stable practical match
        env:
          ATTEMPT: 1
        run: |
          cd /tmp/fbook
          node match.mjs 2>&1 | tee /tmp/fbook/match.log
          grep -F 'FUTURE_BOOK_STABLE_PRACTICAL_SUMMARY ' /tmp/fbook/match.log
          grep -F 'PASS_FUTURE_BOOK_STABLE_PIYO40_HARNESS' /tmp/fbook/match.log
      - name: Preserve evidence
        if: always()
        run: |
          grep -E '^(PIYO40_PROFILE|FUTURE_BOOK_STABLE_PROFILE|FUTURE_BOOK_STABLE_POLICY|FUTURE_BOOK_STABLE_MOVE|PIYO40_COMMIT|PIYO40_HEARTBEAT|PIYO40_REPLY|FUTURE_BOOK_STABLE_AUDIT|FUTURE_BOOK_STABLE_PRACTICAL_SUMMARY|PASS_FUTURE_BOOK_STABLE_PIYO40_HARNESS)' /tmp/fbook/match.log | tail -320 || true
