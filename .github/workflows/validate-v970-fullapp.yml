name: Validate V9.70 full app integration
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/validate-v970-fullapp.yml'
      - 'shogi-v21528/future-yaneura-worker21528.js'
      - 'shogi-v21528/yaneuraou/**'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  fullapp:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local COOP COEP server
        shell: bash
        run: |
          cat > /tmp/server.cjs <<'NODE'
          const http=require('http'),fs=require('fs'),path=require('path');
          const root=process.cwd();
          const mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.part':'text/plain; charset=utf-8','.css':'text/css; charset=utf-8','.wasm':'application/wasm','.bin':'application/octet-stream','.jpg':'image/jpeg','.jpeg':'image/jpeg','.png':'image/png','.webp':'image/webp','.svg':'image/svg+xml'};
          http.createServer((req,res)=>{
            const u=new URL(req.url,'http://x');
            let rel=decodeURIComponent(u.pathname).replace(/^\/+/, '')||'shogi-v21528/index.html';
            const f=path.resolve(root,rel);
            if(!f.startsWith(root+path.sep)){res.writeHead(403);return res.end('forbidden')}
            fs.readFile(f,(e,d)=>{
              if(e){res.writeHead(404);return res.end('not found '+rel)}
              res.setHeader('Cross-Origin-Opener-Policy','same-origin');
              res.setHeader('Cross-Origin-Embedder-Policy','require-corp');
              res.setHeader('Cross-Origin-Resource-Policy','same-origin');
              res.setHeader('Cache-Control','no-store');
              res.setHeader('Content-Type',mime[path.extname(f).toLowerCase()]||'application/octet-stream');
              res.end(d);
            });
          }).listen(4173,'127.0.0.1');
          NODE
      - name: Install Playwright browsers
        shell: bash
        run: |
          mkdir -p /tmp/fullapp-pw && cd /tmp/fullapp-pw
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps firefox webkit chromium >/dev/null
      - name: Run actual app integration checks
        shell: bash
        run: |
          cat > /tmp/fullapp-pw/test.mjs <<'NODE'
          import {firefox,webkit,chromium} from 'playwright';
          import fs from 'fs';
          const cases=[
            {name:'desktop-firefox',type:firefox,ua:null},
            {name:'iphone-webkit',type:webkit,ua:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'},
            {name:'fire-silk',type:chromium,ua:'Mozilla/5.0 (Linux; Android 9; KFKAWI Build/PS7314.1745N) AppleWebKit/537.36 (KHTML, like Gecko) Silk/130.4.1 like Chrome/130.0.0.0 Safari/537.36'}
          ];
          const out=[];
          for(const c of cases){
            const br=await c.type.launch({headless:true});
            const ctx=await br.newContext(c.ua?{userAgent:c.ua}:{ });
            const p=await ctx.newPage();
            const errors=[];
            p.on('console',m=>{const s=m.text();console.log(c.name,'CONSOLE',s);if(m.type()==='error')errors.push(s)});
            p.on('pageerror',e=>errors.push(String(e)));
            await p.goto('http://127.0.0.1:4173/shogi-v21528/index.html?fullapp='+encodeURIComponent(c.name),{waitUntil:'domcontentloaded',timeout:120000});
            await p.waitForFunction(()=>window.AI_SHOGI_WEB_AUDIT&&window.AI_SHOGI_WEB_AUDIT.characters===26,{timeout:120000});
            const audit=await p.evaluate(()=>window.AI_SHOGI_WEB_AUDIT);
            const app=await p.evaluate(()=>window.AI_SHOGI_V21528||null);
            const fa=await p.evaluate(()=>window.AI_SHOGI_FUTURE_AUDIT21520||null);
            if(!app||app.characters!==26||app.futureIndex!==25||app.rating!==3400)throw Error(c.name+' app metadata '+JSON.stringify(app));
            if(!audit||audit.characters!==26||!audit.future)throw Error(c.name+' audit '+JSON.stringify(audit));
            if(!fa||!fa.card||!fa.sfenOK)throw Error(c.name+' future audit '+JSON.stringify(fa));
            const init=await p.evaluate(async()=>{await window.AI_SHOGI_YANEURAOU_FUTURE.init();return window.AI_SHOGI_YANEURAOU_FUTURE.status()});
            if(!init.ready||init.error||!init.crossOriginIsolated||!init.worker)throw Error(c.name+' engine init '+JSON.stringify(init));
            const cards=await p.locator('#chars .ch').count();
            const futureCards=await p.locator('[data-future-mitsuki="1"]').count();
            const r={name:c.name,cards,futureCards,audit,app,fa,init,consoleErrors:errors.slice(-5)};
            console.log('FULLAPP_PASS',JSON.stringify(r));out.push(r);
            await br.close();
          }
          fs.writeFileSync('/tmp/fullapp-proof.json',JSON.stringify({ok:true,profiles:out},null,2));
          NODE
          node /tmp/server.cjs >/tmp/fullapp-server.log 2>&1 & PID=$!
          trap 'kill $PID 2>/dev/null||true' EXIT
          for i in $(seq 1 50);do curl -fsS http://127.0.0.1:4173/shogi-v21528/index.html >/dev/null&&break||sleep .2;done
          cd /tmp/fullapp-pw
          node test.mjs 2>&1 | tee /tmp/fullapp.log
          grep -c '^FULLAPP_PASS ' /tmp/fullapp.log | grep -x 3
      - name: Report result on PR 8
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "### V9.70 full-app integration: ${JOB_STATUS}"
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            if [ -f /tmp/fullapp.log ]; then
              echo '```text'
              grep -E '^(FULLAPP_PASS|[a-z-]+ CONSOLE (PASS|FAIL|STAGE|INIT|BEST))' /tmp/fullapp.log | tail -80 || true
              echo '```'
            else
              echo "fullapp.log was not created."
            fi
          } > /tmp/pr-report.md
          gh pr comment 8 --body-file /tmp/pr-report.md
          test "$JOB_STATUS" = success
