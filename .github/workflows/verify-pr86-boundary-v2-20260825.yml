name: Verify PR86 boundary v2 deep loss
on:
  push:
    branches: [audit-pr86-boundary-v2-20260825]
permissions:
  contents: read
jobs:
  boundary-v2:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
      - name: Build duel page
        run: node .github/scripts/build-boundary-duel-page-pr86-v2-20260825.mjs
      - name: Start server
        run: |
          node .github/scripts/coi-lower8-quality-server-20260825.mjs >/tmp/pr86-bdv2-server.log 2>&1 &
          sleep 1
      - name: Run deep-loss boundary audit
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/audit-pr86-boundary-duels-v2-20260825.mjs 2>&1 | tee /tmp/pr86-bdv2.log
          grep -F 'PASS_PR86_BOUNDARY_V2_DEEP_LOSS_AUDIT' /tmp/pr86-bdv2.log
