name: Inspect Piyo hand piece DOM
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-piyo-hand-20260819.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Recreate bishop-in-hand position and inspect DOM
        shell: bash
        run: |
          cat > /tmp/pw/inspect.mjs <<'NODE'
          import { chromium } from 'playwright';
          const br=await chromium.launch({headless:true}),p=await br.newPage({viewport:{width:1280,height:1000}});
          await p.goto('https://www.studiok-i.net/ps/',{waitUntil:'domcontentloaded',timeout:120000});
          await p.waitForSelector('#btnNewGame',{timeout:120000});await p.waitForTimeout(2000);
          // Use built-in visible paste-kifu dialog by opening menu and finding the paste command.
          await p.locator('img[alt="メニュー"]').first().click();await p.waitForTimeout(200);
          const menu=await p.evaluate(()=>[...document.querySelectorAll('[id]')].filter(e=>!!e.offsetParent&&/kif|paste/i.test(e.id)).map(e=>({id:e.id,text:(e.textContent||'').trim(),tag:e.tagName})));
          console.log('HAND_MENU',JSON.stringify(menu));
          const pasteId=menu.find(x=>/paste/i.test(x.id))?.id||menu.find(x=>/貼り付け/.test(x.text))?.id;
          if(!pasteId)throw Error('paste menu item not found');await p.locator('#'+pasteId).click();await p.waitForTimeout(200);
          const seq='position startpos moves 4i5h 3c3d 2h3h 8c8d 7g7f 8d8e 8h2b+ 3a2b';
          await p.fill('#dialogPasteKifBox',seq);await p.click('#btnDialogPasteKifOK');await p.waitForTimeout(800);
          const out=await p.evaluate(()=>{
            const board=document.querySelector('#board_img').getBoundingClientRect();
            const all=[...document.querySelectorAll('img')].map(i=>{const r=i.getBoundingClientRect();return{id:i.id,alt:i.alt,src:i.getAttribute('src'),cls:i.className,parentId:i.parentElement?.id,parentCls:i.parentElement?.className,x:r.x,y:r.y,w:r.width,h:r.height,vis:!!(r.width&&r.height),insideBoard:r.x>=board.x&&r.x<board.x+board.width&&r.y>=board.y&&r.y<board.y+board.height}}).filter(x=>x.vis);
            const elems=[...document.querySelectorAll('[id]')].filter(e=>/koma|komadai|mochi|hand|KA|ka/i.test(e.id)).map(e=>{const r=e.getBoundingClientRect();return{id:e.id,tag:e.tagName,cls:e.className,text:(e.textContent||'').trim().slice(0,100),x:r.x,y:r.y,w:r.width,h:r.height,vis:!!(r.width&&r.height),html:e.outerHTML.slice(0,400)}}).filter(x=>x.vis);
            return{board:{x:board.x,y:board.y,w:board.width,h:board.height},imgs:all,elems};
          });
          console.log('HAND_DOM',JSON.stringify(out));
          await br.close();
          NODE
          cd /tmp/pw && node inspect.mjs 2>&1 | tee /tmp/hand.log
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### Piyo hand DOM'; echo '```text'; grep -E '^(HAND_MENU|HAND_DOM)' /tmp/hand.log || true; echo '```'; } >/tmp/report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/report.md
