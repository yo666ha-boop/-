name: Shogi Future loss onset diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/shogi-future-loss-onset.yml'
      - 'shogi-v21528/future-yaneura-worker21528.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  loss-onset:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright WebKit
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Prepare COI test site
        shell: bash
        run: |
          ROOT=/tmp/lossonset/site
          mkdir -p "$ROOT/yaneuraou"
          cp shogi-v21528/future-yaneura-worker21528.js "$ROOT/"
          cp shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.js "$ROOT/yaneuraou/"
          cp shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.worker.js "$ROOT/yaneuraou/"
          cp shogi-v21528/yaneuraou/yaneuraou.halfkp.noeval.wasm "$ROOT/yaneuraou/"
          cp shogi-v21528/yaneuraou/nn.bin "$ROOT/yaneuraou/"
          cat > "$ROOT/server.cjs" <<'NODE'
          const h=require('http'),f=require('fs'),p=require('path'),r=__dirname,m={'.js':'text/javascript','.wasm':'application/wasm','.bin':'application/octet-stream'};
          h.createServer((q,s)=>{const n=new URL(q.url,'http://x').pathname.replace(/^\//,''),x=p.resolve(r,n);if(!x.startsWith(r)){s.writeHead(403);return s.end()}f.readFile(x,(e,d)=>{if(e){s.writeHead(404);return s.end()}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',m[p.extname(x)]||'application/octet-stream');s.end(d)})}).listen(4184,'127.0.0.1');
          NODE
          node "$ROOT/server.cjs" >/tmp/lossonset-server.log 2>&1 &
          sleep 2
      - name: Evaluate actual Piyo checkpoints
        shell: bash
        run: |
          cat > lossonset.mjs <<'NODE'
          import {webkit,devices} from 'playwright';
          const P=[
            {ply:0,sfen:'lnsgkgsnl/1r5b1/ppppppppp/9/9/9/PPPPPPPPP/1B5R1/LNSGKGSNL b - 1'},
            {ply:8,sfen:'lnsgkgsnl/1r5b1/p1ppppppp/2P6/9/9/P+p1PPPPPP/1B4R2/LNSGKGSNL b p 9'},
            {ply:12,sfen:'ln1gkgsnl/3s3b1/p1ppppppp/2P6/1r7/5B3/P+p1PPPPPP/6R2/LNSGKGSNL b p 13'},
            {ply:16,sfen:'ln1gkgsnl/3s5/p1pppp1pp/2P3p2/1r7/5B3/P+p1PPPPPP/4G1R2/+bNSG1KSNL b lp 17'},
            {ply:24,sfen:'ln1g1gsnl/5k3/p2ppp1pp/2Ps2p2/1r7/5B3/P1+pPPPPPP/2G1G1R2/+b1S2KSNL b nl2p 25'},
            {ply:34,sfen:'l2g1gsnl/5k3/p1nppp1pp/3s2p2/9/5B3/P2PPPPPP/3G2R2/2+r2KSNL b Bgsnl4p 35'},
            {ply:44,sfen:'l2g1gsnl/5k3/p1n1pp1pp/3p2p2/9/6P2/P2PP+l1PP/3G2R2/2+r1BKSNL b Nbg2s5p 45'}
          ];
          const browser=await webkit.launch({headless:true});
          const ctx=await browser.newContext({...devices['iPhone 13']});
          const page=await ctx.newPage();
          await page.goto('http://127.0.0.1:4184/future-yaneura-worker21528.js',{waitUntil:'load'}).catch(()=>{});
          const out=await page.evaluate(async P=>{
            const w=new Worker('http://127.0.0.1:4184/future-yaneura-worker21528.js?onset='+Date.now());
            let seq=0;const pending=new Map();
            w.onmessage=e=>{const m=e.data||{};if(m.type==='result'){const p=pending.get(m.id);if(!p)return;pending.delete(m.id);m.ok?p.resolve(m):p.reject(Error(m.error||'worker error'))}};
            const call=(type,payload={},timeout=180000)=>new Promise((resolve,reject)=>{const id='q'+(++seq);pending.set(id,{resolve,reject});w.postMessage({type,id,...payload});setTimeout(()=>{if(pending.delete(id))reject(Error(type+' timeout'))},timeout)});
            const init=await call('init');const rows=[];
            for(const p of P){
              const r=await call('bestmove',{sfen:p.sfen,ms:12000,multiPV:1},150000);
              rows.push({ply:p.ply,move:r.token,cp:r.info?.cp??null,mate:r.info?.mate??null,depth:r.info?.depth||0,nodes:r.info?.nodes||0,threads:r.info?.threads,hashMB:r.info?.hashMB});
            }
            w.terminate();return{init,rows};
          },P);
          console.log('LOSS_ONSET',JSON.stringify(out));
          if(out.rows.some(r=>!r.move||r.move==='resign'||!r.nodes||r.threads!==1||r.hashMB!==64))throw Error('checkpoint search/profile failure');
          let worstDrop=null;
          for(let i=1;i<out.rows.length;i++){
            const a=out.rows[i-1],b=out.rows[i];
            if(Number.isFinite(a.cp)&&Number.isFinite(b.cp)){
              const drop=b.cp-a.cp;
              if(!worstDrop||drop<worstDrop.drop)worstDrop={from:a.ply,to:b.ply,drop,fromCp:a.cp,toCp:b.cp};
            }
          }
          console.log('WORST_EVAL_DROP',JSON.stringify(worstDrop));
          await browser.close();
          NODE
          node lossonset.mjs 2>&1 | tee /tmp/lossonset.log
      - name: Upload loss-onset log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: future-loss-onset
          path: |
            /tmp/lossonset.log
            /tmp/lossonset-server.log
          retention-days: 2