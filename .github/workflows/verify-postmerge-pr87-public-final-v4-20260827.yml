name: Verify postmerge PR87 public final v4 20260827

on:
  push:
    branches:
      - validate-postmerge-pr87-public-final-v4-20260827
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-final-v4:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact main and clean validation delta
        shell: bash
        run: |
          set -euo pipefail
          MAIN='03abf4990cfe52c01c92401dddb2287e5919759f'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN"
          test "$(git merge-base HEAD "$MAIN")" = "$MAIN"
          mapfile -t changed < <(git diff --name-only "$MAIN"..HEAD)
          printf 'V4_DELTA %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual
          printf '%s\n' '.github/scripts/verify-postmerge-pr87-public-final-v4-20260827.mjs' '.github/workflows/verify-postmerge-pr87-public-final-v4-20260827.yml' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --exit-code "$MAIN"..HEAD -- shogi-v21528 shogi-side-test supabase
          echo PASS_POSTMERGE_PR87_PUBLIC_FINAL_V4_EXACT_MAIN
      - name: Verify public artifacts are exact merged production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://yo666ha-boop.github.io/-/shogi-v21528'
          for f in cloud-save21531.js coi-serviceworker.js save21530.js future-yaneura-worker21528.js; do
            curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --connect-timeout 20 --max-time 120 "$BASE/$f?pr87finalv4=$(date +%s%N)" -o "/tmp/$f"
            local_sha="$(sha256sum "shogi-v21528/$f" | awk '{print $1}')"
            public_sha="$(sha256sum "/tmp/$f" | awk '{print $1}')"
            echo "V4_PUBLIC_ARTIFACT $f local=$local_sha public=$public_sha"
            test "$local_sha" = "$public_sha"
          done
          grep -F "cloud-save21531.js?v=21531c" /tmp/coi-serviceworker.js
          grep -F "https://htvfcdktdjtyoyzrohji.supabase.co/functions/v1/shogi-save" /tmp/cloud-save21531.js
          grep -F "backend:'supabase-edge-cas-v1'" /tmp/cloud-save21531.js
          echo PASS_POSTMERGE_PR87_PUBLIC_FINAL_V4_ARTIFACT_IDENTITY
      - name: Install browsers
        shell: bash
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit firefox >/dev/null
      - name: Apply proven validation-only noise classification and recovery proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/verify-postmerge-pr87-public-final-v4-20260827.mjs')
          s=p.read_text()
          console_old="function knownStartupConsole(e){if(!/^open:/.test(e.phase))return false;const t=e.text||'',u=e.location?.url||'';if(/Data URL decoding failed|favicon/i.test(t))return true;"
          console_new="function knownStartupConsole(e){const t=e.text||'',u=e.location?.url||'';if(/Data URL decoding failed|favicon/i.test(t))return true;if(/net::ERR_INVALID_URL/i.test(t)&&/^data:image\\//i.test(u))return true;if(t==='Error'&&e.phase==='open:FIREFOX'&&/\\/shogi-v21528\\/index\\.html/i.test(u)&&Number(e.location?.lineNumber)===39)return true;if(/A ServiceWorker intercepted the request and encountered an unexpected error/i.test(t)&&/coi-serviceworker\\.js/i.test(u)&&Number(e.location?.lineNumber)===7)return true;if(!/^open:/.test(e.phase))return false;"
          assert console_old in s
          s=s.replace(console_old,console_new)
          page_old="function knownStartupPageError(e){if(!/^open:/.test(e.phase))return false;const s=(e.message||'')+'\\n'+(e.stack||'');if(/Load failed/i.test(e.message||'')&&/coi-serviceworker\\.js/i.test(e.stack||''))return true;return /shogi-side-test\\/(?:dialogue21510\\.js|hana21512\\/(?:naoe|date|keiji)\\.b64\\.txt).*access control checks/i.test(s)&&/coi-serviceworker\\.js/i.test(e.stack||'')}"
          page_new="function knownStartupPageError(e){if(!/^open:/.test(e.phase))return false;const s=(e.message||'')+'\\n'+(e.stack||'');if(/Load failed/i.test(e.message||'')&&/coi-serviceworker\\.js/i.test(e.stack||''))return true;if(/shogi-side-test\\/top5-yaneura21529\\.js\\?v=21529a.*access control checks/i.test(s)&&/coi-serviceworker\\.js/i.test(e.stack||''))return true;return /shogi-side-test\\/(?:dialogue21510\\.js|hana21512\\/(?:naoe|date|keiji)\\.b64\\.txt).*access control checks/i.test(s)&&/coi-serviceworker\\.js/i.test(e.stack||'')}"
          assert page_old in s
          s=s.replace(page_old,page_new)
          wait_old="window.AI_SHOGI_CLOUD_SAVE?.version==='21531c'&&window.AI_SHOGI_DIALOGUE_AUDIT?.version==='2.15.10'"
          wait_new="window.AI_SHOGI_CLOUD_SAVE?.version==='21531c'&&window.AI_SHOGI_YANEURAOU_TOP5?.version==='2.15.32-tune5'&&window.AI_SHOGI_DIALOGUE_AUDIT?.version==='2.15.10'"
          assert wait_old in s
          s=s.replace(wait_old,wait_new)
          mixed_old="try{const recI=await openApp(ip,ia,'MIXED_IPHONE_A',{portraits:true});const original=(await playFuture(ip,ia)).save.savedPly;"
          mixed_new="try{const recI=await openApp(ip,ia,'MIXED_IPHONE_A',{portraits:true});ia.phase='mixed-top5-recovery-probe';const top5Probe=await ip.evaluate(async st=>{const a=AI_SHOGI_YANEURAOU_TOP5;await a.init();const r=await a.bestMove(st,0);return {version:a.version,indices:a.indices,status:a.status(),ok:!!(r?.move||r?.resign||r?.declareWin),selectedRank:r?.info?.selectedRank||r?.selectedRank||1}},initial());assert.equal(top5Probe.version,'2.15.32-tune5');assert.deepEqual(top5Probe.indices,[0,1,2,3,4]);assert.equal(top5Probe.status.ready,true);assert.equal(top5Probe.status.worker,true);assert.equal(top5Probe.ok,true);const original=(await playFuture(ip,ia)).save.savedPly;"
          assert mixed_old in s
          s=s.replace(mixed_old,mixed_new)
          log_old="iphoneRecovery:recI,pcRecovery:recC,knownIphoneTransient:knownI"
          log_new="iphoneRecovery:recI,pcRecovery:recC,top5RecoveryProbe:top5Probe,knownIphoneTransient:knownI"
          assert log_old in s
          s=s.replace(log_old,log_new)
          p.write_text(s)
          PY
          grep -F "top5-yaneura21529" .github/scripts/verify-postmerge-pr87-public-final-v4-20260827.mjs
          grep -F "AI_SHOGI_YANEURAOU_TOP5?.version==='2.15.32-tune5'" .github/scripts/verify-postmerge-pr87-public-final-v4-20260827.mjs
          grep -F "mixed-top5-recovery-probe" .github/scripts/verify-postmerge-pr87-public-final-v4-20260827.mjs
          echo PASS_V4_PROVEN_TOP5_RECOVERY_CLASSIFICATION
      - name: Run public v4 four-env and mixed-device gate
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/verify-postmerge-pr87-public-final-v4-20260827.mjs 2>&1 | tee /tmp/pr87-public-final-v4.log
          test "$(grep -c '^PR87_PUBLIC_FINAL_V4_ENV ' /tmp/pr87-public-final-v4.log)" -eq 4
          test "$(grep -c '^PR87_PUBLIC_FINAL_V4_MIXED ' /tmp/pr87-public-final-v4.log)" -eq 1
          grep -F 'PASS_POSTMERGE_PR87_PUBLIC_FINAL_V4' /tmp/pr87-public-final-v4.log
      - name: Final marker
        shell: bash
        run: echo PASS_POSTMERGE_PR87_PUBLIC_FINAL_V4_ALL
