name: Shogi v2.15.28 WebKit Vercel proof
on:
  push:
    paths:
      - '.github/workflows/shogi-v21528-webkit-vercel.yml'
      - '.github/scripts/shogi-v21528-webkit-vercel.mjs'
  workflow_dispatch:
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright WebKit
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Prove Vercel real headers and YaneuraOu on WebKit
        run: node .github/scripts/shogi-v21528-webkit-vercel.mjs
