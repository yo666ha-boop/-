name: Branch practical Piyo Lv40 with official book
on:
  push:
    branches: [verify-piyo-book-practical-20260819]
    paths:
      - '.github/workflows/shogi-v21528-webkit-vercel.yml'
permissions:
  contents: read
  pull-requests: write
jobs:
  match:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Mark start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 17 --body 'PBOOK_PIYO_PRACTICAL_START_V2'
      - name: Prepare official standard book and worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pbook shogi-v21528/bookpractical
          curl -fL --retry 3 'https://github.com/yaneurao/YaneuraOu/releases/download/v4.73_book/standard_book.zip' -o /tmp/pbook/book.zip
          unzip -o /tmp/pbook/book.zip -d /tmp/pbook/unpack >/dev/null
          BOOK=$(find /tmp/pbook/unpack -type f -name standard_book.db | head -1); test -n "$BOOK"
          cp "$BOOK" shogi-v21528/yaneuraou/standard_book.db
          ln -s ../yaneuraou shogi-v21528/bookpractical/yaneuraou
          cp shogi-v21528/future-yaneura-worker21528.js shogi-v21528/bookpractical/future-worker.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('shogi-v21528/bookpractical/future-worker.js'); s=p.read_text()
          s=s.replace("const EVAL='nn.bin';","const EVAL='nn.bin';\nconst BOOK='standard_book.db';",1)
          old="""    engine.FS.writeFile('/'+EVAL,bytes);
    engine.addMessageListener(onLine);"""
          new="""    engine.FS.writeFile('/'+EVAL,bytes);
    stage('AB 公式標準定跡取得中');
    const rb=await fetch(BASE+BOOK+'?v=bookprobe',{cache:'no-store'});if(!rb.ok)throw new Error(BOOK+' '+rb.status);
    const bbytes=new Uint8Array(await rb.arrayBuffer());if(bbytes.byteLength<1000000)throw new Error(BOOK+' too small '+bbytes.byteLength);
    try{engine.FS.unlink('/'+BOOK)}catch(e){}
    engine.FS.writeFile('/'+BOOK,bbytes);stage('AB 標準定跡 '+Math.round(bbytes.byteLength/1024/1024)+'MB 読込完了');
    engine.addMessageListener(onLine);"""
          if old not in s: raise SystemExit('FS marker missing')
          s=s.replace(old,new,1)
          old2="""    stage('⑤-4f MultiPV設定開始');await sendUSI('setoption name MultiPV value 1');stage('⑤-4f MultiPV設定完了');
    stage('⑤-4 設定 Threads='+ENGINE_THREADS+' / Hash='+ENGINE_HASH_MB+(MOBILE_WEBKIT?' / iPhone省メモリ':FIRE_SILK?' / Fire Silk省メモリ':''));"""
          new2="""    stage('⑤-4f MultiPV設定開始');await sendUSI('setoption name MultiPV value 1');stage('⑤-4f MultiPV設定完了');
    stage('AB 定跡設定開始');await sendUSI('setoption name USI_OwnBook value true');await sendUSI('setoption name BookDir value .');await sendUSI('setoption name BookFile value '+BOOK);stage('AB 定跡設定完了 '+BOOK);
    stage('⑤-4 設定 Threads='+ENGINE_THREADS+' / Hash='+ENGINE_HASH_MB+' / Book='+BOOK+(MOBILE_WEBKIT?' / iPhone省メモリ':FIRE_SILK?' / Fire Silk省メモリ':''));"""
          if old2 not in s: raise SystemExit('option marker missing')
          p.write_text(s.replace(old2,new2,1))
          PY
          echo "PBOOK_SIZE $(stat -c%s shogi-v21528/yaneuraou/standard_book.db)"
          echo "PBOOK_SHA $(sha256sum shogi-v21528/yaneuraou/standard_book.db | awk '{print $1}')"
      - name: Install Chromium and WebKit
        run: |
          cd /tmp/pbook
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
      - name: Start COOP COEP server
        run: |
          cat > /tmp/pbook/server.mjs <<'NODE'
          import http from'http';import fs from'fs';import path from'path';const root=process.cwd();const mime={'.html':'text/html','.js':'text/javascript','.wasm':'application/wasm','.bin':'application/octet-stream','.db':'application/octet-stream','.css':'text/css','.jpg':'image/jpeg','.webp':'image/webp'};http.createServer((req,res)=>{let u=decodeURIComponent(req.url.split('?')[0]);if(u==='/')u='/shogi-v21528/index.html';let f=path.join(root,u);try{f=fs.realpathSync(f)}catch{}if(!f.startsWith(root)||!fs.existsSync(f)){res.writeHead(404);return res.end('404')}res.setHeader('Cross-Origin-Opener-Policy','same-origin');res.setHeader('Cross-Origin-Embedder-Policy','require-corp');res.setHeader('Cross-Origin-Resource-Policy','same-origin');res.setHeader('Cache-Control','no-store');res.setHeader('Content-Type',mime[path.extname(f)]||'application/octet-stream');fs.createReadStream(f).pipe(res)}).listen(4183,'127.0.0.1');
          NODE
          node /tmp/pbook/server.mjs >/tmp/pbook/server.log 2>&1 & sleep 1
      - name: Run exact practical match to 50 plies
        shell: bash
        run: |
          cat > /tmp/pbook/match.mjs <<'NODE'
          import{chromium,webkit}from'playwright';
          const MAX=50,R='abcdefghi',INIT='lnsgkgsnl/1r5b1/ppppppppp/9/9/9/PPPPPPPPP/1B5R1/LNSGKGSNL';
          function sfen(ms){const b=new Map(),h={b:{},w:{}};let rr=0;for(const row of INIT.split('/')){let f=9,pr=false;for(const c of row){if(c==='+'){pr=true;continue}if(/\d/.test(c)){f-=+c;continue}const side=c===c.toUpperCase()?'b':'w';b.set(''+f+R[rr],{side,k:c.toUpperCase(),pr});pr=false;f--}rr++}let t='b';for(const m of ms){if(/^[PLNSGBR]\*/.test(m)){const k=m[0],d=m.slice(2);h[t][k]=(h[t][k]||0)-1;b.set(d,{side:t,k,pr:false})}else{const a=m.slice(0,2),d=m.slice(2,4),pc=b.get(a);if(!pc)throw Error('apply '+m+' missing '+a);const cap=b.get(d);if(cap)h[t][cap.k]=(h[t][cap.k]||0)+1;b.delete(a);b.set(d,{...pc,pr:pc.pr||m.endsWith('+')})}t=t==='b'?'w':'b'}const rows=[];for(let r=0;r<9;r++){let x='',e=0;for(let f=9;f;f--){const pc=b.get(''+f+R[r]);if(!pc){e++;continue}if(e){x+=e;e=0}x+=(pc.pr?'+':'')+(pc.side==='b'?pc.k:pc.k.toLowerCase())}if(e)x+=e;rows.push(x)}let hand='';for(const side of['b','w'])for(const k of['R','B','G','S','N','L','P']){const n=h[side][k]||0;if(n>0)hand+=(n>1?n:'')+(side==='b'?k:k.toLowerCase())}return rows.join('/')+' '+t+' '+(hand||'-')+' '+(ms.length+1)}
          const pb=await chromium.launch({headless:true}),p=await pb.newPage({viewport:{width:1280,height:1000}});await p.goto('https://www.studiok-i.net/ps/',{waitUntil:'domcontentloaded',timeout:120000});await p.waitForSelector('#btnNewGame',{timeout:120000});await p.waitForTimeout(1500);await p.click('#btnNewGame');await p.waitForFunction(()=>document.querySelector('#selectLevelGote')?.options.length>0);await p.check('#dialogGameGameTypeSente0');await p.check('#dialogGameGameTypeGote1');const lv=await p.evaluate(()=>{const s=document.querySelector('#selectLevelGote'),o=[...s.options].find(o=>/^\s*Lv40\b/.test(o.textContent));if(!o)return null;s.value=o.value;s.dispatchEvent(new Event('change',{bubbles:true}));return o.textContent.trim()});if(!lv||!lv.includes('R2610'))throw Error('not Lv40 '+lv);console.log('PBOOK_PIYO '+lv);await p.uncheck('#chkFurigoma').catch(()=>{});await p.uncheck('#chkRandomBook').catch(()=>{});await p.uncheck('#chkRatingTarget').catch(()=>{});await p.click('#btnDialogGameStart');await p.waitForTimeout(700);
          const br=await p.locator('#board_img').boundingBox();if(!br)throw Error('board');const sq=s=>({x:br.x+((9-+s[0])+.5)*br.width/9,y:br.y+(s.charCodeAt(1)-97+.5)*br.height/9});
          async function exportMoves(){await p.locator('img[alt="メニュー"]').first().click();await p.waitForTimeout(80);await p.click('#menuKifu');await p.waitForTimeout(80);await p.check('#dialogKifType2');await p.waitForTimeout(50);const txt=(await p.locator('#dialogKifBox').textContent()||'').trim();await p.click('#btnDialogKifClose');const m=/^position startpos(?: moves\s+(.+))?$/s.exec(txt);if(!m)throw Error('export '+txt);return m[1]?m[1].trim().split(/\s+/):[]}
          async function play(u){if(/^[PLNSGBR]\*/.test(u)){const jp={P:'歩',L:'香',N:'桂',S:'銀',G:'金',B:'角',R:'飛'}[u[0]],pt=await p.evaluate(jp=>{const a=[...document.querySelectorAll('#komadai_u img')].map(i=>{const r=i.getBoundingClientRect();return{alt:i.alt.trim(),x:r.x+r.width/2,y:r.y+r.height/2,w:r.width,h:r.height}}).filter(x=>x.w&&x.h&&x.alt===jp);return a[0]||null},jp);if(!pt)throw Error('hand '+u);await p.mouse.click(pt.x,pt.y);const d=sq(u.slice(2));await p.mouse.click(d.x,d.y);return}const a=sq(u.slice(0,2)),d=sq(u.slice(2,4));await p.mouse.click(a.x,a.y);await p.waitForTimeout(60);await p.mouse.click(d.x,d.y);await p.waitForTimeout(80);if(u.endsWith('+'))await p.locator('#btnDialogNari1').click({force:true,timeout:1000}).catch(()=>{});else if(await p.locator('#dialogNari').isVisible().catch(()=>false))await p.click('#btnDialogNari2')}
          const fb=await webkit.launch({headless:true}),f=await fb.newPage({userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'});await f.goto('http://127.0.0.1:4183/shogi-v21528/index.html',{waitUntil:'domcontentloaded',timeout:120000});if(!await f.evaluate(()=>crossOriginIsolated))throw Error('COI');const prof=await f.evaluate(async()=>{const w=new Worker('./bookpractical/future-worker.js?v='+Date.now());let n=0,P=new Map(),st=[];w.onmessage=e=>{const m=e.data||{};if(m.type==='stage'){st.push(m.text);return}const q=P.get(m.id);if(!q||m.type!=='result')return;P.delete(m.id);clearTimeout(q.t);m.ok?q.r(m):q.j(Error(m.error||'worker'))};const call=(type,x={})=>new Promise((r,j)=>{const id=++n,t=setTimeout(()=>j(Error(type+' timeout '+st.slice(-6).join(' | '))),180000);P.set(id,{r,j,t});w.postMessage({type,id,...x})});window.__w=w;window.__call=call;const out=await call('init');return{out,st}});if(prof.out.threads!==1||prof.out.hashMB!==32||!prof.out.mobileWebKit||!prof.st.some(x=>x.includes('AB 定跡設定完了')))throw Error('profile '+JSON.stringify(prof));console.log('PBOOK_PROFILE '+JSON.stringify(prof.out));const search=(pos,ms=4500,pv=1)=>f.evaluate(({pos,ms,pv})=>window.__call('bestmove',{sfen:pos,ms,multiPV:pv}),{pos,ms,pv});
          let ms=[],result='50-ply reached',bookMoves=0;while(ms.length<MAX){if(ms.length%2)throw Error('turn '+ms.length);const ply=ms.length+1,pos=sfen(ms),t=Date.now(),r=await search(pos),elapsed=Date.now()-t,u=String(r.token||''),bookLikely=elapsed<1000&&(r.info?.nodes||0)===0;if(bookLikely)bookMoves++;console.log('PBOOK_FUTURE '+JSON.stringify({ply,u,elapsed,bookLikely,cp:r.info?.cp,mate:r.info?.mate,depth:r.info?.depth,nodes:r.info?.nodes}));if(u==='resign'||u==='win'){result='Future '+u;break}const before=ms.length;await play(u);let got=null,last='';const st=Date.now();while(Date.now()-st<120000){last=((await p.locator('#select_kifu option').allTextContents()).at(-1)||'').trim();const x=await exportMoves();if(x.length>=before+2||/投了|詰み|反則|千日手|持将棋|中断/.test(last)){got=x;break}await p.waitForTimeout(300)}if(!got)throw Error('Piyo reply timeout ply '+ply);if(got[before]!==u)throw Error('USI DIVERGENCE '+ply+' '+u+' '+got[before]);ms=got;console.log('PBOOK_REPLY '+JSON.stringify({plies:ms.length,last,tail:ms.slice(-4)}));if(/投了|詰み|反則|千日手|持将棋|中断/.test(last)||ms.length%2){result=last||'ended';break}}
          let final=null;if(ms.length%2===0){const r=await search(sfen(ms),12000,4);final={token:r.token,cp:r.info?.cp,mate:r.info?.mate,depth:r.info?.depth,nodes:r.info?.nodes,candidates:r.candidates?.slice(0,4).map(x=>({rank:x.rank,token:x.token,cp:x.cp,mate:x.mate}))}}const sum={piyo:lv,plies:ms.length,result,bookMoves,final,tail:ms.slice(-12)};console.log('PBOOK_SUMMARY '+JSON.stringify(sum));await f.evaluate(()=>window.__w?.terminate());await fb.close();await pb.close();
          NODE
          cd /tmp/pbook && node match.mjs 2>&1 | tee /tmp/pbook/match.log
          grep -F 'PBOOK_SUMMARY ' /tmp/pbook/match.log
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### Piyo Lv40 practical with official standard book'; echo '```text'; grep -E '^(PBOOK_PIYO|PBOOK_PROFILE|PBOOK_FUTURE|PBOOK_REPLY|PBOOK_SUMMARY)' /tmp/pbook/match.log 2>/dev/null | tail -140 || true; echo '```'; } >/tmp/pbook/report.md
          gh pr comment 17 --body-file /tmp/pbook/report.md
