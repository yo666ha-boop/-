name: Audit post-merge ranks 13-18 quality
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Playwright package
        run: |
          npm init -y
          npm install playwright@1.55.0
      - name: Fetch proven quality harness
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/yo666ha-boop/-/verify-pr65-cohort13-18-20260820/.github/scripts/verify-pr65-cohort13-18-quality-20260820.mjs' -o verify-postmerge-cohort13-18-quality.mjs
      - name: Build diagnostic page
        run: |
          node <<'NODE'
          const fs=require('fs');let s=fs.readFileSync('shogi-v21528/index.html','utf8');const n="'const AI_SHOGI_PRE_STRONG_21528=chooseAI;',strongPatch,";if(!s.includes(n))throw Error('hook missing');const h=`"window.__PR65_Q={legal:(s)=>legal(s).map(usi),usi:(m)=>usi(m),parse:(pos)=>{const [board,turn,hands,mn]=pos.trim().split(' '),s=clone(st),keys=['R','B','G','S','N','L','P'];s.b=Array(81).fill(null);let y=0;for(const row of board.split('/')){let x=0,prom=false;for(const ch of row){if(ch==='+'){prom=true;continue}if(ch>='1'&&ch<='9'){x+=Number(ch);continue}const u=ch.toUpperCase();s.b[y*9+x]={k:(prom?'+':'')+u,o:ch===u?1:-1};prom=false;x++}if(x!==9)throw new Error('bad row '+row+' '+x);y++}if(y!==9)throw new Error('bad board rows '+y);s.h={'1':{},'-1':{}};for(const side of['1','-1'])for(const k of keys)s.h[side][k]=0;if(hands!=='-'){let num='';for(const ch of hands){if(ch>='0'&&ch<='9'){num+=ch;continue}const count=num?Number(num):1;num='';const side=ch===ch.toUpperCase()?'1':'-1';s.h[side][ch.toUpperCase()]=(s.h[side][ch.toUpperCase()]||0)+count}}s.t=turn==='b'?1:-1;s.log=Array(Math.max(0,(+mn||1)-1)).fill(0).map((_,i)=>({audit:true,ply:i+1}));return s}};",`;s=s.replace(n,"'const AI_SHOGI_PRE_STRONG_21528=chooseAI;',strongPatch,"+h);fs.writeFileSync('shogi-v21528/index-pr65-quality.html',s);
          NODE
      - name: Start COOP COEP server
        run: |
          cat >/tmp/q65.mjs <<'NODE'
          import http from'http';import fs from'fs';import path from'path';const root=process.cwd(),mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css','.wasm':'application/wasm','.bin':'application/octet-stream','.webp':'image/webp','.png':'image/png','.jpg':'image/jpeg','.jpeg':'image/jpeg'};http.createServer((q,s)=>{let n=decodeURIComponent(new URL(q.url,'http://x').pathname);if(n.endsWith('/'))n+='index.html';const f=path.resolve(root,'.'+n);if(!f.startsWith(root)||!fs.existsSync(f)){s.writeHead(404);return s.end()}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',mime[path.extname(f).toLowerCase()]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4236,'127.0.0.1');
          NODE
          node /tmp/q65.mjs &
          sleep 1
      - name: Run current-main production API 8-case quality
        shell: bash
        env:
          HOME: /root
        run: |
          set -euo pipefail
          node verify-postmerge-cohort13-18-quality.mjs 2>&1 | tee /tmp/q65.log
          grep -q '^PASS_PR65_COHORT_QUALITY ' /tmp/q65.log
      - name: Show actual result
        if: always()
        run: grep -E '^(P65Q_REF|P65Q_ROW|PR65_QUALITY|PASS_PR65_COHORT_QUALITY|Error:)' /tmp/q65.log || true
