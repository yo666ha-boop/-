name: Analyze Piyo practical collapse with V9.70
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/analyze-piyo-v970-collapse.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  analyze:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install iPhone-equivalent WebKit
        run: |
          mkdir -p /tmp/audit && cd /tmp/audit
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps webkit >/dev/null
      - name: Analyze confirmed 54-ply game
        shell: bash
        run: |
          cat > /tmp/audit/audit.mjs <<'NODE'
          import{webkit}from'playwright';
          const R='abcdefghi',INIT='lnsgkgsnl/1r5b1/ppppppppp/9/9/9/PPPPPPPPP/1B5R1/LNSGKGSNL';
          const moves=`4i5h 8c8d 2h3h 8d8e 6g6f 8e8f 8g8f 8b8f 7g7f 8f8g+ 6i7h 8g7f P*7b 7a7b 5i4i 7f8e 3i4h P*8f 6f6e 8f8g+ 8h5e 8e6e 7h6h 6e5e 5g5f 5e7e 6h6i 3c3d 9g9f 2b9i+ 7i8h 9i8h 3h3i B*2h 3i3h 2h1i+ 4g4f 1i2i 3h3i 2i2h 3i3h 2h2g 4h3i N*2f 5h4h 8h8i 4h5g L*4g 5g4g 8i6g 6i5h 7e7i L*5i 2f3h+`.split(/\s+/);
          function sf(ms){const b=new Map(),h={b:{},w:{}};let rr=0;for(const row of INIT.split('/')){let f=9,pr=false;for(const c of row){if(c==='+'){pr=true;continue}if(/\d/.test(c)){f-=+c;continue}const side=c===c.toUpperCase()?'b':'w';b.set(''+f+R[rr],{side,k:c.toUpperCase(),pr});pr=false;f--}rr++}let t='b';for(const m of ms){if(/^[PLNSGBR]\*/.test(m)){const k=m[0],d=m.slice(2);h[t][k]=(h[t][k]||0)-1;b.set(d,{side:t,k,pr:false})}else{const a=m.slice(0,2),d=m.slice(2,4),p=m.endsWith('+'),pc=b.get(a);if(!pc)throw Error('missing '+a+' '+m);const cap=b.get(d);if(cap)h[t][cap.k]=(h[t][cap.k]||0)+1;b.delete(a);b.set(d,{...pc,pr:pc.pr||p})}t=t==='b'?'w':'b'}const rows=[];for(let r=0;r<9;r++){let x='',e=0;for(let f=9;f;f--){const pc=b.get(''+f+R[r]);if(!pc){e++;continue}if(e){x+=e;e=0}x+=(pc.pr?'+':'')+(pc.side==='b'?pc.k:pc.k.toLowerCase())}if(e)x+=e;rows.push(x)}let hand='';for(const side of['b','w'])for(const k of['R','B','G','S','N','L','P']){const n=h[side][k]||0;if(n>0)hand+=(n>1?n:'')+(side==='b'?k:k.toLowerCase())}return rows.join('/')+' '+t+' '+(hand||'-')+' '+(ms.length+1)}
          const br=await webkit.launch({headless:true}),p=await br.newPage({userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'});await p.goto('https://yo666ha-boop.github.io/-/shogi-v21528/?audit='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});await p.waitForFunction(()=>window.AI_SHOGI_WEB_AUDIT?.characters===26);const prof=await p.evaluate(async()=>{const w=new Worker('./future-yaneura-worker21528.js?v=21528v970d4');let n=0,P=new Map();w.onmessage=e=>{const m=e.data||{},q=P.get(m.id);if(!q||m.type!=='result')return;P.delete(m.id);clearTimeout(q.t);m.ok?q.r(m):q.j(Error(m.error||'worker'))};const call=(type,x={})=>new Promise((r,j)=>{const id=++n,t=setTimeout(()=>j(Error(type+' timeout')),180000);P.set(id,{r,j,t});w.postMessage({type,id,...x})});window.__w=w;window.__call=call;return call('init')});console.log('AUDIT_PROFILE '+JSON.stringify(prof));const go=(pos,ms=15000,pv=3)=>p.evaluate(({pos,ms,pv})=>window.__call('bestmove',{sfen:pos,ms,multiPV:pv}),{pos,ms,pv});
          const plies=[21,25,29,33,37,41,43,45,47,49,51,53];const rows=[];for(const ply of plies){const chosen=moves[ply-1],pos=sf(moves.slice(0,ply-1)),r=await go(pos,15000,3),cs=r.candidates||[],best=cs.find(x=>x.rank===1)||cs[0],hit=cs.find(x=>x.token===chosen);let chosenVal=hit?.cp??null,after=null;if(!hit){after=await go(sf(moves.slice(0,ply)),12000,1);if(Number.isFinite(after.info?.cp))chosenVal=-after.info.cp}let loss=Number.isFinite(best?.cp)&&Number.isFinite(chosenVal)?Math.max(0,best.cp-chosenVal):null;const row={ply,chosen,best:best?.token,bestCp:best?.cp,bestMate:best?.mate,chosenRank:hit?.rank??null,chosenCp:chosenVal,lossCp:loss,top3:cs.map(x=>({rank:x.rank,token:x.token,cp:x.cp,mate:x.mate,depth:x.depth,nodes:x.nodes})),afterChosen:after?{cp:after.info?.cp,mate:after.info?.mate,token:after.token}:null};rows.push(row);console.log('COLLAPSE_ROW '+JSON.stringify(row))}
          const known=rows.map(x=>x.lossCp).filter(Number.isFinite),summary={positions:rows.length,bestMatches:rows.filter(x=>x.chosen===x.best).length,outsideTop3:rows.filter(x=>x.chosenRank==null).length,maxLossCp:known.length?Math.max(...known):null,lossOver100:rows.filter(x=>Number.isFinite(x.lossCp)&&x.lossCp>=100).map(x=>({ply:x.ply,lossCp:x.lossCp,chosen:x.chosen,best:x.best})),rows};console.log('COLLAPSE_SUMMARY '+JSON.stringify(summary));await p.evaluate(()=>window.__w?.terminate());await br.close();
          NODE
          cd /tmp/audit && node audit.mjs 2>&1 | tee /tmp/collapse.log
          grep -F 'COLLAPSE_SUMMARY ' /tmp/collapse.log
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### Exact 54-ply collapse analysis'; echo '```text'; grep -E '^(AUDIT_PROFILE|COLLAPSE_ROW|COLLAPSE_SUMMARY)' /tmp/collapse.log | tail -40 || true; echo '```'; } >/tmp/report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/report.md
