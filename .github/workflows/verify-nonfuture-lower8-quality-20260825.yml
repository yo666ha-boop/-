name: Verify non-Future lower8 quality
on:
  push:
    branches: [tune-nonfuture-strength-20260825]
permissions:
  contents: read
jobs:
  lower8-quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
      - name: Build quality page
        run: node .github/scripts/build-lower8-quality-page-20260825.mjs
      - name: Start quality server
        run: |
          node .github/scripts/coi-lower8-quality-server-20260825.mjs >/tmp/l8q-server.log 2>&1 &
          sleep 1
      - name: Run 8-case deep-reference audit
        run: |
          set -euo pipefail
          node .github/scripts/audit-nonfuture-lower8-quality-20260825.mjs 2>&1 | tee /tmp/l8q.log
          grep -F 'PASS_NONFUTURE_LOWER8_8CASE_QUALITY' /tmp/l8q.log
