name: Final practical Piyo Lv40 vs Future V9.70
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-piyo-v970-final-practical.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  match:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install browsers
        run: |
          mkdir -p /tmp/finalp && cd /tmp/finalp
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
      - name: Run exact practical match
        shell: bash
        run: |
          cat > /tmp/finalp/match.mjs <<'NODE'
          import{chromium,webkit}from'playwright';
          const MAX=60,R='abcdefghi',INIT='lnsgkgsnl/1r5b1/ppppppppp/9/9/9/PPPPPPPPP/1B5R1/LNSGKGSNL';
          function sfen(ms){const b=new Map(),h={b:{},w:{}};let rr=0;for(const row of INIT.split('/')){let f=9,pr=false;for(const c of row){if(c==='+'){pr=true;continue}if(/\d/.test(c)){f-=+c;continue}const side=c===c.toUpperCase()?'b':'w';b.set(''+f+R[rr],{side,k:c.toUpperCase(),pr});pr=false;f--}rr++}let t='b';for(const m of ms){if(/^[PLNSGBR]\*/.test(m)){const k=m[0],d=m.slice(2);h[t][k]=(h[t][k]||0)-1;b.set(d,{side:t,k,pr:false})}else{const a=m.slice(0,2),d=m.slice(2,4),p=m.endsWith('+'),pc=b.get(a);if(!pc)throw Error('apply '+m+' missing '+a);const cap=b.get(d);if(cap)h[t][cap.k]=(h[t][cap.k]||0)+1;b.delete(a);b.set(d,{...pc,pr:pc.pr||p})}t=t==='b'?'w':'b'}const rows=[];for(let r=0;r<9;r++){let x='',e=0;for(let f=9;f;f--){const pc=b.get(''+f+R[r]);if(!pc){e++;continue}if(e){x+=e;e=0}x+=(pc.pr?'+':'')+(pc.side==='b'?pc.k:pc.k.toLowerCase())}if(e)x+=e;rows.push(x)}let hand='';for(const side of['b','w'])for(const k of['R','B','G','S','N','L','P']){const n=h[side][k]||0;if(n>0)hand+=(n>1?n:'')+(side==='b'?k:k.toLowerCase())}return rows.join('/')+' '+t+' '+(hand||'-')+' '+(ms.length+1)}
          const pb=await chromium.launch({headless:true}),p=await pb.newPage({viewport:{width:1280,height:1000}});await p.goto('https://www.studiok-i.net/ps/',{waitUntil:'domcontentloaded',timeout:120000});await p.waitForSelector('#btnNewGame',{timeout:120000});await p.waitForTimeout(2000);await p.click('#btnNewGame');await p.waitForFunction(()=>document.querySelector('#selectLevelGote')?.options.length>0);await p.check('#dialogGameGameTypeSente0');await p.check('#dialogGameGameTypeGote1');const lv=await p.evaluate(()=>{const s=document.querySelector('#selectLevelGote'),o=[...s.options].find(o=>/^\s*Lv40\b/.test(o.textContent));if(!o)return null;s.value=o.value;s.dispatchEvent(new Event('change',{bubbles:true}));return o.textContent.trim()});if(!lv||!lv.includes('R2610'))throw Error('not Lv40 '+lv);console.log('PRACTICAL_PIYO '+lv);await p.uncheck('#chkFurigoma').catch(()=>{});await p.uncheck('#chkRandomBook').catch(()=>{});await p.uncheck('#chkRatingTarget').catch(()=>{});await p.click('#btnDialogGameStart');await p.waitForTimeout(700);
          const br=await p.locator('#board_img').boundingBox();if(!br)throw Error('board');const sq=s=>({x:br.x+((9-+s[0])+.5)*br.width/9,y:br.y+(s.charCodeAt(1)-97+.5)*br.height/9});
          async function exportMoves(){await p.locator('img[alt="メニュー"]').first().click();await p.waitForTimeout(80);await p.click('#menuKifu');await p.waitForTimeout(80);await p.check('#dialogKifType2');await p.waitForTimeout(50);const txt=(await p.locator('#dialogKifBox').textContent()||'').trim();await p.click('#btnDialogKifClose');const m=/^position startpos(?: moves\s+(.+))?$/s.exec(txt);if(!m)throw Error('export '+txt);return m[1]?m[1].trim().split(/\s+/):[]}
          async function play(u){if(/^[PLNSGBR]\*/.test(u)){const jp={P:'歩',L:'香',N:'桂',S:'銀',G:'金',B:'角',R:'飛'}[u[0]],pt=await p.evaluate(jp=>{const a=[...document.querySelectorAll('#komadai_u img')].map(i=>{const r=i.getBoundingClientRect();return{alt:i.alt.trim(),id:i.id,x:r.x+r.width/2,y:r.y+r.height/2,w:r.width,h:r.height}}).filter(x=>x.w&&x.h&&x.alt===jp);return a[0]||null},jp);if(!pt)throw Error('hand '+u+' DOM '+JSON.stringify(await p.evaluate(()=>[...document.querySelectorAll('#komadai_u img')].map(i=>({id:i.id,alt:i.alt,src:i.getAttribute('src')})))));await p.mouse.click(pt.x,pt.y);const d=sq(u.slice(2));await p.mouse.click(d.x,d.y);return}
            const a=sq(u.slice(0,2)),d=sq(u.slice(2,4));await p.mouse.click(a.x,a.y);await p.waitForTimeout(60);await p.mouse.click(d.x,d.y);await p.waitForTimeout(80);if(u.endsWith('+')){await p.locator('#btnDialogNari1').click({force:true,timeout:1000}).catch(()=>{})}else if(await p.locator('#dialogNari').isVisible().catch(()=>false)){await p.click('#btnDialogNari2')}
          }
          const fb=await webkit.launch({headless:true}),f=await fb.newPage({userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'});await f.goto('https://yo666ha-boop.github.io/-/shogi-v21528/?real='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});await f.waitForFunction(()=>window.AI_SHOGI_WEB_AUDIT?.characters===26);if(!await f.evaluate(()=>crossOriginIsolated))throw Error('COI');const prof=await f.evaluate(async()=>{const w=new Worker('./future-yaneura-worker21528.js?v=21528v970d4');let n=0,P=new Map();w.onmessage=e=>{const m=e.data||{},q=P.get(m.id);if(!q||m.type!=='result')return;P.delete(m.id);clearTimeout(q.t);m.ok?q.r(m):q.j(Error(m.error||'worker'))};const call=(type,x={})=>new Promise((r,j)=>{const id=++n,t=setTimeout(()=>j(Error(type+' timeout')),180000);P.set(id,{r,j,t});w.postMessage({type,id,...x})});window.__w=w;window.__call=call;return call('init')});if(prof.threads!==1||prof.hashMB!==32||!prof.mobileWebKit)throw Error('profile '+JSON.stringify(prof));console.log('PRACTICAL_PROFILE '+JSON.stringify(prof));const search=(pos,ms=4500,pv=1)=>f.evaluate(({pos,ms,pv})=>window.__call('bestmove',{sfen:pos,ms,multiPV:pv}),{pos,ms,pv});
          let ms=[],result='60-ply reached';const dec=[];while(ms.length<MAX){if(ms.length%2)throw Error('turn '+ms.length);const ply=ms.length+1,pos=sfen(ms),r=await search(pos),u=String(r.token||'');console.log('PRACTICAL_FUTURE '+JSON.stringify({ply,u,cp:r.info?.cp,mate:r.info?.mate,depth:r.info?.depth,nodes:r.info?.nodes}));dec.push({ply,pos,u,info:r.info||{}});if(u==='resign'||u==='win'){result='Future '+u;break}const before=ms.length;await play(u);await p.waitForFunction(n=>document.querySelector('#select_kifu')?.options.length>n+1,before,{timeout:30000}).catch(()=>{});let got=null,last='';const st=Date.now();while(Date.now()-st<120000){const opts=await p.locator('#select_kifu option').allTextContents();last=(opts.at(-1)||'').trim();const x=await exportMoves();if(x.length>=before+2||/投了|詰み|反則|千日手|持将棋|中断/.test(last)){got=x;break}await p.waitForTimeout(300)}if(!got)throw Error('Piyo reply timeout ply '+ply);const actual=got[before];if(actual!==u)throw Error('USI DIVERGENCE ply '+ply+' Future='+u+' Piyo='+actual+' sequence='+got.join(' '));ms=got;console.log('PRACTICAL_REPLY '+JSON.stringify({plies:ms.length,last,tail:ms.slice(-4)}));if(/投了|詰み|反則|千日手|持将棋|中断/.test(last)||ms.length%2){result=last||'ended';break}}
          const audits=[];for(const d of dec.filter(x=>x.ply>=21&&x.ply<=57&&((x.ply-21)%4===0))){const r=await search(d.pos,12000,4),cs=r.candidates||[],best=cs.find(x=>x.rank===1)||cs[0],ch=cs.find(x=>x.token===d.u),loss=best&&ch&&Number.isFinite(best.cp)&&Number.isFinite(ch.cp)?Math.max(0,best.cp-ch.cp):null,row={ply:d.ply,chosen:d.u,quickCp:d.info?.cp,refBest:best?.token,refBestCp:best?.cp,rank:ch?.rank??null,chosenRefCp:ch?.cp??null,lossCp:loss};audits.push(row);console.log('PRACTICAL_AUDIT '+JSON.stringify(row))}const known=audits.map(x=>x.lossCp).filter(Number.isFinite),final=ms.length%2===0?await search(sfen(ms),12000,4):null,sum={piyo:lv,profile:{threads:prof.threads,hashMB:prof.hashMB},plies:ms.length,result,audits:audits.length,refMatches:audits.filter(x=>x.chosen===x.refBest).length,outsideTop4:audits.filter(x=>x.rank==null).length,maxKnownLossCp:known.length?Math.max(...known):null,final:final?{cp:final.info?.cp,mate:final.info?.mate,depth:final.info?.depth,token:final.token}:null,tail:ms.slice(-12)};console.log('PRACTICAL_SUMMARY '+JSON.stringify(sum));await f.evaluate(()=>window.__w?.terminate());await fb.close();await pb.close();
          NODE
          cd /tmp/finalp && node match.mjs 2>&1 | tee /tmp/final-practical.log
          grep -F 'PRACTICAL_SUMMARY ' /tmp/final-practical.log
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### Exact Piyo Lv40 practical result'; echo '```text'; grep -E '^(PRACTICAL_PIYO|PRACTICAL_PROFILE|PRACTICAL_FUTURE|PRACTICAL_REPLY|PRACTICAL_AUDIT|PRACTICAL_SUMMARY)' /tmp/final-practical.log | tail -120 || true; echo '```'; } >/tmp/report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/report.md
