name: NEVER MERGE diag tournament base portraits
on:
  push:
    branches:
      - 'diag/tournament-base-portraits-20260904'

jobs:
  extract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact FIXED_IMG entries
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('shogi/strong213_01.part','utf8');
          const mark='const FIXED_IMG=';
          const a=s.indexOf(mark);
          console.log('MARK_INDEX',a,'SIZE',s.length);
          if(a<0) throw new Error('FIXED_IMG marker missing');
          const start=s.indexOf('[',a+mark.length);
          let depth=0,end=-1,quote='',esc=false;
          for(let i=start;i<s.length;i++){
            const ch=s[i];
            if(quote){
              if(esc){esc=false;continue;}
              if(ch==='\\'){esc=true;continue;}
              if(ch===quote)quote='';
              continue;
            }
            if(ch==='"'||ch==="'"||ch==='`'){quote=ch;continue;}
            if(ch==='['){depth++;continue;}
            if(ch===']'){depth--;if(depth===0){end=i;break;}}
          }
          console.log('ARRAY_RANGE',start,end,'NEXT',JSON.stringify(s.slice(end+1,end+12)));
          if(end<0) throw new Error('FIXED_IMG end missing');
          const literal=s.slice(start,end+1);
          const arr=Function('"use strict";return ('+literal+')')();
          console.log('ARRAY_LENGTH',arr.length);
          console.log('ENTRY_LENGTHS',arr.map(x=>String(x||'').length).join(','));
          for(const [label,idx] of [['MITSUKI',0],['ONIMAMA',3],['MAMA',4]]){
            const v=String(arr[idx]||'');
            console.log(`PORTRAIT_${label}_BEGIN`);
            console.log(v);
            console.log(`PORTRAIT_${label}_END`);
          }
          NODE
