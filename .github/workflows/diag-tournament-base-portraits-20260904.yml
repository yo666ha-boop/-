name: NEVER MERGE diag tournament base portraits
on:
  push:
    branches:
      - 'diag/tournament-base-portraits-20260904'

jobs:
  extract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact FIXED_IMG source shape
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('shogi/strong213_01.part','utf8');
          const mark='const FIXED_IMG=';
          const a=s.indexOf(mark);
          console.log('MARK_INDEX',a,'SIZE',s.length);
          if(a<0) throw new Error('FIXED_IMG marker missing');
          console.log('AROUND_MARK_BEGIN');
          console.log(s.slice(a,a+900));
          console.log('AROUND_MARK_END');
          console.log('TAIL_BEGIN');
          console.log(s.slice(-1800));
          console.log('TAIL_END');
          const tail=s.slice(a);
          const all=tail.match(/data:image\/[A-Za-z0-9.+-]+;base64,[A-Za-z0-9+/=]+/g)||[];
          console.log('DATA_URI_COUNT',all.length);
          console.log('DATA_URI_LENGTHS',all.map(x=>x.length).join(','));
          all.slice(0,8).forEach((v,i)=>{
            console.log(`DATA_URI_${i}_BEGIN`);
            console.log(v);
            console.log(`DATA_URI_${i}_END`);
          });
          NODE
