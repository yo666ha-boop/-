name: Verify Future 4.0s runtime adoption
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps webkit chromium
      - name: Start COOP COEP server
        run: |
          cat >/tmp/coi.mjs <<'NODE'
          import http from'http';import fs from'fs';import path from'path';const root=process.cwd(),mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css','.wasm':'application/wasm','.bin':'application/octet-stream','.jpg':'image/jpeg','.png':'image/png','.webp':'image/webp'};http.createServer((q,s)=>{let n=decodeURIComponent(new URL(q.url,'http://x').pathname);if(n.endsWith('/'))n+='index.html';const f=path.resolve(root,'.'+n);if(!f.startsWith(root)||!fs.existsSync(f)){s.writeHead(404);return s.end('404')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',mime[path.extname(f).toLowerCase()]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4194,'127.0.0.1');
          NODE
          node /tmp/coi.mjs >/tmp/coi.log 2>&1 &
          sleep 1
      - name: Verify WebKit and Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          cat >verify-future-4000.mjs <<'NODE'
          import { webkit, chromium } from 'playwright';
          for (const [name,browserType] of [['webkit',webkit],['chromium',chromium]]) {
            const browser=await browserType.launch({headless:true});
            const context=await browser.newContext({userAgent:name==='webkit'?'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1':'Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 Chrome/139 Safari/537.36'});
            const page=await context.newPage();
            await page.goto('http://127.0.0.1:4194/shogi-v21528/index.html?verify4000='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>document.querySelectorAll('#chars .ch').length===26,{timeout:120000});
            const staticCheck=await page.evaluate(async()=>{const t=await (await fetch('../shogi-side-test/future21520.js?x='+Date.now(),{cache:'no-store'})).text();return{has4000:t.includes('endgame?7000:4000'),has4500:t.includes('endgame?7000:4500'),coi:crossOriginIsolated,cards:document.querySelectorAll('#chars .ch').length,sound:window.AI_SHOGI_PIECE_SOUND?.audit?.()||null};});
            if(!staticCheck.has4000||staticCheck.has4500||!staticCheck.coi||staticCheck.cards!==26)throw Error(name+' static '+JSON.stringify(staticCheck));
            const r=await page.evaluate(async()=>{const a=window.AI_SHOGI_YANEURAOU_FUTURE;await a.init();const s=a.status();const t=performance.now();const x=await a.bestMove((()=>{const f=window.initial||null;return f?f():null})(),{ms:300,multiPV:1}).catch(e=>({error:String(e)}));return{status:s,elapsed:Math.round(performance.now()-t),ok:!x?.error,error:x?.error||'',sound:window.AI_SHOGI_PIECE_SOUND?.audit?.()||null};});
            if(!r.status.ready||!r.status.worker||!r.ok)throw Error(name+' engine '+JSON.stringify(r));
            console.log('PASS_'+name.toUpperCase()+' '+JSON.stringify({staticCheck,r}));
            await browser.close();
          }
          NODE
          node verify-future-4000.mjs 2>&1 | tee /tmp/verify.log
          grep -q '^PASS_WEBKIT ' /tmp/verify.log
          grep -q '^PASS_CHROMIUM ' /tmp/verify.log
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### Future 4.0s runtime verification'; echo '```text'; grep '^PASS_' /tmp/verify.log || true; echo '```'; } >/tmp/report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/report.md
