name: Final all26 post-PR76 audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  local-integrity:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
    strategy:
      fail-fast: false
      matrix:
        platform: [iphone, fire, desktop, firefox]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Playwright package
        run: |
          npm init -y
          npm install playwright@1.55.0
      - name: Start COOP COEP server
        run: |
          cat >/tmp/final26-server.mjs <<'NODE'
          import http from'http';import fs from'fs';import path from'path';const root=process.cwd(),mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css','.wasm':'application/wasm','.bin':'application/octet-stream','.jpg':'image/jpeg','.jpeg':'image/jpeg','.png':'image/png','.webp':'image/webp'};http.createServer((q,s)=>{let n=decodeURIComponent(new URL(q.url,'http://x').pathname);if(n.endsWith('/'))n+='index.html';const f=path.resolve(root,'.'+n);if(!f.startsWith(root)||!fs.existsSync(f)){s.writeHead(404);return s.end('404')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',mime[path.extname(f).toLowerCase()]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4248,'127.0.0.1');
          NODE
          node /tmp/final26-server.mjs >/tmp/final26-server.log 2>&1 &
          sleep 1
      - name: Run local all26 final integrity
        shell: bash
        env:
          TARGET: local
          PLATFORM: ${{ matrix.platform }}
          HOME: /root
        run: |
          set -euo pipefail
          node .github/scripts/audit-final-all26-post-pr76-20260820.mjs 2>&1 | tee /tmp/final26.log
          grep -q '^PASS_FINAL_ALL26_POST_PR76 ' /tmp/final26.log
      - if: always()
        run: grep -E '^(FINAL_ALL26_POST_PR76|PASS_FINAL_ALL26_POST_PR76|Error:)' /tmp/final26.log || true
  public-integrity:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
    strategy:
      fail-fast: false
      matrix:
        platform: [iphone, fire, desktop]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Playwright package
        run: |
          npm init -y
          npm install playwright@1.55.0
      - name: Run public Pages all26 final integrity
        shell: bash
        env:
          TARGET: public
          PLATFORM: ${{ matrix.platform }}
          HOME: /root
        run: |
          set -euo pipefail
          for n in 1 2 3 4 5; do
            if node .github/scripts/audit-final-all26-post-pr76-20260820.mjs 2>&1 | tee /tmp/final26-public.log && grep -q '^PASS_FINAL_ALL26_POST_PR76 ' /tmp/final26-public.log; then exit 0; fi
            echo "public Pages retry $n"; sleep 20
          done
          exit 1
      - if: always()
        run: grep -E '^(FINAL_ALL26_POST_PR76|PASS_FINAL_ALL26_POST_PR76|Error:)' /tmp/final26-public.log || true
