name: Probe Future mobile strength profiles
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/probe-future-strength-profiles-20260819.yml'
permissions:
  contents: read
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright WebKit
        run: |
          mkdir -p /tmp/probe && cd /tmp/probe
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps webkit >/dev/null
      - name: Prepare configurable worker and server
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('shogi-v21528/future-yaneura-worker21528.js')
          s=p.read_text()
          s=s.replace("const ENGINE_THREADS=MOBILE_SAFE?1:2;", "const __Q=new URL(self.location.href).searchParams; const ENGINE_THREADS=Math.max(1,Math.min(2,Number(__Q.get('threads')||1)));" )
          s=s.replace("const ENGINE_HASH_MB=MOBILE_WEBKIT?32:FIRE_SILK?48:128;", "const ENGINE_HASH_MB=Math.max(16,Math.min(128,Number(__Q.get('hash')||32)));" )
          Path('shogi-v21528/probe-future-worker.js').write_text(s)
          PY
          cat > /tmp/probe/server.mjs <<'NODE'
          import http from 'http'; import fs from 'fs'; import path from 'path';
          const root=process.cwd();
          const mime={'.html':'text/html','.js':'text/javascript','.wasm':'application/wasm','.bin':'application/octet-stream','.css':'text/css','.jpg':'image/jpeg','.webp':'image/webp'};
          http.createServer((req,res)=>{let u=decodeURIComponent(req.url.split('?')[0]); if(u==='/')u='/shogi-v21528/index.html'; const f=path.join(root,u); if(!f.startsWith(root)||!fs.existsSync(f)){res.writeHead(404);return res.end('404')} res.setHeader('Cross-Origin-Opener-Policy','same-origin');res.setHeader('Cross-Origin-Embedder-Policy','require-corp');res.setHeader('Cross-Origin-Resource-Policy','same-origin');res.setHeader('Cache-Control','no-store');res.setHeader('Content-Type',mime[path.extname(f)]||'application/octet-stream');fs.createReadStream(f).pipe(res)}).listen(4173,'127.0.0.1');
          NODE
          node /tmp/probe/server.mjs >/tmp/probe/server.log 2>&1 &
          echo $! >/tmp/probe/server.pid
          sleep 1
      - name: Compare exact weak positions
        shell: bash
        run: |
          cat > /tmp/probe/run.mjs <<'NODE'
          import {webkit} from 'playwright';
          const R='abcdefghi',INIT='lnsgkgsnl/1r5b1/ppppppppp/9/9/9/PPPPPPPPP/1B5R1/LNSGKGSNL';
          const MOVES=`4i5h 8c8d 2h3h 8d8e 6g6f 8e8f 8g8f 8b8f 7g7f 8f8g+ 6i7h 8g7f P*7b 7a7b 5i4i 7f8e 3i4h P*8f 6f6e 8f8g+ 8h5e 8e6e 7h6h 6e5e 5g5f 5e7e 6h6i 3c3d 9g9f 2b9i+ 7i8h 9i8h 3h3i B*2h 3i3h 2h1i+`.split(/\s+/);
          function sfen(ms){const b=new Map(),h={b:{},w:{}};let rr=0;for(const row of INIT.split('/')){let f=9,p=false;for(const c of row){if(c==='+'){p=true;continue}if(/\d/.test(c)){f-=+c;continue}const s=c===c.toUpperCase()?'b':'w';b.set(''+f+R[rr],{s,k:c.toUpperCase(),p});p=false;f--}rr++}let t='b';for(const m of ms){if(/^[PLNSGBR]\*/.test(m)){const k=m[0],d=m.slice(2);h[t][k]=(h[t][k]||0)-1;b.set(d,{s:t,k,p:false})}else{const a=m.slice(0,2),d=m.slice(2,4),pc=b.get(a),cap=b.get(d);if(!pc)throw Error('missing '+a+' '+m);if(cap)h[t][cap.k]=(h[t][cap.k]||0)+1;b.delete(a);b.set(d,{...pc,p:pc.p||m.endsWith('+')})}t=t==='b'?'w':'b'}const rows=[];for(let r=0;r<9;r++){let x='',e=0;for(let f=9;f;f--){const q=b.get(''+f+R[r]);if(!q){e++;continue}if(e){x+=e;e=0}x+=(q.p?'+':'')+(q.s==='b'?q.k:q.k.toLowerCase())}if(e)x+=e;rows.push(x)}let hand='';for(const s of['b','w'])for(const k of['R','B','G','S','N','L','P']){const n=h[s][k]||0;if(n>0)hand+=(n>1?n:'')+(s==='b'?k:k.toLowerCase())}return rows.join('/')+' '+t+' '+(hand||'-')+' '+(ms.length+1)}
          const positions=[{ply:23,ref:'5g5f'},{ply:33,ref:'3g3f'},{ply:35,ref:'4i3h'}].map(x=>({...x,sfen:sfen(MOVES.slice(0,x.ply-1))}));
          const profiles=[{name:'T1H32',threads:1,hash:32},{name:'T1H64',threads:1,hash:64},{name:'T2H32',threads:2,hash:32},{name:'T2H48',threads:2,hash:48}];
          const browser=await webkit.launch({headless:true});
          const page=await browser.newPage({userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'});
          await page.goto('http://127.0.0.1:4173/shogi-v21528/index.html',{waitUntil:'domcontentloaded',timeout:120000});
          if(!await page.evaluate(()=>crossOriginIsolated))throw Error('COI false');
          const rows=[];
          for(const prof of profiles){
            let ok=true,err='';
            try{
              await page.evaluate(async prof=>{if(window.__probe)window.__probe.terminate();const w=new Worker('./probe-future-worker.js?threads='+prof.threads+'&hash='+prof.hash+'&v='+Date.now());let id=0,P=new Map();w.onmessage=e=>{const m=e.data||{},q=P.get(m.id);if(!q||m.type!=='result')return;P.delete(m.id);clearTimeout(q.t);m.ok?q.r(m):q.j(Error(m.error||'worker'))};const call=(type,x={})=>new Promise((r,j)=>{const mid=++id,t=setTimeout(()=>j(Error(type+' timeout')),120000);P.set(mid,{r,j,t});w.postMessage({type,id:mid,...x})});window.__probe={w,call,terminate:()=>w.terminate()};window.__init=await call('init');},prof);
              for(const pos of positions)for(let rep=1;rep<=2;rep++){
                const r=await page.evaluate(pos=>window.__probe.call('bestmove',{sfen:pos.sfen,ms:4500,multiPV:1}),pos);
                const row={profile:prof.name,threads:prof.threads,hash:prof.hash,ply:pos.ply,rep,token:r.token,ref:pos.ref,match:r.token===pos.ref,cp:r.info?.cp,mate:r.info?.mate,depth:r.info?.depth,nodes:r.info?.nodes};rows.push(row);console.log('PROFILE_ROW '+JSON.stringify(row));
              }
            }catch(e){ok=false;err=String(e?.message||e);console.log('PROFILE_ERROR '+JSON.stringify({profile:prof.name,error:err}))}
            const pr=rows.filter(x=>x.profile===prof.name),summary={profile:prof.name,ok,error:err,tests:pr.length,matches:pr.filter(x=>x.match).length,meanDepth:pr.length?pr.reduce((a,x)=>a+(x.depth||0),0)/pr.length:0,meanNodes:pr.length?Math.round(pr.reduce((a,x)=>a+(x.nodes||0),0)/pr.length):0};console.log('PROFILE_SUMMARY '+JSON.stringify(summary));
          }
          await page.evaluate(()=>window.__probe?.terminate());await browser.close();
          NODE
          cd /tmp/probe && node run.mjs 2>&1 | tee /tmp/probe/profile.log
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### Future 4.5s mobile profile probe'; echo '```text'; grep -E '^(PROFILE_ROW|PROFILE_ERROR|PROFILE_SUMMARY)' /tmp/probe/profile.log || true; echo '```'; } >/tmp/probe/report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/probe/report.md
