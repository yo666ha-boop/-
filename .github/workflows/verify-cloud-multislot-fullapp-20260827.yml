name: verify-cloud-multislot-fullapp-20260827

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox-fullapp:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check candidate runtime
        run: |
          node --check shogi-v21528/cloud-save21531.js
          node --check shogi-v21528/coi-serviceworker.js
          node --check shogi-v21528/rating-progress21536.js
          node --check shogi-side-test/future21520.js
          node --check shogi-v21528/future-yaneura-worker21528.js
          node --check shogi-side-test/top5-yaneura21529.js
          node --check .github/scripts/verify-tournament-dialogue-fullapp21547.mjs
          node --check .github/scripts/verify-tournament-all-boss-terminal-fullapp21547.mjs
          node --check .github/scripts/verify-tournament-narrow-text21558.mjs
          node --check .github/scripts/verify-tournament-road21562.mjs
          node --check .github/scripts/verify-tournament-history-fullapp21567.mjs
      - name: Install Playwright Firefox
        run: |
          npm init -y
          npm install playwright@1.55.0
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps firefox
      - name: Start static server
        run: |
          python3 -m http.server 8000 > /tmp/shogi-server.log 2>&1 &
          echo $! > /tmp/shogi-server.pid
          sleep 2
      - name: Run 26-character Future engine Firefox smoke
        run: |
          set -o pipefail
          node .github/scripts/shogi-v21528-smoke.js 2>&1 | tee /tmp/firefox-fullapp.log
      - name: Verify tournament dialogue live fullapp API and 21547c cache key
        run: |
          set -o pipefail
          node .github/scripts/verify-tournament-dialogue-fullapp21547.mjs 2>&1 | tee /tmp/tournament-dialogue-fullapp.log
      - name: Verify tournament narrow text scaling
        run: |
          set -o pipefail
          node .github/scripts/verify-tournament-narrow-text21558.mjs 2>&1 | tee /tmp/tournament-narrow-text21558.log
      - name: Verify tournament road stage transitions
        run: |
          set -o pipefail
          node .github/scripts/verify-tournament-road21562.mjs 2>&1 | tee /tmp/tournament-road21562.log
      - name: Verify recent tournament attempt history in fullapp
        run: |
          set -o pipefail
          node .github/scripts/verify-tournament-history-fullapp21567.mjs 2>&1 | tee /tmp/tournament-history-fullapp21567.log
      - name: Verify all 10 boss terminal dialogue states in fullapp
        run: |
          set -o pipefail
          for attempt in 1 2; do
            echo "boss-terminal attempt ${attempt}" | tee -a /tmp/tournament-all-boss-terminal.log
            if node .github/scripts/verify-tournament-all-boss-terminal-fullapp21547.mjs 2>&1 | tee -a /tmp/tournament-all-boss-terminal.log; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "retrying once after transient reload-visibility race" | tee -a /tmp/tournament-all-boss-terminal.log
              sleep 2
            fi
          done
          exit 1
      - name: Run TOP5 shared YaneuraOu smoke
        run: |
          set -o pipefail
          node .github/scripts/shogi-top5-yaneura-smoke.js 2>&1 | tee /tmp/top5.log
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/shogi-server.log || true
      - name: Upload Firefox fullapp diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-fullapp-diagnostics
          if-no-files-found: warn
          path: |
            /tmp/tournament-narrow-text21558.log
            /tmp/tournament-dialogue-fullapp.log
            /tmp/tournament-road21562.log
            /tmp/tournament-history-fullapp21567.log
            /tmp/tournament-all-boss-terminal.log
            /tmp/firefox-fullapp.log
            /tmp/top5.log
            /tmp/shogi-server.log

  webkit-sound-engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright WebKit
        run: |
          npm init -y
          npm install playwright@1.55.0
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps webkit
      - name: Start COOP COEP static server
        run: |
          cat >/tmp/coi-server.mjs <<'NODE'
          import http from 'http';import fs from 'fs';import path from 'path';
          const root=process.cwd(),mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.mjs':'text/javascript; charset=utf-8','.css':'text/css','.wasm':'application/wasm','.bin':'application/octet-stream','.jpg':'image/jpeg','.jpeg':'image/jpeg','.png':'image/png','.webp':'image/webp'};
          http.createServer((q,s)=>{let n=decodeURIComponent(new URL(q.url,'http://x').pathname);if(n.endsWith('/'))n+='index.html';const f=path.resolve(root,'.'+n);if(!f.startsWith(root)||!fs.existsSync(f)||fs.statSync(f).isDirectory()){s.writeHead(404);return s.end('404')}s.setHeader('Cross-Origin-Opener-Policy','same-origin');s.setHeader('Cross-Origin-Embedder-Policy','require-corp');s.setHeader('Cross-Origin-Resource-Policy','same-origin');s.setHeader('Cache-Control','no-store');s.setHeader('Content-Type',mime[path.extname(f).toLowerCase()]||'application/octet-stream');fs.createReadStream(f).pipe(s)}).listen(4188,'127.0.0.1');
          NODE
          node /tmp/coi-server.mjs >/tmp/coi-server.log 2>&1 &
          sleep 1
      - name: Run iPhone WebKit Future prewarm sound and ready search
        run: |
          set -o pipefail
          node .github/scripts/verify-prewarm-sound-20260819.mjs 2>&1 | tee /tmp/prewarm-sound.log
      - name: Show COI server log on failure
        if: failure()
        run: cat /tmp/coi-server.log || true
