name: Build YaneuraOu WASM for Future Mitsuki

on:
  push:
    branches:
      - future-mitsuki-yaneuraou
    paths:
      - .github/workflows/build-yaneuraou-wasm.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build official YaneuraOu HalfKP WASM
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout game branch
        uses: actions/checkout@v4
        with:
          ref: future-mitsuki-yaneuraou

      - name: Checkout official YaneuraOu
        uses: actions/checkout@v4
        with:
          repository: yaneurao/YaneuraOu
          ref: 33ccf1f907eb7184889fa23051243f81ab0bf973
          path: YaneuraOu

      - name: Verify official WASM route and tune iPhone worker pool
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C YaneuraOu rev-parse HEAD)" = "33ccf1f907eb7184889fa23051243f81ab0bf973"
          grep -F 'TARGET_CPU=WASM' YaneuraOu/script/wasm_build.js
          grep -F 'else ifeq ($(TARGET_CPU),WASM)' YaneuraOu/source/Makefile
          python3 - <<'PY'
          from pathlib import Path
          p=Path('YaneuraOu/source/Makefile')
          s=p.read_text()
          old='-s PTHREAD_POOL_SIZE=32'
          new='-s PTHREAD_POOL_SIZE=4'
          if old not in s:
              raise SystemExit('PTHREAD_POOL_SIZE=32 not found in official source/Makefile')
          p.write_text(s.replace(old,new,1))
          PY
          grep -F -- '-s PTHREAD_POOL_SIZE=4' YaneuraOu/source/Makefile

      - name: Build official YaneuraOu HalfKP WebAssembly
        id: build
        shell: bash
        run: |
          set -uo pipefail
          docker pull emscripten/emsdk:3.1.43
          set +e
          docker run --rm \
            -v "${{ github.workspace }}/YaneuraOu:/src" \
            -w /src \
            emscripten/emsdk:3.1.43 \
            node script/wasm_build.js halfkp 2>&1 | tee yaneuraou-build.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "YaneuraOu WASM build exit=${status}"
          exit 0

      - name: Upload build diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: future-mitsuki-yaneuraou-build-log
          path: yaneuraou-build.log
          retention-days: 7

      - name: Verify generated engine files
        if: steps.build.outputs.status == '0'
        shell: bash
        run: |
          set -euxo pipefail
          test -s YaneuraOu/build/wasm/halfkp/lib/yaneuraou.halfkp.js
          test -s YaneuraOu/build/wasm/halfkp/lib/yaneuraou.halfkp.worker.js
          test -s YaneuraOu/build/wasm/halfkp/lib/yaneuraou.halfkp.wasm
          ls -lh YaneuraOu/build/wasm/halfkp/lib/yaneuraou.halfkp.*

      - name: Install browser engine files
        if: steps.build.outputs.status == '0'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p shogi-side-test/yaneuraou
          cp YaneuraOu/build/wasm/halfkp/lib/yaneuraou.halfkp.js shogi-side-test/yaneuraou/YaneuraOu.js
          cp YaneuraOu/build/wasm/halfkp/lib/yaneuraou.halfkp.worker.js shogi-side-test/yaneuraou/YaneuraOu.worker.js
          cp YaneuraOu/build/wasm/halfkp/lib/yaneuraou.halfkp.wasm shogi-side-test/yaneuraou/YaneuraOu.wasm
          cp YaneuraOu/LICENSE shogi-side-test/yaneuraou/YANEURAOU_LICENSE.txt
          printf '%s\n' \
            'source=yaneurao/YaneuraOu' \
            'commit=33ccf1f907eb7184889fa23051243f81ab0bf973' \
            'edition=halfkp' \
            'target_cpu=WASM' \
            'pthread_pool=4' \
            'emscripten=3.1.43' \
            > shogi-side-test/yaneuraou/build-info.txt
          sha256sum shogi-side-test/yaneuraou/YaneuraOu.js \
                    shogi-side-test/yaneuraou/YaneuraOu.worker.js \
                    shogi-side-test/yaneuraou/YaneuraOu.wasm

      - name: Commit official WASM artifacts to experiment branch
        if: steps.build.outputs.status == '0'
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f shogi-side-test/yaneuraou/YaneuraOu.js \
                     shogi-side-test/yaneuraou/YaneuraOu.worker.js \
                     shogi-side-test/yaneuraou/YaneuraOu.wasm \
                     shogi-side-test/yaneuraou/YANEURAOU_LICENSE.txt \
                     shogi-side-test/yaneuraou/build-info.txt
          if git diff --cached --quiet; then
            echo "No WASM artifact changes."
            exit 0
          fi
          git commit -m "build: 公式やねうら王HalfKP WASMを追加"
          git push origin HEAD:future-mitsuki-yaneuraou

      - name: Upload WASM artifact
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: future-mitsuki-yaneuraou-halfkp
          path: shogi-side-test/yaneuraou
          retention-days: 30

      - name: Fail job when engine build failed
        if: steps.build.outputs.status != '0'
        shell: bash
        run: |
          echo "YaneuraOu WASM build failed; diagnostic log was uploaded."
          exit 1
