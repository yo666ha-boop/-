name: Build YaneuraOu WASM for Future Mitsuki

on:
  push:
    branches:
      - future-mitsuki-yaneuraou
    paths:
      - .github/workflows/build-yaneuraou-wasm.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout YaneuraOu official source
        uses: actions/checkout@v4
        with:
          repository: yaneurao/YaneuraOu
          ref: 33ccf1f907eb7184889fa23051243f81ab0bf973
          path: yaneuraou

      - name: Limit browser worker pool for iPhone
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('yaneuraou/source/Makefile')
          s=p.read_text()
          s=s.replace('-s PTHREAD_POOL_SIZE=32','-s PTHREAD_POOL_SIZE=4')
          p.write_text(s)
          PY

      - name: Build official YaneuraOu HalfKP WebAssembly
        run: |
          docker pull emscripten/emsdk:3.1.43
          docker run --rm -v ${PWD}/yaneuraou:/src emscripten/emsdk:3.1.43 node script/wasm_build.js halfkp

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp yaneuraou/build/wasm/halfkp/lib/yaneuraou.halfkp.js artifact/
          cp yaneuraou/build/wasm/halfkp/lib/yaneuraou.halfkp.worker.js artifact/
          cp yaneuraou/build/wasm/halfkp/lib/yaneuraou.halfkp.wasm artifact/
          cp yaneuraou/LICENSE artifact/YANEURAOU_LICENSE.txt
          printf '%s\n' 'source=yaneurao/YaneuraOu' 'commit=33ccf1f907eb7184889fa23051243f81ab0bf973' 'edition=halfkp' 'pthread_pool=4' > artifact/build-info.txt

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: future-mitsuki-yaneuraou-halfkp
          path: artifact
          retention-days: 30
