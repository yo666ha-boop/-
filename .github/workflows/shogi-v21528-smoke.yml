name: Shogi v2.15.28 Firefox smoke
on:
  push:
    paths:
      - 'shogi-v21528/**'
      - 'shogi-side-test/future21520.js'
      - 'shogi-side-test/future-yaneura-worker21528.js'
      - 'shogi-side-test/future-mitsuki-image21520.js'
      - 'shogi-side-test/final21513_rinimg.js'
      - 'shogi-side-test/top5-yaneura21529.js'
      - '.github/scripts/shogi-v21528-smoke.js'
      - '.github/scripts/shogi-top5-yaneura-smoke.js'
      - '.github/scripts/shogi-top5-benchmark.js'
      - '.github/scripts/shogi-top5-opening-benchmark.js'
      - '.github/workflows/shogi-v21528-smoke.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check Future Mitsuki and top-five scripts
        run: |
          node --check shogi-side-test/future21520.js
          node --check shogi-side-test/future-yaneura-worker21528.js
          node --check shogi-side-test/top5-yaneura21529.js
          node --check .github/scripts/shogi-top5-benchmark.js
          node --check .github/scripts/shogi-top5-opening-benchmark.js
          node --check shogi-v21528/coi-serviceworker.js
      - name: Install Playwright Firefox
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps firefox
      - name: Start static server
        run: |
          python3 -m http.server 8000 > /tmp/shogi-server.log 2>&1 &
          echo $! > /tmp/shogi-server.pid
          sleep 2
      - name: Run v2.15.28 Firefox smoke
        run: node .github/scripts/shogi-v21528-smoke.js
      - name: Run top-five shared YaneuraOu smoke
        run: node .github/scripts/shogi-top5-yaneura-smoke.js
      - name: Run top-five multi-position benchmark
        id: benchmark
        continue-on-error: true
        run: |
          set +e
          node .github/scripts/shogi-top5-benchmark.js
          code=$?
          if [ $code -ne 0 ] && [ ! -f .github/benchmark-results/shogi-top5-latest.json ]; then
            mkdir -p .github/benchmark-results
            printf '{"generatedAt":"%s","pass":false,"failures":["benchmark process exited %s before report generation"]}\n' "$(date -u +%FT%TZ)" "$code" > .github/benchmark-results/shogi-top5-latest.json
          fi
          exit $code
      - name: Run top-five opening bias benchmark
        id: opening_benchmark
        continue-on-error: true
        run: |
          set +e
          node .github/scripts/shogi-top5-opening-benchmark.js
          code=$?
          if [ $code -ne 0 ] && [ ! -f .github/benchmark-results/shogi-top5-opening-latest.json ]; then
            mkdir -p .github/benchmark-results
            printf '{"generatedAt":"%s","pass":false,"failures":["opening benchmark process exited %s before report generation"]}\n' "$(date -u +%FT%TZ)" "$code" > .github/benchmark-results/shogi-top5-opening-latest.json
          fi
          exit $code
      - name: Save benchmark results on benchmark branch
        if: always() && github.ref == 'refs/heads/feature/shogi-top5-benchmark-21531-20260818'
        run: |
          if ls .github/benchmark-results/shogi-top5-*.json >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/benchmark-results/shogi-top5-*.json
            if ! git diff --cached --quiet; then
              git commit -m 'bench: update top-five engine benchmark results [skip ci]'
              git push
            fi
          fi
      - name: Fail if benchmark failed
        if: steps.benchmark.outcome != 'success' || steps.opening_benchmark.outcome != 'success'
        run: exit 1
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/shogi-server.log || true
