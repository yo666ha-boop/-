<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06100d">
<title>AI将棋先生 v2.15.28</title>
<script src="./coi-serviceworker.js?v=21528g"></script>
<link rel="stylesheet" href="../shogi/strong213.css?v=21528j">
<style>
/* v2.15.28g iPhone portrait normalization */
#chars [data-future-mitsuki="1"] .futureEngineState{display:none!important}
#chars [data-future-mitsuki="1"]{min-height:64px!important}
#chars [data-future-mitsuki="1"] .chPic{width:34px!important;height:34px!important}
@media(min-width:721px){#chars [data-future-mitsuki="1"]{min-height:69px!important}#chars [data-future-mitsuki="1"] .chPic{width:38px!important;height:38px!important}}
.oppPortrait img,.focusPortrait img,.chPic{display:block;width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div id="appLoader21528" style="position:fixed;inset:0;z-index:99999;background:#06100d;color:#f0d996;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;font-weight:800;text-align:center;padding:24px">AI将棋先生 v2.15.28 を準備しています…</div>
<script>
(async()=>{
const VERSION='21528j';
const root=new URL('../shogi/',location.href);
const sideRoot=new URL('../shogi-side-test/',location.href);
const parts=['strong213_01.part','strong213_02.part','strong213_02b.part','strong213_03.part','strong213_04.part','strong213_05.part','strong213_06.part'];
const loadText=async url=>{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(url+' '+r.status);return await r.text()};
const run=src=>(0,eval)(src);
try{
  let src='';for(const p of parts)src+=await loadText(new URL(p+'?v='+VERSION,root));run(src);
  const patches=['side2157.js','eva2158.js','hokuto21511.js','hanakeiji21512.js','final21513.js','functional21518.js'];
  for(const p of patches)run(await loadText(new URL(p+'?v='+VERSION,sideRoot)));
  run(await loadText(new URL('future-mitsuki-image21520.js?v='+VERSION,sideRoot)));
  run(await loadText(new URL('future21520.js?v='+VERSION,sideRoot)));
  const NAME_IMG={
    'みっちゃん':'../shogi/micchan2154.svg?v=21528j',
    'あき王':'../shogi/akiou.webp?v=21528g'
  };
  const cardName=card=>card.querySelector('.chName')?.textContent?.trim()||card.querySelector('img')?.alt||'';
  function fixImages(){
    document.querySelectorAll('#chars .ch').forEach(card=>{
      const name=cardName(card),img=card.querySelector('img');if(!img)return;
      if(name==='未来からやってきたみつき'&&window.FUTURE_MITSUKI_IMAGE21520){img.onerror=null;if(img.src!==window.FUTURE_MITSUKI_IMAGE21520)img.src=window.FUTURE_MITSUKI_IMAGE21520}
      else if(NAME_IMG[name]){img.onerror=null;const target=new URL(NAME_IMG[name],location.href).href;if(img.src!==target)img.src=target}
    });
    document.querySelectorAll('#oppPortrait img,#foppPortrait img').forEach(img=>{const name=img.alt||'';if(NAME_IMG[name]){img.onerror=null;img.src=new URL(NAME_IMG[name],location.href).href}});
  }
  fixImages();setTimeout(fixImages,50);setTimeout(fixImages,300);setTimeout(fixImages,1200);
  new MutationObserver(()=>fixImages()).observe(document.getElementById('chars'),{subtree:true,childList:true});
  window.AI_SHOGI_V21528_FIX_IMAGES=fixImages;
  document.getElementById('appLoader21528')?.remove();
}catch(e){console.error(e);const l=document.getElementById('appLoader21528');if(l)l.textContent='読み込みに失敗しました。再読み込みしてください。\n'+String(e)}
})();
</script>
</body>
</html>
