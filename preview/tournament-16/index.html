<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>みつき将棋｜大会モード16人確認版</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;background:#06100e;color:#f2e3ad}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#163329 0,#081612 34%,#040a08 100%);min-height:100vh}.app{max-width:1180px;margin:auto;padding:14px}.top{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid #725923;border-radius:14px;background:#0a1713;position:sticky;top:0;z-index:5}.title{font-weight:900;font-size:20px}.badge{font-size:11px;border:1px solid #b38a2c;border-radius:999px;padding:4px 9px;color:#ffdf75}.notice{margin:10px 0;border:1px solid #385f50;border-radius:12px;padding:9px 12px;background:#0b1d18;color:#c8ded5;font-size:12px;line-height:1.6}.controls{display:grid;grid-template-columns:minmax(160px,240px) 1fr;gap:10px;margin:10px 0}.ratingBox,.recommended{border:1px solid #4a4127;border-radius:12px;padding:10px;background:#091511}.ratingBox label{font-size:12px;font-weight:900}.ratingBox input{width:100%;margin-top:6px;padding:9px;border-radius:9px;border:1px solid #65552c;background:#050c0a;color:#fff;font-size:16px}.recommended b{color:#ffe173}.recommended{font-size:13px;line-height:1.6}.cupGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.cup{border:1px solid #55482a;border-radius:12px;background:#0a1512;padding:10px;min-width:0}.cup.rec{border-color:#e0b846;box-shadow:0 0 0 1px #e0b846 inset}.cupName{font-weight:900;font-size:14px}.tag{font-size:10px;border:1px solid currentColor;border-radius:999px;padding:1px 5px;margin-left:5px}.meta{font-size:11px;line-height:1.5;color:#bdb397;margin:5px 0 8px}.btn{appearance:none;border:1px solid #74602f;border-radius:10px;background:#111d18;color:#f2e3ad;font-weight:900;padding:9px 10px;cursor:pointer}.btn:hover{filter:brightness(1.12)}.btn.primary{background:#795e18;border-color:#d0a63f;color:#fff5c7}.cup .btn{width:100%}.stage{display:none;margin-top:12px;border:1px solid #765d25;border-radius:14px;padding:10px;background:#08130f}.stage.on{display:block}.stageHead{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}.stageTitle{font-size:16px;font-weight:900}.status{font-size:13px;font-weight:900;color:#ffdf75;margin:7px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions .btn{min-width:120px}.bracketCaption{display:flex;justify-content:space-between;align-items:end;gap:8px;font-size:11px;color:#cbbf9c;margin:10px 0 5px}.scroll{overflow-x:auto;padding-bottom:8px;overscroll-behavior-x:contain}.bracket{display:flex;gap:7px;min-width:900px;border:1px solid #3e3829;border-radius:12px;background:#050c0a;padding:8px}.round{width:168px;flex:0 0 168px}.roundTitle{text-align:center;font-size:12px;font-weight:900;color:#e6cb77;margin-bottom:5px}.roundBody{height:620px;display:flex;flex-direction:column;justify-content:space-around;gap:3px}.slot{min-height:29px;border:1px solid #413b29;border-radius:8px;background:#0a1512;padding:5px 7px;font-size:10px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}.slot .name{overflow:hidden;text-overflow:ellipsis}.slot .r{margin-left:auto;font-size:9px;opacity:.75}.slot.empty{opacity:.4}.slot.player{border-color:#65a8ff;background:#102034;color:#dcecff;font-weight:900}.slot.boss{border-color:#d2a638;background:#211b0b}.slot.current{outline:2px solid #65a8ff;outline-offset:1px}.slot.opp{outline:2px solid #d4a73a;outline-offset:1px}.slot.champion{border-color:#ffe174;background:#2a220b;color:#ffeb9a;font-weight:900}.legend{font-size:11px;color:#a99f84;line-height:1.6;margin-top:8px}.foot{font-size:10px;color:#827b69;margin:12px 2px 30px;line-height:1.5}@media(max-width:820px){.cupGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.controls{grid-template-columns:1fr}.top{position:static}.roundBody{height:570px}}@media(max-width:480px){.cupGrid{grid-template-columns:1fr}.app{padding:9px}.title{font-size:17px}.badge{font-size:9px}.bracket{min-width:820px}.round{width:150px;flex-basis:150px}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="title">🏆 みつき将棋・大会モード</div><div class="badge">16人シンプル版・確認用</div></header>
  <div class="notice"><b>本体とは完全に別の確認ページです。</b> 将棋の完成版・本番データには触れません。ここでは「杯の選び方」「16人トーナメント表」「4勝で優勝」の見た目と流れだけを確認できます。</div>
  <div class="controls">
    <div class="ratingBox"><label for="rating">プレイヤーのレート</label><input id="rating" type="number" min="1000" max="3600" step="50" value="1500"></div>
    <div class="recommended" id="recommend"></div>
  </div>
  <div class="cupGrid" id="cups"></div>
  <section class="stage" id="stage">
    <div class="stageHead"><div class="stageTitle" id="stageTitle"></div><div class="actions"><button class="btn primary" id="winBtn">この対局に勝った</button><button class="btn" id="lossBtn">この対局に負けた</button><button class="btn" id="resetBtn">大会をやめる</button></div></div>
    <div class="status" id="status"></div>
    <div class="bracketCaption"><b>16人トーナメント表</b><span>スマホは横にスクロール</span></div>
    <div class="scroll"><div class="bracket" id="bracket"></div></div>
    <div class="legend">青＝あなた ／ 金＝杯のてっぺんキャラ ／ 枠の強調＝現在の対局。AI同士はレート差を基準に自動進行し、てっぺんキャラは決勝まで勝ち上がる確認仕様です。</div>
  </section>
  <div class="foot">確認版なので実際の将棋対局エンジンは動かしません。大会モード本体の実装はPR #126の別分岐にあり、専用Playwright＋既存回帰10系統を通過済みです。</div>
</div>
<script>
const PLAYER='__PLAYER__';
const ROUNDS=['1回戦','準々決勝','準決勝','決勝'];
const LABELS=[...ROUNDS,'優勝'];
const CUPS=[
{id:'shinji',name:'しんじ杯',boss:'しんじ',bossRating:1550,min:0,max:1649,label:'入門〜初級'},
{id:'ayanami',name:'あやなみ杯',boss:'あやなみ',bossRating:1800,min:1650,max:1899,label:'初中級'},
{id:'kenshiro',name:'ケンシロウ杯',boss:'ケンシロウ',bossRating:2100,min:1900,max:2149,label:'中上級'},
{id:'kaworu',name:'カヲル杯',boss:'カヲル',bossRating:2400,min:2150,max:2449,label:'上級'},
{id:'akiou',name:'あき王杯',boss:'あき王',bossRating:2700,min:2450,max:2749,label:'超上級'},
{id:'micchan',name:'みっちゃん杯',boss:'みっちゃん',bossRating:2850,min:2750,max:2899,label:'最上級'},
{id:'mitsuki',name:'みつき杯',boss:'みつき',bossRating:3000,min:2900,max:3099,label:'最高峰'},
{id:'future',name:'未来みつき杯',boss:'未来からやってきたみつき',bossRating:3400,min:3100,max:9999,label:'究極'}];
const CHARACTERS=[
['みつき',3000],['みっちゃん',2850],['あき王',2700],['おにまま',2600],['まま',2500],['ケンシロウ',2100],['ジャギ',1450],['しんじ',1550],['直江兼続',1700],['あやなみ',1800],['バット',1600],['伊達政宗',1750],['あすか',1900],['ユリア',1680],['玉ちゃん',1380],['まり',1950],['ぺんぺん',1250],['げんどー',2050],['前田慶次',1820],['シン',2000],['みさとさん',1880],['サウザー',2180],['リン',1500],['ラオウ',2250],['カヲル',2400],['未来からやってきたみつき',3400]
].map(([name,rating])=>({name,rating}));
const $=s=>document.querySelector(s), ratingEl=$('#rating'), cupsEl=$('#cups'), recEl=$('#recommend'), stage=$('#stage'), bracketEl=$('#bracket'), statusEl=$('#status');
let active=null;
const ratingOf=n=>n===PLAYER?(Number(ratingEl.value)||1500):(CHARACTERS.find(x=>x.name===n)?.rating||0);
const nameOf=n=>n===PLAYER?'あなた':n;
const cupById=id=>CUPS.find(c=>c.id===id);
const recommended=()=>{const r=Number(ratingEl.value)||1500;return CUPS.find(c=>r>=c.min&&r<=c.max)||CUPS.at(-1)};
function hash32(s){let h=2166136261>>>0;for(const ch of String(s)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}h^=h<<13;h^=h>>>17;h^=h<<5;return h>>>0}
function rnd(seed,key){return hash32(seed+'|'+key)/4294967296}
function shuffle(a,seed){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd(seed,'s'+i)*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function entrants(cup,seed){const pool=CHARACTERS.filter(x=>x.name!==cup.boss).sort((a,b)=>{const sa=(a.rating<=cup.bossRating?Math.abs(a.rating-cup.bossRating):Math.abs(a.rating-cup.bossRating)*4+120);const sb=(b.rating<=cup.bossRating?Math.abs(b.rating-cup.bossRating):Math.abs(b.rating-cup.bossRating)*4+120);return sa-sb||a.rating-b.rating});return[PLAYER,...shuffle(pool.slice(0,14).map(x=>x.name),seed),cup.boss]}
function aiWinner(a,b,cup,seed,round,match){if(a===cup.boss||b===cup.boss)return cup.boss;const ra=ratingOf(a),rb=ratingOf(b),p=1/(1+Math.pow(10,(rb-ra)/400));return rnd(seed,`m${round}-${match}-${a}-${b}`)<p?a:b}
function simulateKnown(){const {cup,rounds,seed}=active;for(let r=0;r<4;r++){const src=rounds[r],dst=rounds[r+1];for(let m=0;m<src.length/2;m++){if(dst[m])continue;const a=src[m*2],b=src[m*2+1];if(!a||!b||a===PLAYER||b===PLAYER)continue;dst[m]=aiWinner(a,b,cup,seed,r,m)}}}
function currentOpponent(){return active.rounds[active.round][active.playerSlot^1]}
function renderCups(){const rec=recommended(),r=Number(ratingEl.value)||1500;recEl.innerHTML=`あなたは <b>R${r}</b>。おすすめは <b>${rec.name}</b>。強い杯へ先に挑戦することもできます。`;cupsEl.innerHTML=CUPS.map(c=>`<div class="cup ${c.id===rec.id?'rec':''}"><div class="cupName">${c.name}${c.id===rec.id?'<span class="tag">おすすめ</span>':''}</div><div class="meta">${c.label}<br>決勝ボス：${c.boss} R${c.bossRating}<br>16人・4勝で優勝</div><button class="btn ${c.id===rec.id?'primary':''}" data-cup="${c.id}">挑戦する</button></div>`).join('');cupsEl.querySelectorAll('[data-cup]').forEach(b=>b.onclick=()=>startCup(b.dataset.cup))}
function startCup(id){const cup=cupById(id),seed=id+'-'+Date.now()+'-'+ratingEl.value;active={cup,seed,round:0,playerSlot:0,status:'active',rounds:[entrants(cup,seed),Array(8).fill(null),Array(4).fill(null),Array(2).fill(null),Array(1).fill(null)]};simulateKnown();stage.classList.add('on');renderStage();stage.scrollIntoView({behavior:'smooth',block:'start'})}
function slotHtml(n,r,s){const opp=active.status==='active'&&r===active.round&&s===(active.playerSlot^1),cur=active.status==='active'&&r===active.round&&s===active.playerSlot,champ=r===4&&n;const cls=['slot',!n?'empty':'',n===PLAYER?'player':'',n===active.cup.boss?'boss':'',cur?'current':'',opp?'opp':'',champ?'champion':''].filter(Boolean).join(' ');if(!n)return`<div class="${cls}"><span class="name">—</span></div>`;return`<div class="${cls}"><span class="name">${nameOf(n)}${n===active.cup.boss?' 👑':''}${champ?' 🏆':''}</span><span class="r">R${ratingOf(n)}</span></div>`}
function renderStage(){const a=active;if(!a)return;$('#stageTitle').textContent=`${a.cup.name}　16人制`;bracketEl.innerHTML=a.rounds.map((row,r)=>`<div class="round" data-round="${r}"><div class="roundTitle">${LABELS[r]}</div><div class="roundBody">${row.map((n,s)=>slotHtml(n,r,s)).join('')}</div></div>`).join('');if(a.status==='champion'){statusEl.textContent=`🏆 ${a.cup.name} 優勝！ 4連勝で頂点です。`;$('#winBtn').disabled=true;$('#lossBtn').disabled=true}else if(a.status==='lost'){statusEl.textContent=`敗退。大会優勝は ${nameOf(a.rounds[4][0]||a.cup.boss)}。`;$('#winBtn').disabled=true;$('#lossBtn').disabled=true}else{statusEl.textContent=`${ROUNDS[a.round]}：次の相手は ${nameOf(currentOpponent())} R${ratingOf(currentOpponent())}${currentOpponent()===a.cup.boss?' 👑 決勝ボス':''}`;$('#winBtn').disabled=false;$('#lossBtn').disabled=false}}
function win(){if(!active||active.status!=='active')return;if(active.round===3){active.rounds[4][0]=PLAYER;active.status='champion';renderStage();return}const next=Math.floor(active.playerSlot/2);active.rounds[active.round+1][next]=PLAYER;active.round++;active.playerSlot=next;simulateKnown();renderStage()}
function loss(){if(!active||active.status!=='active')return;const opp=currentOpponent(),next=Math.floor(active.playerSlot/2);active.rounds[active.round+1][next]=opp;active.status='lost';for(let i=0;i<5;i++)simulateKnown();if(!active.rounds[4][0])active.rounds[4][0]=active.cup.boss;renderStage()}
ratingEl.addEventListener('input',renderCups);$('#winBtn').onclick=win;$('#lossBtn').onclick=loss;$('#resetBtn').onclick=()=>{active=null;stage.classList.remove('on')};renderCups();
window.TOURNAMENT_PREVIEW_AUDIT=()=>({ok:true,standalone:true,cups:CUPS.length,recommended:recommended().id,active:active?{cup:active.cup.id,round:active.round,status:active.status,slots:active.rounds[0].length,columns:active.rounds.length,boss:active.cup.boss}:null,columns:document.querySelectorAll('.round').length,firstRound:document.querySelectorAll('.round[data-round="0"] .slot').length});
</script>
</body>
</html>
