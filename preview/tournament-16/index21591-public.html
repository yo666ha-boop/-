<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>みつき将棋｜大会モード画像カード＋進出演出 確認版</title><body style="margin:0;background:#06100e;color:#f2e3ad;font-family:sans-serif"><div id="boot" style="padding:16px">大会モードを準備中…</div><script>
(async()=>{
  const clean=location.href.split(/[?#]/)[0];
  const marker='/preview/tournament-16/';
  const p=clean.indexOf(marker);
  if(p<0)throw Error('same-origin preview path not found');
  const root=clean.slice(0,p+1);
  const sha=(root.match(/\/([0-9a-f]{40})\/$/i)||[])[1]||'feature/tournament-cups-20260902';
  const baseURL=root+'preview/tournament-16/index21542b.html';
  const cupsURL=root+'preview/tournament-16/cups-preview21589.js';
  const fieldURL=root+'preview/tournament-16/field-preview21545.js';
  const patchURL=root+'preview/tournament-16/bracket-preview21543.js';
  const bossURL=root+'preview/tournament-16/boss-preview21546.js';
  const skinURL=root+'preview/tournament-16/visual-polish21544.css';
  const bankURL=root+'shogi-v21528/tournament-dialogue-bank21547.js';
  const dialogueURL=root+'preview/tournament-16/dialogue-preview21547.js';
  const gameUIURL=root+'shogi-v21528/tournament-game-ui21559.js';
  const roadURL=root+'shogi-v21528/tournament-road21562.js';
  const visualURL=root+'preview/tournament-16/visual-preview21591.js';
  const oldHydrate=`rawText('shogi/strong213_01.part').then(s=>{const a=fixedImages(s);IMG['みつき']=a[0];IMG['おにまま']=a[3];IMG['まま']=a[4]})`;
  const newHydrate=`Promise.all(['01','02','02b','03','04','05','06'].map(id=>rawText('shogi/strong213_'+id+'.part'))).then(parts=>{const s=parts.join(''),p=s.indexOf('const FIXED_IMG='),all=(p>=0?s.slice(p):s).match(/data:image\\\/[A-Za-z0-9.+-]+;base64,[A-Za-z0-9+/=]+/g)||[];if(all.length<5)throw Error('FIXED_IMG concat incomplete '+all.length);IMG['みつき']=all[0];IMG['おにまま']=all[3];IMG['まま']=all[4]})`;
  const closeScript='</scr'+'ipt>';
  const bootMarker='renderCups();hydrate();\n'+closeScript+'</body></html>';
  const safeScript=s=>s.replace(new RegExp('<\\/script','gi'),'<\\/script');
  try{
    const urls=[baseURL,cupsURL,fieldURL,patchURL,bossURL,skinURL,bankURL,dialogueURL,gameUIURL,roadURL,visualURL];
    const res=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'})));
    const names=['preview source','cup sync','field rule','bracket patch','boss patch','visual skin','dialogue bank','dialogue preview','game ui','road ui','visual animation'];
    res.forEach((r,i)=>{if(!r.ok)throw Error(names[i]+' '+r.status)});
    let html=await res[0].text(),cupsPatch=safeScript(await res[1].text()),field=safeScript(await res[2].text()),patch=safeScript(await res[3].text()),boss=safeScript(await res[4].text()),skin=await res[5].text(),bank=safeScript(await res[6].text()),dialogue=safeScript(await res[7].text()),gameUI=safeScript(await res[8].text()),road=safeScript(await res[9].text()),visual=safeScript(await res[10].text());
    if(!html.includes(oldHydrate))throw Error('21542b hydrate signature mismatch');
    if(!html.includes(bootMarker))throw Error('21542b boot signature mismatch');
    html=html.replace(oldHydrate,newHydrate)
      .replace(/const BASE='[^']+',RAW=`https:\/\/raw\.githubusercontent\.com\/yo666ha-boop\/-\/\$\{BASE\}\/`;/,"const BASE='"+sha+"',RAW='"+root+"';")
      .replace('</head>','<style id="visualPolish21544Style">'+skin+'</style></head>')
      .replace('大会モード16人・画像完全＋Fireフィット確認版','大会モード16人・画像カード＋進出演出 確認版')
      .replace('16人・画像完全＋Fireフィット確認版','16人トーナメント → 画像カード＋進出アニメ → 優勝後ボス戦')
      .replace('Fire相当の横長画面では5列を最初から画面内に収めます。勝者は開始時には決まっていません。','Fire相当の横長画面では5列を画面内に収めます。既存26キャラ実画像を使った画像カード、勝者進出アニメ、ラウンド開始演出を確認できます。杯ボスはブラケット外で、4勝優勝後に別5戦目として挑戦します。')
      .replaceAll('決勝ボス','優勝後ボス');
    html=html.replace(bootMarker,bank+'\n'+cupsPatch+'\n'+field+'\n'+patch+'\n'+boss+'\n'+dialogue+'\n'+gameUI+'\n'+road+'\n'+visual+'\nrenderCups();hydrate();\n'+closeScript+'</body></html>');
    document.open();document.write(html);document.close();
  }catch(e){const b=document.getElementById('boot');if(b)b.textContent='確認ページの準備に失敗しました: '+String(e);throw e}
})();
</script></body>
