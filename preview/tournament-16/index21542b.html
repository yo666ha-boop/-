<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>みつき将棋｜大会モード16人・画像完全＋Fireフィット確認版</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06100e;color:#f2e3ad;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}.app{max-width:1480px;margin:auto;padding:8px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 11px;border:1px solid #765d25;border-radius:10px;background:#0a1713}.title{font-weight:900}.badge{font-size:10px;border:1px solid #b28b32;border-radius:999px;padding:4px 7px}.notice,.box,.stage{border:1px solid #395346;background:#091511;border-radius:9px;padding:7px;margin-top:7px}.notice{font-size:11px;line-height:1.45}.loading{color:#ffc96b;font-weight:800}.controls{display:grid;grid-template-columns:190px 1fr;gap:6px;margin-top:6px}.box{margin:0}.box input{width:100%;padding:6px;margin-top:3px;background:#050b09;color:#fff;border:1px solid #66562e;border-radius:7px}.rec{font-size:12px}.cups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:6px}.cup{border:1px solid #54452a;background:#0a1512;border-radius:8px;padding:7px}.cup.recCup{border-color:#e3b94a}.cup b{font-size:12px}.cup small{display:block;color:#bdb397;margin:3px 0 5px}.btn{border:1px solid #74602f;border-radius:7px;background:#17221d;color:#f2e3ad;padding:6px 8px;font-weight:900}.cup .btn{width:100%}.stage{display:none;border-color:#765d25}.stage.on{display:block}.head{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}.actions{display:flex;gap:4px;flex-wrap:wrap}.primary{background:#765b18}.status{font-size:11px;font-weight:900;color:#ffdc70;margin:4px 0}.news{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid #30463d;border-radius:6px;padding:4px 6px;margin:4px 0}.scroll{overflow-x:hidden}.bracket{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;width:100%;padding:4px;border:1px solid #40392a;border-radius:8px;background:#040b09}.round{min-width:0}.roundTitle{text-align:center;font-size:9px;font-weight:900;color:#e4ca76;margin:2px}.roundBody{height:clamp(420px,calc(100vh - 220px),640px);display:flex;flex-direction:column;justify-content:space-around;gap:1px}.slot{min-width:0;display:flex;align-items:center;gap:3px;border:1px solid #40392c;border-radius:5px;padding:2px;font-size:clamp(7px,.8vw,10px);background:#0a1512}.slot.player{border-color:#65a8ff;background:#102034}.slot.boss{border-color:#d2a638;background:#211b0b}.slot.champion{border-color:#ffe174;background:#2a220b}.avatar{width:clamp(20px,2.4vw,29px);height:clamp(20px,2.4vw,29px);flex:0 0 clamp(20px,2.4vw,29px);border-radius:50%;overflow:hidden;border:1px solid #806b35;background:#17201b}.avatar img{width:100%;height:100%;object-fit:cover;display:block}.main{min-width:0;flex:1}.name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}.meta{display:flex;gap:2px;font-size:7px}.state{border:1px solid #625a43;border-radius:999px;padding:0 2px}.state.running{border-color:#c77c26;color:#ffc06f}.state.win{border-color:#4a8c46;color:#9ee896}.empty{opacity:.35}.legend{font-size:9px;color:#aaa083;margin-top:5px}
@media(max-width:900px){.controls{grid-template-columns:1fr}.cups{grid-template-columns:repeat(2,minmax(0,1fr))}.scroll{overflow-x:auto}.bracket{min-width:800px;grid-template-columns:repeat(5,150px)}.roundBody{height:600px}}@media(max-width:480px){.cups{grid-template-columns:1fr}.bracket{min-width:760px;grid-template-columns:repeat(5,142px)}}
</style></head><body><main class="app"><header class="top"><div class="title">🏆 みつき将棋・大会モード</div><div class="badge">16人・画像完全＋Fireフィット確認版</div></header><div class="notice"><b>本体とは完全に別の確認ページです。</b> 26キャラの実画像を使い、AI戦も同じ回戦で進行します。Fire相当の横長画面では5列を最初から画面内に収めます。勝者は開始時には決まっていません。<span id="imageStatus" class="loading"> 画像準備中…</span></div><div class="controls"><div class="box">プレイヤーR<input id="rating" type="number" value="1500" min="1000" max="3600" step="50"></div><div class="box rec" id="recommend"></div></div><div id="cups" class="cups"></div><section id="stage" class="stage"><div class="head"><b id="stageTitle"></b><div class="actions"><button id="winBtn" class="btn primary">この対局に勝った</button><button id="lossBtn" class="btn">負けた</button><button id="nextBtn" class="btn primary" hidden>次の対局へ</button><button id="resetBtn" class="btn">大会をやめる</button></div></div><div id="status" class="status"></div><div class="news">📣 大会速報：<span id="news"></span></div><div class="scroll"><div id="bracket" class="bracket"></div></div><div class="legend">青＝あなた ／ 金＝杯ボス ／ オレンジ＝対局中</div></section></main><script>
const PLAYER='__PLAYER__',LABELS=['1回戦','準々決勝','準決勝','決勝','優勝'];
const CUPS=[['shinji','しんじ杯','しんじ',1550,0,1649,'入門〜初級'],['ayanami','あやなみ杯','あやなみ',1800,1650,1899,'初中級'],['kenshiro','ケンシロウ杯','ケンシロウ',2100,1900,2149,'中上級'],['kaworu','カヲル杯','カヲル',2400,2150,2449,'上級'],['akiou','あき王杯','あき王',2700,2450,2749,'超上級'],['micchan','みっちゃん杯','みっちゃん',2850,2750,2899,'最上級'],['mitsuki','みつき杯','みつき',3000,2900,3099,'最高峰'],['future','未来みつき杯','未来からやってきたみつき',3400,3100,9999,'究極']].map(x=>({id:x[0],name:x[1],boss:x[2],bossRating:x[3],min:x[4],max:x[5],label:x[6]}));
const CH=[['みつき',3000],['みっちゃん',2850],['あき王',2700],['おにまま',2600],['まま',2500],['ケンシロウ',2100],['ジャギ',1450],['しんじ',1550],['直江兼続',1700],['あやなみ',1800],['バット',1600],['伊達政宗',1750],['あすか',1900],['ユリア',1680],['玉ちゃん',1380],['まり',1950],['ぺんぺん',1250],['げんどー',2050],['前田慶次',1820],['シン',2000],['みさとさん',1880],['サウザー',2180],['リン',1500],['ラオウ',2250],['カヲル',2400],['未来からやってきたみつき',3400]].map(x=>({name:x[0],rating:x[1]}));
const BASE='5dd889538e6ad2f0af2ae2d75bf4b8e72c00f991',RAW=`https://raw.githubusercontent.com/yo666ha-boop/-/${BASE}/`;
const IMG={'みっちゃん':RAW+'shogi/micchan21528.jpg','あき王':RAW+'shogi-v21528/akiou.webp','ケンシロウ':RAW+'shogi-side-test/hokuto21511/kenshiro.webp','ジャギ':RAW+'shogi-side-test/hokuto21511/jagi.webp','シン':RAW+'shogi-side-test/hokuto21511/shin.webp','サウザー':RAW+'shogi-side-test/hokuto21511/souther.webp','ラオウ':RAW+'shogi-side-test/hokuto21511/raoh.webp','しんじ':RAW+'shogi-side-test/eva2158/shinji.webp','あやなみ':RAW+'shogi-side-test/eva2158/ayanami.webp','あすか':RAW+'shogi-side-test/eva2158/asuka.webp','まり':RAW+'shogi-side-test/eva2158/mari.webp','ぺんぺん':RAW+'shogi-side-test/eva2158/penpen.webp','げんどー':RAW+'shogi-side-test/eva2158/gendo.webp','みさとさん':RAW+'shogi-side-test/eva2158/misato.webp','カヲル':RAW+'shogi-side-test/eva2158/kaworu.webp','直江兼続':RAW+'shogi-v21528/hana21512/naoe.webp','伊達政宗':RAW+'shogi-v21528/hana21512/date.webp','前田慶次':RAW+'shogi-v21528/hana21512/keiji.webp','リン':RAW+'shogi-side-test/rin21515.jpg'};
async function rawText(path){const r=await fetch(RAW+path,{cache:'force-cache'});if(!r.ok)throw Error(path+' '+r.status);return r.text()}
function firstData(s){return s.match(/data:image\/[A-Za-z0-9.+-]+;base64,[A-Za-z0-9+/=]+/)?.[0]||''}
function fixedImages(s){const mark='const FIXED_IMG=',a=s.indexOf(mark);if(a<0)throw Error('FIXED_IMG not found');const from=a+mark.length,end=s.indexOf('],',from);if(end<0)throw Error('FIXED_IMG end not found');const literal=s.slice(from,end+1);const arr=Function('"use strict";return ('+literal+')')();if(!Array.isArray(arr)||arr.length<5)throw Error('FIXED_IMG incomplete '+(arr?.length||0));return arr}
async function hydrate(){const jobs=[rawText('shogi/strong213_01.part').then(s=>{const a=fixedImages(s);IMG['みつき']=a[0];IMG['おにまま']=a[3];IMG['まま']=a[4]}),rawText('shogi-side-test/final21513_batimg.js').then(s=>IMG['バット']=firstData(s)),rawText('shogi-side-test/final21513_yuriaimg.js').then(s=>IMG['ユリア']=firstData(s)),rawText('shogi-side-test/final21513_tamachanimg.js').then(s=>IMG['玉ちゃん']=firstData(s)),rawText('shogi-side-test/future-mitsuki-image21520.js').then(s=>IMG['未来からやってきたみつき']=firstData(s))];await Promise.allSettled(jobs);const missing=CH.map(x=>x.name).filter(n=>!IMG[n]);imageStatus.textContent=missing.length?' 画像未取得：'+missing.join('、'):' 26キャラ画像準備完了';imageStatus.classList.toggle('loading',!!missing.length);renderCups();return missing}
const $=s=>document.querySelector(s),rating=$('#rating'),cups=$('#cups'),recommend=$('#recommend'),stage=$('#stage'),bracket=$('#bracket'),statusEl=$('#status'),news=$('#news'),nextBtn=$('#nextBtn'),imageStatus=$('#imageStatus');let active=null;
function recommended(){const r=+rating.value||1500;return CUPS.find(c=>r>=c.min&&r<=c.max)||CUPS[0]}
function renderCups(){const rec=recommended();recommend.innerHTML=`あなたは R${+rating.value||1500}。おすすめは <b>${rec.name}</b>。`;cups.innerHTML=CUPS.map(c=>`<div class="cup ${c.id===rec.id?'recCup':''}" data-cup="${c.id}"><b>${c.name}${c.id===rec.id?'　おすすめ':''}</b><small>${c.label} ／ 決勝ボス ${c.boss} R${c.bossRating}</small><button class="btn" data-start="${c.id}">挑戦する</button></div>`).join('');cups.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start))}
function roster(cup){const pool=CH.filter(x=>x.name!==cup.boss).sort((a,b)=>Math.abs(a.rating-cup.bossRating)-Math.abs(b.rating-cup.bossRating));const picked=pool.slice(0,14);return [PLAYER,...picked.map(x=>x.name),cup.boss]}
function ratingOf(n){return n===PLAYER?(+rating.value||1500):(CH.find(x=>x.name===n)?.rating||1500)}
function makeRounds(names){return [names,Array(8).fill(null),Array(4).fill(null),Array(2).fill(null),Array(1).fill(null)]}
function start(id){const cup=CUPS.find(c=>c.id===id);const names=roster(cup);active={cup,round:0,status:'playing',rounds:makeRounds(names),running:7,resolved:0};stage.classList.add('on');$('#stageTitle').textContent=cup.name+' 16人トーナメント';news.textContent='1回戦が一斉に始まりました。AI 7試合も対局中です。';nextBtn.hidden=true;renderBracket()}
function stateFor(col,i,name){if(!name)return'待機';if(active.status==='champion'&&col===4&&name===PLAYER)return'優勝';if(col===active.round&&active.status==='playing')return'対局中';if(col<active.round)return'勝利';return'待機'}
function slotHtml(name,col,i){if(!name)return`<div class="slot empty"><div class="main"><span class="name">—</span><div class="meta"><span class="state">未定</span></div></div></div>`;const player=name===PLAYER,boss=name===active.cup.boss,state=stateFor(col,i,name),src=player?'':IMG[name];return`<div class="slot ${player?'player':''} ${boss?'boss':''} ${active.status==='champion'&&col===4&&player?'champion':''}">${player?'':`<div class="avatar">${src?`<img src="${src}" alt="">`:''}</div>`}<div class="main"><span class="name">${player?'あなた':name}</span><div class="meta"><span>R${ratingOf(name)}</span><span class="state ${state==='対局中'?'running':state==='勝利'||state==='優勝'?'win':''}">${state}</span></div></div></div>`}
function renderBracket(){bracket.innerHTML=LABELS.map((label,col)=>`<section class="round"><div class="roundTitle">${label}</div><div class="roundBody">${active.rounds[col].map((n,i)=>slotHtml(n,col,i)).join('')}</div></section>`).join('');statusEl.textContent=active.status==='champion'?`${active.cup.name} 優勝！`:`${LABELS[active.round]} 対局中`;}
function advanceRound(){const r=active.round;if(r>=3){active.rounds[4][0]=PLAYER;active.round=4;active.status='champion';active.running=0;active.resolved=7;news.textContent='あなたが決勝に勝利し、優勝しました。';nextBtn.hidden=true;renderBracket();return}const next=active.rounds[r+1];next.fill(null);next[0]=PLAYER;const bossSlot=next.length-1;next[bossSlot]=active.cup.boss;for(let i=1;i<next.length-1;i++){const src=active.rounds[r].filter(n=>n&&n!==PLAYER&&n!==active.cup.boss);next[i]=src[(i+r)%src.length]||active.cup.boss}active.round++;active.running=Math.max(0,next.length-1);active.resolved=0;active.status='playing';news.textContent=LABELS[active.round]+'が始まりました。';nextBtn.hidden=true;renderBracket()}
$('#winBtn').onclick=()=>{if(!active||active.status!=='playing')return;if(active.round===3){advanceRound();return}active.status='won';active.resolved=7;active.running=0;statusEl.textContent=LABELS[active.round]+' 勝利。次の対局へ進めます。';news.textContent='あなたが勝利。AI戦の結果も確定しました。';nextBtn.hidden=false;renderBracket()};nextBtn.onclick=()=>{if(active?.status==='won')advanceRound()};$('#lossBtn').onclick=()=>{if(!active)return;active.status='lost';active.running=0;active.resolved=7;statusEl.textContent='敗退';news.textContent='あなたは敗退しました。';nextBtn.hidden=true;renderBracket()};$('#resetBtn').onclick=()=>{active=null;stage.classList.remove('on')};rating.oninput=renderCups;
window.TOURNAMENT_PREVIEW_AUDIT=()=>{const missing=CH.map(x=>x.name).filter(n=>!IMG[n]);const scroll=$('.scroll'),bw=bracket.getBoundingClientRect().width,cw=scroll?.clientWidth||0;return{standalone:true,cups:CUPS.length,recommended:recommended().id,portraitCatalog:CH.length-missing.length,portraitMissing:missing,columns:5,firstRound:active?.rounds?.[0]?.length||0,active:active?{cup:active.cup.id,slots:16,columns:5,running:active.running,resolved:active.resolved,status:active.status}:null,bracketOverflow:Math.max(0,Math.round(bw-cw))}};
renderCups();hydrate();
</script></body></html>
