<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>みつき将棋｜大会モード10杯 iPhone確認版</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06100e;color:#f2e3ad;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}button,input{font:inherit}.app{max-width:1180px;margin:auto;padding:8px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px;border:1px solid #80692c;border-radius:11px;background:#0a1713}.title{font-weight:900}.badge{font-size:10px;border:1px solid #b28b32;border-radius:999px;padding:4px 7px}.notice,.panel,.stage{border:1px solid #395346;background:#091511;border-radius:9px;padding:8px;margin-top:7px}.notice{font-size:11px;line-height:1.5}.ok{color:#9ee896;font-weight:900}.controls{display:grid;grid-template-columns:180px 1fr;gap:6px;margin-top:7px}.panel{margin:0}.panel input{width:100%;margin-top:3px;padding:7px;border:1px solid #66562e;border-radius:7px;background:#050b09;color:#fff}.cups{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:7px}.cup{border:1px solid #54452a;background:#0a1512;border-radius:8px;padding:7px}.cup.rec{border-color:#e3b94a}.cup b{font-size:11px}.cup small{display:block;min-height:32px;color:#bdb397;margin:3px 0 5px;font-size:9px}.btn{width:100%;border:1px solid #74602f;border-radius:7px;background:#17221d;color:#f2e3ad;padding:7px;font-weight:900}.primary{background:#765b18}.stage{display:none;border-color:#765d25}.stage.on{display:block}.stageHead{display:flex;justify-content:space-between;gap:7px;align-items:center;flex-wrap:wrap}.actions{display:flex;gap:4px;flex-wrap:wrap}.actions .btn{width:auto}.dialogue{display:grid;grid-template-columns:44px 1fr;gap:7px;align-items:center;border:1px solid #5b4b2b;border-radius:8px;padding:6px;margin-top:6px;background:#0b1814}.portrait{width:44px;height:44px;border-radius:50%;overflow:hidden;border:1px solid #806b35;background:#18251f;display:grid;place-items:center;font-size:9px}.portrait img{width:100%;height:100%;object-fit:cover}.speech{font-size:11px;line-height:1.4}.road{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:7px 0}.road span{font-size:9px;text-align:center;padding:4px 2px;border:1px solid #3e493f;border-radius:5px;color:#989d91}.road .done{color:#9ee896;border-color:#477c48}.road .now{color:#ffd76b;border-color:#a77926;font-weight:900}.bracket{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;width:100%;border:1px solid #40392a;border-radius:8px;padding:4px;background:#040b09}.roundTitle{text-align:center;font-size:8px;font-weight:900;color:#e4ca76;padding:2px}.slots{display:flex;flex-direction:column;justify-content:space-around;gap:2px;min-height:460px}.slot{display:flex;align-items:center;gap:3px;min-height:32px;border:1px solid #40392c;border-radius:5px;padding:2px;background:#0a1512;font-size:8px}.slot.player{border-color:#65a8ff;background:#102034}.slot.win{border-color:#79a64a}.ava{width:24px;height:24px;flex:0 0 24px;border-radius:50%;overflow:hidden;border:1px solid #66562e;background:#1c2822;display:grid;place-items:center;font-size:7px}.ava img{width:100%;height:100%;object-fit:cover}.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}.meta{font-size:7px;color:#aaa083}.bossCard{display:none;margin-top:7px;border:1px solid #d2a638;background:#211b0b;border-radius:9px;padding:9px}.bossCard.on{display:block}.history{font-size:10px;margin-top:7px;border-top:1px solid #32463b;padding-top:5px}.error{color:#ff9b8f}.footer{font-size:9px;color:#949b8c;margin:7px 2px}
@media(max-width:820px){.controls{grid-template-columns:1fr}.cups{grid-template-columns:repeat(2,minmax(0,1fr))}.bracketWrap{overflow-x:auto}.bracket{grid-template-columns:repeat(5,138px);min-width:710px}.stage{overflow:hidden}.slots{min-height:520px}}
@media(max-width:420px){.app{padding:5px}.cups{grid-template-columns:1fr}.top{align-items:flex-start}.badge{font-size:8px}.dialogue{grid-template-columns:40px 1fr}.portrait{width:40px;height:40px}.speech{font-size:10px}.road span{font-size:8px}.bracket{grid-template-columns:repeat(5,126px);min-width:650px}.slots{min-height:550px}.slot{font-size:8px}}
</style></head><body><main class="app"><header class="top"><div class="title">🏆 みつき将棋・大会モード</div><div class="badge">10杯 / iPhone確認版 21584</div></header><div class="notice"><b>プレイヤー＋ボス未満AI15人の16人トーナメント → 4勝で優勝 → 杯ボスへ別5戦目。</b> 杯ボスはトーナメント表に出ません。<br><span id="boot" class="ok">画面描画OK</span> ／ document.write不使用 ／ 21583別ボスチェーン準拠。</div><div class="controls"><div class="panel">プレイヤーR<input id="rating" type="number" value="2100" min="1000" max="3600" step="50"></div><div class="panel" id="recommend"></div></div><div id="cups" class="cups"></div><section id="stage" class="stage"><div class="stageHead"><b id="stageTitle"></b><div class="actions"><button id="winBtn" class="btn primary">この対局に勝った</button><button id="lossBtn" class="btn">負けた</button><button id="resetBtn" class="btn">終了</button></div></div><div class="dialogue" role="status" aria-live="polite" aria-atomic="true"><div class="portrait" id="dialoguePortrait">主</div><div class="speech"><b id="speaker">大会主</b><div id="speech">挑戦する杯を選んでください。</div></div></div><div class="road" id="road"></div><div class="bracketWrap"><div id="bracket" class="bracket"></div></div><div id="bossCard" class="bossCard"></div><div class="history"><b>今回の履歴</b><div id="history">まだありません</div></div></section><div class="footer">青枠＝あなた。AI同士は表示Rベース＋乱数の仮方式。既存26キャラR / AI engine / MultiPV / cp-loss / personalityは変更しません。</div></main><script>
'use strict';
const ASSET_SHA='fea685fd03771ccc1e0318f4dac2567ba35eb443',RAW=`https://raw.githubusercontent.com/yo666ha-boop/-/${ASSET_SHA}/`;
const CUPS=[
 ['kenshiro','ケンシロウ杯','ケンシロウ',2100,0,2149,'中級'],['souther','サウザー杯','サウザー',2180,2150,2219,'中上級'],['raoh','ラオウ杯','ラオウ',2250,2220,2349,'強豪'],['kaworu','カヲル杯','カヲル',2400,2350,2449,'上級'],['mama','まま杯','まま',2500,2450,2549,'上級+'],['onimama','おにまま杯','おにまま',2600,2550,2649,'超上級'],['akiou','あき王杯','あき王',2700,2650,2749,'超上級+'],['micchan','みっちゃん杯','みっちゃん',2850,2750,2899,'最上級'],['mitsuki','みつき杯','みつき',3000,2900,3099,'最高峰'],['future','未来みつき杯','未来からやってきたみつき',3400,3100,9999,'究極']
].map(x=>({id:x[0],name:x[1],boss:x[2],bossR:x[3],min:x[4],max:x[5],label:x[6]}));
const CH=[['みつき',3000],['みっちゃん',2850],['あき王',2700],['おにまま',2600],['まま',2500],['ケンシロウ',2100],['ジャギ',1450],['しんじ',1550],['直江兼続',1700],['あやなみ',1800],['バット',1600],['伊達政宗',1750],['あすか',1900],['ユリア',1680],['玉ちゃん',1380],['まり',1950],['ぺんぺん',1250],['げんどー',2050],['前田慶次',1820],['シン',2000],['みさとさん',1880],['サウザー',2180],['リン',1500],['ラオウ',2250],['カヲル',2400],['未来からやってきたみつき',3400]].map(x=>({name:x[0],r:x[1]}));
const IMG={'みっちゃん':RAW+'shogi/micchan21528.jpg','あき王':RAW+'shogi-v21528/akiou.webp','ケンシロウ':RAW+'shogi-side-test/hokuto21511/kenshiro.webp','ジャギ':RAW+'shogi-side-test/hokuto21511/jagi.webp','シン':RAW+'shogi-side-test/hokuto21511/shin.webp','サウザー':RAW+'shogi-side-test/hokuto21511/souther.webp','ラオウ':RAW+'shogi-side-test/hokuto21511/raoh.webp','しんじ':RAW+'shogi-side-test/eva2158/shinji.webp','あやなみ':RAW+'shogi-side-test/eva2158/ayanami.webp','あすか':RAW+'shogi-side-test/eva2158/asuka.webp','まり':RAW+'shogi-side-test/eva2158/mari.webp','ぺんぺん':RAW+'shogi-side-test/eva2158/penpen.webp','げんどー':RAW+'shogi-side-test/eva2158/gendo.webp','みさとさん':RAW+'shogi-side-test/eva2158/misato.webp','カヲル':RAW+'shogi-side-test/eva2158/kaworu.webp','直江兼続':RAW+'shogi-v21528/hana21512/naoe.webp','伊達政宗':RAW+'shogi-v21528/hana21512/date.webp','前田慶次':RAW+'shogi-v21528/hana21512/keiji.webp','リン':RAW+'shogi-side-test/rin21515.jpg'};
const $=s=>document.querySelector(s),rating=$('#rating'),cups=$('#cups'),recommend=$('#recommend'),stage=$('#stage'),bracket=$('#bracket'),road=$('#road'),historyEl=$('#history'),bossCard=$('#bossCard');let active=null;
function rr(n){return CH.find(x=>x.name===n)?.r||1500}function rec(){let r=+rating.value||2100;return CUPS.find(c=>r>=c.min&&r<=c.max)||CUPS[0]}
function renderCups(){let rc=rec();recommend.innerHTML=`あなたは R${+rating.value||2100}。おすすめは <b>${rc.name}</b>。`;cups.innerHTML=CUPS.map(c=>`<div class="cup ${c.id===rc.id?'rec':''}"><b>${c.name}${c.id===rc.id?'　おすすめ':''}</b><small>${c.label} ／ 優勝後ボス ${c.boss} R${c.bossR}</small><button class="btn" data-cup="${c.id}">挑戦する</button></div>`).join('');cups.querySelectorAll('[data-cup]').forEach(b=>b.onclick=()=>start(b.dataset.cup))}
function pickField(cup){const eligible=CH.filter(x=>x.name!==cup.boss&&x.r<cup.bossR).sort((a,b)=>b.r-a.r);if(eligible.length<15)throw Error(`boss-under不足 ${cup.id} ${eligible.length}`);return ['あなた',...eligible.slice(0,15).map(x=>x.name)]}
function avatar(n){let s=IMG[n];return s?`<div class="ava"><img src="${s}" alt="" onerror="this.parentNode.textContent='${n.slice(0,1)}'"></div>`:`<div class="ava">${n==='あなた'?'YOU':n.slice(0,1)}</div>`}
function slot(n,state='待機'){if(!n)return`<div class="slot"><div class="name">—</div></div>`;return`<div class="slot ${n==='あなた'?'player':''} ${state==='勝利'?'win':''}">${avatar(n)}<div><div class="name">${n}</div><div class="meta">${n==='あなた'?'R'+(+rating.value||2100):'R'+rr(n)} ／ ${state}</div></div></div>`}
function start(id){let cup=CUPS.find(c=>c.id===id),field=pickField(cup);active={cup,round:0,field,rounds:[field,Array(8).fill(null),Array(4).fill(null),Array(2).fill(null),Array(1).fill(null)],done:false,history:[`${cup.name} 1回戦開始`]};stage.classList.add('on');$('#stageTitle').textContent=cup.name+'｜16人トーナメント';bossCard.classList.remove('on');$('#winBtn').disabled=false;$('#lossBtn').disabled=false;say(cup.boss,`${cup.name}へようこそ。ボス未満AI15人を相手に4勝して優勝してください。私は表の外で待っています。`);renderAll();stage.scrollIntoView({behavior:'smooth',block:'start'})}
function aiWinner(a,b){if(!a)return b;if(!b)return a;let p=1/(1+Math.pow(10,(rr(b)-rr(a))/400));return Math.random()<p?a:b}
function advance(){let r=active.round,cur=active.rounds[r],next=active.rounds[r+1];for(let i=0;i<next.length;i++){let a=cur[i*2],b=cur[i*2+1];next[i]=(a==='あなた'||b==='あなた')?'あなた':aiWinner(a,b)}active.round++;active.history.unshift(`${['準々決勝','準決勝','決勝','優勝'][active.round-1]}へ進出`);if(active.round===4){active.done=true;active.history.unshift('16人トーナメント優勝');showBoss();say(active.cup.boss,'トーナメント優勝おめでとう。ここから表の外の別5戦目、私との杯ボス戦です。')}else say(active.cup.boss,`${['1回戦','準々決勝','準決勝','決勝'][active.round]}へ進みます。あと${4-active.round}勝で優勝です。`);renderAll()}
function lose(){active.history.unshift(`${['1回戦','準々決勝','準決勝','決勝'][active.round]}で敗退`);say(active.cup.boss,'今回はここまで。また同じ杯へ挑戦できます。');active.done=true;$('#winBtn').disabled=true;$('#lossBtn').disabled=true;renderAll()}
function showBoss(){bossCard.classList.add('on');bossCard.innerHTML=`<b>👑 優勝後ボス戦（別5戦目）</b><p>${active.cup.boss} R${active.cup.bossR} は16人トーナメント表の外です。</p><button class="btn primary" id="bossWin">杯ボスに勝った</button>`;$('#bossWin').onclick=()=>{active.history.unshift(`${active.cup.name} 完全制覇`);say(active.cup.boss,'完全制覇です。トロフィー獲得！');bossCard.innerHTML='<b>🏆 杯完全制覇</b>';renderHistory()}}
function say(name,text){$('#speaker').textContent=name;$('#speech').textContent=text;let p=$('#dialoguePortrait'),s=IMG[name];p.innerHTML=s?`<img src="${s}" alt="${name}" onerror="this.parentNode.textContent='主'">`:'主'}
function renderRoad(){let labs=['1R','QF','SF','F','EX'];road.innerHTML=labs.map((x,i)=>`<span class="${active.done&&i===4?'now':i<active.round?'done':i===active.round?'now':''}">${x}</span>`).join('')}
function renderBracket(){let labels=['1回戦','準々決勝','準決勝','決勝','優勝'];bracket.innerHTML=active.rounds.map((arr,col)=>`<div><div class="roundTitle">${labels[col]}</div><div class="slots">${arr.map(n=>slot(n,col<active.round?'勝利':col===active.round?'対局中':'待機')).join('')}</div></div>`).join('')}
function renderHistory(){historyEl.innerHTML=active.history.slice(0,5).map(x=>`<div>${x}</div>`).join('')}
function renderAll(){renderRoad();renderBracket();renderHistory()}
rating.oninput=renderCups;$('#winBtn').onclick=()=>{if(active&&!active.done)advance()};$('#lossBtn').onclick=()=>{if(active&&!active.done)lose()};$('#resetBtn').onclick=()=>{stage.classList.remove('on');active=null;renderCups()};renderCups();window.addEventListener('error',e=>{$('#boot').className='error';$('#boot').textContent='表示エラー: '+e.message});
</script></body></html>
