<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="sansu-app-version" content="alpha7.27"><title>算数プリントメーカー alpha7.27</title><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;padding:28px;background:#f7f8fa;color:#111}#boot{max-width:720px;margin:40px auto;background:#fff;border:1px solid #ddd;border-radius:12px;padding:24px}.ok{color:#087f23}.err{color:#b42318;white-space:pre-wrap}</style></head><body><div id="boot"><h1>算数プリントメーカー</h1><p>alpha7.27 を検証して読み込んでいます…</p><p id="st">0 / 18</p></div><script>(async()=>{const files=Array.from({length:18},(_,i)=>`../sansu-app-alpha7-27-20260901-v2/p${String(i+1).padStart(2,"0")}.txt`),parts=[];for(let i=0;i<files.length;i++){const r=await fetch(files[i],{cache:"no-store"});if(!r.ok)throw new Error(`${files[i]}: HTTP ${r.status}`);parts.push((await r.text()).trim());document.getElementById("st").textContent=`${i+1} / 18`}const gz=Uint8Array.from(atob(parts.join("")),c=>c.charCodeAt(0)),ds=new DecompressionStream("gzip"),bytes=new Uint8Array(await new Response(new Blob([gz]).stream().pipeThrough(ds)).arrayBuffer()),digest=[...new Uint8Array(await crypto.subtle.digest("SHA-256",bytes))].map(x=>x.toString(16).padStart(2,"0")).join(""),expected="90560c323b910d91e2ef8e15b01ac87972b550cca5a8c14fd2da8e9d4d2df80c";if(digest!==expected)throw new Error(`整合性エラー\nexpected: ${expected}\nactual:   ${digest}`);document.getElementById("boot").innerHTML=`<h1 class="ok">整合性確認 OK</h1><p>alpha7.27 / SHA256 ${digest.slice(0,16)}…</p><p>アプリを起動します。</p>`;const html=new TextDecoder("utf-8").decode(bytes);setTimeout(()=>{document.open();document.write(html);document.close()},100)})().catch(e=>{document.getElementById("boot").innerHTML='<h1 class="err">読み込みエラー</h1><div class="err"></div>';document.querySelector(".err:last-child").textContent=String(e)});</script></body></html>
